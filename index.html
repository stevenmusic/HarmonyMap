<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 手機瀏覽器的網址列/狀態列會吃這個顏色。切換淺色主題時 applyTheme() 會一起改,
     不然頁面變白了、上面那條還是黑的,看起來像沒對齊 -->
<meta name="theme-color" content="#0C0A07">
<title id="pageTitle">HarmonyMap — 和弦與音階地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ══ 設計代幣:與 ScrollScore 同一套語意變數,兩個工具放在一起看是同一個產品 ══ */
:root{
  --bg:#0C0A07;
  --panel:#161209;
  --panel-2:#201A0F;
  --gold:#C9A24B;
  --gold-bright:#EFD48A;
  --teal:#3FBFAE;          /* 鍵盤上「和弦內音(非根音)」的顏色,沿用 ScrollScore 左右手的第二色 */
  --teal-bright:#8FFFF0;
  --ivory:#F4ECDA;
  --muted:#8A7D5F;
  --muted-bright:#B6A576;
  --line:#2A2415;
  --shadow-sm:0 4px 14px rgba(0,0,0,.35);
  --shadow-md:0 10px 26px rgba(0,0,0,.5);
  --shadow-lg:0 18px 44px rgba(0,0,0,.6);
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:18px;
  --radius-pill:999px;
  --fs-2xs:11px;
  --fs-xs:12px;
  --fs-sm:13px;
  --fs-md:14px;
  --fs-lg:16px;
  --fs-xl:19px;
  --fs-2xl:26px;
  --surface-glass:rgba(32,26,15,.88);
  --surface-inset:rgba(22,18,9,.55);
  --card-tint:rgba(255,255,255,.035);
  --stage-glow:#171208;
  color-scheme:dark;
}
/* ══ 淺色主題:同一組語意變數換一套值,版面與元件完全不用改寫 ══ */
body.light{
  --bg:#FBF7EE;
  --panel:#F4EEE0;
  --panel-2:#EDE6D4;
  --gold:#856418;
  --gold-bright:#6B5115;
  --teal:#0F5F56;
  --teal-bright:#0B463F;
  --ivory:#241E12;
  --muted:#6F6450;
  --muted-bright:#544B3B;
  --line:#D8CDB2;
  --shadow-sm:0 4px 14px rgba(90,72,30,.10);
  --shadow-md:0 10px 26px rgba(90,72,30,.14);
  --shadow-lg:0 18px 44px rgba(90,72,30,.18);
  --surface-glass:rgba(252,249,241,.92);
  --surface-inset:rgba(255,255,255,.7);
  --card-tint:rgba(133,100,24,.05);
  --stage-glow:#FFFDF6;
  color-scheme:light;
}
/* touch-action:manipulation 只關掉「雙擊放大」這個手勢,雙指縮放完全不受影響——
   跟直接鎖 viewport 的 user-scalable=no 不一樣,那個連縮放需求的使用者也會一起擋掉。
   #keyboardCanvas 自己的 touch-action:manipulation 已經是同一個值,不衝突 */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{height:100%}
body{
  min-height:100%;
  background:var(--bg);color:var(--ivory);
  font-family:"Noto Sans TC",sans-serif;
  display:flex;flex-direction:column;
}
/* ── 頂欄 ───────────────────────── */
header{
  display:flex;align-items:center;flex-wrap:wrap;
  gap:8px 14px;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--line);
  background:var(--panel);
  position:sticky;top:0;z-index:20;
}
.header-left,.header-right{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px}
/* Hub 頁(stevenmusic.github.io)是後來才生的,工具頁原本沒有回首頁的路徑——
   跟 ScrollScore/SightScore/LoudMaster 用同一套安靜文字連結 */
.home-link{
  display:inline-flex;align-items:center;gap:4px;flex:none;
  color:var(--muted);font-size:var(--fs-sm);text-decoration:none;
  padding:6px 4px;border-radius:var(--radius-sm);transition:color .15s;
}
.home-link:hover,.home-link:focus-visible{color:var(--gold-bright)}
/* 品牌名用流體字級(clamp)而不是斷點階梯。用斷點的話,430px 的 Pro Max 跟 320px 的 SE
   會拿到同一個字級,大螢幕明明放得下卻被迫用小字,看起來就是「字太小」。
   改成跟著視窗寬度連續縮放:窄機收到剛好放得下,寬機自然長回原本的大小。
   下限 12px 是頂欄單排放得下的極限,上限 var(--fs-lg) 維持桌機原本的大小不變
   ── 這一組數值與 ScrollScore 完全相同,兩個工具的品牌名要長得一模一樣 */
header h1{
  font-family:"Noto Serif TC",serif;
  font-size:clamp(12px, 3.7vw, var(--fs-lg));
  letter-spacing:clamp(.02em, .55vw, .12em);
  font-weight:700;color:var(--gold);white-space:nowrap;
  flex:none;
}
header h1 span{color:var(--ivory);font-weight:600}
/* 副標是 HarmonyMap 自己多出來的東西,獨立成一個元素,不寫進 h1 裡面,
   免得動到照抄過來的品牌名字級 */
.tagline{color:var(--muted);font-size:var(--fs-xs);letter-spacing:.04em;white-space:nowrap}
@media (max-width:600px){ .tagline{display:none} }
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1;
  border:1px solid var(--gold);background:transparent;color:var(--gold);
  font-family:inherit;font-size:var(--fs-md);font-weight:500;
  padding:8px 16px;height:38px;border-radius:var(--radius-pill);cursor:pointer;
  transition:background .2s,color .2s;white-space:nowrap;
}
.btn svg{flex:none}
.btn:active{background:var(--gold);color:var(--bg)}
.btn.primary{background:var(--gold);color:var(--bg);font-weight:700}
.btn.ghost{border-color:var(--line);color:var(--muted-bright)}
.btn.small{height:32px;padding:0 12px;font-size:var(--fs-sm)}
#themeToggle[aria-pressed="true"]{background:var(--gold);color:var(--bg)}
/* 語言切換鈕:跟主題/設定等圖示鈕一樣統一用正圓形(跟 ScrollScore/SightScore/LoudNorm
   同一套外觀),只顯示「EN」/「中」文字、不搭配圖示——四個專案不要有的用文字有的用圖示。
   aspect-ratio:1 讓寬度自動跟著當下 .btn 的高度走,不用每個斷點各寫一次寬度 */
#langToggle{aspect-ratio:1;padding:0}
#langToggle[aria-pressed="true"]{background:var(--gold);color:var(--bg)}
/* 頂欄的內距與間距同樣跟著寬度連續縮放,不用斷點硬切(照 ScrollScore 的值) */
@media (max-width:600px){
  header{padding:8px clamp(6px, 2.2vw, 10px);gap:clamp(4px, 1.4vw, 6px);flex-wrap:nowrap}
  .header-left,.header-right{gap:clamp(4px, 1.4vw, 6px)}
  .btn{padding:0 10px;height:34px;font-size:var(--fs-sm)}
  .btn-label{display:none}
  .header-left .btn svg{margin:0}
}
@media (max-width:380px){ .btn{padding:0 8px;height:32px} }
@media (max-width:340px){ .btn{padding:0 5px} }

/* ── 版面:上半部釘住不動,只有下半部捲動 ──────────────────────
   .topbar(分頁 + 鍵盤 + 根音)整塊 position:sticky,選下面的和弦時鍵盤與 C D E F G
   一直看得到。刻意做成「一個」sticky 區塊而不是三個各自釘住的元素:三個分開釘的話,
   它們中間的間距是透明的,底下的內容會從縫隙穿出來,而且每個元素的 top 偏移量都要
   靠 JS 量前一個的高度。包成一塊就只有一個偏移量、一個不透明底色,不會有縫。
   .lower(和弦清單 + 結果面板)是唯一會捲動的區域。 */
main{
  flex:1;display:flex;flex-direction:column;gap:14px;
  padding:14px;max-width:1400px;width:100%;margin:0 auto;
}
.topbar{
  position:sticky;top:var(--header-h, 56px);z-index:15;
  background:var(--bg); /* 必須不透明:捲上來的內容要被擋在後面 */
  display:flex;flex-direction:column;gap:10px;padding-bottom:8px;
}
.lower{display:flex;flex-direction:column;gap:14px;min-width:0}
.info{display:flex;flex-direction:column;gap:14px;min-width:0}

/* 手機橫向 / 螢幕高度極矮:頂欄整體收扁,品牌名也降一階 */
@media (max-height:420px){
  header{padding:5px 10px;gap:4px 8px}
  header h1{font-size:var(--fs-sm)}
  .btn{padding:0 10px;height:28px;font-size:var(--fs-xs)}
  /* 螢幕矮到這個程度(手機橫向),再把上半部釘住就沒有空間捲清單了,整頁一起捲 */
  .topbar{position:static}
}

.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-md);padding:14px 16px;
}
.card-title{
  font-size:var(--fs-2xs);letter-spacing:.14em;color:var(--muted);
  text-transform:uppercase;font-weight:700;margin-bottom:10px;
}

/* ── 分頁(和弦 / 音階 / 反查)── */
.tabs{display:flex;gap:6px;background:var(--surface-inset);border:1px solid var(--line);
      border-radius:var(--radius-pill);padding:4px}
.tabs button{
  flex:1;border:none;background:transparent;color:var(--muted-bright);
  font-family:inherit;font-size:var(--fs-md);font-weight:500;
  padding:9px 8px;border-radius:var(--radius-pill);cursor:pointer;transition:background .2s,color .2s;
}
.tabs button[aria-selected="true"]{background:var(--gold);color:var(--bg);font-weight:700}

/* ── 根音:字母列 + 升降記號 ── */
.root-row{display:flex;gap:6px;flex-wrap:wrap}
.root-row.letters button{flex:1 1 0;min-width:38px}
.key-btn{
  border:1px solid var(--line);background:var(--surface-inset);color:var(--ivory);
  font-family:"Noto Serif TC",serif;font-size:var(--fs-lg);font-weight:600;
  height:44px;border-radius:var(--radius-sm);cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.key-btn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.acc-row{display:flex;gap:6px;margin-top:6px}
.acc-row .key-btn{flex:1;height:36px;font-size:var(--fs-md)}
/* 手機:根音卡片是釘住的,每省下一點高度就是清單多看到一排。
   「根音」這個標題可以省——底下就是 C D E F G A B 七顆按鈕,不會看不懂 */
@media (max-width:900px){
  #rootCard{padding:8px 10px}
  #rootCard .card-title{display:none}
  .root-row.letters .key-btn{height:38px}
  .acc-row{margin-top:5px}
  .acc-row .key-btn{height:30px}
  .topbar{gap:8px}
  #typeCard{padding:12px}
}

/* ── 類型清單:搜尋 + 分組晶片 ── */
/* 搜尋 + 篩選同一排,省掉一整行的高度 */
.find-row{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.find-row .search-wrap{flex:1;min-width:0;margin-bottom:0}
.filter-summary{
  cursor:pointer;user-select:none;flex:none;
  display:inline-flex;align-items:center;gap:6px;
  background:transparent;font-family:inherit;
  border:1px solid var(--line);border-radius:var(--radius-pill);
  padding:5px 14px 5px 10px;font-size:var(--fs-xs);color:var(--muted-bright);
  transition:border-color .15s,color .15s;
}
.filter-summary:hover{border-color:var(--gold);color:var(--gold)}
.filter-summary .chev{display:inline-block;transition:transform .2s;font-size:14px;line-height:1}
.filter-summary[aria-expanded="true"] .chev{transform:rotate(90deg)}
.filter-summary[aria-expanded="true"]{border-color:var(--gold);color:var(--gold)}
.filter-summary .badge{
  background:var(--gold);color:var(--bg);border-radius:var(--radius-pill);
  padding:1px 7px;font-size:var(--fs-2xs);font-weight:700;
}
.filter-summary .badge:empty{display:none}
.filter-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.filter-rows[hidden]{display:none}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* [hidden] 是 UA 樣式表給的 display:none,會被上面作者自訂的 display:flex 蓋掉,
   一定要自己補這一條,否則 hidden 設了也沒用(和弦的篩選列會跑到音階分頁上) */
.filter-rows[hidden],.filter-row[hidden]{display:none}
.filter-chip{
  border:1px solid var(--line);background:transparent;color:var(--muted-bright);
  border-radius:var(--radius-pill);padding:5px 12px;font-family:inherit;font-size:var(--fs-xs);
  cursor:pointer;transition:border-color .15s,color .15s,background .15s;white-space:nowrap;
}
.filter-chip:hover{border-color:var(--gold);color:var(--gold)}
.filter-chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:700}
.filter-chip .cnt{opacity:.6;font-size:var(--fs-2xs);margin-left:4px}
/* width→min-width:英文標籤(Style/Level/Enh.)比中文兩個字寬,固定寬度會截斷,
   改成最小寬度,超出時整個 label 連同後面的篩選晶片一起換行(.filter-row 本來就 flex-wrap) */
.filter-label{min-width:3em;flex:none;color:var(--muted);font-size:var(--fs-xs)}
/* 記號的圖例。金線與 ≡ 這兩個標記本身看不出是什麼意思,一定要寫出來——
   靠 title 屬性不算數,手機沒有 hover */
.filter-hint{font-size:var(--fs-2xs);color:var(--muted);opacity:.85;line-height:1.6;padding-left:3em}
.filter-hint b{color:var(--gold);font-weight:400}

/* ── 分類按鈕 ── */
/* 這一排是主要的導覽方式,不是篩選:按一下就換一整組項目。
   所以做得比篩選晶片明顯(實心底、字大一級),使用者才知道要先從這裡選 */
/* position:relative 是為了讓按鈕的 offsetLeft 以這一排為基準,
   捲到選中項目的計算才不會算到別的祖先身上 */
.group-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;position:relative}
/* 同樣的老問題:作者自訂的 display:flex 會蓋掉 [hidden] 的 display:none */
.group-tabs[hidden]{display:none}
.group-tab{
  border:1px solid var(--line);background:var(--surface-inset);color:var(--muted-bright);
  border-radius:var(--radius-sm);padding:7px 12px;font-family:inherit;font-size:var(--fs-sm);
  cursor:pointer;transition:border-color .15s,color .15s,background .15s;white-space:nowrap;
}
.group-tab:hover{border-color:var(--gold);color:var(--gold)}
.group-tab[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:700}
.group-tab .cnt{opacity:.6;font-size:var(--fs-2xs);margin-left:5px}
.group-tab[aria-pressed="true"] .cnt{opacity:.66}
/* 選了哪一組,就把那一組的定義寫在按鈕底下——原本這句話是掛在分組標題上的,
   改成分類按鈕之後標題不見了,這句話不能跟著不見 */
.group-note{font-size:var(--fs-2xs);color:var(--muted);line-height:1.6;margin-bottom:10px}
.group-note:empty{display:none}
/* 目前分類的按鈕:只有窄螢幕會出現(寬螢幕整排分類本來就看得完) */
.group-current{display:none}
/* 窄螢幕:分類有 14 組,排成一排要左右滑才找得到想去的組,滑到一半還會忘記看過哪些。
   改成「一顆按鈕顯示目前分類 + 展開後兩欄格線一次全部看完」,
   收合時只佔一行,展開時不用捲、不用滑,一眼掃完 */
@media (max-width:600px){
  .group-current{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    background:var(--surface-inset);border:1px solid var(--line);color:var(--ivory);
    border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:8px;
    font-family:inherit;font-size:var(--fs-sm);font-weight:700;cursor:pointer;
  }
  .group-current[hidden]{display:none}
  .group-current .cnt{opacity:.55;font-size:var(--fs-2xs);font-weight:400}
  .group-current .chev{margin-left:auto;font-size:16px;line-height:1;transition:transform .2s}
  .group-current[aria-expanded="true"]{border-color:var(--gold);color:var(--gold)}
  .group-current[aria-expanded="true"] .chev{transform:rotate(90deg)}
  /* 三欄:音階有 15 顆(含「全部」),兩欄要排八列、展開後最後一列會掉到摺線以下,
     等於還是要捲才看得完;三欄五列剛好整片在第一屏裡 */
  .group-tabs{display:grid;grid-template-columns:repeat(3,1fr)}
  .group-tab{
    white-space:normal;text-align:center;padding:8px 4px;font-size:var(--fs-2xs);
    line-height:1.35;min-height:44px; /* 觸控目標不小於 44px */
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  }
  .group-tab .cnt{margin-left:0}
}

/* 分組副標:說明是什麼音程定義了這個家族,讓分組本身也在教東西 */
.type-group-sub{
  font-size:var(--fs-2xs);color:var(--muted);opacity:.85;font-weight:400;
  letter-spacing:0;margin-top:2px;
}
/* 必學的和弦在左上角標一顆星。原本用左緣金邊,但一道色塊看不出是什麼意思
   (連做的人都要問),星號本身就帶語意。≡ 在右上角,兩個記號各佔一角不會打架 */
.chip[data-lv="3"]::before{
  content:"★";position:absolute;top:2px;left:5px;
  font-size:10px;line-height:1;color:var(--gold);
}
.chip[data-lv="3"][aria-pressed="true"]::before{color:rgba(0,0,0,.55)}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap input{
  width:100%;height:38px;padding:0 12px 0 34px;
  background:var(--surface-inset);border:1px solid var(--line);border-radius:var(--radius-pill);
  color:var(--ivory);font-family:inherit;font-size:var(--fs-sm);
}
.search-wrap input:focus{outline:none;border-color:var(--gold)}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.6}
/* 清單本身不再自己捲(上半部已經釘住了,交給頁面捲就好),
   否則會出現「捲軸裡還有捲軸」,手機上很難操作 */
.type-group + .type-group{margin-top:14px}
.type-group-title{
  font-size:var(--fs-2xs);letter-spacing:.12em;color:var(--muted);font-weight:700;
  margin-bottom:8px;padding:4px 0;
}
/* 每一層(必學 / 常用 / 進階)的展開鈕。做得比晶片輕(只有一條文字 + 箭頭),
   讓它讀起來像分隔線而不是又一個可以選的項目 */
.tier-toggle{
  display:flex;align-items:center;gap:6px;width:100%;margin-top:8px;
  background:transparent;border:0;border-top:1px solid var(--line);
  padding:9px 2px 0;font-family:inherit;font-size:var(--fs-2xs);
  color:var(--muted);cursor:pointer;transition:color .15s;
}
.tier-toggle:hover{color:var(--gold)}
.tier-toggle .chev{display:inline-block;font-size:13px;line-height:1;transition:transform .2s}
.tier-toggle[aria-expanded="true"]{color:var(--gold)}
.tier-toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
.tier-toggle + .chips{margin-top:8px}

/* 等寬格線排列。原本用 flex 讓晶片各自照文字長度決定寬度,每一列的數量與寬度都不一樣,
   整片看起來參差不齊;改成固定欄寬的 grid,行列自然對齊,長短名稱都排得整整齊齊 */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.chips.wide{grid-template-columns:repeat(auto-fill,minmax(152px,1fr))} /* 音階名稱長,欄位加寬 */
.chip{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:1px solid var(--line);background:var(--surface-inset);color:var(--ivory);
  border-radius:var(--radius-sm);padding:8px 8px;cursor:pointer;
  font-family:inherit;text-align:center;transition:border-color .15s,background .15s;
}
.chip{position:relative}
/* 與其他條目同音高的,右上角標一個 ≡,瀏覽時就看得出來,不必點進去才發現 */
.chip[data-dup]::after{
  content:"≡";position:absolute;top:2px;right:5px;
  font-size:10px;line-height:1;color:var(--muted);opacity:.75;
}
.chip[data-dup][aria-pressed="true"]::after{color:rgba(0,0,0,.55)}
.chip b{font-size:var(--fs-sm);font-weight:700;line-height:1.25;white-space:nowrap}
.chip[data-lv="3"],.chip[data-dup]{padding-top:11px}
.chip i{font-size:var(--fs-2xs);font-style:normal;color:var(--muted);line-height:1.25;white-space:nowrap}
/* 英文和弦名稱(例如 "Dominant 7th ♭9♭13")比中文長很多,窄格子裡用 nowrap 會被切斷/溢出——
   只在英文介面放行換行,中文維持原本的單行(中文名稱本來就短,不需要這條規則) */
html[data-lang="en"] .chip i{white-space:normal}
/* 音階的中文名稱長度差很多(「多利安」到「烏克蘭小調(多利安♯4)」),允許換行才不會被截掉 */
.chips.wide .chip b,.chips.wide .chip i{white-space:normal}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.chip[aria-pressed="true"] i{color:rgba(0,0,0,.62)}
.empty-hint{color:var(--muted);font-size:var(--fs-sm);padding:10px 2px}

/* ── 鍵盤 ── */
.kb-wrap{
  position:relative; /* 讓載入提示可以絕對定位貼在上面(窄螢幕改成 sticky 一樣能當定位基準) */
  border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;
  background:
    radial-gradient(ellipse 120% 80% at 50% 0%, var(--stage-glow) 0%, var(--bg) 60%);
}
#keyboardCanvas{display:block;width:100%;height:150px;background:transparent;touch-action:manipulation;cursor:pointer}
/* 釘在鍵盤下方的一行摘要:和弦名 + 組成音。
   刻意限制成「絕對只有一行」(nowrap + 超出用省略號),因為這一塊在手機上是釘住的,
   高度只要會隨內容變化,底下整排和弦按鈕就會跟著上下跳 */
.kb-summary{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;white-space:nowrap;overflow:hidden;
}
.kb-summary b{
  font-family:"Noto Serif TC",serif;font-size:var(--fs-lg);font-weight:700;
  color:var(--gold-bright);flex:none;
}
.kb-summary .zh{font-size:var(--fs-xs);color:var(--muted);flex:none}
.kb-summary .tones{
  font-size:var(--fs-sm);color:var(--ivory);letter-spacing:.06em;
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:right;
}
/* 鍵盤設定的浮動面板。蓋在琴鍵上方(.kb-wrap 是 overflow:hidden,所以尺寸要放得進去),
   關掉之後完全不佔版面高度——原本這三個選單常駐一整排,吃掉釘住區約 50px */
.kb-popover{
  position:absolute;right:8px;bottom:8px;z-index:5;
  display:flex;flex-direction:column;gap:6px;
  background:var(--surface-glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--gold);border-radius:var(--radius-md);
  padding:10px 12px;box-shadow:var(--shadow-md);
}
.kb-popover[hidden]{display:none}
.kb-popover label{display:flex;align-items:center;gap:8px;font-size:var(--fs-2xs);color:var(--muted)}
.kb-popover select{flex:1;min-width:118px}
.kb-gear{
  flex:none;background:transparent;border:1px solid var(--line);color:var(--muted-bright);
  border-radius:var(--radius-pill);width:26px;height:26px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center; /* 線稿圖示要自己置中,不靠字型基線 */
  cursor:pointer;margin-left:8px;transition:border-color .15s,color .15s;
}
.kb-gear svg{display:block}
.kb-gear:hover,.kb-gear[aria-expanded="true"]{border-color:var(--gold);color:var(--gold)}
.audio-status{
  position:absolute;top:8px;left:8px;z-index:2;
  font-size:var(--fs-2xs);color:var(--muted-bright);white-space:nowrap;
  background:var(--surface-glass);border:1px solid var(--line);
  border-radius:var(--radius-pill);padding:3px 10px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
select.mini{
  background:var(--surface-inset);color:var(--ivory);border:1px solid var(--line);
  border-radius:var(--radius-pill);padding:0 10px;height:32px;font-family:inherit;font-size:var(--fs-sm);
}
select.mini:focus{outline:none;border-color:var(--gold)}
/* 手機上鍵盤是釘住的,這條工具列也跟著一直佔畫面高度——圖例的資訊
   下方的結果面板已經寫得更清楚了,窄螢幕就先讓位給控制項,確保它們排得下一列 */
@media (max-width:600px){
  select.mini{font-size:var(--fs-xs);padding:0 8px}
}

/* ── 結果面板 ── */
.rt-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.rt-name{font-family:"Noto Serif TC",serif;font-size:var(--fs-2xl);font-weight:700;color:var(--gold-bright);line-height:1.1}
.rt-sub{font-size:var(--fs-sm);color:var(--muted-bright)}
/* align-items:stretch(預設值,寫出來提醒別動它):有的音要標八度、有的不用,
   同一列的格子必須等高,不然高低參差 */
.note-strip{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.note-cell{
  min-width:64px;flex:0 0 auto;text-align:center;
  border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:8px 10px;background:var(--surface-inset);
}
.note-cell .deg{font-size:var(--fs-2xs);color:var(--muted);letter-spacing:.06em}
.note-cell .nm{font-family:"Noto Serif TC",serif;font-size:var(--fs-xl);font-weight:700;color:var(--ivory);line-height:1.25}
.note-cell .oct{font-size:var(--fs-2xs);color:var(--muted);opacity:.75}
.note-cell.is-root{border-color:var(--gold);background:rgba(201,162,75,.12)}
.note-cell.is-root .nm{color:var(--gold-bright)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;font-size:var(--fs-sm);color:var(--muted-bright)}
.meta-row b{color:var(--ivory);font-weight:500;font-variant-numeric:tabular-nums}
.desc{margin-top:12px;font-size:var(--fs-sm);line-height:1.75;color:var(--muted-bright)}
.desc strong{color:var(--ivory);font-weight:500}

/* 順階和弦表 */
.table-scroll{overflow-x:auto}
table.dia{width:100%;border-collapse:collapse;font-size:var(--fs-sm);min-width:420px}
table.dia th,table.dia td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.dia th{font-size:var(--fs-2xs);letter-spacing:.08em;color:var(--muted);font-weight:700;text-transform:uppercase}
table.dia td.rn{color:var(--gold);font-family:"Noto Serif TC",serif;font-weight:700}
table.dia td.sym{font-weight:700}
table.dia td.tones{color:var(--muted-bright);font-size:var(--fs-xs)}
table.dia tr:last-child td{border-bottom:none}
table.dia button.link{
  background:none;border:none;color:inherit;font:inherit;cursor:pointer;padding:0;
  border-bottom:1px dashed var(--line);
}
table.dia button.link:hover{color:var(--gold);border-color:var(--gold)}

/* 建議音階 / 相關連結 */
.link-chips{display:flex;flex-wrap:wrap;gap:6px}
.link-chip{
  border:1px dashed var(--line);background:transparent;color:var(--muted-bright);
  border-radius:var(--radius-pill);padding:6px 12px;font-family:inherit;font-size:var(--fs-xs);cursor:pointer;
  transition:border-color .15s,color .15s;
}
.link-chip:hover{border-color:var(--gold);color:var(--gold)}

/* 反查結果 */
.find-list{display:flex;flex-direction:column;gap:8px}
.find-item{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;background:var(--surface-inset);
}
.find-item .fname{font-family:"Noto Serif TC",serif;font-size:var(--fs-lg);font-weight:700;color:var(--gold-bright)}
.find-item .fzh{font-size:var(--fs-xs);color:var(--muted-bright)}
.find-item .ftag{
  margin-left:auto;font-size:var(--fs-2xs);color:var(--muted);
  border:1px solid var(--line);border-radius:var(--radius-pill);padding:2px 8px;
}
.find-item .ftag.exact{color:var(--gold);border-color:var(--gold)}

footer{
  padding:16px 14px calc(18px + env(safe-area-inset-bottom));
  text-align:center;color:var(--muted);font-size:var(--fs-2xs);line-height:1.8;
}
/* ── 觸控裝置:點擊目標放大(照抄 ScrollScore 的 pointer:coarse 三條規則)────────── */
@media (pointer:coarse){
  .btn{height:44px;min-width:44px}
  select.mini{min-height:38px}
}
/* 手機橫向:螢幕高度本來就很吃緊,44px 的按鈕會再吃掉寶貴的高度。
   這裡取 36px 折衷——比純高度斷點的 28px 好按,又不會把清單壓得更小。
   必須放在 pointer:coarse 之後,否則會被上面的 44px 蓋掉 */
@media (pointer:coarse) and (max-height:420px){
  .btn{height:36px}
}
/* 觸控目標寬度連續縮放:320px 只放得下 38px(仍遠高於 WCAG 2.2 AA 2.5.8 要求的 24px,
   而且高度維持 44px),400px 以上就回到 Apple HIG 建議的 44px。
   必須放在 pointer:coarse 之後才不會被上面的 min-width:44px 蓋掉 */
@media (pointer:coarse) and (max-width:420px){
  .btn{min-width:clamp(38px, 10.5vw, 44px)}
}

/* ── 使用者在系統關掉動態效果時,一律不要有轉場與動畫 ──────────────
   四個專案(ScrollScore / SightScore / LoudNorm / HarmonyMap)共用同一組斷點,
   這條是其中之一 */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important;
  }
}

/* ── 平板/桌機:左右兩欄 ──────────────────────────────────────
   放在整份樣式表的最後(跟 ScrollScore 一樣),寬度剛好等於 900px 時
   才會贏過上面那些 max-width:900px 的規則,不會兩套版面打架 */
@media (min-width:900px){
  /* 釘住的那塊裡面:左邊放分頁與根音、右邊放鍵盤;下半部左邊清單、右邊說明 */
  .topbar{display:grid;grid-template-columns:minmax(280px,340px) 1fr;gap:10px 14px;align-items:start}
  .topbar .tabs{grid-column:1;grid-row:1}
  .topbar #rootCard,.topbar #findCard{grid-column:1;grid-row:2}
  .topbar .kb-wrap{grid-column:2;grid-row:1 / span 2}
  /* 欄寬分配:會捲的長清單拿彈性寬度,不會捲的短說明給上限。
     反過來(清單鎖 420px、說明吃 1fr)在平板橫式會很難看——實測 1024×768 時
     清單被擠成 420 寬 × 1292 高的窄長條、右下角一大片空白。
     讓清單隨寬度長大,每列多放幾顆晶片,整體高度就跟著降下來 */
  .lower{display:grid;grid-template-columns:minmax(360px,1fr) minmax(340px,480px);align-items:start}
  /* 右邊的說明欄也跟著釘住。不然左邊清單很長、右邊說明很短,清單一往下捲,
     右半邊就整片空著。--topbar-h 由 JS 量出來(鍵盤高度會隨音域變,寫死會對不齊) */
  .info{position:sticky;top:calc(var(--header-h, 60px) + var(--topbar-h, 250px) + 10px)}
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="https://stevenmusic.github.io/" class="home-link" data-i18n-attr="aria-label:homeAria,title:homeAria">
      <span aria-hidden="true">←</span><span class="btn-label" data-i18n="homeText">首頁</span>
    </a>
    <h1>Harmony<span>Map</span></h1>
    <span class="tagline" data-i18n="tagline">和弦與音階地圖</span>
  </div>
  <div class="header-right">
    <!-- 主題在前、語言在後,跟 ScrollScore / LoudMaster 的 header-right 同一個順序。
         這裡原本是反過來的,四個工具並排時只有這一頁的兩顆鈕位置對調 -->
    <button class="btn" id="themeToggle" aria-label="淺色模式" aria-pressed="false" data-i18n-attr="aria-label:themeToggleLabel,title:themeToggleTitle" title="切換淺色/深色主題">
      <svg id="themeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 3a9 9 0 000 18z" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button class="btn" id="langToggle" aria-pressed="false" data-i18n-attr="aria-label:langToggleLabel,title:langToggleTitle" data-i18n="langToggleText">EN</button>
  </div>
</header>

<main>
  <!-- ══ 釘在上方的區塊:分頁 / 鍵盤 / 根音,捲動時不會離開畫面 ══ -->
  <div class="topbar">
    <div class="tabs" role="tablist">
      <button role="tab" id="tabChord" aria-selected="true" data-i18n="tabChord">和弦</button>
      <button role="tab" id="tabScale" aria-selected="false" data-i18n="tabScale">音階</button>
      <button role="tab" id="tabFind"  aria-selected="false" data-i18n="tabFind">反查</button>
    </div>

    <div class="kb-wrap">
      <canvas id="keyboardCanvas"></canvas>
      <span id="audioStatus" class="audio-status" hidden></span>
      <div class="kb-summary" id="kbSummary"></div>
      <!-- 起始八度/標示方式/播放方式都是「設一次就不太會再動」的設定,
           不該常駐在最貴的釘住區裡,收進這個浮動面板 -->
      <div class="kb-popover" id="kbPopover" hidden>
        <label><span data-i18n="octaveLabel">起始八度</span><select class="mini" id="octaveSel"></select></label>
        <label><span data-i18n="keyLabelLabel">琴鍵標示</span><select class="mini" id="labelSel">
          <option value="en" data-i18n="labelOptEn">音名 C D E</option>
          <option value="do" data-i18n="labelOptDo">唱名 Do Re Mi</option>
          <option value="deg" data-i18n="labelOptDeg">數字 1 ♭3 5</option>
          <option value="off" data-i18n="labelOptOff">不標字</option>
        </select></label>
        <label><span data-i18n="playModeLabel">播放方式</span><select class="mini" id="playModeSel"></select></label>
      </div>
    </div>

    <div class="card" id="rootCard">
      <div class="card-title" data-i18n="rootCardTitle">根音</div>
      <div class="root-row letters" id="letterRow"></div>
      <div class="acc-row" id="accRow"></div>
    </div>

    <div class="card" id="findCard" hidden>
      <div class="card-title" data-i18n="findChordTitle">反查和弦</div>
      <div class="desc" style="margin-top:0" data-i18n="findCardDesc">直接點鍵盤上的琴鍵選音,下面會列出所有符合的和弦名稱。最低的音就是低音:低音不是根音時會寫成斜線和弦(E G C 是 C/E),低音當根音的寫法排在前面。</div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <button class="btn small ghost" id="findClear" data-i18n="clearSelection">清除選音</button>
        <select class="mini" id="findSpell">
          <option value="sharp" data-i18n="spellSharp">拼寫偏好:升記號 ♯</option>
          <option value="flat" data-i18n="spellFlat">拼寫偏好:降記號 ♭</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ══ 只有這一區會捲動:和弦/音階清單 + 結果說明 ══ -->
  <div class="lower">
    <div class="card" id="typeCard">
      <!-- 篩選預設收合。它是「偶爾用一次」的功能,常駐展開會把主要內容(和弦清單)
           整個推到第一屏之外——實測手機版第一顆和弦落在 y=803 的 844px 畫面上 -->
      <!-- 搜尋與篩選併成一排。篩選預設收合——它是「偶爾用一次」的功能,
           常駐展開會把主要內容(和弦清單)整個推到第一屏之外 -->
      <div class="find-row">
        <div class="search-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="typeSearch" type="search" data-i18n-attr="placeholder:searchPlaceholder" placeholder="搜尋名稱、符號或公式" autocomplete="off">
        </div>
        <button class="filter-summary" id="filterToggle" aria-expanded="false">
          <span class="chev">›</span><span data-i18n="filterToggleText">篩選</span><span class="badge" id="filterBadge"></span>
        </button>
      </div>
      <div class="filter-rows" id="filterRows" hidden>
        <div class="filter-row" id="styleRow"></div>
        <div class="filter-row" id="levelRow"></div>
        <div class="filter-row" id="sizeRow"></div>
        <div class="filter-row" id="dupRow"></div>
        <div class="filter-hint" id="filterHint"></div>
      </div>
      <!-- 分類按鈕:一次只顯示一個家族/系統的項目。80 個和弦、120 個音階全部攤成
           一長條清單的話,要看小調系得先捲過三個家族;改成先選分類,清單一次最多 20 個。
           窄螢幕分類有 14 組,排成一列要左右滑才找得到,所以收成一顆按鈕 + 展開面板 -->
      <button class="group-current" id="groupCurrent" aria-expanded="false">
        <span class="gc-label"></span><span class="cnt"></span><span class="chev">›</span>
      </button>
      <div class="group-tabs" id="groupTabs"></div>
      <div class="group-note" id="groupNote"></div>
      <div class="type-scroll" id="typeList"></div>
    </div>

    <div class="info">
      <div class="card" id="readout"></div>
      <div class="card" id="extraCard" hidden></div>
    </div>
  </div>
</main>

<footer>
  HarmonyMap
</footer>

<script>
"use strict";
const $ = id => document.getElementById(id);

/* ══════════════════════════════════════════════════════════════
   0. 多語言:文案字典 + 套用邏輯
   ──────────────────────────────────────────────────────────────
   只維護「一份」DOM——所有靜態文字掛 data-i18n / data-i18n-attr,
   applyLanguage() 統一走一遍 DOM 換字,不是中英文各刻一份畫面。
   和弦/音階本身的名稱字典裡本來就同時有 zh/en 兩個欄位(見下面第 2、3 節),
   那些是樂理名詞、不是介面文字,不進這份字典,用 localName()/subName() 挑欄位。
   ══════════════════════════════════════════════════════════════ */
const LANG_KEY = "sm_lang"; // 與 ScrollScore / SightScore / LoudMaster / Hub 共用同一把 key
let LANG = localStorage.getItem(LANG_KEY) === "en" ? "en" : "zh"; // 沒存過或存的不是 en,一律回中文

const I18N = {
  zh: {
    pageTitle: "HarmonyMap — 和弦與音階地圖",

/* t(key, vars):讀目前語言的字典,缺字退回中文、再退回 key 本身。
   vars 用來填 "{n}" 這種佔位符——八度數字、還差幾個音,這幾句話都要塞數字進去 */
function t(key, vars){
  let s = (I18N[LANG] && I18N[LANG][key]) || I18N.zh[key] || key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}
/* 和弦/音階字典本身每一條目已經同時有 zh/en 兩個欄位(不是介面文字,是樂理名詞),
   所以不走 I18N,直接依目前語言挑欄位。localName = 目前語言的主要名稱。
   subName = 副標用的對照名稱:中文介面附上英文原名(查資料、看譜都用得到),
   英文介面則**不附中文名**——英文版裡冒出一個中文名稱讀不出任何資訊,只是雜訊。
   所以 subName 在英文介面回傳空字串,呼叫端要連分隔號一起省略,
   不然會留下孤零零的「 · 」(用 nameWithSub() 就不必每個地方各判斷一次) */
function localName(def){ return LANG === "en" ? (def.en || def.zh) : def.zh; }
function subName(def){ return LANG === "en" ? "" : (def.en || def.zh); }
function nameWithSub(main, def){ const s = subName(def); return s ? main + " · " + s : main; }
/* 每個和弦/音階的長篇說明(def.d)也有對應的英文版 def.d_en,挑法跟 localName 一樣。
   沒有 d_en 就退回中文,不要讓面板開天窗(200 條理論上都已經補好了) */
function localDesc(def){ return LANG === "en" ? (def.d_en || def.d) : def.d; }

/* 走一遍 DOM,把 data-i18n / data-i18n-attr 標記的文字換成目前語言。
   同一份元素、同一份 DOM 結構,只換文字內容——不是中英文各刻一份畫面 */
function applyLanguage(lang){
  LANG = (lang === "en") ? "en" : "zh";
  localStorage.setItem(LANG_KEY, LANG);
  document.documentElement.lang = LANG === "en" ? "en" : "zh-Hant";
  document.documentElement.setAttribute("data-lang", LANG);
  document.title = t("pageTitle");
  const titleTag = $("pageTitle");
  if (titleTag) titleTag.textContent = t("pageTitle");
  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.setAttribute("content", t("pageTitle"));
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-attr]").forEach(el => {
    el.getAttribute("data-i18n-attr").split(",").forEach(pair => {
      const [attr, key] = pair.split(":");
      if (attr && key) el.setAttribute(attr.trim(), t(key.trim()));
    });
  });
  const lt = $("langToggle");
  if (lt) lt.setAttribute("aria-pressed", String(LANG === "en"));
  // 鋼琴取樣還在載入/失敗時,狀態文字是用 setAudioStatus() 存 key 記住的——
  // 換語言時補一次,免得它停在切換前的語言,一直等到下一次狀態變化才會更新
  if (typeof audioStatusKey !== "undefined" && audioStatusKey && typeof setAudioStatus === "function") {
    setAudioStatus(audioStatusKey);
  }
  // 動態產生的內容(清單、篩選列、鍵盤摘要、結果面板…)不是靠 data-i18n 走的,
  // 換語言之後要整套重新 render 一次,才不會留下舊語言的殘影
  if (typeof render === "function") render();
}

/* ══════════════════════════════════════════════════════════════
   1. 樂理核心:音名拼寫
   ──────────────────────────────────────────────────────────────
   「C 小三度」寫成 E♭ 而不是 D♯,是因為三度就必須落在 C 往上數第三個字母 E 上。
   所以這裡不用「12 個音的查表」,而是照樂理規則推:
     字母 = 根音字母 + (級數 - 1),升降記號 = 目標音高 - 該字母的自然音高。
   這樣 Cdim7 會正確地拼成 C E♭ G♭ B♭♭(而不是 C D♯ F♯ A),
   Locrian 的 ♭5 也不會被寫成 ♯4。
   ══════════════════════════════════════════════════════════════ */
const LETTERS   = ["C","D","E","F","G","A","B"];
const LETTER_PC = [0, 2, 4, 5, 7, 9, 11];        // 各字母的自然音高(半音)
const SOLFEGE   = ["Do","Re","Mi","Fa","Sol","La","Si"]; // 固定唱名,跟字母一一對應
/* 級數 → 相對根音的半音數(自然音程) */
const DEG_SEMI  = {1:0, 2:2, 3:4, 4:5, 5:7, 6:9, 7:11, 9:14, 11:17, 13:21};

function accText(n){
  if (n === 0) return "";
  if (n > 0) return "♯".repeat(n);
  return "♭".repeat(-n);
}
/* 把 "♭13"、"♯11"、"♭♭7"、"5" 這種級數代號拆成 {deg, alt} */
function parseToken(tok){
  let alt = 0, i = 0;
  while (i < tok.length && (tok[i] === "♭" || tok[i] === "♯")) { alt += tok[i] === "♯" ? 1 : -1; i++; }
  return { deg: parseInt(tok.slice(i), 10), alt };
}
function tokenSemi(tok){
  const { deg, alt } = parseToken(tok);
  return DEG_SEMI[deg] + alt;
}
/* 根音(字母序號 + 升降)加上一個級數代號,推出該音的正規拼寫與相對半音 */
function spell(rootLetter, rootAcc, tok){
  const { deg } = parseToken(tok);
  const semi     = tokenSemi(tok);
  const step     = rootLetter + (deg - 1);
  const letter   = step % 7;
  const carry    = Math.floor(step / 7);            // 跨過 B→C 要補一個八度
  const absolute = LETTER_PC[rootLetter] + rootAcc + semi;
  const natural  = LETTER_PC[letter] + 12 * carry;
  let acc = absolute - natural;
  let name;
  if (acc < -2 || acc > 2) {
    // 三重升降(例如 G♯ 的利底安♯2)在實務上不會這樣寫,退回等音的簡易拼寫
    name = simpleName(((absolute % 12) + 12) % 12, acc < 0 ? "flat" : "sharp");
    acc = null;
  } else {
    name = LETTERS[letter] + accText(acc);
  }
  return { tok, deg, semi, name, letter, acc };
}
const SHARP_NAMES = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const FLAT_NAMES  = ["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];
function simpleName(pc, pref){ return (pref === "flat" ? FLAT_NAMES : SHARP_NAMES)[pc]; }
/* 音名 → 唱名(把字母換掉,升降記號原樣保留) */
function toSolfege(name){
  const idx = LETTERS.indexOf(name[0]);
  return idx < 0 ? name : SOLFEGE[idx] + name.slice(1);
}
function midiToFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }

  {id:"add11", sym:"add11",  zh:"加十一和弦",   en:"Add 11",           g:"大調系", t:["1","3","5","11"],      alias:["add4"], lv:1, st:"pop film", d:"大三和弦加四度音,三音與四音只差半音會打架,通常把三音移高八度或省略。", d_en:"A major triad plus a 4th. The 3rd and 4th clash a half step apart, so the 3rd is usually moved up an octave or dropped."},
  {id:"adds11",sym:"add♯11", zh:"加升十一",     en:"Add ♯11",          g:"大調系", t:["1","3","5","♯11"],     alias:["add♭5"], lv:1, st:"jz film", d:"不加七音、直接加 ♯11,利底安的色彩但保持三和弦的輕盈。", d_en:"No 7th, just a raised 11th added directly — the Lydian color while staying as light as a triad."},
  {id:"maj7",  sym:"maj7",   zh:"大七和弦",     en:"Major 7th",        g:"大調系", t:["1","3","5","7"],        alias:["△7","M7"], lv:3, st:"cl pop jz film", d:"大三和弦加大七度,是大調 I 級與 IV 級的完整形態,溫暖而帶有一點慵懶的漂浮感。", d_en:"A major triad plus a major 7th — the full form of the I and IV chords in a major key, warm with a slightly languid floating quality."},
  {id:"maj7s5",sym:"maj7♯5", zh:"增大七和弦",   en:"Major 7th ♯5",     g:"大調系", t:["1","3","♯5","7"],       alias:["△7♯5"], lv:1, st:"jz film", d:"取自旋律小調的第三級(Lydian ♯5),漂浮、沒有重力感,現代爵士很愛用。", d_en:"Borrowed from the 3rd degree of melodic minor (Lydian ♯5) — weightless, no sense of gravity, a favorite in modern jazz."},
  {id:"maj7b5",sym:"maj7♭5", zh:"降五大七",     en:"Major 7 ♭5",       g:"大調系", t:["1","3","♭5","7"],       alias:["△7♭5"], lv:1, st:"jz", d:"大七和弦把五音降低,與 maj7♯11 是同一組音的不同寫法(取代五音 vs 保留五音)。", d_en:"A maj7 chord with the 5th lowered — the same pitches as maj7♯11 spelled differently (replacing the 5th vs. keeping it)."},
  {id:"69",    sym:"6/9",    zh:"六九和弦",     en:"Six Nine",         g:"大調系", t:["1","3","5","6","9"],   alias:["6add9"], lv:2, st:"pop jz bl", d:"六音與九音一起加,完全沒有七度的張力,是爵士最常見的「大調結束和弦」。", d_en:"The 6th and 9th added together, with no 7th tension at all — jazz's most common \"major resolution chord\"."},
  {id:"maj9",  sym:"maj9",   zh:"大九和弦",     en:"Major 9th",        g:"大調系", t:["1","3","5","7","9"],     alias:["△9"], lv:2, st:"pop jz film", d:"maj7 再往上疊九音,是最華麗的大調延伸音響,實務上常省略五音。", d_en:"A maj7 chord with the 9th stacked on top — the showiest major-key extension; the 5th is often dropped in practice."},
  {id:"maj9s5", sym:"maj9♯5", zh:"增大九和弦", en:"Major 9th ♯5", g:"大調系", t:["1","3","♯5","7","9"], alias:["△9♯5"], lv:1, st:"jz film", d:"增大七和弦再加九音,取自旋律小調第三級,漂浮感更厚。", d_en:"A maj7♯5 chord plus the 9th, borrowed from the 3rd degree of melodic minor — an even thicker floating quality."},
  {id:"maj7s11",sym:"maj7♯11",zh:"利底安大七",  en:"Major 7 ♯11",      g:"大調系", t:["1","3","5","7","♯11"],       alias:["△7♯11"], lv:2, st:"jz film", d:"十一音升高半音就避開了與三音的衝突,這是利底安調式的招牌色彩,明亮又懸浮。", d_en:"Raising the 11th a half step avoids the clash with the 3rd — the signature color of the Lydian mode, bright and suspended."},
  {id:"maj13", sym:"maj13",  zh:"大十三和弦",   en:"Major 13th",       g:"大調系", t:["1","3","5","7","9","13"],    alias:["△13"], lv:1, st:"jz", d:"大調延伸的極致,把 Ionian 除了四音以外的音都收進來。", d_en:"The ultimate major-key extension — every note of Ionian except the 4th, stacked up."},
  {id:"maj9s11",sym:"maj9♯11",zh:"大九升十一",  en:"Major 9 ♯11",      g:"大調系", t:["1","3","5","7","9","♯11"],   alias:["△9♯11"], lv:1, st:"jz film", d:"利底安色彩的完整堆疊,明亮到接近透明,是電影配樂常用的「開闊感」和弦。", d_en:"The full stack of the Lydian color, bright to the point of transparency — a common \"wide open\" chord in film scoring."},
  {id:"69s11", sym:"6/9♯11",  zh:"六九升十一",   en:"Six Nine ♯11",     g:"大調系", t:["1","3","5","6","9","♯11"], alias:[], lv:1, st:"jz", d:"六九和弦再加利底安的 ♯11,完全沒有七度的張力卻有滿滿的色彩。", d_en:"A 6/9 chord plus the Lydian ♯11 — full color with no 7th tension at all."},
  {id:"maj13s11",sym:"maj13♯11",zh:"大十三升十一",en:"Major 13 ♯11",   g:"大調系", t:["1","3","5","7","9","♯11","13"], alias:[], lv:1, st:"jz", d:"利底安音階的七個音全部堆起來,大調延伸的理論極限。", d_en:"All seven notes of the Lydian scale stacked up — the theoretical limit of major-key extension."},

  // ── 屬和弦系 ──
  {id:"7",     sym:"7",      zh:"屬七和弦",     en:"Dominant 7th",     g:"屬和弦系", t:["1","3","5","♭7"],       alias:["dom7"], lv:3, st:"cl pop jz bl", d:"三音與♭7形成三全音,是所有調性音樂最重要的張力來源,天生就想解決到 I 級。", d_en:"The 3rd and ♭7 form a tritone — the single most important source of tension in tonal music, always wanting to resolve to the I chord."},
  {id:"7s5",   sym:"7♯5",    zh:"增屬七和弦",   en:"Augmented 7th",    g:"屬和弦系", t:["1","3","♯5","♭7"],      alias:["aug7","7+5"], lv:1, st:"cl jz", d:"屬七和弦把五音升高,張力更強,常出現在解決到小調的 V 級。", d_en:"A dominant 7th with the 5th raised for more tension — often appears resolving to the V of a minor key."},
  {id:"7b5",   sym:"7♭5",    zh:"降五屬七",     en:"Dominant 7th ♭5",  g:"屬和弦系", t:["1","3","♭5","♭7"],      alias:[], lv:1, st:"jz", d:"屬七把五音降低,和它的三全音代理和弦共用同一組音,是變化屬和弦的入門形態。", d_en:"A dominant 7th with the 5th lowered, sharing its pitches with its tritone-substitute chord — an entry point into altered dominants."},
  {id:"9",     sym:"9",      zh:"屬九和弦",     en:"Dominant 9th",     g:"屬和弦系", t:["1","3","5","♭7","9"],    alias:[], lv:2, st:"pop jz bl", d:"屬七加九音,張力仍在但顏色更飽滿,放克與藍調最常見的和弦之一。", d_en:"A dominant 7th plus the 9th — the tension stays but the color gets fuller, one of the most common chords in funk and blues."},
  {id:"9b5", sym:"9♭5", zh:"降五九和弦", en:"Dominant 9th ♭5", g:"屬和弦系", t:["1","3","♭5","♭7","9"], lv:1, st:"jz", d:"九和弦把五音降半音,♭5 與 9 同時在場,常寫成 7♭5add9。", d_en:"A 9th chord with the 5th lowered a half step — ♭5 and 9 together, often written as 7♭5add9."},
  {id:"9s5", sym:"9♯5", zh:"增五九和弦", en:"Dominant 9th ♯5", g:"屬和弦系", t:["1","3","♯5","♭7","9"], lv:1, st:"jz", d:"九和弦把五音升半音,全音音階的和聲代表,五音與 ♭13 同音不同拼寫。", d_en:"A 9th chord with the 5th raised a half step — the harmonic signature of the whole-tone scale; the 5th and ♭13 are the same pitch spelled differently."},
  {id:"7b9",   sym:"7♭9",    zh:"降九屬七",     en:"Dominant 7 ♭9",    g:"屬和弦系", t:["1","3","5","♭7","♭9"],   alias:[], lv:2, st:"cl jz", d:"往小調解決時的首選,去掉根音後其實就是一個減七和弦,張力尖銳。", d_en:"The first choice when resolving to a minor key — drop the root and it's literally a diminished 7th chord, sharply tense."},
  {id:"7s9",   sym:"7♯9",    zh:"升九屬七",     en:"Dominant 7 ♯9",    g:"屬和弦系", t:["1","3","5","♭7","♯9"],   alias:["Hendrix"], lv:2, st:"pop jz bl", d:"大三度與升九(等於小三度)同時存在的衝突音響,〈Purple Haze〉那個著名的和弦。", d_en:"The clash of a major 3rd against a raised 9th (enharmonically a minor 3rd) — the famous chord from \"Purple Haze\"."},
  {id:"7b9s9", sym:"7♭9♯9", zh:"降九升九和弦", en:"Dominant 7th ♭9♯9", g:"屬和弦系", t:["1","3","5","♭7","♭9","♯9"], lv:1, st:"jz", d:"兩個九音同時出現,半音撞在一起,是最緊繃的屬和弦聲響之一。", d_en:"Both altered 9ths present at once, a half step apart — one of the most tense-sounding dominant chords."},
  {id:"7s11",  sym:"7♯11",   zh:"升十一屬七",   en:"Dominant 7 ♯11",   g:"屬和弦系", t:["1","3","5","♭7","♯11"],      alias:["7♭5(add)"], lv:2, st:"jz", d:"對應利底安屬音階,是三全音代理常用的顏色,比 7♭5 保留了完全五度。", d_en:"Matches the Lydian dominant scale — a common tritone-substitute color that keeps the perfect 5th, unlike 7♭5."},
  {id:"7s5s9", sym:"7♯5♯9",  zh:"增五升九",     en:"Dominant 7 ♯5♯9",  g:"屬和弦系", t:["1","3","♯5","♭7","♯9"],  alias:[], lv:1, st:"jz", d:"兩個變化音一起上,張力極高,對應變化音階。", d_en:"Two altered tensions stacked together for very high tension, matching the altered scale."},
  {id:"7s5b9", sym:"7♯5♭9",  zh:"增五降九",     en:"Dominant 7 ♯5♭9",  g:"屬和弦系", t:["1","3","♯5","♭7","♭9"],  alias:[], lv:1, st:"jz", d:"往小調解決時最常見的變化屬和弦之一,對應變化音階或半全減音階。", d_en:"One of the most common altered dominants resolving to a minor key, matching the altered scale or the half-whole diminished scale."},
  {id:"7b5b9", sym:"7♭5♭9", zh:"降五降九和弦", en:"Dominant 7th ♭5♭9", g:"屬和弦系", t:["1","3","♭5","♭7","♭9"], lv:1, st:"jz", d:"♭5 與 ♭9 的組合,解決到小調時比 ♯5♭9 更沉。", d_en:"The ♭5 and ♭9 combination — darker than ♯5♭9 when resolving to a minor key."},
  {id:"7b5s9", sym:"7♭5♯9", zh:"降五升九和弦", en:"Dominant 7th ♭5♯9", g:"屬和弦系", t:["1","3","♭5","♭7","♯9"], lv:1, st:"jz", d:"♭5 配 ♯9,變化屬和弦的四種組合之一,藍調搖滾也用得到。", d_en:"♭5 paired with ♯9 — one of the four altered-dominant combinations, also used in blues rock."},
  {id:"7b13",  sym:"7♭13",   zh:"降十三屬七",   en:"Dominant 7 ♭13",   g:"屬和弦系", t:["1","3","5","♭7","♭13"],      alias:["7♯5(add)"], lv:1, st:"jz", d:"♭13 與 ♯5 是同一個音高,但寫法不同:保留完全五度時寫 ♭13,取代五音時寫 ♯5。", d_en:"♭13 and ♯5 are the same pitch, spelled differently: write ♭13 when keeping the perfect 5th, ♯5 when replacing it."},
  {id:"7s9b13",sym:"7♯9♭13", zh:"升九降十三",   en:"Dominant 7 ♯9♭13", g:"屬和弦系", t:["1","3","♭7","♯9","♭13"],     alias:[], lv:1, st:"jz", d:"往小調解決時最濃烈的配色,五音通常省略讓 ♭13 站出來。", d_en:"The thickest coloring for resolving to a minor key — the 5th is usually dropped so the ♭13 can stand out."},
  {id:"13",    sym:"13",     zh:"屬十三和弦",   en:"Dominant 13th",    g:"屬和弦系", t:["1","3","5","♭7","9","13"],   alias:[], lv:2, st:"jz bl", d:"最豐滿的屬和弦,實際彈奏通常只留 3、♭7、9、13 四個音,大樂團的標準配置。", d_en:"The fullest dominant chord — in practice usually only the 3rd, ♭7, 9th, and 13th are voiced, the standard big-band setup."},
  {id:"9s11",  sym:"9♯11",   zh:"九升十一",     en:"Dominant 9 ♯11",   g:"屬和弦系", t:["1","3","5","♭7","9","♯11"],  alias:[], lv:1, st:"jz", d:"屬九再加 ♯11,對應利底安屬音階,是三全音代理最完整的表達。", d_en:"A dominant 9th plus ♯11, matching the Lydian dominant scale — the fullest expression of a tritone substitute."},
  {id:"7b9s11",sym:"7♭9♯11", zh:"降九升十一",   en:"Dominant 7 ♭9♯11", g:"屬和弦系", t:["1","3","5","♭7","♭9","♯11"], alias:[], lv:1, st:"jz", d:"對應半全減音階,同時具備 ♭9 的尖銳與 ♯11 的懸浮,張力極高。", d_en:"Matches the half-whole diminished scale — combines the sharpness of ♭9 with the suspension of ♯11 for very high tension."},
  {id:"7s9s11", sym:"7♯9♯11", zh:"升九升十一和弦", en:"Dominant 7th ♯9♯11", g:"屬和弦系", t:["1","3","5","♭7","♯9","♯11"], lv:1, st:"jz", d:"♯9 與 ♯11 並置,常見於旋律小調第七級之外的另一種變化配置。", d_en:"♯9 and ♯11 placed together — commonly found as an alternate alteration outside the 7th degree of melodic minor."},
  {id:"7b9b13",sym:"7♭9♭13", zh:"降九降十三",   en:"Dominant 7 ♭9♭13", g:"屬和弦系", t:["1","3","5","♭7","♭9","♭13"], alias:[], lv:1, st:"jz", d:"對應半全減音階或變化音階,往小調解決時最濃的顏色。", d_en:"Matches the half-whole diminished or altered scale — the darkest coloring when resolving to a minor key."},
  {id:"7alt",  sym:"7alt",   zh:"變化屬和弦",   en:"Altered Dominant", g:"屬和弦系", t:["1","3","♭7","♭9","♯9","♭13"],alias:["7♯9♭9♭13"], lv:2, st:"jz", d:"把所有能變化的延伸音(♭9、♯9、♭13)一次用上,對應變化音階,爵士最強的解決前張力。", d_en:"Piles on every alterable extension (♭9, ♯9, ♭13) at once, matching the altered scale — jazz's strongest pre-resolution tension."},
  {id:"13s11", sym:"13♯11",  zh:"十三升十一",   en:"Dominant 13 ♯11",  g:"屬和弦系", t:["1","3","5","♭7","9","♯11","13"], alias:[], lv:1, st:"jz", d:"利底安屬音階的完整七音堆疊,大樂團寫作的極限配置。", d_en:"The full seven-note stack of the Lydian dominant scale — the extreme configuration in big-band writing."},
  {id:"13b9", sym:"13♭9", zh:"降九十三和弦", en:"Dominant 13th ♭9", g:"屬和弦系", t:["1","3","5","♭7","♭9","13"], lv:2, st:"jz film", d:"♭9 的張力配上大十三度的明亮,半減八度音階(HW)的招牌和聲。", d_en:"The tension of ♭9 against the brightness of a major 13th — the signature harmony of the half-whole (HW) diminished scale."},
  {id:"13s9", sym:"13♯9", zh:"升九十三和弦", en:"Dominant 13th ♯9", g:"屬和弦系", t:["1","3","5","♭7","♯9","13"], lv:1, st:"jz bl", d:"♯9 的藍調味配十三度,放克與靈魂樂裡很常見的濃厚屬和弦。", d_en:"A bluesy ♯9 paired with the 13th — a rich, common dominant chord in funk and soul."},

  // ── 小調系 ──
  {id:"min",   sym:"m",      zh:"小三和弦",     en:"Minor",            g:"小調系", t:["1","♭3","5"],           alias:["min","−"], lv:3, st:"cl pop jz bl film", d:"把大三和弦的三音降半音,色彩立刻轉為柔和、內斂。小調的 i 級。", d_en:"Lower the 3rd of a major triad a half step and the color turns soft and inward at once — the i chord of a minor key."},
  {id:"m6",    sym:"m6",     zh:"小六和弦",     en:"Minor 6th",        g:"小調系", t:["1","♭3","5","6"],      alias:[], lv:2, st:"cl jz", d:"小三和弦加大六度(注意是大六度,不是♭6),來自旋律小調,帶著淡淡的爵士感。", d_en:"A minor triad plus a major 6th (note: major, not ♭6) — borrowed from melodic minor, with a hint of jazz flavor."},
  {id:"madd9", sym:"m(add9)",zh:"小加九和弦",   en:"Minor Add 9",      g:"小調系", t:["1","♭3","5","9"],      alias:[], lv:2, st:"pop film", d:"小三和弦加九音,♭3 與 9 之間形成寬廣的張力,有種冷冽的美感。", d_en:"A minor triad plus the 9th — the ♭3 and 9 form a wide tension with a cool, crisp beauty."},
  {id:"madd11", sym:"madd11", zh:"小加十一和弦", en:"Minor add11", g:"小調系", t:["1","♭3","5","11"], alias:["m(add4)"], lv:1, st:"pop film", d:"小三和弦加四度,沒有七音,空靈而不指向任何解決,配樂常用。", d_en:"A minor triad plus the 4th, no 7th — airy and unresolved, common in film scoring."},
  {id:"mb6",   sym:"m♭6",     zh:"小三降六",     en:"Minor ♭6",         g:"小調系", t:["1","♭3","5","♭6"],      alias:[], lv:1, st:"cl film", d:"小三和弦加 ♭6(等同大三和弦的第一轉位加低音),自然小調的內部張力。", d_en:"A minor triad plus ♭6 (equivalent to a major triad's first inversion with a different bass) — the internal tension of natural minor."},
  {id:"m7",    sym:"m7",     zh:"小七和弦",     en:"Minor 7th",        g:"小調系", t:["1","♭3","5","♭7"],      alias:["min7","−7"], lv:3, st:"pop jz bl", d:"最溫和的七和弦,張力低、可久留,ii–V–I 裡的 ii 級就是它。", d_en:"The gentlest 7th chord — low tension, easy to sit on; it's the ii chord in a ii–V–I progression."},
  {id:"mMaj7", sym:"mMaj7",  zh:"小大七和弦",   en:"Minor Major 7th",  g:"小調系", t:["1","♭3","5","7"],       alias:["m△7","mM7"], lv:2, st:"cl jz film", d:"小三和弦配大七度,來自和聲小調/旋律小調,懸疑、帶點希區考克式的不安。", d_en:"A minor triad with a major 7th, borrowed from harmonic/melodic minor — mysterious, with a bit of Hitchcockian unease."},
  {id:"m7s5",  sym:"m7♯5",   zh:"增五小七",     en:"Minor 7 ♯5",       g:"小調系", t:["1","♭3","♯5","♭7"],     alias:[], lv:1, st:"jz", d:"小七和弦把五音升高,等同大三和弦加六音的轉位,實務上不常單獨出現。", d_en:"A minor 7th with the 5th raised — equivalent to an inversion of a major-6th chord, rarely appears on its own in practice."},
  {id:"m69",   sym:"m6/9",   zh:"小六九和弦",   en:"Minor Six Nine",   g:"小調系", t:["1","♭3","5","6","9"],  alias:[], lv:1, st:"jz film", d:"小三和弦加六音與九音,沒有七度的張力,是小調段落最漂亮的收尾和弦。", d_en:"A minor triad plus the 6th and 9th, with no 7th tension — a beautiful way to close out a minor-key section."},
  {id:"m9",    sym:"m9",     zh:"小九和弦",     en:"Minor 9th",        g:"小調系", t:["1","♭3","5","♭7","9"],   alias:["−9"], lv:2, st:"pop jz bl", d:"小七和弦加九音,柔軟又有層次,是 Neo-Soul 的標準配備。", d_en:"A minor 7th plus the 9th — soft and layered, the standard-issue chord of neo-soul."},
  {id:"mMaj9", sym:"mMaj9",  zh:"小大九和弦",   en:"Minor Major 9th",  g:"小調系", t:["1","♭3","5","7","9"],    alias:["m△9"], lv:1, st:"jz film", d:"小大七再加九音,神祕色彩更濃,常見於旋律小調的即興。", d_en:"A minor-major 7th plus the 9th — even more mysterious, common in melodic-minor improvisation."},

  {id:"mMaj13", sym:"mMaj13", zh:"小大十三和弦", en:"Minor Major 13th", g:"小調系", t:["1","♭3","5","7","9","11","13"], alias:["m△13"], lv:1, st:"jz film", d:"旋律小調的完整堆疊,小三度與導音並存,同時帶大十三度。", d_en:"The full stack of melodic minor — the minor 3rd and the leading tone coexist alongside a major 13th."},

  {id:"lydianDom",  zh:"利底安屬音階",    en:"Lydian Dominant",      g:"旋律小調系統", t:["1","2","3","♯4","5","6","♭7"],      lv:2, d:"旋律小調第四級,又稱 Overtone 音階(接近自然泛音列),是 7♯11 與三全音代理的標準選擇。", d_en:"The 4th degree of melodic minor, also called the Overtone scale (close to the natural harmonic series) — the standard choice for 7♯11 and tritone substitution."},
  {id:"mixob6",     zh:"米索利地安 ♭6",   en:"Mixolydian ♭6",        g:"旋律小調系統", t:["1","2","3","4","5","♭6","♭7"],      lv:2, d:"旋律小調第五級,又稱印度音階,屬七和弦帶 ♭13 時用它。", d_en:"The 5th degree of melodic minor, also called the Hindu scale — used over dominant chords carrying a ♭13."},
  {id:"locrian2",   zh:"半減音階(洛克里安♮2)", en:"Locrian ♮2",      g:"旋律小調系統", t:["1","2","♭3","4","♭5","♭6","♭7"],    lv:2, d:"旋律小調第六級,比一般洛克里安多了自然九音,是小調 ii 級 m7♭5 的首選。", d_en:"The 6th degree of melodic minor — has a natural 9th that ordinary Locrian lacks, the first choice for a minor-key ii chord voiced as m7♭5."},
  {id:"altered",    zh:"變化音階(超級洛克里安)", en:"Altered / Super Locrian", g:"旋律小調系統", t:["1","♭2","♭3","♭4","♭5","♭6","♭7"], lv:2, d:"旋律小調第七級,含 ♭9 ♯9 ♭5 ♯5 四個變化音(♭4 其實就是大三度),7alt 的專屬音階。", d_en:"The 7th degree of melodic minor, containing four altered tones — ♭9, ♯9, ♭5, ♯5 (the ♭4 is enharmonically a major 3rd) — the dedicated scale for 7alt."},

  // ── 和聲大調系統 ──
  {id:"harmMajor",  zh:"和聲大調",        en:"Harmonic Major",       g:"和聲大調系統", t:["1","2","3","4","5","♭6","7"],       lv:2, d:"大調把六音降半音,同時擁有大三度與 ♭6,常用在 IV 級轉小調的瞬間。", d_en:"The major scale with the 6th lowered a half step, keeping both the major 3rd and the ♭6 — often used at the moment a IV chord tips into minor."},
  {id:"dorianb5", zh:"多利安 ♭5", en:"Dorian ♭5", g:"和聲大調系統", t:["1","2","♭3","4","♭5","6","♭7"], lv:1, d:"和聲大調第二級。小三度配 ♭5 又保留大六度,是 IIm7♭5 上的另一種選擇,比洛克里安 ♯2 更暗。", d_en:"The 2nd degree of harmonic major. A minor 3rd paired with ♭5 while keeping the major 6th — an alternative for IIm7♭5, darker than Locrian ♯2."},
  {id:"phrygianb4", zh:"弗里吉安 ♭4", en:"Phrygian ♭4", g:"和聲大調系統", t:["1","♭2","♭3","♭4","5","♭6","♭7"], lv:1, d:"和聲大調第三級。♭4 讓三音與四音擠在一起,張力極高,少見但適合營造不安。", d_en:"The 3rd degree of harmonic major. The ♭4 squeezes right up against the 3rd for very high tension — rare, but good for building unease."},
  {id:"lydianb3", zh:"利底安 ♭3", en:"Lydian ♭3", g:"和聲大調系統", t:["1","2","♭3","♯4","5","6","7"], lv:2, d:"和聲大調第四級,又稱 Lydian Diminished。小三度配 ♯4 與大七度,可用在 mMaj7♯11。", d_en:"The 4th degree of harmonic major, also called Lydian Diminished. A minor 3rd paired with ♯4 and a major 7th — usable over mMaj7♯11."},
  {id:"mixob2", zh:"米索利地安 ♭2", en:"Mixolydian ♭2", g:"和聲大調系統", t:["1","♭2","3","4","5","6","♭7"], lv:2, d:"和聲大調第五級。屬和弦配 ♭9 但保留大十三度,是 7♭9 上很好用的選擇。", d_en:"The 5th degree of harmonic major. A dominant chord with ♭9 that keeps the major 13th — a great choice over 7♭9."},
  {id:"lydAug2", zh:"增利底安 ♯2", en:"Lydian Augmented ♯2", g:"和聲大調系統", t:["1","♯2","3","♯4","♯5","6","7"], lv:1, d:"和聲大調第六級。三個升高音,漂浮又帶增二度,現代配樂用來寫神祕感。", d_en:"The 6th degree of harmonic major. Three raised tones — floating, with an augmented 2nd — used in modern scoring to write a sense of mystery."},
  {id:"locrianbb7", zh:"洛克里安 ♭♭7", en:"Locrian ♭♭7", g:"和聲大調系統", t:["1","♭2","♭3","4","♭5","♭6","♭♭7"], lv:1, d:"和聲大調第七級。與減七和弦完全相合,是 dim7 上的音階選擇。", d_en:"The 7th degree of harmonic major. A perfect match for a diminished 7th chord — the scale choice over dim7."},

  // ── 雙和聲大調系統 ──
  {id:"dblHarm",    zh:"雙和聲大調(拜占庭)", en:"Double Harmonic",   g:"雙和聲大調系統", t:["1","♭2","3","4","5","♭6","7"],      lv:2, d:"兩個增二度,又稱阿拉伯/吉普賽大調,異國感最強烈的七聲音階。", d_en:"Two augmented 2nds, also called the Arabic/Gypsy major scale — the most strongly exotic-sounding seven-note scale."},
  {id:"lydian26", zh:"利底安 ♯2 ♯6", en:"Lydian ♯2 ♯6", g:"雙和聲大調系統", t:["1","♯2","3","♯4","5","♯6","7"], lv:1, d:"雙和聲大調第二級。♯2 ♯4 ♯6 三個升高音,兩個增二度,最外放的一個調式。", d_en:"The 2nd degree of double harmonic major. Three raised tones — ♯2, ♯4, ♯6 — and two augmented 2nds, the most outward-facing of these modes."},
  {id:"ultraphryg", zh:"超弗里吉安", en:"Ultraphrygian", g:"雙和聲大調系統", t:["1","♭2","♭3","♭4","5","♭6","♭♭7"], lv:1, d:"雙和聲大調第三級,又稱弗里吉安 ♭4 ♭♭7。半音與增二度交錯,幾乎沒有穩定音。", d_en:"The 3rd degree of double harmonic major, also called Phrygian ♭4 ♭♭7. Half steps and augmented 2nds interleave, with almost no stable tone."},
  {id:"hungMinor",  zh:"匈牙利小調",      en:"Hungarian Minor",      g:"雙和聲大調系統", t:["1","2","♭3","♯4","5","♭6","7"],     lv:2, d:"和聲小調再把四音升高,同時有 ♯4 與導音,東歐吉普賽音樂的代表。", d_en:"Harmonic minor with the 4th also raised — has both ♯4 and a leading tone, representative of Eastern European Gypsy music."},
  {id:"oriental", zh:"東方音階", en:"Oriental", g:"雙和聲大調系統", t:["1","♭2","3","4","♭5","6","♭7"], lv:2, d:"雙和聲大調第五級,又稱 Mixolydian ♭5 ♭9。中東與東歐旋律常見的下行色彩。", d_en:"The 5th degree of double harmonic major, also called Mixolydian ♭5 ♭9 — a common descending color in Middle Eastern and Eastern European melodies."},
  {id:"ionianAug2", zh:"增愛奧尼安 ♯2", en:"Ionian Augmented ♯2", g:"雙和聲大調系統", t:["1","♯2","3","4","♯5","6","7"], lv:1, d:"雙和聲大調第六級。大調骨架配 ♯2 與 ♯5,古典晚期與配樂裡的增和弦素材。", d_en:"The 6th degree of double harmonic major. A major-scale skeleton with ♯2 and ♯5 — augmented-chord material from the late-Romantic era and film scoring."},
  {id:"locrianbb3bb7", zh:"洛克里安 ♭♭3 ♭♭7", en:"Locrian ♭♭3 ♭♭7", g:"雙和聲大調系統", t:["1","♭2","♭♭3","4","♭5","♭6","♭♭7"], lv:1, d:"雙和聲大調第七級。拼寫上出現兩個重降音,實際音高與雙和聲大調同一組。", d_en:"The 7th degree of double harmonic major. Spelled with two double-flats, but the same pitches as double harmonic major."},

  // ── 五聲與藍調 ──
  {id:"majPent",    zh:"大調五聲",        en:"Major Pentatonic",     g:"五聲與藍調", t:["1","2","3","5","6"],                lv:3, d:"大調拿掉四音與七音,沒有半音衝突,怎麼彈都不會錯,民謠與鄉村的基礎。", d_en:"The major scale with the 4th and 7th removed — no half-step clashes, so nothing you play sounds wrong. The foundation of folk and country music."},
  {id:"minPent",    zh:"小調五聲",        en:"Minor Pentatonic",     g:"五聲與藍調", t:["1","♭3","4","5","♭7"],              lv:3, d:"搖滾與藍調獨奏的第一課,與大調五聲互為關係音階(相差小三度)。", d_en:"Lesson one for rock and blues soloing, and the relative scale of major pentatonic (a minor 3rd apart)."},
  {id:"bluesMin",   zh:"小調藍調",        en:"Minor Blues",          g:"五聲與藍調", t:["1","♭3","4","♭5","5","♭7"],         lv:3, d:"小調五聲插入 ♭5 這顆藍調音,經過性地滑過去最有味道。", d_en:"Minor pentatonic with the ♭5 blue note dropped in — sounds best slid through as a passing tone."},
  {id:"bluesMaj",   zh:"大調藍調",        en:"Major Blues",          g:"五聲與藍調", t:["1","2","♭3","3","5","6"],           lv:2, d:"大調五聲插入 ♭3,♭3→3 的滑音是鄉村與西岸藍調的招牌。", d_en:"Major pentatonic with a ♭3 dropped in — the ♭3→3 slide is the signature move of country and West Coast blues."},
  {id:"egyptian",   zh:"埃及五聲(sus)",   en:"Egyptian / Sus Pent",  g:"五聲與藍調", t:["1","2","4","5","♭7"],               lv:1, d:"大調五聲的第二轉位,全是二度與四度堆疊,開放且無調性傾向。", d_en:"The second inversion of major pentatonic — entirely stacked 2nds and 4ths, open and with no clear tonal leaning."},

  // ── 日本音階 ──
  {id:"hirajoshi",  zh:"平調子",          en:"Hirajoshi",            g:"日本音階", t:["1","2","♭3","5","♭6"],              lv:2, d:"日本箏最常見的定弦音階,兩個半音落點讓它一聽就有和風。", d_en:"The most common tuning scale for the Japanese koto — its two half-step landings give it an unmistakable Japanese sound."},
  {id:"kumoi",      zh:"雲井調子",        en:"Kumoi",                g:"日本音階", t:["1","2","♭3","5","6"],               lv:2, d:"小調五聲換掉四音與七音、帶自然六度,清澈明亮的和風小調。", d_en:"Minor pentatonic with the 4th and 7th swapped out for a natural 6th — a clear, bright, Japanese-flavored minor scale."},
  {id:"miyakobushi",zh:"都節音階",        en:"Miyako-bushi",         g:"日本音階", t:["1","♭2","4","5","♭6"],              lv:2, d:"江戶時代都市音樂的代表音階,♭2 與 ♭6 兩個半音是它的招牌,聽起來最「日本」。", d_en:"The representative scale of Edo-period urban music — its two half steps, ♭2 and ♭6, are its signature, and it sounds the most \"Japanese\" of all."},
  {id:"insen",      zh:"陰旋音階",        en:"Insen",                g:"日本音階", t:["1","♭2","4","5","♭7"],              lv:1, d:"都節把 ♭6 換成 ♭7,陰暗中多一點流動感,常用於尺八與箏曲。", d_en:"Miyako-bushi with ♭6 swapped for ♭7 — darker but with more flow, common in shakuhachi and koto music."},
  {id:"iwato",      zh:"岩戶音階",        en:"Iwato",                g:"日本音階", t:["1","♭2","4","♭5","♭7"],             lv:1, d:"都節音階的轉位,含減五度,是日本音階裡最緊繃、最神祕的一個。", d_en:"An inversion of Miyako-bushi containing a diminished 5th — the tensest, most mysterious of the Japanese scales."},
  {id:"ryukyu",     zh:"琉球音階",        en:"Ryukyu / Okinawan",    g:"日本音階", t:["1","3","4","5","7"],                lv:2, d:"沖繩民謠的音階,拿掉二音與六音、保留大三與大七,明亮而獨特,與本土的陰暗和風完全相反。", d_en:"The scale of Okinawan folk music — drops the 2nd and 6th, keeps the major 3rd and major 7th, bright and distinct, the opposite of the dark mainland Japanese sound."},
  {id:"ritsu",      zh:"律音階",          en:"Ritsu",                g:"日本音階", t:["1","2","4","5","6"],                lv:1, d:"雅樂使用的音階,沒有半音,聽感平穩莊重。", d_en:"A scale used in gagaku court music, with no half steps — calm and stately."},
  {id:"minyo",      zh:"民謠音階",        en:"Min'yō",               g:"日本音階", t:["1","♭3","4","5","♭7"],              lv:1, d:"日本民謠的骨幹,音程結構與小調五聲相同,差別在旋律的走法與裝飾。", d_en:"The backbone of Japanese folk song — the same interval structure as minor pentatonic, differing in melodic movement and ornamentation."},
  {id:"ryo",        zh:"呂音階",          en:"Ryo",                  g:"日本音階", t:["1","2","3","5","6"],                lv:1, d:"與律音階相對的雅樂音階,結構等同大調五聲,明亮開闊。", d_en:"The gagaku counterpart to Ritsu — structurally identical to major pentatonic, bright and open."},

  // ── 阿拉伯與中東 ──
  {id:"hijaz",      zh:"希賈茲",          en:"Hijaz",                g:"阿拉伯與中東", t:["1","♭2","3","4","5","♭6","♭7"],  lv:2, d:"最廣為人知的馬卡姆,♭2 到 3 的增二度就是「中東感」的來源。音高結構與弗里吉安屬音階相同。", d_en:"The best-known maqam — the augmented 2nd from ♭2 to 3 is the source of that \"Middle Eastern\" feeling. Same pitches as Phrygian Dominant."},
  {id:"hijazkar",   zh:"希賈茲卡爾",      en:"Hijaz Kar",            g:"阿拉伯與中東", t:["1","♭2","3","4","5","♭6","7"],   lv:2, d:"上下半部都是希賈茲四音列,兩個增二度,又稱雙和聲大調、拜占庭音階。", d_en:"Both halves are Hijaz tetrachords, giving two augmented 2nds — also called double harmonic major or the Byzantine scale."},
  {id:"nahawand",   zh:"納哈萬德",        en:"Nahawand",             g:"阿拉伯與中東", t:["1","2","♭3","4","5","♭6","7"],   lv:2, d:"阿拉伯音樂裡的小調,結構等同和聲小調,是最貼近西方耳朵的馬卡姆之一。", d_en:"The minor scale of Arabic music — structurally identical to harmonic minor, one of the maqamat closest to Western ears."},
  {id:"kurd",       zh:"庫爾德",          en:"Kurd",                 g:"阿拉伯與中東", t:["1","♭2","♭3","4","5","♭6","♭7"], lv:2, d:"結構等同弗里吉安,現代阿拉伯流行歌大量使用。", d_en:"Structurally identical to Phrygian — used heavily in modern Arabic pop."},
  {id:"ajam",       zh:"阿賈姆",          en:"Ajam",                 g:"阿拉伯與中東", t:["1","2","3","4","5","6","7"],      lv:2, d:"阿拉伯音樂裡的大調,結構等同 Ionian,明亮、節慶感。", d_en:"The major scale of Arabic music — structurally identical to Ionian, bright and festive."},
  {id:"bayati",     zh:"巴亞提",          en:"Bayati",               g:"阿拉伯與中東", t:["1","2","♭3","4","5","♭6","♭7"],  lv:2, d:"最常用的馬卡姆之一。真正的巴亞提第二音是四分之一音(比 ♮2 略低),鋼琴彈不出來,這裡用最接近的十二平均律近似。", d_en:"One of the most-used maqamat. The true 2nd degree of Bayati is a quarter tone (slightly lower than ♮2), which a piano can't play — this is its closest 12-tone-equal-temperament approximation."},
  {id:"rast",       zh:"拉斯特",          en:"Rast",                 g:"阿拉伯與中東", t:["1","2","3","4","5","6","♭7"],     lv:2, d:"馬卡姆體系的「基準音階」,三音與七音實際是四分之一音,鋼琴上以 Mixolydian 近似。", d_en:"The \"reference scale\" of the maqam system — the 3rd and 7th are actually quarter tones, approximated on piano as Mixolydian."},
  {id:"saba",       zh:"薩巴",            en:"Saba",                 g:"阿拉伯與中東", t:["1","2","♭3","♭4","5","♭6","♭7"], lv:1, d:"四音就降下來(♭4),形成獨特的哀傷色彩,是最容易辨認的馬卡姆之一。", d_en:"The 4th degree drops a half step (♭4), giving it a distinctively mournful color — one of the most recognizable maqamat."},
  {id:"nikriz",     zh:"尼克里茲",        en:"Nikriz",               g:"阿拉伯與中東", t:["1","2","♭3","♯4","5","6","♭7"],  lv:1, d:"♯4 配自然六度,結構等同烏克蘭小調,土耳其與巴爾幹音樂常見。", d_en:"♯4 paired with a natural 6th — structurally identical to Ukrainian Dorian, common in Turkish and Balkan music."},
  {id:"nawaathar",  zh:"納瓦阿薩爾",      en:"Nawa Athar",           g:"阿拉伯與中東", t:["1","2","♭3","♯4","5","♭6","7"],  lv:1, d:"兩個增二度的小調型馬卡姆,結構等同匈牙利小調。", d_en:"A minor-type maqam with two augmented 2nds — structurally identical to Hungarian minor."},
  {id:"suznak",     zh:"蘇茲納克",        en:"Suznak",               g:"阿拉伯與中東", t:["1","2","3","4","5","♭6","7"],     lv:1, d:"下半部是拉斯特、上半部是希賈茲,結構等同和聲大調。", d_en:"The lower half is Rast, the upper half is Hijaz — structurally identical to harmonic major."},
  {id:"zanjaran",   zh:"贊賈蘭",          en:"Zanjaran",             g:"阿拉伯與中東", t:["1","♭2","3","4","5","6","♭7"],    lv:1, d:"希賈茲四音列配上明亮的自然六度,聽感比一般希賈茲開朗。", d_en:"A Hijaz tetrachord paired with a bright natural 6th — sounds more cheerful than typical Hijaz."},
  {id:"atharkurd",  zh:"阿薩爾庫爾德",    en:"Athar Kurd",           g:"阿拉伯與中東", t:["1","♭2","♭3","♯4","5","♭6","7"], lv:1, d:"庫爾德起頭、增四度轉折,是馬卡姆裡結構最曲折的一支。", d_en:"Starts as Kurd, then turns through an augmented 4th — the most winding structure among the maqamat."},
  {id:"persian",    zh:"波斯音階",        en:"Persian",              g:"阿拉伯與中東", t:["1","♭2","3","4","♭5","♭6","7"],  lv:1, d:"兩個增二度加減五度,異國情調濃厚,常見於電影配樂對「東方」的想像。", d_en:"Two augmented 2nds plus a diminished 5th — heavily exotic, often used in film scoring to evoke \"the East\"."},
  {id:"jiharkah", zh:"賈哈爾卡", en:"Jiharkah", g:"阿拉伯與中東", t:["1","2","3","4","5","6","♭7"], lv:1, d:"阿賈姆家族的馬卡姆,以大調四音列起頭、七音降半音,音高與米索利地安相同。", d_en:"A maqam of the Ajam family — starts with a major tetrachord, 7th lowered a half step — the same pitches as Mixolydian."},
  {id:"farahfaza", zh:"法拉赫法扎", en:"Farahfaza", g:"阿拉伯與中東", t:["1","2","♭3","4","5","♭6","♭7"], lv:1, d:"納哈萬德家族的馬卡姆,音高與自然小調相同,差別在旋律的行進與終止習慣。", d_en:"A maqam of the Nahawand family — same pitches as natural minor, differing in melodic movement and cadence habits."},
  {id:"shawqafza", zh:"蕭克阿夫扎", en:"Shawq Afza", g:"阿拉伯與中東", t:["1","2","3","4","5","♭6","7"], lv:1, d:"阿賈姆家族的馬卡姆,上半部改用希賈茲四音列,音高與和聲大調相同。", d_en:"A maqam of the Ajam family — the upper half switches to a Hijaz tetrachord; same pitches as harmonic major."},

  // ── 印度與其他亞洲 ──
  {id:"bilawal",    zh:"比拉瓦爾",        en:"Bilawal Thaat",        g:"印度與其他亞洲", t:["1","2","3","4","5","6","7"],      lv:2, d:"印度十大塔特(音階母體)之一,結構等同大調,是其他塔特的參照點。", d_en:"One of the ten Hindustani thaats (parent scales) — structurally identical to the major scale, the reference point for the other thaats."},
  {id:"khamaj",     zh:"卡瑪吉",          en:"Khamaj Thaat",         g:"印度與其他亞洲", t:["1","2","3","4","5","6","♭7"],     lv:1, d:"結構等同 Mixolydian,輕快的半古典曲目(Thumri)常用。", d_en:"Structurally identical to Mixolydian — common in lighter semi-classical repertoire (thumri)."},
  {id:"kafi",       zh:"卡菲",            en:"Kafi Thaat",           g:"印度與其他亞洲", t:["1","2","♭3","4","5","6","♭7"],    lv:2, d:"結構等同多利安,是北印度音樂裡最常見的小調型塔特。", d_en:"Structurally identical to Dorian — the most common minor-type thaat in North Indian music."},
  {id:"asavari",    zh:"阿薩瓦里",        en:"Asavari Thaat",        g:"印度與其他亞洲", t:["1","2","♭3","4","5","♭6","♭7"],   lv:1, d:"結構等同自然小調,晨間拉格的典型音階。", d_en:"Structurally identical to natural minor — the typical scale of morning ragas."},
  {id:"bhairavi",   zh:"拜拉維",          en:"Bhairavi Thaat",       g:"印度與其他亞洲", t:["1","♭2","♭3","4","5","♭6","♭7"],  lv:2, d:"結構等同弗里吉安,音樂會通常以拜拉維作結。", d_en:"Structurally identical to Phrygian — concerts traditionally close with Bhairavi."},
  {id:"bhairav",    zh:"拜拉夫",          en:"Bhairav Thaat",        g:"印度與其他亞洲", t:["1","♭2","3","4","5","♭6","7"],    lv:2, d:"結構等同雙和聲大調,清晨演奏的莊嚴拉格。", d_en:"Structurally identical to double harmonic major — a solemn raga performed at dawn."},
  {id:"kalyan",     zh:"卡揚",            en:"Kalyan Thaat",         g:"印度與其他亞洲", t:["1","2","3","♯4","5","6","7"],     lv:2, d:"結構等同利底安,黃昏拉格的代表。", d_en:"Structurally identical to Lydian — representative of evening ragas."},
  {id:"marwa",      zh:"馬爾瓦",          en:"Marwa Thaat",          g:"印度與其他亞洲", t:["1","♭2","3","♯4","5","6","7"],    lv:1, d:"♭2 配 ♯4,刻意迴避五音,懸浮而不安定。", d_en:"♭2 paired with ♯4, deliberately avoiding the 5th — suspended and unsettled."},
  {id:"purvi",      zh:"普爾維",          en:"Purvi Thaat",          g:"印度與其他亞洲", t:["1","♭2","3","♯4","5","♭6","7"],   lv:1, d:"馬爾瓦再把六音降下來,日落時分的拉格。", d_en:"Marwa with the 6th also lowered — a raga for sunset."},
  {id:"todi",       zh:"托迪",            en:"Todi Thaat",           g:"印度與其他亞洲", t:["1","♭2","♭3","♯4","5","♭6","7"],  lv:1, d:"三個降音配一個升四,是十大塔特裡張力最強的一個。", d_en:"Three lowered tones paired with a raised 4th — the most tense of the ten thaats."},
  {id:"gong",       zh:"宮調式",          en:"Gong (Chinese)",       g:"印度與其他亞洲", t:["1","2","3","5","6"],              lv:2, d:"中國五聲調式的第一調,以宮為主音,結構等同大調五聲,端正明亮。", d_en:"The first mode of the Chinese pentatonic system, centered on gong — structurally identical to major pentatonic, upright and bright."},
  {id:"shang",      zh:"商調式",          en:"Shang (Chinese)",      g:"印度與其他亞洲", t:["1","2","4","5","♭7"],             lv:1, d:"以商為主音的五聲調式,沒有三音,聽感中性開闊。", d_en:"A pentatonic mode centered on shang — no 3rd, a neutral, open sound."},
  {id:"jue",        zh:"角調式",          en:"Jue (Chinese)",        g:"印度與其他亞洲", t:["1","♭3","4","♭6","♭7"],           lv:1, d:"以角為主音的五聲調式,五個音裡沒有純五度,是五個調式中最不穩定的。", d_en:"A pentatonic mode centered on jue — none of its five notes form a perfect 5th, making it the least stable of the five modes."},
  {id:"zhi",        zh:"徵調式",          en:"Zhi (Chinese)",        g:"印度與其他亞洲", t:["1","2","4","5","6"],              lv:1, d:"以徵為主音的五聲調式,結構等同律音階,平和舒展。", d_en:"A pentatonic mode centered on zhi — structurally identical to Ritsu, calm and expansive."},
  {id:"yu",         zh:"羽調式",          en:"Yu (Chinese)",         g:"印度與其他亞洲", t:["1","♭3","4","5","♭7"],            lv:2, d:"以羽為主音的五聲調式,結構等同小調五聲,是中國音樂裡的「小調」。", d_en:"A pentatonic mode centered on yu — structurally identical to minor pentatonic, the closest thing to a \"minor key\" in Chinese music."},
  {id:"qingyue", zh:"清樂音階", en:"Qingyue (Chinese)", g:"印度與其他亞洲", t:["1","2","3","4","5","6","7"], lv:1, d:"中國七聲之一,五聲加清角(4)與變宮(7),音高與大調相同,魏晉至南北朝的清商樂系統。", d_en:"One of the Chinese heptatonic scales — pentatonic plus qingjiao (4) and biangong (7); same pitches as the major scale — the Qingshang system from the Wei-Jin through Northern-and-Southern-Dynasties era."},
  {id:"yayue", zh:"雅樂音階", en:"Yayue (Chinese)", g:"印度與其他亞洲", t:["1","2","3","♯4","5","6","7"], lv:1, d:"中國七聲之一,五聲加變徵(♯4)與變宮(7),音高與利底安相同,古代宮廷雅樂所用。", d_en:"One of the Chinese heptatonic scales — pentatonic plus bianzhi (♯4) and biangong (7); same pitches as Lydian — used in ancient imperial court music."},
  {id:"yanyue", zh:"燕樂音階", en:"Yanyue (Chinese)", g:"印度與其他亞洲", t:["1","2","3","4","5","6","♭7"], lv:1, d:"中國七聲之一,五聲加清角(4)與閏(♭7),音高與米索利地安相同,隋唐燕樂所用。", d_en:"One of the Chinese heptatonic scales — pentatonic plus qingjiao (4) and run (♭7); same pitches as Mixolydian — used in the banquet music of the Sui and Tang dynasties."},
  {id:"pelog",      zh:"貝洛(印尼)",      en:"Pelog",                g:"印度與其他亞洲", t:["1","♭2","♭3","5","♭6"],           lv:2, d:"甘美朗的七聲音律取五個音的近似。真正的貝洛音程不均等、也不落在十二平均律上。", d_en:"A seven-note approximation reduced to five for gamelan tuning. The true Pelog intervals are uneven and don't fall on 12-tone equal temperament."},
  {id:"slendro",    zh:"斯連德羅(印尼)",  en:"Slendro",              g:"印度與其他亞洲", t:["1","2","♭3","5","6"],             lv:2, d:"甘美朗的另一套音律,五個音接近等分八度,這裡同樣是十二平均律的近似。", d_en:"Another gamelan tuning system — its five notes divide the octave almost equally; again approximated here in 12-tone equal temperament."},

  // ── 非洲音階 ──
  {id:"tizita", zh:"提濟塔", en:"Tizita", g:"非洲音階", t:["1","2","3","5","6"], lv:2, d:"衣索比亞四大 qenet 之一,懷舊與思念的代名詞,音高與大調五聲相同。", d_en:"One of Ethiopia's four great qenet — synonymous with nostalgia and longing, same pitches as major pentatonic."},
  {id:"tizitaMin", zh:"提濟塔(小調)", en:"Tizita Minor", g:"非洲音階", t:["1","2","♭3","5","♭6"], lv:2, d:"提濟塔的小調變體,♭3 與 ♭6 讓同一套旋律轉為哀傷。", d_en:"The minor variant of Tizita — ♭3 and ♭6 turn the same melodic material melancholy."},
  {id:"bati", zh:"巴提", en:"Bati", g:"非洲音階", t:["1","3","4","5","7"], lv:1, d:"衣索比亞四大 qenet 之一,以大三度與導音構成明亮開闊的色彩。", d_en:"One of Ethiopia's four great qenet — built from a major 3rd and a leading tone for a bright, open color."},
  {id:"batiMin", zh:"巴提(小調)", en:"Bati Minor", g:"非洲音階", t:["1","♭3","4","5","♭7"], lv:1, d:"巴提的小調變體,音高與小調五聲相同,是 Ethio-jazz 最常見的底色。", d_en:"The minor variant of Bati — same pitches as minor pentatonic, the most common backdrop in Ethio-jazz."},
  {id:"ambassel", zh:"安巴塞爾", en:"Ambassel", g:"非洲音階", t:["1","♭2","4","5","♭6"], lv:1, d:"衣索比亞四大 qenet 之一,♭2 與 ♭6 讓它聽起來接近中東音階。", d_en:"One of Ethiopia's four great qenet — ♭2 and ♭6 make it sound close to a Middle Eastern scale."},
  {id:"anchihoye", zh:"安奇霍耶", en:"Anchihoye", g:"非洲音階", t:["1","♭2","4","♭5","6"], lv:1, d:"衣索比亞四大 qenet 之一,♭5 讓它在四個 qenet 裡最不穩定、最具異國感。", d_en:"One of Ethiopia's four great qenet — the ♭5 makes it the most unstable and exotic-sounding of the four."},

  // ── 對稱音階 ──
  {id:"wholeTone",  zh:"全音音階",        en:"Whole Tone",           g:"對稱音階", t:["1","2","3","♯4","♯5","♭7"],           lv:2, d:"全部由全音構成,只有兩組不同的全音音階存在。無中心感,對應 7♯5,德布西的印象派語彙。", d_en:"Built entirely from whole steps — only two distinct whole-tone scales exist. No tonal center; matches 7♯5, the vocabulary of Debussy's impressionism."},
  {id:"dimHW",      zh:"減音階(半全)",    en:"Half-Whole Diminished",g:"對稱音階", t:["1","♭2","♯2","3","♯4","5","6","♭7"],  lv:2, d:"半音、全音交替的八聲音階,含 ♭9 ♯9 ♯11 13,是 7♭9 與 7♯11 的標準選擇。", d_en:"An eight-note scale alternating half and whole steps, containing ♭9, ♯9, ♯11, and 13 — the standard choice for 7♭9 and 7♯11."},
  {id:"dimWH",      zh:"減音階(全半)",    en:"Whole-Half Diminished",g:"對稱音階", t:["1","2","♭3","4","♭5","♭6","6","7"],   lv:2, d:"全音、半音交替,主和弦是 dim7,四個小三度對稱,轉位後仍是同一組音。", d_en:"Alternating whole and half steps; its tonic chord is dim7. Four minor 3rds in symmetry, so the same pitches survive any inversion."},
  {id:"augmented",  zh:"增音階",          en:"Augmented",            g:"對稱音階", t:["1","♯2","3","5","♯5","7"],            lv:1, d:"小三度與半音交替的六聲音階,對應 maj7♯5,現代爵士的對稱素材。", d_en:"A six-note scale alternating minor 3rds and half steps, matching maj7♯5 — symmetric material in modern jazz."},
  {id:"chromatic",  zh:"半音階",          en:"Chromatic",            g:"對稱音階", t:["1","♭2","2","♭3","3","4","♭5","5","♭6","6","♭7","7"], lv:1, d:"十二個半音全用,沒有調性中心,實務上當作經過音的來源而不是即興的骨架。", d_en:"Uses all twelve half steps with no tonal center — in practice a source of passing tones rather than a skeleton for improvising."},

  // ── 其他七聲音階 ──
  {id:"harmMajor2", zh:"匈牙利大調",      en:"Hungarian Major",      g:"其他七聲音階", t:["1","♯2","3","♯4","5","6","♭7"],    lv:2, d:"增二度起頭配 ♯4,李斯特筆下吉普賽風格的大調版本。", d_en:"Opens with an augmented 2nd paired with ♯4 — the major-key version of Liszt's Gypsy style."},
  {id:"neapMinor",  zh:"拿坡里小調",      en:"Neapolitan Minor",     g:"其他七聲音階", t:["1","♭2","♭3","4","5","♭6","7"],     lv:2, d:"和聲小調配 ♭2,古典裡與拿坡里六和弦(♭II)一同出現。", d_en:"Harmonic minor with a ♭2 — appears in classical music alongside the Neapolitan sixth chord (♭II)."},
  {id:"neapMajor",  zh:"拿坡里大調",      en:"Neapolitan Major",     g:"其他七聲音階", t:["1","♭2","♭3","4","5","6","7"],      lv:1, d:"旋律小調配 ♭2,下半部是小調、上半部是大調的混血音階。", d_en:"Melodic minor with a ♭2 — a hybrid scale, minor in the lower half and major in the upper half."},
  {id:"romanianMaj", zh:"羅馬尼亞大調", en:"Romanian Major", g:"其他七聲音階", t:["1","♭2","3","♯4","5","6","♭7"], lv:1, d:"♭2 配 ♯4 的屬和弦色彩,巴爾幹與克萊茲梅爾音樂的常見素材。", d_en:"♭2 paired with ♯4 for a dominant-chord color — common material in Balkan and klezmer music."},
  {id:"locrianMaj", zh:"大洛克里安",      en:"Locrian Major",        g:"其他七聲音階", t:["1","2","3","4","♭5","♭6","♭7"],    lv:1, d:"大三度配減五度,和聲大調的第五級,用在 7♭5 這類和弦上。", d_en:"A major 3rd paired with a diminished 5th — the 5th degree of harmonic major, used over 7♭5-type chords."},

  // ── Bebop 八聲音階 ──
  {id:"bebopDom",   zh:"屬七 Bebop",      en:"Bebop Dominant",       g:"Bebop 八聲音階", t:["1","2","3","4","5","6","♭7","7"],   lv:2, d:"米索利地安加一顆經過性的大七度,八個音剛好讓和弦內音落在正拍上。", d_en:"Mixolydian plus a passing major 7th — eight notes that land chord tones squarely on the beat."},
  {id:"bebopMaj",   zh:"大調 Bebop",      en:"Bebop Major",          g:"Bebop 八聲音階", t:["1","2","3","4","5","♯5","6","7"],   lv:2, d:"大調在五音與六音之間插入 ♯5,八分音符跑句時和弦音自動對齊拍點。", d_en:"The major scale with a ♯5 inserted between the 5th and 6th — chord tones automatically align to the beat in eighth-note runs."},
  {id:"bebopDor",   zh:"多利安 Bebop",    en:"Bebop Dorian",         g:"Bebop 八聲音階", t:["1","2","♭3","3","4","5","6","♭7"],  lv:2, d:"多利安在 ♭3 與 4 之間插入自然三度,是 ii 級跑句最順手的音階。", d_en:"Dorian with a natural 3rd inserted between ♭3 and 4 — the smoothest-running scale for ii-chord lines."},
  {id:"bebopMel",   zh:"旋律小調 Bebop",  en:"Bebop Melodic Minor",  g:"Bebop 八聲音階", t:["1","2","♭3","4","5","♯5","6","7"],  lv:2, d:"旋律小調插入 ♯5 經過音,小調長樂句的節奏對位工具。", d_en:"Melodic minor with a ♯5 passing tone inserted — a rhythmic-alignment tool for long minor-key phrases."},

  // ── 進階與罕用 ──
  {id:"algerian",   zh:"阿爾及利亞音階",  en:"Algerian",             g:"進階與罕用", t:["1","2","♭3","♯4","5","♭6","7"],    lv:1, d:"匈牙利小調的別名系統,北非與地中海音樂的常見素材。", d_en:"An alias system for Hungarian minor — common material in North African and Mediterranean music."},
  {id:"prometheus", zh:"普羅米修斯音階",  en:"Prometheus / Mystic",  g:"進階與罕用", t:["1","2","3","♯4","6","♭7"],         lv:1, d:"史克里亞賓的「神祕和弦」拆成音階,六個音全部可以疊成四度,無調性但不刺耳。", d_en:"Scriabin's \"Mystic chord\" unpacked into a scale — all six notes stack in 4ths, atonal but not harsh."},
  {id:"enigmatic",  zh:"謎音階",          en:"Enigmatic",            g:"進階與罕用", t:["1","♭2","3","♯4","♯5","♯6","7"],   lv:1, d:"威爾第出的作曲謎題,前半像弗里吉安、後半像全音,沒有任何一個標準和弦能完整支撐它。", d_en:"Verdi's compositional riddle — the lower half sounds like Phrygian, the upper half like whole tone; no standard chord can fully support it."},
  {id:"tritoneSc",  zh:"三全音音階",      en:"Tritone Scale",        g:"進階與罕用", t:["1","♭2","3","♭5","5","♭7"],        lv:1, d:"以三全音為週期的六聲對稱音階,兩個大三和弦相隔三全音疊起來的效果。", d_en:"A six-note symmetric scale with a tritone period — the effect of two major triads stacked a tritone apart."},
  {id:"istrian",    zh:"伊斯特里亞音階",  en:"Istrian",              g:"進階與罕用", t:["1","♭2","♭3","♭4","♭5","♭7"],      lv:1, d:"克羅埃西亞伊斯特里亞半島的傳統音階,已列入聯合國非物質文化遺產。", d_en:"A traditional scale from Croatia's Istrian peninsula, inscribed on UNESCO's Intangible Cultural Heritage list."},
  {id:"leadWhole",  zh:"導音全音音階",    en:"Leading Whole Tone",   g:"進階與罕用", t:["1","2","3","♯4","♯5","♭7","7"],    lv:1, d:"全音音階最上面補一個導音,讓它終於有了解決的方向。", d_en:"The whole-tone scale with a leading tone added on top, finally giving it a sense of resolution."},
  {id:"sixSym",     zh:"六聲對稱音階",    en:"Six Tone Symmetrical", g:"進階與罕用", t:["1","♭2","3","4","♯5","6"],         lv:1, d:"半音與小三度交替的對稱音階,每隔大三度就重複一次。", d_en:"A symmetric scale alternating half steps and minor 3rds, repeating every major 3rd."},
  {id:"blues9",     zh:"九聲藍調",        en:"Nine Tone Blues",      g:"進階與罕用", t:["1","2","♭3","3","4","♭5","5","6","♭7"], lv:1, d:"大調藍調與小調藍調疊在一起,九個音幾乎涵蓋整個藍調語彙,實務上當素材庫用。", d_en:"Major blues and minor blues stacked together — nine notes covering almost the entire blues vocabulary, used in practice as a reference pool."},
  {id:"flamenco", zh:"佛朗明哥調式", en:"Flamenco Mode", g:"進階與罕用", t:["1","♭2","♭3","3","4","5","♭6","♭7"], lv:1, d:"弗里吉安同時保留 ♭3 與 3 的八音變體,佛朗明哥吉他在同一個調裡自由切換兩種三度。", d_en:"An eight-note variant of Phrygian that keeps both ♭3 and 3 — flamenco guitar freely switches between the two thirds within the same key."},
  {id:"messiaen3",  zh:"梅湘第三模式",    en:"Messiaen Mode 3",      g:"進階與罕用", t:["1","2","♭3","3","♯4","5","6","♭7","7"], lv:1, d:"以大三度為週期的九聲音階,梅湘「有限移調模式」的第三個。", d_en:"A nine-note scale with a major-3rd period — the third of Messiaen's \"modes of limited transposition\"."},
  {id:"messiaen4",  zh:"梅湘第四模式",    en:"Messiaen Mode 4",      g:"進階與罕用", t:["1","♭2","2","4","♭5","5","6","7"],  lv:1, d:"以三全音為週期的八聲音階,兩個半音群夾一個大跳。", d_en:"An eight-note scale with a tritone period — two half-step clusters flanking a large leap."},
  {id:"messiaen5",  zh:"梅湘第五模式",    en:"Messiaen Mode 5",      g:"進階與罕用", t:["1","♭2","4","♭5","5","7"],         lv:1, d:"梅湘模式裡音最少的一個,半音—大三度—半音的對稱結構。", d_en:"The sparsest of Messiaen's modes — a symmetric half-step / major-3rd / half-step structure."},
  {id:"messiaen6",  zh:"梅湘第六模式",    en:"Messiaen Mode 6",      g:"進階與罕用", t:["1","2","3","4","♭5","♭6","♭7","7"], lv:1, d:"全音音階裡插進兩個半音,保留全音的漂浮感又多了落點。", d_en:"Two half steps inserted into the whole-tone scale — keeps the floating whole-tone feel while adding more landing points."},

   ══════════════════════════════════════════════════════════════ */
/* 和弦家族的分組副標。分組不是按音數(那是印刷慣例),是按「三音 + 七音」——
   因為那才決定和弦的功能與可以搭配的音階。同一個家族裡的和弦共用同一組音階,
   按音數分組反而會把 maj7 / maj9 / maj13 拆散、又把 maj7 / 7 / m7 / dim7 綁在一起 */
const GROUP_NOTE = {

  "進階與罕用":    "作曲家自創或地區性的音階,查詢用"
