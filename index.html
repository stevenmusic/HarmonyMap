function matchesSearch(item, q){
  if (!q) return true;
  const hay = [item.zh, item.en, item.sym || "", item.id, (item.alias || []).join(" "), item.t.join(" ")]
    .join(" ").toLowerCase();
  return hay.includes(q.toLowerCase());
}
/* 風格與常用度的篩選只套用在和弦(音階是按母音階系統與文化來源分組,本來就沒有這兩個欄位) */
function chordPasses(c, style, level, size){
  if (style && !(c.st || "").split(" ").includes(style)) return false;
  if (level && (c.lv || 2) !== level) return false;
  if (size && sizeBucket(c.t.length) !== size) return false;
  return true;
}
function passesFilter(it){ return chordPasses(it, STATE.style, STATE.level, STATE.size); }

function buildFilterRows(){
  const isChord = STATE.tab === "chord";
  const wrap = $("filterRows");
  $("filterToggle").hidden = STATE.tab === "find";
  wrap.hidden = STATE.tab === "find" || !STATE.filtersOpen;
  $("styleRow").hidden = $("levelRow").hidden = $("sizeRow").hidden = !isChord;
  $("dupRow").hidden = isChord;
  $("filterToggle").setAttribute("aria-expanded", String(STATE.filtersOpen));
  if (STATE.tab === "find") return;
  if (!isChord) {
    const row = $("dupRow");
    row.innerHTML = "";
    const tag = document.createElement("span");
    tag.className = "filter-label";
    tag.textContent = t("filterEnharmonic");
    row.appendChild(tag);
    for (const [val, key] of DUPOPT) {
      const on = STATE.hideDup === val;
      const b = document.createElement("button");
      b.className = "filter-chip";
      b.setAttribute("aria-pressed", String(on));
      b.title = t("hideDupTooltip");
      b.innerHTML = t(key) + '<span class="cnt">' + SCALES.filter(x => !SAME_PITCH.has(x.id)).length + '</span>';
      b.onclick = () => { STATE.hideDup = on ? 0 : val; render(); };
      row.appendChild(b);
    }
    $("filterHint").innerHTML = t("filterHintScale");
    $("filterBadge").textContent = STATE.hideDup ? t("hideDupBadge") : "";
    return;
  }
  const empty = axis => axis === "style" ? "" : 0;
  const mk = (row, labelKey, opts, axis) => {
    row.innerHTML = "";
    const tag = document.createElement("span");
    tag.className = "filter-label";
    tag.textContent = t(labelKey);
    row.appendChild(tag);
    for (const [val, key] of opts) {
      const on = STATE[axis] === val;
      const b = document.createElement("button");
      b.className = "filter-chip";
      b.setAttribute("aria-pressed", String(on));
      /* 數字 = 「這個選項本身有幾個」(其他兩軸的篩選照舊套用)。
         不要寫成「按下去會變幾個」——按下之後那個數字就會跳成放開後的總數,
         使用者會把「三和弦 67」誤讀成「有 67 個三和弦」 */
      const probe = { style: STATE.style, level: STATE.level, size: STATE.size };
      probe[axis] = val;
      const n = CHORDS.filter(c => chordPasses(c, probe.style, probe.level, probe.size)).length;
      b.innerHTML = t(key) + '<span class="cnt">' + n + '</span>';
      b.onclick = () => { STATE[axis] = on ? empty(axis) : val; render(); };
      row.appendChild(b);
    }
  };
  mk($("styleRow"), "filterStyle", STYLES, "style");
  mk($("levelRow"), "filterLevel", LEVELS, "level");
  mk($("sizeRow"),  "filterSize",  SIZES,  "size");
  // 收合狀態下也要看得出「現在有沒有在篩選」,否則會以為清單怎麼少了一半
  const on = [
    (STYLES.find(x => x[0] === STATE.style) || [])[1],
    (LEVELS.find(x => x[0] === STATE.level) || [])[1],
    (SIZES.find(x => x[0] === STATE.size) || [])[1]
  ].filter(Boolean).map(key => t(key));
  $("filterBadge").textContent = on.length ? on.join(" · ") : "";
  $("filterHint").innerHTML = t("filterHintChord");
}

/* 目前分頁套用搜尋與篩選之後的完整候選清單(還沒依分類縮小)。
   清單、分類按鈕的數字、上下鍵瀏覽三個地方都要用同一份,不然數字會對不起來 */
function filteredItems(){
  const isChord = STATE.tab === "chord";
  let items = (isChord ? CHORDS : SCALES).filter(it => matchesSearch(it, STATE.search));
  if (isChord) items = items.filter(passesFilter);
  // 搜尋中就不套用「隱藏重複」——不然搜「拜拉夫」會什麼都找不到,那才是真的幫倒忙
  else if (STATE.hideDup && !STATE.search) items = items.filter(it => !SAME_PITCH.has(it.id));
  return items;
}
const groupKey = () => STATE.tab === "chord" ? "chord" : "scale";
/* 從別處跳過來的項目(順階和弦表、建議音階、上下鍵)可能不在目前分類裡,
   分類要跟著換過去,否則會「選好了卻在清單上找不到它」。
   只在「選擇真的變了」的時候才動:每次 render 都無條件校正的話,
   使用者按下別的分類按鈕會立刻被彈回選中項目所屬的那一組,分類等於按不動 */
const lastSel = { chord: STATE.chordId, scale: STATE.scaleId };
function syncGroup(){
  if (STATE.tab === "find") return;
  const key = groupKey();
  const id = key === "chord" ? STATE.chordId : STATE.scaleId;
  if (lastSel[key] === id) return;
  lastSel[key] = id;
  const def = key === "chord" ? chordById(id) : scaleById(id);
  if (def && STATE.group[key] && STATE.group[key] !== def.g) STATE.group[key] = def.g;
}

/* 分類按鈕:一次只顯示一組。這是主要導覽,不是篩選——篩選是縮小範圍,
   這個是換一整組,所以做得比篩選晶片明顯 */
function buildGroupTabs(){
  const row = $("groupTabs"), note = $("groupNote"), cur = $("groupCurrent");
  const key = groupKey();
  // 搜尋結果會跨分類,這時候分類按鈕沒有意義,收起來讓結果照原本的分組排
  const searching = !!STATE.search;
  cur.hidden = searching;
  row.hidden = searching || (NARROW.matches && !STATE.groupOpen);
  if (searching) { row.innerHTML = ""; note.textContent = ""; return; }
  const items = filteredItems();
  const counts = new Map();
  for (const it of items) counts.set(it.g, (counts.get(it.g) || 0) + 1);
  // 篩選把整組篩光的話(例如「流行 × 三和弦」之下沒有增六和弦),退回「全部」,
  // 不然按鈕不見了、清單也空著,看起來像壞掉
  if (STATE.group[key] && !counts.get(STATE.group[key])) STATE.group[key] = "";
  const order = [];
  for (const it of (key === "chord" ? CHORDS : SCALES)) if (!order.includes(it.g)) order.push(it.g);
  row.innerHTML = "";
  const mk = (name, label, n) => {
    const b = document.createElement("button");
    b.className = "group-tab";
    b.setAttribute("aria-pressed", String(STATE.group[key] === name));
    b.innerHTML = "<span></span><span class='cnt'></span>";
    b.children[0].textContent = label;
    b.children[1].textContent = n;
    // 選了就把面板收起來:窄螢幕上面板蓋住的正是使用者接下來要看的清單
    b.onclick = () => { STATE.group[key] = name; STATE.groupOpen = false; render(); };
    row.appendChild(b);
  };
  mk("", t("groupAll"), items.length);
  for (const g of order) if (counts.get(g)) mk(g, groupLabel(g), counts.get(g));
  note.textContent = STATE.group[key] ? groupNoteText(STATE.group[key]) : "";
  // 收合時那顆按鈕要說清楚現在在哪一組、有幾個
  cur.setAttribute("aria-expanded", String(STATE.groupOpen));
  cur.querySelector(".gc-label").textContent = STATE.group[key] ? groupLabel(STATE.group[key]) : t("groupAll");
  cur.querySelector(".cnt").textContent =
    STATE.group[key] ? (counts.get(STATE.group[key]) || 0) : items.length;
}

/* 窄螢幕才把分類收成一顆按鈕。用 matchMedia 跟 CSS 讀同一個斷點,不要各寫各的 */
const NARROW = window.matchMedia("(max-width:600px)");
NARROW.addEventListener("change", () => { STATE.groupOpen = false; buildGroupTabs(); });
$("groupCurrent").onclick = () => {
  STATE.groupOpen = !STATE.groupOpen;
  buildGroupTabs();
  // 短螢幕(例如 320×568)展開後面板會有一截在摺線以下,順手把它捲進畫面。
  // 捲到釘住區塊的下緣為止,不要捲過頭把鍵盤推走
  if (STATE.groupOpen) {
    const row = $("groupTabs");
    const bar = document.querySelector(".topbar");
    const top = bar && getComputedStyle(bar).position === "sticky" ? bar.getBoundingClientRect().bottom : 0;
    const r = row.getBoundingClientRect();
    if (r.bottom > innerHeight || r.top < top) window.scrollBy({ top: r.top - top - 8, behavior: "smooth" });
  }
};

/* 搜尋框直接打和弦名稱:C/B、D/F#、Bbmaj7、F#m7b5、Am/G。
   打的 # / b 會換成 ♯ / ♭;和弦符號比對 sym 與 alias(maj、min 也認)。
   6/9 本身就有斜線,所以先整串當符號比對,比不到才把最後一個斜線後面當低音 */
/* 和弦記號(maj7、m7♭5、7♯9、sus4…)→ 和弦定義。和弦名稱解析與級數輸入共用 */
function chordBySym(x){
  const norm = y => y.replace(/#/g, "♯").replace(/b/g, "♭").replace(/\s+/g, "");
  const n = norm(x);
  if (n === "maj" || n === "M" || n === "") return chordById("maj");
  if (n === "min" || n === "-") return chordById("min");
  return CHORDS.find(c => norm(c.sym) === n) ||
         CHORDS.find(c => c.alias && c.alias.some(a => norm(a) === n)) || null;
}
function parseChordName(q){
  // 根音只認大寫:小寫開頭的是一般搜尋字(add9、dim、aug),不能被讀成 A、D 和弦
  const m = q.trim().match(/^([A-G])([#♯b♭]*)(.*)$/);
  if (!m) return null;
  const letter = LETTERS.indexOf(m[1]);
  const accOf = x => [...x].reduce((a, c) => a + (c === "#" || c === "♯" ? 1 : -1), 0);
  const acc = accOf(m[2]);
  if (acc < -1 || acc > 1) return null;
  const findSym = chordBySym;
  let def = findSym(m[3]), bass = null;
  if (!def) {
    const i = m[3].lastIndexOf("/");
    if (i < 0) return null;
    def = findSym(m[3].slice(0, i));
    const bm = m[3].slice(i + 1).match(/^([A-Ga-g])([#♯b♭]*)$/);
    if (!def || !bm) return null;
    const bpc = pcOf(LETTER_PC[LETTERS.indexOf(bm[1].toUpperCase())] + accOf(bm[2]));
    const iv = pcOf(bpc - (LETTER_PC[letter] + acc));
    bass = iv === 0 ? null : iv;
  }
  return { letter, acc, def, bass };
}
function goToParsedChord(pc){
  STATE.tab = "chord";
  STATE.letter = pc.letter; STATE.acc = pc.acc; STATE.chordId = pc.def.id;
  STATE.bassIv = pc.bass; STATE.bassFor = pc.def.id;
  STATE.search = ""; $("typeSearch").value = "";
  render();
  playCurrent();
}
function buildTypeList(){
  const list = $("typeList");
  list.innerHTML = "";
  const isChord = STATE.tab === "chord";
  const parsed = isChord && STATE.search ? parseChordName(STATE.search) : null;
  if (parsed) {
    // 打的是一個完整的和弦名稱:最上面放一顆「前往」,按 Enter 也可以
    const saved = { letter: STATE.letter, acc: STATE.acc, bassIv: STATE.bassIv, bassFor: STATE.bassFor, chordId: STATE.chordId };
    Object.assign(STATE, { letter: parsed.letter, acc: parsed.acc, chordId: parsed.def.id, bassIv: parsed.bass, bassFor: parsed.def.id });
    const label = chordTitle(parsed.def);
    Object.assign(STATE, saved);
    const go = document.createElement("button");
    go.className = "chip go-chip";
    go.innerHTML = "<b></b><i></i>";
    go.querySelector("b").textContent = label;
    go.querySelector("i").textContent = t("goToChord");
    go.onclick = () => goToParsedChord(parsed);
    list.appendChild(go);
  }
  const key = groupKey();
  let items = filteredItems();
  // 選了分類就只出那一組(搜尋時不受分類限制)
  const single = !STATE.search && STATE.group[key];
  if (single) items = items.filter(it => it.g === STATE.group[key]);
  if (!items.length) {
    if (!parsed) list.innerHTML = '<div class="empty-hint">' + t("emptyHint") + '</div>';
    return;
  }
  const groups = [];
  for (const it of items) {
    let grp = groups.find(g => g.name === it.g);
    if (!grp) groups.push(grp = { name: it.g, items: [] });
    grp.items.push(it);
  }
  const selId = isChord ? STATE.chordId : STATE.scaleId;
  // 選擇有沒有變:選中的項目在收起來的那一層時,只在「選擇剛變過來」那一次把那層打開
  const selKey = STATE.tab + "|" + selId, selChanged = STATE.tierSel !== selKey;
  STATE.tierSel = selKey;
  for (const g of groups) {
    const wrap = document.createElement("div");
    wrap.className = "type-group";
    // 只出一組的時候不用再寫一次標題——上面那顆分類按鈕就是標題了,
    // 定義那句話也已經放在按鈕底下的 .group-note
    if (!single) {
      const title = document.createElement("div");
      title.className = "type-group-title";
      title.textContent = groupLabel(g.name);
      const noteText = groupNoteText(g.name);
      if (noteText) {
        const sub = document.createElement("div");
        sub.className = "type-group-sub";
        sub.textContent = noteText;
        title.appendChild(sub);
      }
      wrap.appendChild(title);
    }
    const mkChips = arr => {
      const chips = document.createElement("div");
      chips.className = isChord ? "chips" : "chips wide";
      for (const it of arr) {
        const b = document.createElement("button");
        b.className = "chip";
        b.setAttribute("aria-pressed", String(it.id === selId));
        if (it.lv) b.dataset.lv = it.lv;
        const same = SAME_PITCH.get(it.id);
        if (same) { b.dataset.dup = "1"; b.title = t("dupOfLabel", { name: localName(same) }); }
        // 晶片第二行:和弦是名稱、音階是對照名稱。英文介面的音階沒有對照名稱,
        // 空的 <i> 會被 flex 的 gap 撐出一條空隙,所以乾脆不要產生它
        const subText = isChord ? localName(it) : subName(it);
        b.innerHTML = "<b></b>" + (subText ? "<i></i>" : "");
        b.querySelector("b").textContent = isChord ? rootName() + it.sym : localName(it);
        if (subText) b.querySelector("i").textContent = subText;
        // 點名稱就直接發聲。已經選中的再點一次就是重播,不需要另外一顆播放鈕
        b.onclick = () => {
          if (isChord) STATE.chordId = it.id; else STATE.scaleId = it.id;
          render();
          playCurrent();
        };
        chips.appendChild(b);
      }
      return chips;
    };
    // 組內照程度切成三層:必學 ★ / 常用 / 進階。最基本的那一層攤開,其餘收在展開鈕後面。
    // 屬和弦系 25 個裡有 17 個是變化音,全部平鋪出來,想找 C7 的人得先掃過 7♭5♯9。
    // 三層與「程度」篩選是同一套語意(不是兩套各藏各的),所以每一層都指得到、也都打得開
    const TIERS = [[3, "tierEssential"], [2, "tierCommon"], [1, "tierAdvanced"]];
    const tiers = TIERS
      .map(([lv, key]) => ({ lv, key, items: g.items.filter(it => (it.lv || 2) === lv) }))
      .filter(x => x.items.length);
    // 搜尋時、或者篩選已經指定了某一層、或者整組只剩一層時,就不必再收合
    if (STATE.search || STATE.level || tiers.length < 2) {
      wrap.appendChild(mkChips(g.items));
    } else {
      tiers.forEach((tier, i) => {
        const k = g.name + "|" + tier.lv;
        // 每一層預設全部攤開(沒有選程度時就是要一次看到所有和弦);使用者可以自己收合某一層。
        // 選中的項目跳進收起來的那一層(順階和弦表、上下鍵)時把那層打開,否則會「選好了卻在清單上看不到它」。
        // 只在選擇剛變的那一次打開:原本每次都強制打開,選中的那一層按收合完全沒反應,看起來像壞掉(模擬操作時抓到)
        if (selChanged && tier.items.some(it => it.id === selId)) STATE.tierClosed.delete(k);
        const open = !STATE.tierClosed.has(k);
        const tg = document.createElement("button");
        tg.className = "tier-toggle";
        tg.setAttribute("aria-expanded", String(open));
        tg.innerHTML = '<span class="chev">›</span><span></span>';
        tg.children[1].textContent = t("tierToggle", { name: t(tier.key), n: tier.items.length });
        tg.onclick = () => {
          if (STATE.tierClosed.has(k)) STATE.tierClosed.delete(k); else STATE.tierClosed.add(k);
          buildTypeList();
        };
        wrap.appendChild(tg);
        if (open) wrap.appendChild(mkChips(tier.items));
      });
    }
    list.appendChild(wrap);
  }
}

const ROMAN = ["I","II","III","IV","V","VI","VII"];
/* 七聲音階的順階和弦:每隔一個音疊上去,再用和弦辨識表反查名稱 */
function diatonicChords(scale){
  if (scale.t.length !== 7) return null;
  const notes = scale.t.map(tok => spell(STATE.letter, STATE.acc, tok));
  const out = [];
  for (let i = 0; i < 7; i++) {
    const pick = k => {
      const idx = (i + k) % 7;
      const wraps = Math.floor((i + k) / 7);
      return { note: notes[idx], semi: notes[idx].semi + 12 * wraps };
    };
    const stack = [pick(0), pick(2), pick(4), pick(6)];
    const rel = stack.map(s => s.semi - stack[0].semi);
    const triad = matchChords(0, rel.slice(0, 3))[0];
    const seventh = matchChords(0, rel)[0];
    /* 和弦名稱是照音高比對出來的,拼法不一定跟三度堆疊一樣:雙和聲小調的 iii 是 E G B D♭(減七度),
       聽起來就是 Em6(E G B C♯)。名稱照樣寫(譜上就是這樣記),但要標 ≅ 說明只是等音。
       理論上的調(B♯、C♭ 起的某些音階)要三重升降時 spell() 退回等音拼法(acc 為 null),
       這一列改用和弦自己的根音與拼法,不然會拼出 G♯ A♯♯ C♯♯ E♯ 這種四不像,點下去也跳不過去 */
    let rootNote = stack[0].note;
    const tri = stack.some(s => s.note.acc === null);
    if (rootNote.acc === null) {
      const nm = rootNote.name;
      rootNote = { name: nm, letter: LETTERS.indexOf(nm[0]), acc: [...nm.slice(1)].reduce((a, c) => a + (c === "♯" ? 1 : c === "♭" ? -1 : 0), 0) };
    }
    const ownSpell = d => d ? d.t.map(tok => spell(rootNote.letter, rootNote.acc, tok).name) : null;
    const stackNames = stack.map(s => s.note.name);
    const own7 = ownSpell(seventh), own3 = ownSpell(triad);
    const enh7 = !!own7 && own7.join(" ") !== stackNames.join(" ");
    const enh3 = !!own3 && own3.join(" ") !== stackNames.slice(0, 3).join(" ");
    const rn = ROMAN[i];
    let roman = rn;
    if (triad) {
      if (triad.id === "min" || triad.id === "dim") roman = rn.toLowerCase();
      if (triad.id === "dim") roman += "°";
      if (triad.id === "aug") roman += "+";
    }
    out.push({
      roman,
      root: rootNote.name,
      triad: triad ? rootNote.name + triad.sym : "—",
      triadZh: triad ? localName(triad) : "",
      seventh: seventh ? rootNote.name + seventh.sym : "—",
      seventhId: seventh ? seventh.id : null,
      seventhLetter: rootNote.letter,
      seventhAcc: rootNote.acc,
      // 三重升降的列:音名照和弦自己的拼法(已經不是這個音階的拼法了,所以也標 ≅)
      tones: (tri && own7 ? own7 : stackNames).join(" "),
      enh3: enh3 || (tri && !!triad), enh7: enh7 || (tri && !!seventh),
      enhEx: enh7 && !tri ? [stackNames.join(" "), rootNote.name + seventh.sym + " = " + own7.join(" ")] : null
    });
  }
  return out;
}

function intervalSteps(notes){
  const steps = [];
  for (let i = 1; i < notes.length; i++) steps.push(notes[i].semi - notes[i - 1].semi);
  return steps;
}

/* 斜線和弦的低音:和弦內音做成按鈕(D/F♯、C/G、G/B 這類轉位最常用),
   和弦外的音收在一個下拉(D/C 這種),12 × 80 種組合全部即時算,不另外存條目 */
function bassPickerHtml(def){
  const b = bassInfo();
  const seen = new Set([0]);
  let chips = '<button class="filter-chip" data-bass="" aria-pressed="' + !b + '">' + t("bassRoot") + '</button>';
  for (const tok of def.t) {
    const iv = pcOf(tokenSemi(tok));
    if (seen.has(iv)) continue;
    seen.add(iv);
    const nm = spell(STATE.letter, STATE.acc, tok).name;
    chips += '<button class="filter-chip" data-bass="' + iv + '" aria-pressed="' + (!!b && b.iv === iv) + '">' + nm + ' <small>' + tok + '</small></button>';
  }
  // 和弦外的低音不在這裡另外放下拉選單:根音卡片的「/」就能打任何低音(同一件事只留一個入口)。
  // 目前是和弦外的低音時,多一顆亮著的晶片標出來
  let sel = "";
  if (b && !seen.has(b.iv)) sel = '<button class="filter-chip" data-bass="' + b.iv + '" aria-pressed="true">' + b.name + ' <small>' + b.tok + '</small></button>';
  let note = "";
  if (b) note = '<div class="desc" style="margin-top:6px">' +
    (b.chordTone ? inversionLabel(rootPc(), def, b.pc, "sharp") : t("bassNonChord")) + '</div>';
  /* 同一組音的另一種寫法(Cmaj7/B ↔ C/B、C7/B♭ ↔ C/B♭、C6/A ↔ C/A):兩種都正確,歌譜上出現的頻率差不多。
     低音線條往下走、上面和弦不動時寫 C/B 較清楚;要看出和弦性質在變(maj7 → 7)時寫 Cmaj7/B。
     所以不是「更正」,是兩個方向都能一鍵切換;兩個名稱的指法清單也一樣 */
  const pair = b ? slashPair(def, b.iv) : null;
  if (pair) {
    const other = pair.full === def ? pair.plain : pair.full;
    let otherBass = spell(STATE.letter, STATE.acc, other === pair.full ? pair.tok : BASS_TOKS[b.iv]).name;
    if (hasDoubleAcc(otherBass)) otherBass = spell(STATE.letter, STATE.acc, BASS_TOKS[b.iv]).name;
    const alt = rootName() + other.sym + "/" + otherBass;
    note += '<div class="desc slash-alt" style="margin-top:6px">' + t("slashAltNote", { x: alt }) +
      ' <button class="filter-chip" id="slashAlt" data-id="' + other.id + '">' + t("slashAltBtn", { x: alt }) + '</button></div>';
  }
  return '<div class="bass-row"><span class="filter-label">' + t("bassLabel") + '</span>' + chips + sel + '</div>' + note;
}
function setBass(iv){
  STATE.bassIv = iv; STATE.bassFor = STATE.chordId;
  render();
  playCurrent();
}
function renderReadout(){
  const ro = $("readout"), ex = $("extraCard");
  if (STATE.tab === "find") { renderFindReadout(ro, ex); return; }

  const isChord = STATE.tab === "chord";
  const def = isChord ? chordById(STATE.chordId) : scaleById(STATE.scaleId);
  const notes = currentNotes();
  const title = isChord ? chordTitle(def) : (rootName() + " " + localName(def));
  // 副標是「名稱 · 對照名稱 · 別名」,任何一段可能是空的(英文介面沒有對照名稱、
  // 也不是每個和弦都有 alias),所以先收成陣列再濾掉空字串,免得留下多餘的分隔號
  const subParts = isChord ? [localName(def), subName(def)] : [subName(def)];
  if (isChord && def.alias && def.alias.length) {
    subParts.push(t("aliasLabel") + " " + def.alias.map(a => rootName() + a).join(t("listSep")));
  }
  const sub = subParts.filter(Boolean).join(" · ");

  // 英文介面的音階沒有副標(不附中文名),空的 .rt-sub 就不要產生
  let html = '<div class="rt-head"><div class="rt-name"></div>' + (sub ? '<div class="rt-sub"></div>' : '') +
    // 查到的和弦一鍵排進練習的進行(不用打開練習再輸入一次)
    (isChord ? '<button class="filter-chip rt-add" id="addToPractice">' + t("addToPractice") + '</button>' : '') + '</div>';
  html += '<div class="note-strip">';
  const shown = displayNotes();
  for (const n of shown) {
    // 八度不再標在這裡(鍵盤上看得到),每格只寫級數 + 音名
    html += '<div class="note-cell' + (n.deg === 1 && !n.octaveTop ? " is-root" : "") + '" data-midi="' + n.midi + '">' +
              '<span class="deg">' + (n.deg === 1 && !n.octaveTop ? t("rootDegree") : n.tok) + '</span>' +
              '<span class="nm">' + (STATE.label === "do" ? toSolfege(n.name) : n.name) + '</span>' +
            '</div>';
  }
  html += '</div>';

  // 只留「公式」與「半音間隔」:音數看得出來、音級集合上面那排音名已經寫過了,
  // 重複的資訊只是把面板撐長、讓版面變亂
  const steps = intervalSteps(notes);
  html += '<div class="meta-row">' +
            '<span>' + t("formulaLabel") + ' <b>' + def.t.join("  ") + '</b></span>' +
            '<span>' + t("semitoneStepsLabel") + ' <b>' + steps.join("–") + '</b></span>' +
          '</div>';
  if (isChord && STATE.inst === "guitar") {
    const v = currentVoicing();
    // 指法本身與「開放 / 五弦…」上面的和弦圖已經畫出來了,這裡只補圖上看不出來的:省略了哪個音、最低音不是根音
    if (!v) html += '<div class="meta-row"><span>' + t("guitarTabTitle") + ' <b>' + t("guitarNoVoicing") + '</b></span></div>';
    else if (v.missing.length || !(v.bassIsRoot || bassInfo())) {
      html += '<div class="meta-row">' +
              (v.missing.length ? '<span>' + t("guitarOmit") + ' <b>' + v.missing.join(" ") + '</b></span>' : '') +
              (v.bassIsRoot || bassInfo() ? '' : '<span>' + t("guitarBassNote") + '</span>') + '</div>';
    }
  }
  if (isChord) html += bassPickerHtml(def);
  html += '<div class="desc">' + localDesc(def) + '</div>';
  ro.innerHTML = html;
  ro.querySelector(".rt-name").textContent = title;
  if (sub) ro.querySelector(".rt-sub").textContent = sub;
  ro.querySelectorAll("[data-bass]").forEach(el => {
    el.onclick = () => { setBass(el.dataset.bass === "" ? null : +el.dataset.bass); };
  });
  const ap = ro.querySelector("#addToPractice");
  if (ap) ap.onclick = () => {
    const b = bassInfo();
    PRACTICE.steps.push({ letter: STATE.letter, acc: STATE.acc, id: STATE.chordId, bass: b ? b.iv : null });
    PRACTICE.custom = PRACTICE.steps.map(stepText).join(" ");
    try { localStorage.setItem(PRCUR_KEY, PRACTICE.custom); } catch (e) {}
    $("practiceCount").textContent = String(PRACTICE.steps.length);
    ap.textContent = t("addedToPractice", { n: PRACTICE.steps.length });
    ap.classList.add("done");
    clearTimeout(ap._t); ap._t = setTimeout(() => { ap.textContent = t("addToPractice"); ap.classList.remove("done"); }, 1600);
  };
  const ss = ro.querySelector("#slashAlt");
  if (ss) ss.onclick = () => {
    const iv = STATE.bassIv;
    STATE.chordId = ss.dataset.id; STATE.bassIv = iv; STATE.bassFor = STATE.chordId;
    render(); playCurrent();
  };
  ro.querySelectorAll(".note-cell").forEach(el => {
    el.style.cursor = "pointer";
    el.onclick = () => playSingle(+el.dataset.midi);
  });

  // ── 延伸資訊 ──
  if (isChord) {
    const ids = CHORD_SCALES[def.id] || [];
    // 沒有對應的建議音階時不要留一個空標題在那裡
    let e = "";
    if (ids.length) {
      e += '<div class="card-title">' + t("suggestedScales") + '</div><div class="link-chips">';
      for (const sid of ids) {
        const s = scaleById(sid);
        if (s) e += '<button class="link-chip" data-scale="' + sid + '">' + nameWithSub(rootName() + " " + localName(s), s) + '</button>';
      }
      e += '</div>';
    }
    // 同一組音的其他寫法(等和弦)
    const others = matchChords(rootPc(), notes.map(n => (rootPc() + n.semi) % 12)).filter(c => c.id !== def.id);
    if (others.length) {
      e += '<div class="card-title"' + (e ? ' style="margin-top:16px"' : '') + '>' + t("otherChordNames") + '</div><div class="link-chips">';
      for (const o of others) e += '<button class="link-chip" data-chord="' + o.id + '">' + rootName() + o.sym + " · " + localName(o) + '</button>';
      e += '</div>';
    }
    ex.innerHTML = e;
    ex.hidden = !e;
    ex.querySelectorAll("[data-scale]").forEach(b => b.onclick = () => { STATE.tab = "scale"; STATE.scaleId = b.dataset.scale; jumpedTo(); });
    ex.querySelectorAll("[data-chord]").forEach(b => b.onclick = () => { STATE.chordId = b.dataset.chord; render(); });
  } else {
    /* 跨文化的同音異名:同一組音在不同傳統裡有不同名字(希賈茲 = 弗里吉安屬音階、
       羽調式 = 小調五聲…)。這是使用者最想知道的關聯,直接列出來並可點擊跳轉 */
    const myKey = pitchKey(def);
    const alsoKnown = SCALES.filter(x => x.id !== def.id && pitchKey(x) === myKey);
    const dia = diatonicChords(def);
    const alt = theoreticalAlt(def, STATE.letter, STATE.acc);
    const theoHtml = alt
      ? '<div class="desc" style="margin-top:0;margin-bottom:12px">' + t("theoKey", { a: rootName() + " " + localName(def), b: LETTERS[alt.letter] + accText(alt.acc) + " " + localName(def) }) +
        ' <button class="link-chip" data-theo="1">' + LETTERS[alt.letter] + accText(alt.acc) + " " + localName(def) + '</button></div>'
      : "";
    const sameHtml = alsoKnown.length
      ? '<div class="card-title" style="margin-top:16px">' + t("otherScaleNames") + '</div><div class="link-chips">' +
        alsoKnown.map(x => '<button class="link-chip" data-scale="' + x.id + '">' + nameWithSub(localName(x), x) + '</button>').join("") +
        '</div>'
      : "";
    if (!dia) {
      ex.innerHTML = theoHtml + '<div class="card-title">' + t("diatonicChordsTitle") + '</div><div class="desc" style="margin-top:0">' +
        t("noTertianTable", { n: def.t.length }) + '</div>' + sameHtml;
      ex.hidden = false;
      ex.querySelectorAll("[data-scale]").forEach(b => b.onclick = () => { STATE.scaleId = b.dataset.scale; jumpedTo(); });
      ex.querySelectorAll("[data-theo]").forEach(b => b.onclick = () => { STATE.letter = alt.letter; STATE.acc = alt.acc; jumpedTo(); });
    } else {
      let e = theoHtml + '<div class="card-title">' + t("diatonicChordsTitleFull") + '</div><div class="table-scroll"><table class="dia">' +
              '<tr><th>' + t("colDegree") + '</th><th>' + t("colTriad") + '</th><th>' + t("col7th") + '</th><th>' + t("colTones") + '</th></tr>';
      for (const d of dia) {
        const enh = '<sup class="enh">≅</sup>';
        e += '<tr><td class="rn">' + d.roman + '</td><td class="sym">' + d.triad + (d.enh3 ? enh : "") + '</td>' +
             '<td class="sym"><button class="link" data-id="' + (d.seventhId || "") + '" data-letter="' + d.seventhLetter + '" data-acc="' + (d.seventhAcc === null ? "" : d.seventhAcc) + '">' + d.seventh + '</button>' + (d.enh7 ? enh : "") + '</td>' +
             '<td class="tones">' + d.tones + '</td></tr>';
      }
      // 有 ≅ 就在表下寫出圖例(手機沒有 hover,title 不算數),例子取表裡第一個
      const ex1 = dia.find(d => d.enhEx);
      const enhLegend = ex1 ? t("enhNote", { a: ex1.enhEx[0], b: ex1.enhEx[1] }) : dia.some(d => d.enh3 || d.enh7) ? t("enhNoteTri") : "";
      e += '</table></div><div class="desc">' + t("clickSeventhHint") + '</div>' +
           (enhLegend ? '<div class="desc">' + enhLegend + '</div>' : '') + sameHtml;
      ex.innerHTML = e;
      ex.hidden = false;
      ex.querySelectorAll("[data-scale]").forEach(b => b.onclick = () => { STATE.scaleId = b.dataset.scale; jumpedTo(); });
      ex.querySelectorAll("[data-theo]").forEach(b => b.onclick = () => { STATE.letter = alt.letter; STATE.acc = alt.acc; jumpedTo(); });
      ex.querySelectorAll("button.link").forEach(b => {
        b.onclick = () => {
          if (!b.dataset.id || b.dataset.acc === "") return;
          STATE.tab = "chord";
          STATE.chordId = b.dataset.id;
          STATE.letter = +b.dataset.letter;
          STATE.acc = +b.dataset.acc;
          jumpedTo();
        };
      });
    }
  }
}
/* 照某個和弦的級數推算它每個音的拼寫,回傳「音級 → { 音名, 級數 }」。
   反查的音名列與斜線和弦的低音都走這裡,兩邊才不會一邊寫 E♭、另一邊寫 D♯ */
function chordSpelling(rootPc, chord, spellPref){
  const map = new Map();
  const rn = simpleName(rootPc, spellPref);
  const li = LETTERS.indexOf(rn[0]);
  const ac = (rn.match(/♯/g) || []).length - (rn.match(/♭/g) || []).length;
  for (const tok of chord.t) {
    const sp = spell(li, ac, tok);
    const pc = ((LETTER_PC[li] + ac + sp.semi) % 12 + 12) % 12;
    if (!map.has(pc)) map.set(pc, { name: sp.name, tok });
  }
  return map;
}
/* 反查列出來的和弦名稱。低音不是根音時要寫成斜線和弦:E G C 是 C/E,不是 C。
   和弦名稱說的是「這是哪一組音」,斜線後面說的是「最低的是哪一個音」,
   兩件事都得說——只寫 C 的話,照著彈出來的聲音跟使用者選的根本不一樣。
   低音的拼寫照這個和弦自己的級數推(C/E 不會變成 C/F♭) */
function findChordName(rootPc, chord, bassPc, spellPref){
  const name = simpleName(rootPc, spellPref) + chord.sym;
  if (bassPc === null || bassPc === rootPc) return name;
  const sp = chordSpelling(rootPc, chord, spellPref).get(bassPc);
  // 名稱裡不寫重升重降(Cdim7/A,不是 Cdim7/B♭♭)
  return name + "/" + (sp && !hasDoubleAcc(sp.name) ? sp.name : simpleName(bassPc, spellPref));
}
/* 轉位編號看的是「低音是第幾級」:三音 = 第一轉位、五音 = 第二轉位、七音 = 第三轉位。
   升降不影響編號(♭3 一樣是第一轉位)。
   2/4/6/9/11/13 在低音**沒有**標準的轉位編號——那些是掛留音與延伸音,不是三度堆疊的
   其中一層,C13/A 講「第五轉位」是自己發明的說法。這種情形只寫「轉位」,
   斜線和弦名稱已經把低音是誰講清楚了,寧可少說也不要編一個不存在的名字 */
const INVERSION_KEY = { 1: "bassInRoot", 3: "inv1", 5: "inv2", 7: "inv3" };
function inversionLabel(rootPc, chord, bassPc, spellPref){
  if (bassPc === null || bassPc === rootPc) return t("bassInRoot");
  const sp = chordSpelling(rootPc, chord, spellPref).get(bassPc);
  return t((sp && INVERSION_KEY[parseToken(sp.tok).deg]) || "inversion");
}
/* 反查的分析結果:選了哪些音、符合哪些和弦、每個音級該怎麼拼寫。
   鍵盤標籤與下方面板共用同一份結果,兩邊的音名才不會不一致 */
/* 反查的拼寫偏好。預設 auto:照「調號升降記號比較少」的慣例拼根音(和移調用的 PC_SPELL 同一套想法),
   大三度的和弦看大調(D♭ 5♭ 勝過 C♯ 7♯、A♭、B♭、E♭,F♯/G♭ 同為 6 個取慣用的 F♯),
   小三度的和弦看小調(C♯m 4♯ 勝過 D♭m 8♭、G♯m、F♯m,E♭m/D♯m 同為 6 個取 E♭m、B♭m)。
   原本預設一律用升記號,E♭7 被寫成 D♯7(三音還是 F𝄪)、A♭7 寫成 G♯7。使用者選了 ♯ 或 ♭ 就照選的 */
const AUTO_MAJOR = ["sharp","flat","sharp","flat","sharp","sharp","sharp","sharp","flat","sharp","flat","sharp"];
const AUTO_MINOR = ["sharp","sharp","sharp","flat","sharp","sharp","sharp","sharp","sharp","sharp","flat","sharp"];
function spellPrefFor(rootPc, chord){
  if (STATE.findSpell !== "auto") return STATE.findSpell;
  const minor = !!chord && chord.t.includes("♭3") && !chord.t.includes("3");
  return (minor ? AUTO_MINOR : AUTO_MAJOR)[rootPc];
}
function findAnalysis(){
  const sel = [...STATE.findSel].sort((a, b) => a - b);
  const pcs = [...new Set(sel.map(m => ((m % 12) + 12) % 12))];
  const bassPc = sel.length ? ((sel[0] % 12) + 12) % 12 : null;
  const results = [];
  for (const rp of pcs) {
    for (const c of matchChords(rp, pcs)) results.push({ rootPc: rp, chord: c, isBass: rp === bassPc });
  }
  /* 省略五音:七和弦以上最先省略的就是完全五度(吉他的 C7♯9 = C E B♭ D♯、爵士的 3-7 voicing),
     譜上照樣寫 C7♯9。只在「沒有任何一般和弦完全符合」時才找,免得 E G C 多出 Em♭6(省略五音)這種牽強讀法。
     增六和弦不算「一般和弦」:它是由解決方向定義的(要在上下文裡才成立),C E B♭ 一般讀成 C7(省略五音),
     不是義大利增六。排序:完全符合的一般和弦 > 省略五音 > 增六和弦,同一級裡低音當根音的先 */
  const AUG6 = ["it6", "fr6", "ger6"];
  const rank = r => r.no5 ? 1 : AUG6.includes(r.chord.id) ? 2 : 0;
  if (pcs.length >= 3 && !results.some(r => rank(r) === 0)) {
    for (const rp of pcs) {
      const p5 = (rp + 7) % 12;
      if (pcs.includes(p5)) continue;
      for (const c of matchChords(rp, pcs.concat(p5)))
        if (c.t.includes("5") && c.t.length >= 4) results.push({ rootPc: rp, chord: c, isBass: rp === bassPc, no5: true });
    }
  }
  // 同一級裡低音當根音的排前面,再來是組成音少(比較單純)的寫法
  results.sort((a, b) => (rank(a) - rank(b)) || (b.isBass - a.isBass) || (a.chord.t.length - b.chord.t.length));

  /* 音名拼寫:一旦找到完全符合的和弦,就照那個和弦的級數推算正規拼寫
     (所以 C-E-G-B♭ 會寫成 B♭ 而不是 A♯);沒有符合的和弦時才退回升/降偏好 */
  const nameByPc = new Map(), tokByPc = new Map();
  if (results.length) {
    const best = results[0];
    for (const [pc, sp] of chordSpelling(best.rootPc, best.chord, spellPrefFor(best.rootPc, best.chord))) {
      nameByPc.set(pc, sp.name); tokByPc.set(pc, sp.tok);
    }
  }
  for (const p of pcs) if (!nameByPc.has(p)) nameByPc.set(p, simpleName(p, spellPrefFor(p, null)));
  return { sel, pcs, bassPc, results, nameByPc, tokByPc };
}

function renderFindReadout(ro, ex){
  const an = findAnalysis();
  const sel = an.sel;
  if (!sel.length) {
    ro.innerHTML = '<div class="rt-head"><div class="rt-name">' + t("findChordTitle") + '</div></div>' +
      '<div class="desc" style="margin-top:0">' + t(STATE.inst === "guitar" ? "findHelpTextGuitar" : "findHelpText") + '</div>';
    ex.hidden = true;
    return;
  }
  const pcs = an.pcs, results = an.results;
  // 依實際彈奏的高低順序把音名列出來(同一個音級只列一次)
  const seen = new Set();
  const ordered = sel.map(m => ((m % 12) + 12) % 12).filter(p => !seen.has(p) && seen.add(p));

  let html = '<div class="rt-head"><div class="rt-name">' +
             ordered.map(p => an.nameByPc.get(p)).join(" ") + '</div>' +
             '<div class="rt-sub">' + t("selectedNotesLabel", { n: sel.length, m: pcs.length }) + '</div></div>';
  if (results.length) {
    html += '<div class="find-list">';
    for (const r of results.slice(0, 12)) {
      const pref = spellPrefFor(r.rootPc, r.chord);
      let nm = findChordName(r.rootPc, r.chord, an.bassPc, pref);
      // 斜線和弦:名稱跟點下去之後和弦頁寫的一致(D♭13♭9/D 在和弦頁要寫成 E♭♭,改用 C♯13♭9/D)
      if (an.bassPc !== r.rootPc) nm = chordPageSpelling(r.rootPc, r.chord, pcOf(an.bassPc - r.rootPc), pref)[2];
      html += '<div class="find-item" role="button" tabindex="0"' + findJumpAttrs(r.rootPc, r.chord, an.bassPc, pref) + '><span class="fname">' + nm + '</span>' +
              '<span class="fzh">' + localName(r.chord) + '</span>' +
              '<span class="ftag exact">' + inversionLabel(r.rootPc, r.chord, an.bassPc, pref) + '</span>' +
              (r.no5 ? '<span class="ftag">' + t("omit5") + '</span>' : '') + '</div>';
    }
    html += '</div>';
  } else {
    html += '<div class="desc" style="margin-top:0">' + t("noExactMatch") + '</div>';
  }
  ro.innerHTML = html;

  // 超集合:哪些和弦「包含」目前選的音
  const supers = [];
  for (let rp = 0; rp < 12; rp++) {
    for (const m of CHORD_MATCH) {
      if (m.size <= pcs.length) continue;
      const abs = new Set(m.pcs.map(p => (p + rp) % 12));
      if (pcs.every(p => abs.has(p))) supers.push({ rootPc: rp, chord: m.ref, missing: m.size - pcs.length });
    }
  }
  supers.sort((a, b) => a.missing - b.missing || a.chord.t.length - b.chord.t.length);
  if (supers.length) {
    let e = '<div class="card-title">' + t("couldBelongTo") + '</div><div class="find-list">';
    for (const s of supers.slice(0, 10)) {
      e += '<div class="find-item" role="button" tabindex="0"' + findJumpAttrs(s.rootPc, s.chord, an.bassPc, spellPrefFor(s.rootPc, s.chord)) + '><span class="fname">' + findChordName(s.rootPc, s.chord, an.bassPc, spellPrefFor(s.rootPc, s.chord)) + '</span>' +
           '<span class="fzh">' + localName(s.chord) + '</span>' +
           '<span class="ftag">' + t(s.missing === 1 ? "missingNote1" : "missingNotes", { n: s.missing }) + '</span></div>';
    }
    e += '</div>';
    ex.innerHTML = e;
    ex.hidden = false;
  } else {
    ex.innerHTML = "";
    ex.hidden = true;
  }
  // 包含這些音的音階(三個音以上才列,太少的話幾乎每個音階都符合)
  const sc = scalesContaining(pcs, an.bassPc);
  if (sc.length) {
    ex.insertAdjacentHTML("beforeend", '<div class="card-title"' + (ex.innerHTML ? ' style="margin-top:14px"' : '') + '>' + t("scalesContaining") + '</div><div class="link-chips">' +
      sc.map(x => '<button class="link-chip" data-rp="' + x.rp + '" data-sid="' + x.s.id + '">' + simpleName(x.rp, spellPrefFor(x.rp, null)) + ' ' + localName(x.s) + '</button>').join("") + '</div>');
    ex.hidden = false;
  }
  // 點結果就跳過去:和弦 → 和弦分頁(低音照選的音);音階 → 音階分頁
  const jump = el => {
    if (el.dataset.sid) {
      const [L, A] = PC_SPELL_PREF(+el.dataset.rp);
      Object.assign(STATE, { tab: "scale", letter: L, acc: A, scaleId: el.dataset.sid, slash: null });
      render(); playCurrent(); scrollTo({ top: 0 }); return;
    }
    /* 和弦頁的低音是照和弦級數拼的,根音拼法不同時低音可能變成重升重降(G♯mMaj7/F♯♯)。
       兩種根音拼法都試:優先跟點下去的那個名稱一模一樣的,再來是沒有重升重降的 */
    const def = chordById(el.dataset.cid), bass = el.dataset.bass === "" ? null : +el.dataset.bass;
    const pick = chordPageSpelling(+el.dataset.rp, def, bass, el.dataset.pref);
    goToParsedChord({ letter: pick[0], acc: pick[1], def, bass });
    scrollTo({ top: 0 });
  };
  for (const box of [ro, ex]) box.querySelectorAll('.find-item[role="button"], .link-chip[data-sid]').forEach(el => {
    el.onclick = () => jump(el);
    el.onkeydown = ev => { if (ev.key === "Enter") { ev.preventDefault(); jump(el); } };
  });
}
/* 和弦頁會怎麼寫這個和弦:低音照和弦級數拼,根音拼法不同時低音可能變成重升重降(D♭13♭9/E♭♭)。
   依序試「偏好的拼法 → 升記號 → 降記號」,優先沒有重升重降的那個。回傳 [字母, 升降, 名稱] */
function chordPageSpelling(rootPc, def, bassIv, pref){
  const cands = [PC_SPELL_PREF(rootPc, pref === "sharp" || pref === "flat" ? pref : undefined), PC_SPELL_PREF(rootPc, "sharp"), PC_SPELL_PREF(rootPc, "flat")];
  const keep = { tab: STATE.tab, letter: STATE.letter, acc: STATE.acc, chordId: STATE.chordId, bassIv: STATE.bassIv, bassFor: STATE.bassFor };
  const out = cands.map(([L, A]) => { Object.assign(STATE, { tab: "chord", letter: L, acc: A, chordId: def.id, bassIv, bassFor: def.id }); const x = chordTitle(def); Object.assign(STATE, keep); return [L, A, x]; });
  return out.find(c => !/♯♯|♭♭|𝄪|𝄫/.test(c[2])) || out[0];
}
/* 從結果面板跳到別的和弦/音階:回到頁面最上面(看得到名稱與鍵盤)並發聲,跟辨識結果的跳轉一樣 */
function jumpedTo(){ render(); playCurrent(); scrollTo({ top: 0 }); }
/* 辨識結果上帶著「跳過去」要的資料:根音、和弦、低音(離根音幾個半音;就是根音時空白) */
function findJumpAttrs(rootPc, chord, bassPc, pref){
  const b = bassPc == null || bassPc === rootPc ? "" : pcOf(bassPc - rootPc);
  return ' data-rp="' + rootPc + '" data-cid="' + chord.id + '" data-bass="' + b + '" data-pref="' + (pref || "") + '"';
}
/* 音高 → 根音卡片的字母 + 升降(照升降偏好;沒有偏好時用常見調名) */
function PC_SPELL_PREF(pc, pref){
  if (pref === "sharp" || pref === "flat") { const n = simpleName(pc, pref); return [LETTERS.indexOf(n[0]), n[1] === "♯" ? 1 : n[1] === "♭" ? -1 : 0]; }
  return PC_SPELL[pcOf(pc)];
}
/* 包含這些音的音階:每個音階 × 12 個根音,音都在裡面的留下來;同一組音(不同調式)只留一個——
   優先主音就是低音的,再來是比較常用的(lv)、多出來的音比較少的。最多 8 個 */
function scalesContaining(pcs, bassPc){
  if (pcs.length < 3) return [];
  const out = [], seen = new Set();
  const cands = [];
  for (const s of SCALES) {
    const rel = [...new Set(s.t.map(x => pcOf(tokenSemi(x))))];
    for (let rp = 0; rp < 12; rp++) {
      const abs = new Set(rel.map(x => (x + rp) % 12));
      if (pcs.every(p => abs.has(p))) cands.push({ rp, s, extra: abs.size - pcs.length, key: [...abs].sort((a, b) => a - b).join(","), isBass: rp === bassPc, inSel: pcs.includes(rp) });
    }
  }
  cands.sort((a, b) => (b.isBass - a.isBass) || (b.inSel - a.inSel) || ((b.s.lv || 0) - (a.s.lv || 0)) || (a.extra - b.extra));
  for (const c of cands) { if (seen.has(c.key)) continue; seen.add(c.key); out.push(c); }
  out.sort((a, b) => ((b.s.lv || 0) - (a.s.lv || 0)) || (a.extra - b.extra) || (b.isBass - a.isBass));
  return out.slice(0, 8);
}

/* 播放方式的選項隨分頁改變:音階不提供「齊奏」——把一整個音階的音同時壓下去
   在音樂上沒有意義(那是和弦的呈現方式),音階是旋律性的,只該用琶音或逐音上下行。
   如果使用者在和弦分頁選了齊奏再切到音階,自動落到逐音上下行 */
const PLAY_MODES = {
  chord: [["block","playBlock"],["arp","playArp"],["asc","playAsc"]],
  scale: [["arp","playArp"],["asc","playAsc"]],
  find:  [["block","playBlock"],["arp","playArp"],["asc","playAsc"]]
};
/* 每個分頁各自記住自己的播放方式:在和弦用齊奏、去音階看一眼(自動變成逐音)、
   再切回和弦時應該回到齊奏,而不是把音階的設定帶回來 */
const PLAY_PREF = { chord: "block", scale: "arp", find: "block" };
function buildPlayModes(){
  const sel = $("playModeSel");
  const opts = PLAY_MODES[STATE.tab] || PLAY_MODES.chord;
  let pref = PLAY_PREF[STATE.tab];
  if (!opts.some(o => o[0] === pref)) pref = opts[opts.length - 1][0];
  STATE.playMode = pref;
  // built 的快取 key 要帶上 LANG——不然切換語言時,值(v)沒變、被誤判成不用重建,
  // select 裡的文字就會停在舊語言
  const built = LANG + "|" + opts.map(o => o[0]).join(",");
  if (sel._built !== built) {
    sel.innerHTML = "";
    for (const [v, key] of opts) {
      const op = document.createElement("option");
      op.value = v; op.textContent = t(key);
      sel.appendChild(op);
    }
    sel._built = built;
  }
  sel.value = STATE.playMode;
}

function renderOctaveSel(){
  const sel = $("octaveSel");
  // 同上,快取邏輯只看選項數量,語言換了要強制重建文字
  if (sel.options.length && sel._lang === LANG) { sel.value = String(STATE.octave); return; }
  sel.innerHTML = "";
  for (let o = 2; o <= 5; o++) {
    const op = document.createElement("option");
    op.value = String(o);
    op.textContent = t("octavePrefix") + LETTERS[STATE.letter] + o;
    sel.appendChild(op);
  }
  sel._lang = LANG;
  sel.value = String(STATE.octave);
}
function refreshOctaveLabels(){
  const sel = $("octaveSel");
  [...sel.options].forEach(op => { op.textContent = t("octavePrefix") + rootName() + op.value; });
}

/* 鍵盤操作:根音列、和弦按鈕、清單、練習輸入板每次 render 都整排重建,焦點會掉回 body(下一個 Tab 又從頂欄開始)。
   render 前記下「焦點在哪個有 id 的容器裡的第幾個可聚焦元素」,重建完再聚焦同一個位置 */
function render(){
  const a = document.activeElement;
  let key = null;
  if (a && a !== document.body && a.closest) {
    const box = a.closest("[id]");
    if (box) { const list = [...box.querySelectorAll('button, [role="button"], [tabindex="0"], select, input')]; key = { id: box.id, i: list.indexOf(a), same: a }; }
  }
  renderCore();
  if (key && key.i >= 0 && !document.body.contains(key.same)) {
    const box = document.getElementById(key.id);
    const el = box && [...box.querySelectorAll('button, [role="button"], [tabindex="0"], select, input')][key.i];
    if (el && el.offsetParent) el.focus({ preventScroll: true });
  }
}

/* ══════════════════════════════════════════════════════════════
   換和弦練習:使用者自己用輸入板(根音 + 快速鍵)或文字框排一組和弦,跟著節拍器輪流換。
   沒有內建範例進行(使用者要求拿掉,省版面)。
   節拍用 Web Audio 的時鐘排程(提前 0.1 秒排好點擊聲),畫面在那一刻用 setTimeout 跟上
   ══════════════════════════════════════════════════════════════ */
const PRACTICE = { fs: false, runId: 0, clicks: [], countIn: false, taps: [], ramp: "", baseBpm: 0, pad: { letter: 0, acc: 0 }, open: false, bpm: 70, beats: 4, accomp: true, custom: "", bad: [],
                   steps: [], step: 0, beat: -1, slash: null, padFresh: false, running: false, timer: 0, nextTime: 0, count: 0, flash: -1 };
/* 級數輸入(老師的寫法):先寫調「G:」「Bb:」「Am:」,後面的羅馬數字照那個調換成和弦。
   大寫 = 大三、小寫 = 小三,° = 減、ø = 半減、+ = 增,後面可以接記號(V7、ii7、Imaj7、IVsus4);前面可以加 ♭ ♯(♭VII、♯iv°)。
   小調的級數照自然小調算(III = ♭3、VI = ♭6、VII = ♭7)。根音照級數推字母(F♯ 大調的 vii° 是 E♯dim,不是 Fdim) */
const ROMAN_DEG = { i: 1, ii: 2, iii: 3, iv: 4, v: 5, vi: 6, vii: 7 };
function romanStep(w, key){
  const m = w.match(/^([b♭#♯]?)(vii|iii|iv|vi|ii|v|i|VII|III|IV|VI|II|V|I)(°|o|ø|\+)?(.*)$/);
  if (!m || !key) return null;
  const up = m[2] === m[2].toUpperCase(), deg = ROMAN_DEG[m[2].toLowerCase()];
  let alt = (m[1] === "b" || m[1] === "♭") ? -1 : m[1] ? 1 : 0;
  // 小調:沒寫升降的 III VI VII 照自然小調降半音;已經寫了 ♭(i ♭VI ♭VII 的流行寫法)就不再降第二次。
  // 小寫的 vii° / viiø 是導音上的減和弦(A 小調 = G♯dim7),照和聲小調不降
  const leading = deg === 7 && !up && /^(°|o|ø)$/.test(m[3] || "");
  if (key.minor && [3, 6, 7].includes(deg) && !m[1] && !leading) alt -= 1;
  const tok = (alt < 0 ? "♭".repeat(-alt) : "♯".repeat(alt)) + deg;
  const sp = spell(key.letter, key.acc, tok);
  let letter = sp.letter, acc = sp.acc;
  if (acc == null || acc < -1 || acc > 1) [letter, acc] = PC_SPELL[pcOf(LETTER_PC[key.letter] + key.acc + tokenSemi(tok))];
  const q = m[3], rest = m[4];
  let def = null;
  if (q === "°" || q === "o") def = chordBySym(rest === "7" ? "dim7" : rest === "" ? "dim" : "dim" + rest);
  else if (q === "ø") def = chordBySym(rest === "" || rest === "7" ? "m7♭5" : "m" + rest.replace(/^7?/, "") + "♭5");
  else if (q === "+") def = chordBySym(rest === "" ? "aug" : rest + "♯5") || chordBySym("aug" + rest);
  else if (up) def = chordBySym(rest);
  else {
    // 小寫 = 小三度:i7 = m7、imaj7 = mMaj7、iadd9 = m(add9)。找不到小調版本時,只有本來就沒有三音的(sus、5)才退回原記號,
    // 不然 imaj7 會悄悄變成大七和弦
    const r2 = rest.replace(/^maj/i, "Maj");
    def = rest === "" ? chordById("min") : (chordBySym("m" + rest) || chordBySym("m" + r2) || chordBySym("m(" + rest + ")") ||
          (/^(sus|5$)/.test(rest) ? chordBySym(rest) : null));
  }
  return def ? { letter, acc, id: def.id, bass: null } : null;
}
function practiceParseCustom(text){
  const bad = [], steps = [];
  let key = null;
  for (const w0 of text.split(/[\s,|]+/).filter(Boolean)) {
    // 結尾的 *n = 這個和弦佔 n 拍(C*2 = 兩拍);沒寫的填到小節線(practiceTimeline)
    const dm = w0.match(/^(.+?)\*([1-8])$/), w = dm ? dm[1] : w0, beats = dm ? +dm[2] : 0;
    const push = st => steps.push(beats ? Object.assign(st, { beats }) : st);
    const k = w.match(/^([A-G])([#♯b♭]?)(m|min)?:$/);
    if (k) { key = { letter: LETTERS.indexOf(k[1]), acc: k[2] ? (k[2] === "#" || k[2] === "♯" ? 1 : -1) : 0, minor: !!k[3] }; continue; }
    const pc = parseChordName(w);
    if (pc) { push({ letter: pc.letter, acc: pc.acc, id: pc.def.id, bass: pc.bass }); continue; }
    const rs = romanStep(w, key);
    if (rs) push(rs); else bad.push(w0);
  }
  return { steps, bad };
}
/* 進行存在這台裝置上:目前這一組(重新整理還在)+ 另外存起來的幾組(文字,跟文字框同一種寫法) */
const PROG_KEY = "harmonymap.progs", PRCUR_KEY = "harmonymap.practice", COUNTIN_KEY = "harmonymap.countin", RAMP_KEY = "harmonymap.ramp", VOICE_KEY = "harmonymap.voicing";
try { PRACTICE.voicing = localStorage.getItem(VOICE_KEY) === "near" ? "near" : ""; } catch (e) {}
try { PRACTICE.countIn = localStorage.getItem(COUNTIN_KEY) === "1"; const rp = localStorage.getItem(RAMP_KEY); if (/^(2\/1|5\/2|5\/4)$/.test(rp || "")) PRACTICE.ramp = rp; } catch (e) {}
function loadSavedProgs(){
  try { const a = JSON.parse(localStorage.getItem(PROG_KEY) || "[]"); return Array.isArray(a) ? a.filter(x => typeof x === "string" && x) : []; }
  catch (e) { return []; }
}
function storeSavedProgs(a){ try { localStorage.setItem(PROG_KEY, JSON.stringify(a)); } catch (e) {} }
/* 整組移調:根音平移 d 個半音,拼法取常見的調名(C D♭ D E♭ E F F♯ G A♭ A B♭ B)。
   斜線低音存的是「離根音幾個半音」,跟著走,不用另外算 */
const PC_SPELL = [[0,0],[1,-1],[1,0],[2,-1],[2,0],[3,0],[3,1],[4,0],[5,-1],[5,0],[6,-1],[6,0]];
function practiceTranspose(d){
  PRACTICE.shift = (((PRACTICE.shift || 0) + d + 6) % 12 + 12) % 12 - 6;   // 目前移了幾個半音(−6 ~ +5),顯示在「移調」旁邊
  PRACTICE.steps = PRACTICE.steps.map(st => {
    const [letter, acc] = PC_SPELL[pcOf(LETTER_PC[st.letter] + st.acc + d)];
    return Object.assign({}, st, { letter, acc });
  });
}
/* 輸入板:根音一下 + 和弦一下就加進去;要轉位(斜線和弦)再按「/」+ 低音字母(+ ♭ ♯)。
   按字母一律是本位音,♭ ♯ 是開關,所以不需要 ♮ */
function padChord(id){
  const P = PRACTICE;
  P.slash = null; P.padFresh = false;
  const st = { letter: P.pad.letter, acc: P.pad.acc, id, bass: null };
  P.steps.push(st);
  practiceEdited(P.steps.length - 1);
  withStep(st, () => playCurrent());
}
function padLetter(i){
  const P = PRACTICE;
  // 「/」之後的第一個字母是低音(接著的 ♭ ♯ 也還是改低音);再按字母就是下一個和弦的根音,
  // 不然打完 C/E 接著按 G 會把它改成 C/G
  if (P.slash && P.slash.letter < 0) { P.slash = { letter: i, acc: 0 }; padSetBass(); }
  else { P.slash = null; P.pad = { letter: i, acc: 0 }; P.padFresh = true; renderPractice(); }
}
function padAcc(v){
  const P = PRACTICE;
  if (P.slash) {
    if (P.slash.letter < 0) return;
    P.slash.acc = P.slash.acc === v ? 0 : v; padSetBass();
  } else { P.pad.acc = P.pad.acc === v ? 0 : v; P.padFresh = true; renderPractice(); }
}
function padSlash(){
  const P = PRACTICE;
  /* 剛按了根音、還沒按和弦種類就按 /:斜線和弦絕大多數是大三和弦,直接當 maj 加進去,
     C / B 三下就是 C/B,不用 C maj / B 四下(使用者嫌太麻煩) */
  if (P.padFresh && !P.slash) { padChord("maj"); P.slash = { letter: -1, acc: 0 }; renderPractice(); return; }
  if (!P.steps.length) return;
  // 還沒選低音時再按一次 = 取消;已經選過低音再按 = 重選低音
  P.slash = P.slash && P.slash.letter < 0 ? null : { letter: -1, acc: 0 };
  renderPractice();
}
/* 低音存成「離根音幾個半音」(跟 STATE.bassIv 同一套),拼法由和弦自己的級數決定;低音 = 根音就是原位 */
function padSetBass(){
  const P = PRACTICE, i = P.steps.length - 1, st = P.steps[i];
  const iv = pcOf(LETTER_PC[P.slash.letter] + P.slash.acc - LETTER_PC[st.letter] - st.acc);
  P.steps[i] = Object.assign({}, st, { bass: iv === 0 ? null : iv });
  practiceEdited(i);
  withStep(P.steps[i], () => playCurrent());
}
function practiceEdited(flash){
  const P = PRACTICE;

const stepName = st => {

  Object.assign(STATE, { letter: st.letter, acc: st.acc, chordId: st.id, bassIv: st.bass, bassFor: st.id });

/* 進行的時間軸:每個和弦從第幾拍開始、整輪幾拍 */
/* 練習時(吉他)的移調夾選單:鍵盤設定面板在練習時收起來了,這裡也要能換。
   ★ 標在「這組進行用開放和弦指型最多」的那一格(同分取比較低的格),例如 E♭ B♭ Cm A♭ 夾第 3 格 = C G Am F */
function practiceCapoBest(){
  const steps = PRACTICE.steps;
  if (!steps.length) return -1;
  let best = 0, bestN = -1;
  for (let k = 0; k <= 7; k++) {
    let n = 0;
    for (const st of steps) {
      const rp = pcOf(LETTER_PC[st.letter] + st.acc - k), def = chordById(st.id);
      const bass = st.bass == null ? null : pcOf(rp + st.bass);
      const vs = chordVoicingsFor(rp, def, bass), v = vs.list[vs.best];
      if (v && v.frets.some(f => f === 0) && v.minF <= 4) n++;
    }
    if (n > bestN) { bestN = n; best = k; }
  }
  return best;
}
function practiceCapoSelect(){
  const best = practiceCapoBest();
  return '<select class="mini" id="prCapo" aria-label="' + t("capoLabel") + '" title="' + t("practiceCapoHint") + '">' +
    [0, 1, 2, 3, 4, 5, 6, 7].map(n => '<option value="' + n + '"' + (n === STATE.capo ? " selected" : "") + '>' +
      (n ? t("practiceCapoN", { n }) : t("practiceCapo0")) + (n === best && best > 0 ? " ★" : "") + '</option>').join("") + '</select>';
}
/* 每個和弦佔幾拍:有寫拍數(C*1、C*2…)就照寫的;**沒寫 = 填到這一小節結束**(使用者要求):
   第一個和弦按成 1 拍,下一個和弦自動佔剩下的 3 拍,不會把後面整排推離小節線。
   整個進行補到整小節(最後一個和弦延長到小節線),bars = 一共幾小節 */
function practiceTimeline(){
  const start = [], dur = [], B = PRACTICE.beats; let t = 0;
  for (const st of PRACTICE.steps) {
    const d = st.beats && st.beats < B ? st.beats : B - (t % B);
    start.push(t); dur.push(d); t += d;
  }
  const total = Math.max(1, Math.ceil(t / B)) * B;
  if (dur.length) dur[dur.length - 1] += total - t;
  return { start: start.length ? start : [0], dur, total, bars: total / B };
}
/* 存檔與文字框用的寫法:和弦名稱,不是整小節的加上 *拍數 */
const stepText = st => stepName(st) + (st.beats ? "*" + st.beats : "");
/* 把目前這一步套到鍵盤/指板上 */
function practiceApply(){
  const st = PRACTICE.steps[PRACTICE.step];
  if (!st) return;
  Object.assign(STATE, { tab: "chord", letter: st.letter, acc: st.acc, chordId: st.id, bassIv: st.bass, bassFor: st.id });
}
function practiceClick(time, accent){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.value = accent ? 1760 : 1175;
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(accent ? 0.5 : 0.28, time + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
  o.connect(g); g.connect(masterGain);
  o.start(time); o.stop(time + 0.06);
  o._at = time;
  PRACTICE.clicks = PRACTICE.clicks.filter(c => c._at > time - 1).concat(o);   // 停止時取消還沒響的點擊聲(不放進 scheduledNodes,換和弦會把它們收掉)
}
function practiceStart(){

  PRACTICE.count = PRACTICE.countIn ? -PRACTICE.beats : 0;   // 預備小節:先數一小節的拍子,第一個和弦在下一小節
  PRACTICE.step = 0;

  const run = ++PRACTICE.runId;   // 停了又馬上開始時,上一輪還沒觸發的 setTimeout 認得出自己過期了
  const schedule = () => {
    /* 計時器被節流(切到背景、主執行緒卡住)回來時,錯過的拍子不要一口氣全補(會聽到一串點擊和和弦疊在一起),
       直接跳過、留在原本的小節格線上 */
    const spb = 60 / PRACTICE.bpm, lag = audioCtx.currentTime - 0.05 - PRACTICE.nextTime;
    if (lag > 0) { const missed = Math.ceil(lag / spb); PRACTICE.count += missed; PRACTICE.nextTime += missed * spb; }
    while (PRACTICE.nextTime < audioCtx.currentTime + 0.1) {
      /* 每個和弦佔幾拍:沒寫就是一整小節;`C*2` 是兩拍(一小節換兩個和弦)。拍點與重音照小節格線(n % B),
         和弦照累計拍數換:onset = 這一拍剛好是某個和弦的開頭 */

      const tl = practiceTimeline(), pos = n >= 0 ? n % tl.total : 0;
      let step = 0; while (step + 1 < tl.start.length && tl.start[step + 1] <= pos) step++;
      const onset = n >= 0 && tl.start[step] === pos;
      practiceClick(PRACTICE.nextTime, beat === 0);
      if (n < 0) {   // 預備小節:只有點擊聲和拍點,不彈和弦、不換圖
        const delay = Math.max(0, (PRACTICE.nextTime - heardTime()) * 1000);
        setTimeout(() => { if (PRACTICE.running && PRACTICE.runId === run) { PRACTICE.beat = beat; renderPracticeBeat(); } }, delay);
        PRACTICE.nextTime += 60 / PRACTICE.bpm;
        continue;
      }
      // 和弦跟點擊聲排在同一個音訊時鐘的同一刻。原本等畫面的 setTimeout 觸發才彈,
      // 計時器常常晚幾十毫秒、playNotes 又再往後 60ms,和弦總是慢半拍(使用者回報過)
      /* 逐漸加速(老師常用的練法):整個進行每繞完 k 輪,速度加 d(最快 200)。在新一輪的第一拍換速度 */

        const [d, k] = PRACTICE.ramp.split("/").map(Number), loop = n / tl.total;
        if (loop % k === 0 && PRACTICE.bpm < 200) {
          PRACTICE.bpm = Math.min(200, PRACTICE.bpm + d);
          const bpm = PRACTICE.bpm, delay = Math.max(0, (PRACTICE.nextTime - heardTime()) * 1000);
          setTimeout(() => { if (PRACTICE.running && PRACTICE.runId === run) { updateBpmUI(bpm); practiceBeatVar(); } }, delay);
        }
      }
      if (onset && PRACTICE.accomp) {
        const at = PRACTICE.nextTime;
        withStep(PRACTICE.steps[step], () => playCurrent(at));
      }
      // 畫面跟著「聽到」的時刻走(扣掉輸出延遲),不是排程時鐘,跟鍵盤發亮同一個規則
      const delay = Math.max(0, (PRACTICE.nextTime - heardTime()) * 1000);
      setTimeout(() => {
        if (!PRACTICE.running || PRACTICE.runId !== run) return;
        PRACTICE.beat = beat;
        if (onset) {
          if (!PRACTICE.steps.length) return;
          PRACTICE.step = step % PRACTICE.steps.length;   // 排程之後、觸發之前刪掉了最後一個和弦,索引會超出範圍
          practiceApply();
          practiceTick();   // 聲音已經在上面照節拍器的時鐘排好了,這裡只更新會變的那幾塊畫面
        } else renderPracticeBeat();
      }, delay);
      PRACTICE.nextTime += 60 / PRACTICE.bpm;
    }

  PRACTICE.timer = setInterval(schedule, 25);

}
function practiceStop(){
  if (!PRACTICE.running && !PRACTICE.open) return;
  clearInterval(PRACTICE.timer);
  PRACTICE.running = false;
  PRACTICE.beat = -1;
  // 節拍器提前 0.1 秒排好下一拍的和弦:在拍子前一刻按停止,那個和弦不該還響出來。還沒開始的音取消,正在響的不動
  // 還沒開始的音直接取消(停止時間 = 開始時間就完全不出聲;fadeStop 會從預設音量 1 開始收,離開始不到 40ms 時會冒一下);
  // 已經排好的節拍器點擊聲也一起取消
  if (audioCtx) {
    const now = audioCtx.currentTime;
    for (const n of scheduledNodes) if (n._at > now + 0.001) { try { if (n._g) { n._g.gain.cancelScheduledValues(0); n._g.gain.setValueAtTime(0, now); } n.stop(n._at); } catch (e) {} n._cancelled = true; }
    for (const o of PRACTICE.clicks) if (o._at > now) { try { o.stop(o._at); } catch (e) {} }
  }
  PRACTICE.clicks = [];
  if (PRACTICE.ramp && PRACTICE.baseBpm) PRACTICE.bpm = PRACTICE.baseBpm;
}

/* 練習卡片裡「現在 / 下一個」的小圖:吉他畫直式和弦圖(跟指板上同一個指法),鋼琴畫兩個八度的小鍵盤。
   兩個一起看,換和弦之前就能先把手準備好 */
function withStep(st, fn){
  const saved = { letter: STATE.letter, acc: STATE.acc, chordId: STATE.chordId, bassIv: STATE.bassIv, bassFor: STATE.bassFor, tab: STATE.tab }, v0 = VOICED;
  const vo = practiceVoicedFor(st);
  Object.assign(STATE, { tab: "chord", letter: st.letter, acc: st.acc, chordId: st.id, bassIv: st.bass, bassFor: st.id });

   第一個和弦照名稱的原位;之後每個和弦試所有轉位 × 上下一個八度,取「每個音到前一個和弦最近的音」距離總和最小的,
   再加一點「離第一個和弦的音區越遠越貴」,繞好幾圈也不會一路往上飄。斜線和弦的低音照樣在最下面。

    const inv = upper.map((n, i) => Object.assign({}, n, { midi: n.midi + (i < k ? 12 : 0), isBass: false }));

    for (const m of ms) cost += Math.min(...prev.map(x => Math.abs(x - m)));
    for (const x of prev) cost += Math.min(...ms.map(m => Math.abs(x - m)));

function practiceVoicedFor(st){
  const P = PRACTICE;
  if (P.voicing !== "near" || STATE.inst !== "piano" || VOICED) return null;
  const i = P.steps.indexOf(st);
  if (i < 0) return null;
  const key = P.steps.map(stepText).join(" ");
  if (!P._vc || P._vc.key !== key) {
    const list = [];
    P._vc = { key, list: null };
    P.steps.forEach((s2, j) => {
      const ns = withStep(s2, () => displayNotes());   // _vc.list 還是 null,這裡拿到的是原位
      if (!ns.length) { list.push(ns); return; }
      if (!j) { list.push(ns); return; }
      const first = list[0].length ? list[0] : ns;
      const center = first.reduce((a, n) => a + n.midi, 0) / first.length;
      const prev = (list[j - 1].length ? list[j - 1] : first).map(n => n.midi);
      list.push(voiceNear(ns, prev, center));
    });
    P._vc.list = list;
  }
  return P._vc.list ? P._vc.list[i] : null;
}

/* 手機兩列版型(max-width:600)的上列放不下時,不寫半截(不要「…」):先拿掉兩個名字音階的括號名,再拿掉副標。
   寬版還是一行,不處理 */
function fitSummary(el){
  const row = el.querySelector(".nmrow");
  if (!row || getComputedStyle(row).display === "contents") return;
  const over = () => row.scrollWidth > row.clientWidth + 1;
  const zhEl = row.querySelector(".zh");
  if (zhEl && over()) zhEl.classList.add("off");
  const second = row.querySelectorAll("b.stk .nm span")[1];
  if (second && over()) second.classList.add("off");
  // 還是放不下(320px 的長音階名、半音階的十二個音):字縮小一點,最小 12 / 11px,也不寫半截
  const shrink = (box, target, min, isOver) => {
    let fs = parseFloat(getComputedStyle(target).fontSize);
    while (isOver() && fs > min) { fs = Math.max(min, fs - 0.5); target.style.fontSize = fs + "px"; }
  };
  shrink(row, row.querySelector("b"), 12, over);
  const tn = el.querySelector(".tones");
  if (tn && tn.scrollWidth > tn.clientWidth + 1) {
    tn.style.letterSpacing = "0";
    shrink(tn, tn, 11, () => tn.scrollWidth > tn.clientWidth + 1);
  }
}
/* 釘在鍵盤下的摘要:名稱 + 組成音,高度固定(寬版一行、手機兩列) */

    name = isChord ? chordTitle(def) : rootName() + " " + summaryScaleName(def);
    if (!isChord) { const sn = summaryScaleName(def), i = sn.indexOf(" / "); if (i > 0) stack = [rootName(), sn.slice(0, i), "(" + sn.slice(i + 3) + ")"]; }

  }

  /* 吉他音階的把位:‹ 3★ › 放在摘要列(使用者要求)。原本是指板下面一整排「全部 1 2 … 7」,

  const posList = STATE.inst === "guitar" && STATE.tab === "scale" ? scalePositions() : null;
  const posCur = posList && currentScalePos(), posIdx = posCur ? posList.findIndex(p => p.k === posCur.k) : -1;

  const capoTag = capoK() ? '<span class="capo-tag">' + t("capoTag", { n: capoK() }) + '</span>' : '';
  el.innerHTML = '<span class="nmrow"><b></b>' + (zh ? '<span class="zh"></span>' : '') + '</span><span class="tones">' + capoTag + '</span>' + nav + posNav +

    '</button>';
  /* Aeolian / Natural Minor 這種兩個名字的音階,一行塞不下(手機上被截成 Aeolian / Nat…):

/* 鍵盤點擊:用跟 drawKeyboard 一樣的幾何反推點到哪個鍵(黑鍵疊在上面所以先判斷) */
function keyAt(px, py){
  const cv = $("keyboardCanvas");
  const w = cv._cssW, h = cv._cssH;
  const whiteW = w / KB_WHITE_KEYS.length;
  const blackH = h * 0.6, blackW = whiteW * 0.62;
  for (let m = KB_LOW; m <= KB_HIGH; m++) {
    if (!isBlackKey(m)) continue;
    let leftWhite = m - 1;
    while (isBlackKey(leftWhite)) leftWhite--;
    const li = KB_WHITE_IDX[leftWhite];
    if (li === undefined) continue;
    const kx = (li + 1) * whiteW - blackW / 2;
    if (py <= blackH && px >= kx && px <= kx + blackW) return m;
  }
  const i = Math.floor(px / whiteW);
  return KB_WHITE_KEYS[Math.max(0, Math.min(KB_WHITE_KEYS.length - 1, i))];
}
/* 撥一條弦:發出目前指法在這條弦上的音(空弦就是空弦音、按弦就是按住的那一格),
   標 × 的弦不彈,不發聲 */
function pluckString(s){
  const v = currentVoicing();
  if (!v || v.frets[s] < 0) return;
  vibrateString(s, v.frets[s]);
  playSingle(gm(s, v.frets[s]));
}

$("keyboardCanvas").addEventListener("pointermove", ev => {
  const cv = $("keyboardCanvas");
  if (cv._strum == null || STATE.inst !== "guitar" || STATE.tab !== "chord") return;
  const rect = cv.getBoundingClientRect();
  const hit = fretAt(ev.clientX - rect.left, ev.clientY - rect.top);
  if (!hit || hit.s === cv._strum) return;
  // 一次滑過好幾條弦(滑得快)時,中間經過的每一條都要響
  const step = hit.s > cv._strum ? 1 : -1;
  for (let s = cv._strum + step; s !== hit.s + step; s += step) pluckString(s);

});

$("keyboardCanvas").addEventListener("pointerdown", ev => {
  const cv = $("keyboardCanvas");
  const rect = cv.getBoundingClientRect();
  if (STATE.tab === "scale") return;   // 音階分頁(鋼琴與吉他):整個方框都是「播上行音階」,交給 .kb-wrap 的處理

  if (STATE.inst === "guitar") {
    const hit = fretAt(ev.clientX - rect.left, ev.clientY - rect.top);
    if (!hit) return;
    const midi = gm(hit.s, hit.f);
    if (STATE.tab === "find") {
      // 一條弦同一時間只能發一個音:點同一格是取消,點別格是移過去
      // 琴頸左邊那一欄(第 0 格)三段切換:沒設定(自動)→ ○ 空弦 → × 不彈 → 回到自動。
      // 最低點以上的弦自動算空弦,想悶掉某一條(Cmaj7 = x3x453)就點兩下變 ×
      const cur = STATE.findFrets[hit.s];
      STATE.findFrets[hit.s] = hit.f === 0 ? (cur == null ? 0 : cur === 0 ? -1 : null) : (cur === hit.f ? null : hit.f);
      syncFindFromFrets();
      const nf = STATE.findFrets[hit.s];
      if (nf != null && nf >= 0) { vibrateString(hit.s, hit.f); playSingle(midi); }
      render();
    } else if (STATE.tab === "chord") {
      // 和弦:左手已經按好整個和弦,右手撥哪條弦就響那條弦「按住的音」,
      // 不是點到的那一格。手指按住往上下滑就是一條一條刷過去
      pluckString(hit.s);
      cv._strum = hit.s;
      try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
    }
    return;
  }
  const m = keyAt(ev.clientX - rect.left, ev.clientY - rect.top);
  if (m === undefined) return;
  if (STATE.tab === "find") {
    if (STATE.findSel.has(m)) STATE.findSel.delete(m); else STATE.findSel.add(m);
    playSingle(m);
    render();
  } else {
    /* 和弦/音階模式只讓亮起來的鍵(組成音)發聲,手指擦到旁邊的鍵不會冒出和弦外的音。
       黑鍵疊在白鍵上面,點在亮起來的白鍵邊緣常常會先命中沒亮的黑鍵——
       這種情形改看手指底下那顆白鍵,它亮著就彈它 */
    const on = new Set(keyboardNotes().map(n => n.midi));
    let hit = on.has(m) ? m : null;
    if (hit == null) {
      const ww = cv._cssW / KB_WHITE_KEYS.length;
      const white = KB_WHITE_KEYS[Math.max(0, Math.min(KB_WHITE_KEYS.length - 1, Math.floor((ev.clientX - rect.left) / ww)))];
      if (on.has(white)) hit = white;
    }
    if (hit != null) playSingle(hit);
  }
});

function currentPlayback(){
  const v = STATE.inst === "guitar" ? currentVoicing() : null;
  const midis = STATE.tab === "find"
    ? [...STATE.findSel].sort((a, b) => a - b)
    : v ? voicingMidis(v) : (STATE.tab === "scale" && STATE.inst === "guitar") ? guitarScaleUpMidis() : displayNotes().map(n => n.midi);

function playCurrent(at){

/* 音階分頁:點鍵盤/指板方框內任何地方(琴鍵、格子或旁邊的空白)= 從主音彈上行音階到高八度主音(使用者要求,
   鋼琴與吉他一樣)。單音改從摘要列的音名點 */
function playScaleUp(){
  const ms = STATE.inst === "guitar" ? guitarScaleUpMidis() : displayNotes().map(n => n.midi).sort((a, b) => a - b);
  if (ms.length) playNotes(ms, "arp");

/* 吉他:選了把位 = 彈那個把位裡畫出來的每一個音,由低到高(聲音跟指板一樣);同一個音高在不同弦上只彈一次。
   選「全部」時指板上有三十幾個音,整串彈下去不成音階,改彈一個八度:指板上最低、而且整個八度都找得到的那個主音起,
   彈到高八度主音(找不到完整的一圈才退回固定八度) */
function guitarScaleUpMidis(){
  const gv = guitarView();
  const avail = new Set(gv.dots.map(d => d.midi).concat(gv.markers.filter(m => m && m.type === "open").map(m => m.midi)));
  if (currentScalePos()) return avail.size ? [...avail].sort((a, b) => a - b) : displayNotes().map(n => n.midi).sort((a, b) => a - b);
  const semis = [...new Set(currentNotes().map(n => ((n.semi % 12) + 12) % 12))].sort((a, b) => a - b).concat(12);
  const tonics = [...avail].filter(m => pcOf(m) === rootPc()).sort((a, b) => a - b);
  for (const t of tonics) { const seq = semis.map(x => t + x); if (seq.every(m => avail.has(m))) return seq; }
  return displayNotes().map(n => n.midi).sort((a, b) => a - b);
}

/* 鍵盤快捷鍵:上下切換類型、左右移動根音、字母直接選根音,方便一路瀏覽完整個字典 */
document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "SELECT" || ev.target.tagName === "TEXTAREA") return;
  // 鍵盤操作時焦點在按鈕上:空白鍵 / Enter 就是按那顆按鈕(原本空白鍵被拿去播放,按鈕按不下去)
  if ((ev.key === " " || ev.key === "Enter") && ev.target.closest && ev.target.closest('button, [role="button"], a, summary')) return;
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const P = PRACTICE;
  /* 字母 C~G、A、B = 根音(練習中是輸入板的根音),- = ♭、= = ♮、+ 或 # = ♯。
     練習中另外:空白鍵 = 開始/停止,Backspace = 刪除最後一個,/ = 斜線低音。不用 b 當降記號,會跟 B 撞 */
  if (P.open && STATE.tab === "chord") {
    if (ev.key === " ") { ev.preventDefault(); if (P.running) { practiceStop(); render(); } else practiceStart(); return; }
    if (ev.key === "Backspace" && P.steps.length) { ev.preventDefault(); $("prUndo").click(); return; }
    if (ev.key === "/") { ev.preventDefault(); padSlash(); return; }
  }
  const li = "CDEFGAB".indexOf(ev.key.toUpperCase());
  /* 辨識(鋼琴):字母鍵 = 在起始八度裡選/取消那個音,Shift + 字母 = 升半音(C# = Shift+C)。
     沒有這個的話,只用鍵盤的人完全沒辦法用辨識(畫布不能聚焦) */
  if (li >= 0 && ev.key.length === 1 && STATE.tab === "find" && STATE.inst === "piano") {
    ev.preventDefault();
    const m = 12 * (STATE.octave + 1) + LETTER_PC[li] + (ev.shiftKey ? 1 : 0);
    if (STATE.findSel.has(m)) STATE.findSel.delete(m); else { STATE.findSel.add(m); playSingle(m); }
    render();
    return;
  }
  if (li >= 0 && ev.key.length === 1 && STATE.tab !== "find") {
    ev.preventDefault();
    if (P.open && STATE.tab === "chord") padLetter(li);
    else rootLetter(li);
    return;
  }
  const acc = { "-": -1, "=": 0, "+": 1, "#": 1 }[ev.key];
  if (acc !== undefined && STATE.tab !== "find") {
    ev.preventDefault();
    if (P.open && STATE.tab === "chord") {
      const cur = P.slash ? P.slash.acc : P.pad.acc;
      if (acc !== cur) padAcc(acc || cur);   // = 是還原:對目前的記號再按一次就是取消
    }
    else {
      const sl = rootSlashState(), cur = sl ? sl.acc : STATE.acc;
      if (acc !== cur) rootAcc(acc || cur);
    }
    return;
  }
  if (ev.key === "/" && STATE.tab === "chord" && !P.open) { ev.preventDefault(); rootSlash(); return; }
  if (ev.key === " ") { ev.preventDefault(); playCurrent(); return; }
  if (STATE.tab === "find") return;
  const isChord = STATE.tab === "chord";
  // 走目前看得到的清單(套過搜尋與篩選),而不是整本字典——
  // 不然篩選中按↓會跳到根本沒顯示出來的項目。跨到別的分類時 syncGroup() 會把分類帶過去
  const list = filteredItems();
  if (!list.length) return;
  const cur = list.findIndex(x => x.id === (isChord ? STATE.chordId : STATE.scaleId));
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    ev.preventDefault();
    const next = cur < 0 ? 0 : (cur + (ev.key === "ArrowDown" ? 1 : list.length - 1)) % list.length;
    if (isChord) STATE.chordId = list[next].id; else STATE.scaleId = list[next].id;
    render();
  } else if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") {
    ev.preventDefault();
    STATE.letter = (STATE.letter + (ev.key === "ArrowRight" ? 1 : 6)) % 7;
    STATE.bassIv = null; STATE.slash = null;

const PRINT_ROOTS = [[0, 0], [1, -1], [1, 0], [2, -1], [2, 0], [3, 0], [3, 1], [4, 0], [5, -1], [5, 0], [6, -1], [6, 0]];   // C D♭ D E♭ E F F♯ G A♭ A B♭ B

    if (used + L.rowH > avail && pages[pages.length - 1].length) { pages.push([]); used = 0; }
    // 換頁後的第一列一定寫根音(不然那一頁看不出是哪個根音)

/* ── 下載 PDF:網頁自己寫 PDF 檔(不經過瀏覽器的列印,使用者要求:存檔時不要網址、日期、頁碼)──
   做法:和弦表排成真正的 A4 放到畫面外(.pdfmode),先量每段字、放不下就縮字級(手機字型比較寬時,E♭dim7 的 ♭ 曾被切掉),
   每一頁用 canvas 畫(文字照量到的位置 fillText、和弦圖把 SVG 當圖片畫),約 250dpi,

const PDF_SCALE = 250 / 96;   // 250dpi
function fitPdfText(sheet){

function svgImage(svg, w, h){

/* ── 主題 ──
   sm_theme 跟 sm_lang 一樣是四個工具共用的 localStorage key,值只有 "light" / "dark"。
   四個工具同一個 origin,在任一個切過主題,其他三個打開就是同一個。沒存過的時候用本
   工具自己的預設(深色)——共用的是「使用者的選擇」,不是「還沒選之前的預設」。

   舊版把這個值存在 "harmonymap.light"("1"/"0")。既有使用者升上來時 sm_theme 還是空的,
   所以讀舊 key 當備援,不然人家設好的淺色會被默默重設成深色。舊 key 只讀不寫,
   使用者下次切換就會寫進 sm_theme。 */
const THEME_KEY = "sm_theme";
const LEGACY_THEME_KEY = "harmonymap.light";
function themeIsLight(){
  try {
    const v = localStorage.getItem(THEME_KEY);
    if (v === "light" || v === "dark") return v === "light";
    const legacy = localStorage.getItem(LEGACY_THEME_KEY);
    if (legacy === "1" || legacy === "0") return legacy === "1";
  } catch (e) {}
  return false;
}
function applyTheme(){
  const on = themeIsLight();
  document.body.classList.toggle("light", on);
  $("themeToggle").setAttribute("aria-pressed", String(on));
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", on ? "#FBF7EE" : "#0C0A07");
  resizeKeyboardCanvas();   // 畫布底色吃 --bg,換主題要重畫
  drawKeyboardLive();
}
$("themeToggle").onclick = () => {
  try { localStorage.setItem(THEME_KEY, themeIsLight() ? "dark" : "light"); } catch (e) {}
  applyTheme();
};

/* ── 分享連結:網址 # 後面記著目前這一頁 ──
   #chord=Bbmaj7、#chord=C/E、#scale=D-dorian、#tab=find,另外 inst=guitar、capo=2、prog=G: I V vi IV(練習)。
   每次 render 用 replaceState 更新(不會塞滿上一頁紀錄),複製網址或用 Safari 分享就是這一頁。

let lastHash = "";

  else if (STATE.tab === "chord") q.set("chord", asciiAcc(chordTitle(chordById(STATE.chordId))));
  else if (STATE.tab === "scale") q.set("scale", asciiAcc(rootName()) + "-" + STATE.scaleId);
  else q.set("tab", "find");
  q.set("inst", STATE.inst);   // 一律寫:連結要用分享的人當時的樂器打開,不是收到的人上次用的
  if (STATE.inst === "guitar" && STATE.capo) q.set("capo", String(STATE.capo));
  const h = q.toString().replace(/\+/g, "%20");

  lastHash = h;

function readHash(){
  const raw = location.hash.slice(1);
  if (!raw) return;
  let q; try { q = new URLSearchParams(raw); } catch (e) { return; }
  const inst = q.get("inst");
  if (inst === "guitar" || inst === "piano") STATE.inst = inst;
  else if (q.get("chord") || q.get("scale") || q.get("prog")) STATE.inst = "piano";   // 舊連結沒寫樂器 = 鋼琴
  if (STATE.inst === "guitar") { const cp = parseInt(q.get("capo") || "0", 10); STATE.capo = cp >= 0 && cp <= 7 ? cp : 0; }
  const ch = q.get("chord"), sc = q.get("scale"), pr = q.get("prog");
  if (pr != null) {
    const r = practiceParseCustom(pr);
    if (r.steps.length) { PRACTICE.steps = r.steps; PRACTICE.custom = r.steps.map(stepText).join(" "); PRACTICE.step = 0; PRACTICE.open = true; STATE.tab = "chord"; practiceApply(); }
  } else if (ch) {
    const pc = parseChordName(ch);
    if (pc) Object.assign(STATE, { tab: "chord", letter: pc.letter, acc: pc.acc, chordId: pc.def.id, bassIv: pc.bass, bassFor: pc.def.id, slash: null });
    PRACTICE.open = false;
  } else if (sc) {
    const m = sc.match(/^([A-G])([#b♯♭]?)-(.+)$/), def = m && scaleById(m[3]);
    if (def) Object.assign(STATE, { tab: "scale", letter: LETTERS.indexOf(m[1]), acc: m[2] ? (/[#♯]/.test(m[2]) ? 1 : -1) : 0, scaleId: def.id });
    PRACTICE.open = false;
  } else if (q.get("tab") === "find") { STATE.tab = "find"; PRACTICE.open = false; }
  lastHash = raw;
}

/* ── 語言 ── */
$("langToggle").onclick = () => { applyLanguage(LANG === "zh" ? "en" : "zh"); };

syncStickyMetrics();
applyTheme();
// 上次練習的那一組進行(重新整理之後還在)
try {
  const r = practiceParseCustom(localStorage.getItem(PRCUR_KEY) || "");
  if (r.steps.length) { PRACTICE.steps = r.steps; PRACTICE.custom = r.steps.map(stepText).join(" "); }
} catch (e) {}
readHash();   // 網址裡帶了和弦/音階/進行(老師傳給學生的連結)就直接打開那一頁
window.addEventListener("hashchange", () => { if (location.hash.slice(1) !== lastHash) { readHash(); render(); } });
applyLanguage(LANG); // 內部會呼叫 render(),所以下面不用再呼叫一次
</script>
