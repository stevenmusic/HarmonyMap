  {id:"7b9",   sym:"7♭9",    zh:"降九屬七",     en:"Dominant 7 ♭9",    g:"屬和弦系", t:["1","3","5","♭7","♭9"],   alias:[], lv:2, st:"cl jz", d:"往小調解決時的首選,去掉根音後其實就是一個減七和弦,張力尖銳。", d_en:"The first choice when resolving to a minor key — drop the root and it's literally a diminished 7th chord, sharply tense."},
  {id:"7s9",   sym:"7♯9",    zh:"升九屬七",     en:"Dominant 7 ♯9",    g:"屬和弦系", t:["1","3","5","♭7","♯9"],   alias:["Hendrix"], lv:2, st:"pop jz bl", d:"大三度與升九(等於小三度)同時存在的衝突音響,〈Purple Haze〉那個著名的和弦。", d_en:"The clash of a major 3rd against a raised 9th (enharmonically a minor 3rd) — the famous chord from \"Purple Haze\"."},
  {id:"7b9s9", sym:"7♭9♯9", zh:"降九升九和弦", en:"Dominant 7th ♭9♯9", g:"屬和弦系", t:["1","3","5","♭7","♭9","♯9"], lv:1, st:"jz", d:"兩個九音同時出現,半音撞在一起,是最緊繃的屬和弦聲響之一。", d_en:"Both altered 9ths present at once, a half step apart — one of the most tense-sounding dominant chords."},
  {id:"7s11",  sym:"7♯11",   zh:"升十一屬七",   en:"Dominant 7 ♯11",   g:"屬和弦系", t:["1","3","5","♭7","♯11"],      alias:["7♭5(add)"], lv:2, st:"jz", d:"對應利底安屬音階,是三全音代理常用的顏色,比 7♭5 保留了完全五度。", d_en:"Matches the Lydian dominant scale — a common tritone-substitute color that keeps the perfect 5th, unlike 7♭5."},
  {id:"7s5s9", sym:"7♯5♯9",  zh:"增五升九",     en:"Dominant 7 ♯5♯9",  g:"屬和弦系", t:["1","3","♯5","♭7","♯9"],  alias:[], lv:1, st:"jz", d:"兩個變化音一起上,張力極高,對應變化音階。", d_en:"Two altered tensions stacked together for very high tension, matching the altered scale."},
  {id:"7s5b9", sym:"7♯5♭9",  zh:"增五降九",     en:"Dominant 7 ♯5♭9",  g:"屬和弦系", t:["1","3","♯5","♭7","♭9"],  alias:[], lv:1, st:"jz", d:"往小調解決時最常見的變化屬和弦之一,對應變化音階或弗里吉安屬音階(半全減音階沒有 ♯5,不適用)。", d_en:"One of the most common altered dominants resolving to a minor key, matching the altered scale or Phrygian dominant (the half-whole diminished scale has no ♯5, so it does not fit)."},
  {id:"7b5b9", sym:"7♭5♭9", zh:"降五降九和弦", en:"Dominant 7th ♭5♭9", g:"屬和弦系", t:["1","3","♭5","♭7","♭9"], lv:1, st:"jz", d:"♭5 與 ♭9 的組合,解決到小調時比 ♯5♭9 更沉。", d_en:"The ♭5 and ♭9 combination — darker than ♯5♭9 when resolving to a minor key."},
  {id:"7b5s9", sym:"7♭5♯9", zh:"降五升九和弦", en:"Dominant 7th ♭5♯9", g:"屬和弦系", t:["1","3","♭5","♭7","♯9"], lv:1, st:"jz", d:"♭5 配 ♯9,變化屬和弦的四種組合之一,藍調搖滾也用得到。", d_en:"♭5 paired with ♯9 — one of the four altered-dominant combinations, also used in blues rock."},
  {id:"7b13",  sym:"7♭13",   zh:"降十三屬七",   en:"Dominant 7 ♭13",   g:"屬和弦系", t:["1","3","5","♭7","♭13"],      alias:["7♯5(add)"], lv:1, st:"jz", d:"♭13 與 ♯5 是同一個音高,但寫法不同:保留完全五度時寫 ♭13,取代五音時寫 ♯5。", d_en:"♭13 and ♯5 are the same pitch, spelled differently: write ♭13 when keeping the perfect 5th, ♯5 when replacing it."},
  // 7♯9♭13 故意不含五音:它是變化屬和弦,搭配的是變化音階(沒有完全五度)。tonal.js 等一般和弦剖析器會補上五音,
  // 但那樣就跟建議音階互相矛盾(測試抓到過),照爵士理論(Levine)不放五音
  {id:"7s9b13",sym:"7♯9♭13", zh:"升九降十三",   en:"Dominant 7 ♯9♭13", g:"屬和弦系", t:["1","3","♭7","♯9","♭13"],     alias:[], lv:1, st:"jz", d:"往小調解決時最濃烈的配色,五音通常省略讓 ♭13 站出來。", d_en:"The thickest coloring for resolving to a minor key — the 5th is usually dropped so the ♭13 can stand out."},
  {id:"13",    sym:"13",     zh:"屬十三和弦",   en:"Dominant 13th",    g:"屬和弦系", t:["1","3","5","♭7","9","13"],   alias:[], lv:2, st:"jz bl", d:"最豐滿的屬和弦,實際彈奏通常只留 3、♭7、9、13 四個音,大樂團的標準配置。", d_en:"The fullest dominant chord — in practice usually only the 3rd, ♭7, 9th, and 13th are voiced, the standard big-band setup."},
  {id:"9s11",  sym:"9♯11",   zh:"九升十一",     en:"Dominant 9 ♯11",   g:"屬和弦系", t:["1","3","5","♭7","9","♯11"],  alias:[], lv:1, st:"jz", d:"屬九再加 ♯11,對應利底安屬音階,是三全音代理最完整的表達。", d_en:"A dominant 9th plus ♯11, matching the Lydian dominant scale — the fullest expression of a tritone substitute."},
  {id:"7b9s11",sym:"7♭9♯11", zh:"降九升十一",   en:"Dominant 7 ♭9♯11", g:"屬和弦系", t:["1","3","5","♭7","♭9","♯11"], alias:[], lv:1, st:"jz", d:"對應半全減音階,同時具備 ♭9 的尖銳與 ♯11 的懸浮,張力極高。", d_en:"Matches the half-whole diminished scale — combines the sharpness of ♭9 with the suspension of ♯11 for very high tension."},
  {id:"7s9s11", sym:"7♯9♯11", zh:"升九升十一和弦", en:"Dominant 7th ♯9♯11", g:"屬和弦系", t:["1","3","5","♭7","♯9","♯11"], lv:1, st:"jz", d:"♯9 與 ♯11 並置、保留完全五度,對應半全減音階(變化音階沒有完全五度)。", d_en:"♯9 and ♯11 together with the perfect 5th kept — matches the half-whole diminished scale (the altered scale has no perfect 5th)."},
  {id:"7b9b13",sym:"7♭9♭13", zh:"降九降十三",   en:"Dominant 7 ♭9♭13", g:"屬和弦系", t:["1","3","5","♭7","♭9","♭13"], alias:[], lv:1, st:"jz", d:"和聲小調第五級的完整和弦,對應弗里吉安屬音階,往小調解決時最濃的顏色(半全減音階沒有 ♭13、變化音階沒有完全五度)。", d_en:"The full chord on the 5th degree of harmonic minor, matching Phrygian dominant — the darkest coloring when resolving to a minor key (half-whole diminished has no ♭13; the altered scale has no perfect 5th)."},
  {id:"7alt",  sym:"7alt",   zh:"變化屬和弦",   en:"Altered Dominant", g:"屬和弦系", t:["1","3","♭7","♭9","♯9","♭13"],alias:["7♯9♭9♭13"], lv:2, st:"jz", d:"把所有能變化的延伸音(♭9、♯9、♭13)一次用上,對應變化音階,爵士最強的解決前張力。", d_en:"Piles on every alterable extension (♭9, ♯9, ♭13) at once, matching the altered scale — jazz's strongest pre-resolution tension."},
  {id:"13s11", sym:"13♯11",  zh:"十三升十一",   en:"Dominant 13 ♯11",  g:"屬和弦系", t:["1","3","5","♭7","9","♯11","13"], alias:[], lv:1, st:"jz", d:"利底安屬音階的完整七音堆疊,大樂團寫作的極限配置。", d_en:"The full seven-note stack of the Lydian dominant scale — the extreme configuration in big-band writing."},
  {id:"13b9", sym:"13♭9", zh:"降九十三和弦", en:"Dominant 13th ♭9", g:"屬和弦系", t:["1","3","5","♭7","♭9","13"], lv:2, st:"jz film", d:"♭9 的張力配上大十三度的明亮,半全減音階(HW)的招牌和聲。", d_en:"The tension of ♭9 against the brightness of a major 13th — the signature harmony of the half-whole (HW) diminished scale."},
  {id:"13s9", sym:"13♯9", zh:"升九十三和弦", en:"Dominant 13th ♯9", g:"屬和弦系", t:["1","3","5","♭7","♯9","13"], lv:1, st:"jz bl", d:"♯9 的藍調味配十三度,放克與靈魂樂裡很常見的濃厚屬和弦。", d_en:"A bluesy ♯9 paired with the 13th — a rich, common dominant chord in funk and soul."},

  // ── 小調系 ──
  {id:"min",   sym:"m",      zh:"小三和弦",     en:"Minor",            g:"小調系", t:["1","♭3","5"],           alias:["min","−"], lv:3, st:"cl pop jz bl film", d:"把大三和弦的三音降半音,色彩立刻轉為柔和、內斂。小調的 i 級。", d_en:"Lower the 3rd of a major triad a half step and the color turns soft and inward at once — the i chord of a minor key."},
  {id:"m6",    sym:"m6",     zh:"小六和弦",     en:"Minor 6th",        g:"小調系", t:["1","♭3","5","6"],      alias:[], lv:2, st:"cl jz", d:"小三和弦加大六度(注意是大六度,不是♭6),來自旋律小調,帶著淡淡的爵士感。", d_en:"A minor triad plus a major 6th (note: major, not ♭6) — borrowed from melodic minor, with a hint of jazz flavor."},
  {id:"madd9", sym:"m(add9)",zh:"小加九和弦",   en:"Minor Add 9",      g:"小調系", t:["1","♭3","5","9"],      alias:[], lv:2, st:"pop film", d:"小三和弦加九音,♭3 與 9 之間形成寬廣的張力,有種冷冽的美感。", d_en:"A minor triad plus the 9th — the ♭3 and 9 form a wide tension with a cool, crisp beauty."},
  {id:"madd11", sym:"madd11", zh:"小加十一和弦", en:"Minor add11", g:"小調系", t:["1","♭3","5","11"], alias:["m(add4)"], lv:1, st:"pop film", d:"小三和弦加四度,沒有七音,空靈而不指向任何解決,配樂常用。", d_en:"A minor triad plus the 4th, no 7th — airy and unresolved, common in film scoring."},
  {id:"mb6",   sym:"m♭6",     zh:"小三降六",     en:"Minor ♭6",         g:"小調系", t:["1","♭3","5","♭6"],      alias:[], lv:1, st:"cl film", d:"小三和弦加 ♭6,同一組音就是以 ♭6 為根音的大七和弦的第一轉位(Cm♭6 = A♭maj7/C),自然小調的內部張力。", d_en:"A minor triad plus ♭6 — the same notes as a first-inversion major 7th chord built on the ♭6 (Cm♭6 = A♭maj7/C); the internal tension of natural minor."},
  {id:"m7",    sym:"m7",     zh:"小七和弦",     en:"Minor 7th",        g:"小調系", t:["1","♭3","5","♭7"],      alias:["min7","−7"], lv:3, st:"pop jz bl", d:"最溫和的七和弦,張力低、可久留,ii–V–I 裡的 ii 級就是它。", d_en:"The gentlest 7th chord — low tension, easy to sit on; it's the ii chord in a ii–V–I progression."},
  {id:"mMaj7", sym:"mMaj7",  zh:"小大七和弦",   en:"Minor Major 7th",  g:"小調系", t:["1","♭3","5","7"],       alias:["m△7","mM7"], lv:2, st:"cl jz film", d:"小三和弦配大七度,來自和聲小調/旋律小調,懸疑、帶點希區考克式的不安。", d_en:"A minor triad with a major 7th, borrowed from harmonic/melodic minor — mysterious, with a bit of Hitchcockian unease."},
  {id:"m7s5",  sym:"m7♯5",   zh:"增五小七",     en:"Minor 7 ♯5",       g:"小調系", t:["1","♭3","♯5","♭7"],     alias:[], lv:1, st:"jz", d:"小七和弦把五音升高,同一組音就是以 ♯5(♭6)為根音的 add9 和弦的轉位(Cm7♯5 = A♭add9/C),實務上不常單獨出現。", d_en:"A minor 7th with the 5th raised — the same notes as an inverted add9 chord built on the ♯5/♭6 (Cm7♯5 = A♭add9/C); rarely appears on its own in practice."},
  {id:"m69",   sym:"m6/9",   zh:"小六九和弦",   en:"Minor Six Nine",   g:"小調系", t:["1","♭3","5","6","9"],  alias:[], lv:1, st:"jz film", d:"小三和弦加六音與九音,沒有七度的張力,是小調段落最漂亮的收尾和弦。", d_en:"A minor triad plus the 6th and 9th, with no 7th tension — a beautiful way to close out a minor-key section."},
  {id:"m9",    sym:"m9",     zh:"小九和弦",     en:"Minor 9th",        g:"小調系", t:["1","♭3","5","♭7","9"],   alias:["−9"], lv:2, st:"pop jz bl", d:"小七和弦加九音,柔軟又有層次,是 Neo-Soul 的標準配備。", d_en:"A minor 7th plus the 9th — soft and layered, the standard-issue chord of neo-soul."},
  {id:"mMaj9", sym:"mMaj9",  zh:"小大九和弦",   en:"Minor Major 9th",  g:"小調系", t:["1","♭3","5","7","9"],    alias:["m△9"], lv:1, st:"jz film", d:"小大七再加九音,神祕色彩更濃,常見於旋律小調的即興。", d_en:"A minor-major 7th plus the 9th — even more mysterious, common in melodic-minor improvisation."},
  {id:"m7add11",sym:"m7add11", zh:"小七加十一",  en:"Minor 7 add 11",   g:"小調系", t:["1","♭3","4","5","♭7"],  alias:["So What"], lv:2, st:"jz", d:"小七和弦加四度音,實務上用四度堆疊的聲位彈出來,就是〈So What〉那個著名的和弦,現代爵士鋼琴的基本語彙。", d_en:"A minor 7th plus the 4th, typically voiced in fourths — this is the famous chord from \"So What\", a basic vocabulary word of modern jazz piano."},
  {id:"m11",   sym:"m11",    zh:"小十一和弦",   en:"Minor 11th",       g:"小調系", t:["1","♭3","5","♭7","9","11"],  alias:[], lv:2, st:"pop jz bl", d:"小和弦沒有三音衝突的問題,可以把 1-♭3-5-♭7-9-11 全部堆好,音響寬廣如水面。", d_en:"Minor chords don't have the 3rd-clash problem, so 1-♭3-5-♭7-9-11 can all be stacked — a sound as wide as open water."},
  {id:"m13",   sym:"m13",    zh:"小十三和弦",   en:"Minor 13th",       g:"小調系", t:["1","♭3","5","♭7","9","13"],  alias:[], lv:1, st:"jz", d:"小七和弦配大十三度(來自多利安的自然六音),明亮版的小和弦。", d_en:"A minor 7th with a major 13th (from Dorian's natural 6th) — a brighter version of the minor chord."},
  {id:"mMaj11",sym:"mMaj11", zh:"小大十一",     en:"Minor Major 11th", g:"小調系", t:["1","♭3","5","7","9","11"],   alias:["m△11"], lv:1, st:"jz", d:"旋律小調的完整堆疊,神祕又寬廣。", d_en:"The full stack of melodic minor — mysterious and wide."},
  {id:"mMaj13", sym:"mMaj13", zh:"小大十三和弦", en:"Minor Major 13th", g:"小調系", t:["1","♭3","5","7","9","11","13"], alias:["m△13"], lv:1, st:"jz film", d:"旋律小調的完整堆疊,小三度與導音並存,同時帶大十三度。", d_en:"The full stack of melodic minor — the minor 3rd and the leading tone coexist alongside a major 13th."},

  // ── 減系與半減系 ──
  {id:"dim",   sym:"dim",    zh:"減三和弦",     en:"Diminished",       g:"減系與半減系", t:["1","♭3","♭5"],          alias:["°","m♭5"], lv:2, st:"cl pop jz film", d:"兩個小三度疊起來,五音被壓縮成減五度,聽感緊張、不穩定,強烈想解決到下一個和弦。", d_en:"Two minor 3rds stacked, squeezing the 5th into a diminished 5th — tense and unstable, strongly wanting to resolve onward."},
  {id:"dim7",  sym:"dim7",   zh:"減七和弦",     en:"Diminished 7th",   g:"減系與半減系", t:["1","♭3","♭5","♭♭7"],    alias:["°7"], lv:2, st:"cl jz", d:"四個音等距(全是小三度),完全對稱,可以往四個方向解決,是最好用的轉調樞紐。七音寫成重降七度。", d_en:"Four notes equally spaced (all minor 3rds), perfectly symmetrical, and able to resolve in four directions — the most useful modulation pivot. The 7th is spelled as a double-flat 7th."},
  {id:"m7b5",  sym:"m7♭5",   zh:"半減七和弦",   en:"Half Diminished",  g:"減系與半減系", t:["1","♭3","♭5","♭7"],     alias:["ø7"], lv:2, st:"cl jz", d:"減三和弦加小七度,小調 ii–V–i 的 ii 級,比全減七柔和、還保有調性方向。", d_en:"A diminished triad plus a minor 7th — the ii chord of a minor-key ii–V–i, gentler than a full diminished 7th and still tonally directional."},
  {id:"dimMaj7",sym:"dim(maj7)",zh:"減三大七",  en:"Diminished Major 7", g:"減系與半減系", t:["1","♭3","♭5","7"],    alias:["°△7"], lv:1, st:"cl film", d:"減三和弦配大七度(減七和弦的七音升高半音),對應全半減音階,懸疑度極高,恐怖片配樂的常客。", d_en:"A diminished triad with a major 7th (a dim7 chord with its 7th raised a half step), matching the whole-half diminished scale — extremely suspenseful, a horror-film-score staple."},
  {id:"m9b5",  sym:"m9♭5",   zh:"半減九和弦",   en:"Half Dim 9th",     g:"減系與半減系", t:["1","♭3","♭5","♭7","9"],  alias:["ø9"], lv:1, st:"jz", d:"半減七加自然九音,來自旋律小調第六級(Locrian ♮2),小調 ii 級的進階配置。", d_en:"A half-diminished 7th plus a natural 9th, borrowed from the 6th degree of melodic minor (Locrian ♮2) — an advanced voicing of the minor ii chord."},
  {id:"m11b5", sym:"m11♭5",  zh:"半減十一",     en:"Minor 11 ♭5",      g:"減系與半減系", t:["1","♭3","♭5","♭7","9","11"], alias:["ø11"], lv:1, st:"jz", d:"半減和弦的完整堆疊,對應旋律小調第六級,小調 ii 級的最大化配置。", d_en:"The full stack of a half-diminished chord, matching the 6th degree of melodic minor — the maximal voicing of the minor ii chord."},

  // ── 無三度和弦 ──
  {id:"pow",   sym:"5",      zh:"強力和弦",     en:"Power Chord",      g:"無三度和弦", t:["1","5"],                alias:["no3"], lv:2, st:"pop", d:"只有根音與五音,沒有三音就沒有大小調色彩,經破音後仍然乾淨,是搖滾吉他的骨幹。", d_en:"Just the root and the 5th — no 3rd means no major/minor color, and it stays clean even through distortion. The backbone of rock guitar."},
  {id:"sus2",  sym:"sus2",   zh:"掛留二和弦",   en:"Suspended 2nd",    g:"無三度和弦", t:["1","2","5"],            alias:["sus9"], lv:2, st:"pop film", d:"用二音取代三音,沒有大小調的傾向,聲響開闊、空靈,常見於流行與民謠伴奏。", d_en:"Replaces the 3rd with the 2nd — no major/minor leaning, an open, airy sound common in pop and folk accompaniment."},
  {id:"sus4",  sym:"sus4",   zh:"掛留四和弦",   en:"Suspended 4th",    g:"無三度和弦", t:["1","4","5"],            alias:["sus"], lv:3, st:"cl pop jz", d:"用四音取代三音,產生想往三音落下的懸置感,古典裡通常解決到同根音的大/小三和弦。", d_en:"Replaces the 3rd with the 4th, creating a suspended pull toward the 3rd — in classical music it typically resolves to a major or minor triad on the same root."},
  {id:"sus2sus4",sym:"sus2sus4",zh:"二四掛留",  en:"Sus2 Sus4",        g:"無三度和弦", t:["1","2","4","5"],        alias:["sus24"], lv:1, st:"pop film", d:"二音與四音同時取代三音,只剩根音、五音與兩個掛留音,空靈而現代。", d_en:"The 2nd and 4th together replace the 3rd, leaving only the root, the 5th, and two suspensions — airy and modern."},
  {id:"6sus4", sym:"6sus4", zh:"六掛四和弦", en:"6sus4", g:"無三度和弦", t:["1","4","5","6"], lv:1, st:"pop jz", d:"掛四和弦加大六度,沒有七音也沒有三音,常當屬和弦的替代色。", d_en:"A sus4 chord plus a major 6th — no 7th, no 3rd, often used as a dominant substitute color."},

  {id:"hungMinor",  zh:"匈牙利小調",      en:"Hungarian Minor",      g:"雙和聲大調系統", t:["1","2","♭3","♯4","5","♭6","7"],     lv:2, d:"和聲小調再把四音升高,同時有 ♯4 與導音,東歐吉普賽音樂的代表。", d_en:"Harmonic minor with the 4th also raised — has both ♯4 and a leading tone, representative of Eastern European Gypsy music."},
  {id:"oriental", zh:"東方音階", en:"Oriental", g:"雙和聲大調系統", t:["1","♭2","3","4","♭5","6","♭7"], lv:2, d:"雙和聲大調第五級,又稱 Mixolydian ♭5 ♭9。中東與東歐旋律常見的下行色彩。", d_en:"The 5th degree of double harmonic major, also called Mixolydian ♭5 ♭9 — a common descending color in Middle Eastern and Eastern European melodies."},
  {id:"ionianAug2", zh:"增愛奧尼安 ♯2", en:"Ionian Augmented ♯2", g:"雙和聲大調系統", t:["1","♯2","3","4","♯5","6","7"], lv:1, d:"雙和聲大調第六級。大調骨架配 ♯2 與 ♯5,古典晚期與配樂裡的增和弦素材。", d_en:"The 6th degree of double harmonic major. A major-scale skeleton with ♯2 and ♯5 — augmented-chord material from the late-Romantic era and film scoring."},
  {id:"locrianbb3bb7", zh:"洛克里安 ♭♭3 ♭♭7", en:"Locrian ♭♭3 ♭♭7", g:"雙和聲大調系統", t:["1","♭2","♭♭3","4","♭5","♭6","♭♭7"], lv:1, d:"雙和聲大調第七級。拼寫上出現兩個重降音,實際音高與雙和聲大調同一組。", d_en:"The 7th degree of double harmonic major. Spelled with two double-flats, but the same pitches as double harmonic major."},

  // ── 五聲與藍調 ──
  {id:"majPent",    zh:"大調五聲",        en:"Major Pentatonic",     g:"五聲與藍調", t:["1","2","3","5","6"],                lv:3, d:"大調拿掉四音與七音,沒有半音衝突,怎麼彈都不會錯,民謠與鄉村的基礎。", d_en:"The major scale with the 4th and 7th removed — no half-step clashes, so nothing you play sounds wrong. The foundation of folk and country music."},
  {id:"minPent",    zh:"小調五聲",        en:"Minor Pentatonic",     g:"五聲與藍調", t:["1","♭3","4","5","♭7"],              lv:3, d:"搖滾與藍調獨奏的第一課,與大調五聲互為關係音階(相差小三度)。", d_en:"Lesson one for rock and blues soloing, and the relative scale of major pentatonic (a minor 3rd apart)."},
  {id:"bluesMin",   zh:"小調藍調",        en:"Minor Blues",          g:"五聲與藍調", t:["1","♭3","4","♭5","5","♭7"],         lv:3, d:"小調五聲插入 ♭5 這顆藍調音,經過性地滑過去最有味道。", d_en:"Minor pentatonic with the ♭5 blue note dropped in — sounds best slid through as a passing tone."},
  {id:"bluesMaj",   zh:"大調藍調",        en:"Major Blues",          g:"五聲與藍調", t:["1","2","♭3","3","5","6"],           lv:2, d:"大調五聲插入 ♭3,♭3→3 的滑音是鄉村與西岸藍調的招牌。", d_en:"Major pentatonic with a ♭3 dropped in — the ♭3→3 slide is the signature move of country and West Coast blues."},
  {id:"egyptian",   zh:"埃及五聲(sus)",   en:"Egyptian / Sus Pent",  g:"五聲與藍調", t:["1","2","4","5","♭7"],               lv:1, d:"大調五聲的第二轉位,全是二度與四度堆疊,開放且無調性傾向。", d_en:"The second inversion of major pentatonic — entirely stacked 2nds and 4ths, open and with no clear tonal leaning."},

  // ── 日本音階 ──
  {id:"hirajoshi",  zh:"平調子",          en:"Hirajoshi",            g:"日本音階", t:["1","2","♭3","5","♭6"],              lv:2, d:"日本箏最常見的定弦音階,兩個半音落點讓它一聽就有和風。", d_en:"The most common tuning scale for the Japanese koto — its two half-step landings give it an unmistakable Japanese sound."},
  {id:"kumoi",      zh:"雲井調子",        en:"Kumoi",                g:"日本音階", t:["1","2","♭3","5","6"],               lv:2, d:"小調五聲換掉四音與七音、帶自然六度,清澈明亮的和風小調。", d_en:"Minor pentatonic with the 4th and 7th swapped out for a natural 6th — a clear, bright, Japanese-flavored minor scale."},
  {id:"miyakobushi",zh:"都節音階",        en:"Miyako-bushi",         g:"日本音階", t:["1","♭2","4","5","♭6"],              lv:2, d:"江戶時代都市音樂的代表音階,♭2 與 ♭6 兩個半音是它的招牌,聽起來最「日本」。", d_en:"The representative scale of Edo-period urban music — its two half steps, ♭2 and ♭6, are its signature, and it sounds the most \"Japanese\" of all."},
  {id:"insen",      zh:"陰旋音階",        en:"Insen",                g:"日本音階", t:["1","♭2","4","5","♭7"],              lv:1, d:"都節把 ♭6 換成 ♭7,陰暗中多一點流動感,常用於尺八與箏曲。", d_en:"Miyako-bushi with ♭6 swapped for ♭7 — darker but with more flow, common in shakuhachi and koto music."},
  {id:"iwato",      zh:"岩戶音階",        en:"Iwato",                g:"日本音階", t:["1","♭2","4","♭5","♭7"],             lv:1, d:"都節音階的轉位,含減五度,是日本音階裡最緊繃、最神祕的一個。", d_en:"An inversion of Miyako-bushi containing a diminished 5th — the tensest, most mysterious of the Japanese scales."},
  {id:"ryukyu",     zh:"琉球音階",        en:"Ryukyu / Okinawan",    g:"日本音階", t:["1","3","4","5","7"],                lv:2, d:"沖繩民謠的音階,拿掉二音與六音、保留大三與大七,明亮而獨特,與本土的陰暗和風完全相反。", d_en:"The scale of Okinawan folk music — drops the 2nd and 6th, keeps the major 3rd and major 7th, bright and distinct, the opposite of the dark mainland Japanese sound."},
  {id:"ritsu",      zh:"律音階",          en:"Ritsu",                g:"日本音階", t:["1","2","4","5","6"],                lv:1, d:"雅樂使用的音階,沒有半音,聽感平穩莊重。", d_en:"A scale used in gagaku court music, with no half steps — calm and stately."},
  {id:"minyo",      zh:"民謠音階",        en:"Min'yō",               g:"日本音階", t:["1","♭3","4","5","♭7"],              lv:1, d:"日本民謠的骨幹,音程結構與小調五聲相同,差別在旋律的走法與裝飾。", d_en:"The backbone of Japanese folk song — the same interval structure as minor pentatonic, differing in melodic movement and ornamentation."},
  {id:"ryo",        zh:"呂音階",          en:"Ryo",                  g:"日本音階", t:["1","2","3","5","6"],                lv:1, d:"與律音階相對的雅樂音階,結構等同大調五聲,明亮開闊。", d_en:"The gagaku counterpart to Ritsu — structurally identical to major pentatonic, bright and open."},

  // ── 阿拉伯與中東 ──
  {id:"hijaz",      zh:"希賈茲",          en:"Hijaz",                g:"阿拉伯與中東", t:["1","♭2","3","4","5","♭6","♭7"],  lv:2, d:"最廣為人知的馬卡姆,♭2 到 3 的增二度就是「中東感」的來源。音高結構與弗里吉安屬音階相同。", d_en:"The best-known maqam — the augmented 2nd from ♭2 to 3 is the source of that \"Middle Eastern\" feeling. Same pitches as Phrygian Dominant."},
  {id:"hijazkar",   zh:"希賈茲卡爾",      en:"Hijaz Kar",            g:"阿拉伯與中東", t:["1","♭2","3","4","5","♭6","7"],   lv:2, d:"上下半部都是希賈茲四音列,兩個增二度,又稱雙和聲大調、拜占庭音階。", d_en:"Both halves are Hijaz tetrachords, giving two augmented 2nds — also called double harmonic major or the Byzantine scale."},
  {id:"nahawand",   zh:"納哈萬德",        en:"Nahawand",             g:"阿拉伯與中東", t:["1","2","♭3","4","5","♭6","7"],   lv:2, d:"阿拉伯音樂裡的小調,結構等同和聲小調,是最貼近西方耳朵的馬卡姆之一。", d_en:"The minor scale of Arabic music — structurally identical to harmonic minor, one of the maqamat closest to Western ears."},
  {id:"kurd",       zh:"庫爾德",          en:"Kurd",                 g:"阿拉伯與中東", t:["1","♭2","♭3","4","5","♭6","♭7"], lv:2, d:"結構等同弗里吉安,現代阿拉伯流行歌大量使用。", d_en:"Structurally identical to Phrygian — used heavily in modern Arabic pop."},
  {id:"ajam",       zh:"阿賈姆",          en:"Ajam",                 g:"阿拉伯與中東", t:["1","2","3","4","5","6","7"],      lv:2, d:"阿拉伯音樂裡的大調,結構等同 Ionian,明亮、節慶感。", d_en:"The major scale of Arabic music — structurally identical to Ionian, bright and festive."},
  {id:"bayati",     zh:"巴亞提",          en:"Bayati",               g:"阿拉伯與中東", t:["1","2","♭3","4","5","♭6","♭7"],  lv:2, d:"最常用的馬卡姆之一。真正的巴亞提第二音是四分之一音(比 ♮2 略低),鋼琴彈不出來,這裡用最接近的十二平均律近似。", d_en:"One of the most-used maqamat. The true 2nd degree of Bayati is a quarter tone (slightly lower than ♮2), which a piano can't play — this is its closest 12-tone-equal-temperament approximation."},
  {id:"rast",       zh:"拉斯特",          en:"Rast",                 g:"阿拉伯與中東", t:["1","2","3","4","5","6","♭7"],     lv:2, d:"馬卡姆體系的「基準音階」,三音與七音實際是四分之一音,鋼琴上以 Mixolydian 近似。", d_en:"The \"reference scale\" of the maqam system — the 3rd and 7th are actually quarter tones, approximated on piano as Mixolydian."},
  {id:"saba",       zh:"薩巴",            en:"Saba",                 g:"阿拉伯與中東", t:["1","2","♭3","♭4","5","♭6","♭7"], lv:1, d:"四音就降下來(♭4),形成獨特的哀傷色彩,是最容易辨認的馬卡姆之一。", d_en:"The 4th degree drops a half step (♭4), giving it a distinctively mournful color — one of the most recognizable maqamat."},
  {id:"nikriz",     zh:"尼克里茲",        en:"Nikriz",               g:"阿拉伯與中東", t:["1","2","♭3","♯4","5","6","♭7"],  lv:1, d:"♯4 配自然六度,結構等同烏克蘭小調,土耳其與巴爾幹音樂常見。", d_en:"♯4 paired with a natural 6th — structurally identical to Ukrainian Dorian, common in Turkish and Balkan music."},
  {id:"nawaathar",  zh:"納瓦阿薩爾",      en:"Nawa Athar",           g:"阿拉伯與中東", t:["1","2","♭3","♯4","5","♭6","7"],  lv:1, d:"兩個增二度的小調型馬卡姆,結構等同匈牙利小調。", d_en:"A minor-type maqam with two augmented 2nds — structurally identical to Hungarian minor."},
  {id:"suznak",     zh:"蘇茲納克",        en:"Suznak",               g:"阿拉伯與中東", t:["1","2","3","4","5","♭6","7"],     lv:1, d:"下半部是拉斯特、上半部是希賈茲,結構等同和聲大調。", d_en:"The lower half is Rast, the upper half is Hijaz — structurally identical to harmonic major."},
  {id:"zanjaran",   zh:"贊賈蘭",          en:"Zanjaran",             g:"阿拉伯與中東", t:["1","♭2","3","4","5","6","♭7"],    lv:1, d:"希賈茲四音列配上明亮的自然六度,聽感比一般希賈茲開朗。", d_en:"A Hijaz tetrachord paired with a bright natural 6th — sounds more cheerful than typical Hijaz."},
  {id:"atharkurd",  zh:"阿薩爾庫爾德",    en:"Athar Kurd",           g:"阿拉伯與中東", t:["1","♭2","♭3","♯4","5","♭6","7"], lv:1, d:"庫爾德起頭、增四度轉折,是馬卡姆裡結構最曲折的一支。", d_en:"Starts as Kurd, then turns through an augmented 4th — the most winding structure among the maqamat."},
  {id:"persian",    zh:"波斯音階",        en:"Persian",              g:"阿拉伯與中東", t:["1","♭2","3","4","♭5","♭6","7"],  lv:1, d:"兩個增二度加減五度,異國情調濃厚,常見於電影配樂對「東方」的想像。", d_en:"Two augmented 2nds plus a diminished 5th — heavily exotic, often used in film scoring to evoke \"the East\"."},
  {id:"jiharkah", zh:"賈哈爾卡", en:"Jiharkah", g:"阿拉伯與中東", t:["1","2","3","4","5","6","♭7"], lv:1, d:"阿賈姆家族的馬卡姆,以大調四音列起頭、七音降半音,音高與米索利地安相同。", d_en:"A maqam of the Ajam family — starts with a major tetrachord, 7th lowered a half step — the same pitches as Mixolydian."},
  {id:"farahfaza", zh:"法拉赫法扎", en:"Farahfaza", g:"阿拉伯與中東", t:["1","2","♭3","4","5","♭6","♭7"], lv:1, d:"納哈萬德家族的馬卡姆,音高與自然小調相同,差別在旋律的行進與終止習慣。", d_en:"A maqam of the Nahawand family — same pitches as natural minor, differing in melodic movement and cadence habits."},
  {id:"shawqafza", zh:"蕭克阿夫扎", en:"Shawq Afza", g:"阿拉伯與中東", t:["1","2","3","4","5","♭6","7"], lv:1, d:"阿賈姆家族的馬卡姆,上半部改用希賈茲四音列,音高與和聲大調相同。", d_en:"A maqam of the Ajam family — the upper half switches to a Hijaz tetrachord; same pitches as harmonic major."},

  // ── 印度與其他亞洲 ──
  {id:"bilawal",    zh:"比拉瓦爾",        en:"Bilawal Thaat",        g:"印度與其他亞洲", t:["1","2","3","4","5","6","7"],      lv:2, d:"印度十大塔特(音階母體)之一,結構等同大調,是其他塔特的參照點。", d_en:"One of the ten Hindustani thaats (parent scales) — structurally identical to the major scale, the reference point for the other thaats."},
  {id:"khamaj",     zh:"卡瑪吉",          en:"Khamaj Thaat",         g:"印度與其他亞洲", t:["1","2","3","4","5","6","♭7"],     lv:1, d:"結構等同 Mixolydian,輕快的半古典曲目(Thumri)常用。", d_en:"Structurally identical to Mixolydian — common in lighter semi-classical repertoire (thumri)."},
  {id:"kafi",       zh:"卡菲",            en:"Kafi Thaat",           g:"印度與其他亞洲", t:["1","2","♭3","4","5","6","♭7"],    lv:2, d:"結構等同多利安,是北印度音樂裡最常見的小調型塔特。", d_en:"Structurally identical to Dorian — the most common minor-type thaat in North Indian music."},
  {id:"asavari",    zh:"阿薩瓦里",        en:"Asavari Thaat",        g:"印度與其他亞洲", t:["1","2","♭3","4","5","♭6","♭7"],   lv:1, d:"結構等同自然小調,晨間拉格的典型音階。", d_en:"Structurally identical to natural minor — the typical scale of morning ragas."},
  {id:"bhairavi",   zh:"拜拉維",          en:"Bhairavi Thaat",       g:"印度與其他亞洲", t:["1","♭2","♭3","4","5","♭6","♭7"],  lv:2, d:"結構等同弗里吉安,音樂會通常以拜拉維作結。", d_en:"Structurally identical to Phrygian — concerts traditionally close with Bhairavi."},
  {id:"bhairav",    zh:"拜拉夫",          en:"Bhairav Thaat",        g:"印度與其他亞洲", t:["1","♭2","3","4","5","♭6","7"],    lv:2, d:"結構等同雙和聲大調,清晨演奏的莊嚴拉格。", d_en:"Structurally identical to double harmonic major — a solemn raga performed at dawn."},
  {id:"kalyan",     zh:"卡揚",            en:"Kalyan Thaat",         g:"印度與其他亞洲", t:["1","2","3","♯4","5","6","7"],     lv:2, d:"結構等同利底安,黃昏拉格的代表。", d_en:"Structurally identical to Lydian — representative of evening ragas."},
  {id:"marwa",      zh:"馬爾瓦",          en:"Marwa Thaat",          g:"印度與其他亞洲", t:["1","♭2","3","♯4","5","6","7"],    lv:1, d:"♭2 配 ♯4,刻意迴避五音,懸浮而不安定。", d_en:"♭2 paired with ♯4, deliberately avoiding the 5th — suspended and unsettled."},
  {id:"purvi",      zh:"普爾維",          en:"Purvi Thaat",          g:"印度與其他亞洲", t:["1","♭2","3","♯4","5","♭6","7"],   lv:1, d:"馬爾瓦再把六音降下來,日落時分的拉格。", d_en:"Marwa with the 6th also lowered — a raga for sunset."},
  {id:"todi",       zh:"托迪",            en:"Todi Thaat",           g:"印度與其他亞洲", t:["1","♭2","♭3","♯4","5","♭6","7"],  lv:1, d:"三個降音配一個升四,是十大塔特裡張力最強的一個。", d_en:"Three lowered tones paired with a raised 4th — the most tense of the ten thaats."},
  {id:"gong",       zh:"宮調式",          en:"Gong (Chinese)",       g:"印度與其他亞洲", t:["1","2","3","5","6"],              lv:2, d:"中國五聲調式的第一調,以宮為主音,結構等同大調五聲,端正明亮。", d_en:"The first mode of the Chinese pentatonic system, centered on gong — structurally identical to major pentatonic, upright and bright."},
  {id:"shang",      zh:"商調式",          en:"Shang (Chinese)",      g:"印度與其他亞洲", t:["1","2","4","5","♭7"],             lv:1, d:"以商為主音的五聲調式,沒有三音,聽感中性開闊。", d_en:"A pentatonic mode centered on shang — no 3rd, a neutral, open sound."},
  {id:"jue",        zh:"角調式",          en:"Jue (Chinese)",        g:"印度與其他亞洲", t:["1","♭3","4","♭6","♭7"],           lv:1, d:"以角為主音的五聲調式,五個音裡沒有純五度,是五個調式中最不穩定的。", d_en:"A pentatonic mode centered on jue — none of its five notes form a perfect 5th, making it the least stable of the five modes."},
  {id:"zhi",        zh:"徵調式",          en:"Zhi (Chinese)",        g:"印度與其他亞洲", t:["1","2","4","5","6"],              lv:1, d:"以徵為主音的五聲調式,結構等同律音階,平和舒展。", d_en:"A pentatonic mode centered on zhi — structurally identical to Ritsu, calm and expansive."},
  {id:"yu",         zh:"羽調式",          en:"Yu (Chinese)",         g:"印度與其他亞洲", t:["1","♭3","4","5","♭7"],            lv:2, d:"以羽為主音的五聲調式,結構等同小調五聲,是中國音樂裡的「小調」。", d_en:"A pentatonic mode centered on yu — structurally identical to minor pentatonic, the closest thing to a \"minor key\" in Chinese music."},
  {id:"qingyue", zh:"清樂音階", en:"Qingyue (Chinese)", g:"印度與其他亞洲", t:["1","2","3","4","5","6","7"], lv:1, d:"中國七聲之一,五聲加清角(4)與變宮(7),音高與大調相同,魏晉至南北朝的清商樂系統。", d_en:"One of the Chinese heptatonic scales — pentatonic plus qingjiao (4) and biangong (7); same pitches as the major scale — the Qingshang system from the Wei-Jin through Northern-and-Southern-Dynasties era."},
  {id:"yayue", zh:"雅樂音階", en:"Yayue (Chinese)", g:"印度與其他亞洲", t:["1","2","3","♯4","5","6","7"], lv:1, d:"中國七聲之一,五聲加變徵(♯4)與變宮(7),音高與利底安相同,古代宮廷雅樂所用。", d_en:"One of the Chinese heptatonic scales — pentatonic plus bianzhi (♯4) and biangong (7); same pitches as Lydian — used in ancient imperial court music."},
  {id:"yanyue", zh:"燕樂音階", en:"Yanyue (Chinese)", g:"印度與其他亞洲", t:["1","2","3","4","5","6","♭7"], lv:1, d:"中國七聲之一,五聲加清角(4)與閏(♭7),音高與米索利地安相同,隋唐燕樂所用。", d_en:"One of the Chinese heptatonic scales — pentatonic plus qingjiao (4) and run (♭7); same pitches as Mixolydian — used in the banquet music of the Sui and Tang dynasties."},
  {id:"pelog",      zh:"貝洛(印尼)",      en:"Pelog",                g:"印度與其他亞洲", t:["1","♭2","♭3","5","♭6"],           lv:2, d:"甘美朗的七聲音律取五個音的近似。真正的貝洛音程不均等、也不落在十二平均律上。", d_en:"A seven-note approximation reduced to five for gamelan tuning. The true Pelog intervals are uneven and don't fall on 12-tone equal temperament."},

/* 風格標籤:和弦的風格不是它的內在屬性,而是「誰常用它」,所以做成可複選的篩選,
   不做成分組——分組放錯會把和弦藏起來,篩選只是縮小範圍 */

       vadi(骨幹音)與演奏時辰,同一個塔特可以長出完全不同的拉格

  const first = new Map(), map = new Map();
  for (const s of SCALES) {
    const k = pitchKey(s);
    if (first.has(k)) map.set(s.id, first.get(k));   // 指向代表條目
    else first.set(k, s);

  return map;
})();

const CHORD_MATCH = CHORDS.map(c => {
  const pcs = [...new Set(c.t.map(t => ((tokenSemi(t) % 12) + 12) % 12))].sort((a, b) => a - b);
  return { ref: c, key: pcs.join(","), size: pcs.length, pcs };

function matchChords(rootPc, pcs){
  const rel = pcs.map(p => ((p - rootPc) % 12 + 12) % 12);
  const k = setKey(rel);
  return CHORD_MATCH.filter(m => m.key === k).map(m => m.ref);

/* ══════════════════════════════════════════════════════════════

function rebuildKeyboardRange(midiList){

    const info = activeMap.get(m);
    const staff = info && info.staff;
    const attack = info && info.attack;
    // 黑鍵的青色也有漸層,底部 #2FA897(對深色字 6.5);金色黑鍵底部原本 #8A6410 只有 3.7,根音在黑鍵時(B♭、F♯)音名難讀,調亮到 #BC8A1C(6.5)

      ctx.shadowColor = staff === 2 ? "rgba(63,191,174,0.9)" : "rgba(242,185,75,0.9)";
      ctx.shadowBlur = 12;

    ctx.fillStyle = g;
    ctx.fill();
    if (staff) ctx.restore();
    // 黑鍵頂端光澤
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.fillRect(kx + blackW * 0.15, y + 2, blackW * 0.3, blackH * 0.35);
  }
}

/* ── 音名標籤:ScrollScore 的鍵盤不需要標音名(那邊看的是樂譜),

    ctx.fillStyle = lab.strong ? "rgba(20,14,4,0.92)" : "rgba(60,52,36,0.55)";
    ctx.fillText(lab.text, cx, y + h - fs * 0.95);

    ctx.fillStyle = lab.strong ? "rgba(10,8,2,0.92)" : "rgba(255,253,246,0.6)";
    ctx.fillText(lab.text, cx, y + blackH - bfs * 0.9);

/* 兩欄版面時,右邊顯示區可以用的高度 = 左欄高度 − 摘要列 − 外框;不是兩欄(或練習中)就回傳 0 */
const TWO_COL = window.matchMedia("(min-width:900px)");
const SHORT_H = window.matchMedia("(max-height:420px)");
function twoColumnAvail(){
  if (!TWO_COL.matches) return 0;
  try { if (PRACTICE.open && STATE.tab === "chord") return 0; } catch (e) { return 0; }   // 載入初期 PRACTICE 還沒宣告
  const card = [$("rootCard"), $("findCard")].find(c => c && !c.hidden);
  const tabs = document.querySelector(".topbar .tab-row"), wrap = document.querySelector(".kb-wrap");
  if (!card || !tabs || !wrap) return 0;
  const gap = parseFloat(getComputedStyle(document.querySelector(".topbar")).rowGap) || 0;
  const cs = getComputedStyle(wrap);
  const chrome = (parseFloat(cs.borderTopWidth) || 0) + (parseFloat(cs.borderBottomWidth) || 0) + $("kbSummary").offsetHeight;
  // 卡片會被拉高去對齊右邊(align-self:stretch),所以量「內容」的高度,不量卡片本身——量卡片的話兩邊會互相撐大

  let lo = Math.min(...ms), hi = Math.max(...ms);

const GTR_OPEN = [40, 45, 50, 55, 59, 64]; // 標準調音,索引 0 = 6 弦(低音 E2)… 5 = 1 弦(高音 E4)

const VOICING_CACHE = new Map();
/* 橫按和弦的「正統」形狀,就是 E 與 A 開放和弦整個往上推(F = E 形推一格、Cm = Am 形推三格)。
   這裡不另外存形狀表:同一種和弦在根音 E、A 上算出來的開放指法就是它的樣板,
   空弦變成食指橫按的那一格。符合樣板的指法優先,否則評分會挑出 × 3 1 0 1 × 這種
   彈得到、但沒有人這樣教的 Cm */
function shapeTemplates(def, bassIv){
  const out = [];
  for (const pc of [4, 9]) { // E、A
    const vs = chordVoicingsFor(pc, def, bassIv == null ? null : pcOf(pc + bassIv), true);
    const v = vs.list[vs.best];
    if (v && v.frets.some(f => f === 0) && v.minF <= 4) out.push({ pc, frets: v.frets });
  }
  return out;
}
function matchesShape(frets, rPc, templates){
  return templates.some(tp => {
    // 平移 k 格或 k + 12 格(E 的六弦封閉和弦在第 12 格,就是 E 形本身往上推一個八度)
    return [pcOf(rPc - tp.pc), pcOf(rPc - tp.pc) + 12].some(k => k > 0 &&
      tp.frets.every((f, s) => f < 0 ? frets[s] < 0 : frets[s] === f + k));
  });
}

    const pcs = [...new Set(sel.map(pcOf))];
    return pcs.length >= 3 && matchChords(pcOf(sel[0]), pcs).length > 0;

    for (let k = 1; k <= 2 && low - k >= 0; k++) { const c = build(low - k); if (rootPos(c)) return c; }

  if (low > 0 && rootPos(base)) {

    const first = pos && pos.hi > frets ? pos.hi - frets : 0;
    for (let s = 0; s < 6; s++) for (let f = first ? first + 1 : 0; f <= first + frets; f++) {
      const midi = gm(s, f), x = info.get(pcOf(midi));
      if (!x) continue;
      if (pos && !inPos.has(s + ":" + f)) { if (f > 0) ghosts.push({ s, f, root: x.root }); continue; }
      // 音階沒有「不彈」這回事:空弦不在音階裡就什麼都不標,在的話畫成 ○
      if (f === 0) markers[s] = { type: "open", midi, root: x.root, text: lab(x) };
      else dots.push({ s, f, midi, root: x.root, text: lab(x) });

  const b = bassInfo();
  if (b && !info.has(b.pc)) info.set(b.pc, { name: b.name, tok: b.tok, root: false });
  const v = currentVoicing();
  if (!v) return { frets, dots, ghosts, markers: markers.map(() => ({ type: "mute" })) };
  frets = Math.min(GTR_FRETS, Math.max(12, Math.max(...v.frets) + 1));
  gtrMarkers(v.frets).forEach((mk, s) => {
    const f = v.frets[s], midi = gm(s, f);
    if (mk === "mute") { markers[s] = { type: "mute" }; return; }
    const x = info.get(pcOf(midi));
    if (mk === "open") markers[s] = { type: "open", midi, root: x.root, text: lab(x) };
    else dots.push({ s, f, midi, root: x.root, text: lab(x) });

  for (let s = 0; s < 6; s++) for (let f = 1; f <= frets; f++) {
    if (f === v.frets[s]) continue;
    const pc = pcOf(gm(s, f));
    const x = info.get(pc);
    if (x && !(b && !b.chordTone && pc === b.pc)) ghosts.push({ s, f, root: x.root });

  return { frets, dots, ghosts, markers, barre };
}

function fretboardLayout(w, h, nFrets, first = 0){
  const numH = Math.max(12, Math.min(16, h * 0.11));   // 最下面一條寫格數
  const colW = Math.max(20, Math.min(30, h * 0.2));    // 琴頸左邊的 ○/× 欄
  const nutX = colW + 5, right = w - 6;
  const top = Math.round(h * 0.05) + 2, bottom = h - numH - 2;
  const sp = (bottom - top) / 6;
  return {
    numH, colW, nutX, right, top, bottom, sp, frets: nFrets, first,
    fretW: (right - nutX) / nFrets,
    // 橫著看的指板:1 弦(高音 E)在最上面、6 弦(低音 E)在最下面,跟六線譜同一個方向
    yOf: s => top + sp * (5 - s + 0.5),

    xOf(f){ return f === 0 && !first ? colW / 2 + 2 : nutX + (f - first - 0.5) * this.fretW; }

function drawFretboard(ctx, w, h, gv){

  const cs = getComputedStyle(document.body);

  const wood = ctx.createLinearGradient(0, top, 0, bottom);

    const x1 = gv.window.lo <= first ? nutX : nutX + (gv.window.lo - 1 - first) * L.fretW, x2 = nutX + (gv.window.hi - first) * L.fretW;
    ctx.fillStyle = "rgba(242,185,75,0.13)";

  // 把位記號(3/5/7/9/15 單點、12 雙點)

  const midY = (top + bottom) / 2;
  const inView = f => f > first && f <= last;
  for (const f of [3, 5, 7, 9, 15, 17, 19, 21]) if (inView(f)) { dot(L.xOf(f), midY, sp * 0.18); ctx.fill(); }
  for (const f of [12, 24]) if (inView(f)) for (const y of [top + sp * 1.5, bottom - sp * 1.5]) { dot(L.xOf(f), y, sp * 0.18); ctx.fill(); }

  ctx.strokeStyle = "#8E877A"; ctx.lineWidth = 1.5;

      ctx.shadowBlur = 4 + 10 * decay;

  // 平移時第一格不一定是上面那些數字,左下角補標起始格數,才知道現在在哪
  if (first && ![1, 3, 5, 7, 9, 12, 15, 17, 19, 21].includes(first + 1)) ctx.fillText(String(first + 1), L.xOf(first + 1), bottom + L.numH / 2 + 1);

  // 音點稍大一點(0.44 → 0.47 倍弦距,相鄰兩弦的點仍不相碰),點裡的音名才放得下 10~11px(原本 7~8px,連桌機都小)

  };
  // 其他位置的組成音:小、淡、不寫字
  for (const g of gv.ghosts) {
    ctx.fillStyle = g.root ? "rgba(242,185,75,0.30)" : "rgba(63,191,174,0.30)";
    dot(L.xOf(g.f), L.yOf(g.s), r * 0.34); ctx.fill();
  }
  // 橫按的直排:畫在音點底下,音點(根音金色、其他青色)照樣疊在上面標出每條弦是什麼音
  if (gv.barre) {
    const x = L.xOf(gv.barre.f), y1 = L.yOf(gv.barre.hi), y2 = L.yOf(gv.barre.lo);
    const bw = r * 1.5;
    ctx.fillStyle = "rgba(232,220,192,0.88)";
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x - bw / 2, y1 - bw / 2, bw, y2 - y1 + bw, bw / 2);
    else ctx.rect(x - bw / 2, y1 - bw / 2, bw, y2 - y1 + bw);
    ctx.fill();
  }
  // 按弦的音
  for (const d of gv.dots) {
    const x = L.xOf(d.f), y = L.yOf(d.s), attack = isSounding(d.midi);
    ctx.save();
    ctx.shadowColor = d.root ? "rgba(242,185,75,0.85)" : "rgba(63,191,174,0.85)";
    ctx.shadowBlur = attack ? 18 : 6;
    ctx.fillStyle = d.root ? (attack ? "#FFE39A" : "#F2B94B") : (attack ? "#8FFFF0" : "#3FBFAE");
    dot(x, y, r); ctx.fill();

    }
  }
  // 琴頸左邊那一欄:空弦畫空心圈(○)、不彈畫叉(×)
  for (let s = 0; s < 6; s++) {
    const mk = gv.markers[s];
    if (!mk) continue;
    const x = L.xOf(0), y = L.yOf(s), rr = Math.min(r, L.colW * 0.42);
    if (mk.type === "mute") {

      dot(x, y, rr - 1); ctx.stroke();
      if (mk.text) {
        fitText(mk.text, rr * 1.8, Math.max(8, rr * 1.1));   // 空弦圈裡的音名跟按弦的音點同一套比例(原本只有 7px)
        ctx.fillStyle = col;
        ctx.fillText(mk.text, x, y + 0.5);
      }
    }
  }
  return L;
}
/* 弦的振動動畫:記下每條弦最後一次被撥的時間與按住的格數,畫的時候依經過時間算振幅 */

function fretAt(px, py){
  const L = $("keyboardCanvas")._fb;
  if (!L) return null;
  if (STATE.lefty) px = $("keyboardCanvas")._cssW - px;   // 左手吉他是鏡像畫的
  const s = Math.max(0, Math.min(5, 5 - Math.floor((py - L.top) / L.sp)));
  if (px < L.nutX - 2 && L.first) return null;   // 平移時左邊那一欄不是空弦

// 摘要列的「放不下就拿掉副標/縮字」是照當下寬度算的:轉向、改視窗大小之後要重算(不重算的話窄→寬會留著縮小的字,寬→窄會被切)

window.addEventListener("orientationchange", () => { requestAnimationFrame(refreshIfSizeChanged); setTimeout(refreshIfSizeChanged, 350); });

    // 殘響的脈衝響應要逐一算 20 萬個取樣,手機上超過 100ms,而且剛好卡在使用者第一次碰畫面的那一下。
    // 閒下來再算:殘響晚零點幾秒接上,第一下點擊不會頓
    (window.requestIdleCallback ? cb => requestIdleCallback(cb, { timeout: 300 }) : cb => setTimeout(cb, 50))(
      () => { reverbConvolver.buffer = buildImpulseResponse(2.1, 2.4); });
    reverbWet = audioCtx.createGain();
    reverbWet.gain.value = 0.18;
    reverbBus.connect(reverbPreDelay);
    reverbPreDelay.connect(reverbConvolver);
    reverbConvolver.connect(reverbWet);
    reverbWet.connect(masterGain);
  }
  // iOS 被電話、Siri、鬧鐘打斷後狀態是非標準的 "interrupted",不只 "suspended":不是 running 就叫醒
  if (audioCtx.state !== "running") { const r = audioCtx.resume(); if (r && r.catch) r.catch(() => {}); }
  loadPianoSamples();
  if (STATE.inst === "guitar") loadGuitarSamples(STATE.gtrTone);
}

/* ── 真實樂器取樣 ─────────────────────────────
   PIANO_BASE 是 Tone.js 官方託管的完整版 Salamander 鋼琴取樣,音質/延音都比一般鏡像版本好。
   exactList 是這個取樣庫實際收錄的每一個(音名,八度),逐一驗證過才收錄,

const PIANO_BASE = "https://tonejs.github.io/audio/salamander/";

const PIANO_SAMPLES = [
  ["A",0],
  ["C",1],["Ds",1],["Fs",1],["A",1],
  ["C",2],["Ds",2],["Fs",2],["A",2],
  ["C",3],["Ds",3],["Fs",3],["A",3],
  ["C",4],["Ds",4],["Fs",4],["A",4],
  ["C",5],["Ds",5],["Fs",5],["A",5],
  ["C",6],["Ds",6],["Fs",6],["A",6],
  ["C",7],["Ds",7],["Fs",7],["A",7],
  ["C",8]
];
let pianoBuffers = null, pianoLoading = null;
let audioStatusKey = ""; // 記住目前顯示的是哪一句(用 key,不是譯好的字串),換語言時才補得回來
function setAudioStatus(key){
  audioStatusKey = key || "";

  const offInst = /^(loadingGuitar|guitarLoadFailed)$/.test(audioStatusKey) && STATE.inst !== "guitar";
  const txt = key && !offInst ? t(key) : "";

}
/* 取樣的抓取:有 Cache API 就把抓到的 mp3 存起來,下次(包括沒網路時)直接從快取拿,不用每次重抓 70 個檔案。
   快取名稱帶版本號,改了 PIANO_SAMPLES / GUITAR_SETS 的網址要把 v1 往上加。沒有 Cache API(file://、部分 WebView)就照舊直接抓 */

function sampleFetch(url){
  const net = () => fetch(url).then(r => { if (!r.ok) throw new Error("404"); return r; });
  if (!window.caches || !caches.open) return net().then(r => r.arrayBuffer());
  return caches.open(SAMPLE_CACHE).then(c => c.match(url).then(hit => hit ||
    net().then(r => { c.put(url, r.clone()).catch(() => {}); return r; })))
    .catch(() => net())
    .then(r => r.arrayBuffer());
}
/* 一個都沒抓到(第一次開就沒網路)時不要永遠卡在合成音色:記下失敗時間,15 秒後再碰畫面、或網路恢復時重抓。
   「載入中…」只在第一次顯示,離線時每點一下就閃一次提示很煩 */
const sampleFail = { piano: 0 };
let sampleTried = { piano: false };
window.addEventListener("online", () => {
  for (const k in sampleFail) sampleFail[k] = 0;
  if (audioCtx) { loadPianoSamples(); if (STATE.inst === "guitar") loadGuitarSamples(STATE.gtrTone); }
});
function loadPianoSamples(){
  if (pianoBuffers || pianoLoading) return pianoLoading || Promise.resolve();
  if (sampleFail.piano && Date.now() - sampleFail.piano < 15000) return Promise.resolve();
  const list = [], jobs = [];
  for (const [letter, oct] of PIANO_SAMPLES) {
    const midi = (oct + 1) * 12 + NOTE_SEMITONE[letter];
    const url = PIANO_BASE + letter + oct + ".mp3";
    jobs.push(
      sampleFetch(url)
        .then(arr => audioCtx.decodeAudioData(arr))
        .then(buf => {
          // mp3 解碼後開頭常留一小段空白(編碼器延遲),和弦每個音都晚這麼多才出聲。跟吉他一樣裁到起音前 5ms
          const x = buf.getChannelData(0);
          let peak = 0; for (let i = 0; i < x.length; i++) peak = Math.max(peak, Math.abs(x[i]));
          let on = 0; while (on < x.length && Math.abs(x[on]) < peak * 0.1) on++;
          list.push({ midi, buffer: buf, offset: Math.min(0.12, Math.max(0, on / buf.sampleRate - 0.005)) });
        })
        .catch(() => {}) // 該取樣缺失就跳過,不影響其他音符
    );
  }
  const first = !sampleTried.piano; sampleTried.piano = true;
  if (first) setAudioStatus("loadingPiano");
  pianoLoading = Promise.all(jobs).then(() => {
    if (list.length) { pianoBuffers = list; sampleFail.piano = 0; if (audioStatusKey === "loadingPiano") setAudioStatus(""); return; }
    pianoLoading = null; sampleFail.piano = Date.now();   // 留給下一次重抓
    if (first) { setAudioStatus("pianoLoadFailed"); setTimeout(() => { if (audioStatusKey === "pianoLoadFailed") setAudioStatus(""); }, 4000); }
  });

}
/* ── 吉他取樣 ─────────────────────────────
   三套都是 tonejs-instruments 的真實錄音(MIT),從 npm 套件經 jsDelivr 取用,版本釘死。
   檔名清單是照發佈的套件內容逐一列出的,不是套公式;
   古典吉他的 D5.mp3 實測音高差了 100 cents(其實是別的音),刻意排除,由相鄰的取樣變速補上。
   實測比較(峰值都在 -3 dBFS、沒有削波):
     民謠吉他  37 檔、每個半音都有錄音(不必變速),尾端雜訊 -105 dBFS,音準全部在 ±15 cents 內 ← 預設
     古典吉他  29 檔、最大間距 3 半音,尾端雜訊 -51 dBFS(錄音在還沒衰減完時就被截掉)

const GUITAR_SETS = {
  acoustic: { base: "https://cdn.jsdelivr.net/npm/tonejs-instrument-guitar-acoustic-mp3@1.1.2/", files: "A2 A3 A4 As2 As3 As4 B2 B3 B4 C3 C4 C5 Cs3 Cs4 Cs5 D2 D3 D4 D5 Ds2 Ds3 Ds4 E2 E3 E4 F2 F3 F4 Fs2 Fs3 Fs4 G2 G3 G4 Gs2 Gs3 Gs4" },
  nylon:    { base: "https://cdn.jsdelivr.net/npm/tonejs-instrument-guitar-nylon-mp3@1.1.1/",    files: "A2 A3 A4 A5 As5 B1 B2 B3 B4 Cs3 Cs4 Cs5 D2 D3 Ds4 E2 E3 E4 E5 Fs2 Fs3 Fs4 Fs5 G3 G5 Gs2 Gs4 Gs5" },
  electric: { base: "https://cdn.jsdelivr.net/npm/tonejs-instrument-guitar-electric-mp3@1.1.1/", files: "A2 A3 A4 A5 C3 C4 C5 C6 Cs2 Ds3 Ds4 Ds5 E2 Fs2 Fs3 Fs4 Fs5" }

const guitarBuffers = {}, guitarLoading = {};
function loadGuitarSamples(kind){
  const set = GUITAR_SETS[kind];

  if (sampleFail[kind] && Date.now() - sampleFail[kind] < 15000) return;
  const list = [];
  const jobs = set.files.split(" ").map(name => {
    const m = name.match(/^([A-G]s?)(\d)$/);
    const midi = (+m[2] + 1) * 12 + NOTE_SEMITONE[m[1]];
    return sampleFetch(set.base + name + ".mp3")
      .then(arr => audioCtx.decodeAudioData(arr))
      .then(buf => {
        // 這幾套錄音在撥弦前有 30~70ms 的空白,刷弦時每條弦只差幾十 ms,不裁掉的話節奏會糊。
        // 找第一個超過峰值 10% 的點,往前留 5ms 當起點
        const x = buf.getChannelData(0);
        let peak = 0; for (let i = 0; i < x.length; i++) peak = Math.max(peak, Math.abs(x[i]));
        let on = 0; while (on < x.length && Math.abs(x[on]) < peak * 0.1) on++;

      })
      .catch(() => {});
  });
  const first = !sampleTried[kind]; sampleTried[kind] = true;
  if (first) setAudioStatus("loadingGuitar");
  guitarLoading[kind] = Promise.all(jobs).then(() => {
    if (list.length) { guitarBuffers[kind] = list; sampleFail[kind] = 0; if (audioStatusKey === "loadingGuitar") setAudioStatus(""); return; }
    guitarLoading[kind] = null; sampleFail[kind] = Date.now();
    if (first) { setAudioStatus("guitarLoadFailed"); setTimeout(() => { if (audioStatusKey === "guitarLoadFailed") setAudioStatus(""); }, 4000); }
  });

/* 吉他的弦撥下去之後就自己衰減,不像鋼琴需要人為的衰減曲線;只在音符結束時收尾 */
function playSampledGuitar(midi, when, dur){
  const list = guitarBuffers[STATE.gtrTone];
  if (!list || !list.length) return false;
  const best = nearestSample(list, midi);
  const rate = Math.pow(2, (midi - best.midi) / 12);
  const src = audioCtx.createBufferSource();
  src.buffer = best.buffer;
  src.playbackRate.setValueAtTime(rate, when);
  const g = audioCtx.createGain();
  const peakGain = 0.6, tail = 0.3;
  const sustain = Math.max(dur, 0.1);
  g.gain.setValueAtTime(peakGain, when);
  g.gain.setValueAtTime(peakGain, when + sustain);
  g.gain.exponentialRampToValueAtTime(0.0001, when + sustain + tail);
  src.connect(g);
  connectOut(g, midi);
  src.start(when, best.offset);
  src.stop(when + sustain + tail + 0.1);
  src._g = g; src._end = when + sustain + tail + 0.1;
  scheduledNodes.push(src);
  return true;
}
/* 找最接近的取樣,用 playbackRate 補足音高差(標準取樣器做法) */
function nearestSample(list, targetMidi){
  let best = list[0], bestDist = Infinity;
  for (const s of list) {
    const dist = Math.abs(s.midi - targetMidi);
    if (dist < bestDist) { bestDist = dist; best = s; }
  }
  return best;
}
/* 取樣播放。chordAnchors:同一個和弦裡,同音名(差整數個八度)的音優先共用同一份錄音,
   讓八度關係更精確;但如果共用會讓變速幅度過大(音色明顯失真),就改用各自最近的錄音 */
function playSampledPiano(midi, when, dur, chordAnchors){
  const list = pianoBuffers;
  if (!list || !list.length) return false;
  const pitchClass = ((midi % 12) + 12) % 12;
  const SHARE_SHIFT_LIMIT = 4; // 半音,超過這個幅度共用弊大於利
  let best;
  if (chordAnchors && chordAnchors[pitchClass] && Math.abs(midi - chordAnchors[pitchClass].midi) <= SHARE_SHIFT_LIMIT) {
    best = chordAnchors[pitchClass];
  } else {
    best = nearestSample(list, midi);
    if (chordAnchors && !chordAnchors[pitchClass]) chordAnchors[pitchClass] = best;
  }
  const rate = Math.pow(2, (midi - best.midi) / 12);
  const src = audioCtx.createBufferSource();
  src.buffer = best.buffer;
  src.playbackRate.setValueAtTime(rate, when);
  const g = audioCtx.createGain();
  const peakGain = 0.6, tail = 0.4;
  const sustain = Math.max(dur, 0.1);
  // 取樣本身錄音長度可能比需要的延音短,加上尾段循環撐住聲音
  const neededSec = (sustain + tail) * rate;
  const bufDur = best.buffer.duration;
  if (bufDur < neededSec && bufDur > 0.3) {
    src.loop = true;
    const loopLen = Math.min(0.6, bufDur * 0.3);
    src.loopStart = Math.max(0, bufDur - loopLen);
    src.loopEnd = bufDur;
  }
  g.gain.setValueAtTime(peakGain, when);
  /* 鋼琴弦被敲下去之後就一路自然衰減,而且衰減速度必須是「每秒固定比例」,
     不是「不管多長都在音符結束時剛好衰減到某個比例」——後者短音掉得快、長音掉得慢,
     同一台鋼琴上不該有這種差異。這裡用固定時間常數 DECAY_TAU */
  const DECAY_TAU = 2.2; // 秒:約每 2.2 秒衰減到 37%,接近真實鋼琴中音域的衰減速度
  const decayEnd = Math.max(when + Math.max(sustain, 0.02), when + 0.005);
  const endLevel = Math.max(0.06, Math.exp(-(decayEnd - when) / DECAY_TAU));
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peakGain * endLevel), decayEnd);
  g.gain.exponentialRampToValueAtTime(0.0001, decayEnd + tail);
  src.connect(g);
  connectOut(g, midi);
  src.start(when, best.offset || 0);
  src.stop(when + sustain + tail + 0.1);
  src._g = g; src._end = when + sustain + tail + 0.1;
  scheduledNodes.push(src);
  return true;
}
/* 聲像 + 殘響送出:鋼琴依音高擺左右(低音左、高音右),取樣與合成兩條路徑共用同一個出口,
   否則取樣載入前後的空間感會突然改變 */
function connectOut(node, midi){
  const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
  const out = panner || node;
  if (panner) { panner.pan.value = pianoPanFor(midi); node.connect(panner); }
  out.connect(masterGain);
  if (reverbBus) {
    const send = audioCtx.createGain();
    send.gain.value = 0.5;
    out.connect(send); send.connect(reverbBus);
  }
}
/* 對外的統一入口:有取樣就用取樣,沒有就用合成音色備援 */
function scheduleNote(midi, when, dur, chordAnchors){
  // 吉他模式:吉他取樣優先;還沒載好或抓不到時退回鋼琴取樣,再退回合成音色
  if (STATE.inst === "guitar" && playSampledGuitar(midi, when, dur)) return;
  if (playSampledPiano(midi, when, dur, chordAnchors)) return;
  schedulePiano(midi, when, dur);
}
/* 真實鋼琴的低音弦在左、高音弦在右(以演奏者的視角) */
function pianoPanFor(midi){
  const t = Math.max(0, Math.min(1, (midi - 21) / 87));
  return (t - 0.5) * 0.64;
}
function schedulePiano(midi, when, dur){
  const freq = midiToFreq(midi);
  const osc = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const lp = audioCtx.createBiquadFilter();
  osc.type = "triangle"; osc.frequency.value = freq;
  osc2.type = "sine";    osc2.frequency.value = freq * 2; // 一點泛音
  lp.type = "lowpass";   lp.frequency.value = Math.min(freq * 6, 8000);
  const g2 = audioCtx.createGain(); g2.gain.value = 0.18;
  const peak = 0.32;
  const sustain = Math.max(dur * 0.9, 0.08), releaseTail = 0.35;
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(peak, when + 0.012);
  // 鋼琴弦是持續自然衰減,而且衰減速度是每秒固定比例(短音長音都一樣)
  const decayEnd = when + Math.max(sustain, 0.02);
  const endLevel = Math.max(0.06, Math.exp(-(decayEnd - when) / 2.2));
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak * endLevel), decayEnd);
  g.gain.exponentialRampToValueAtTime(0.0001, decayEnd + releaseTail);
  osc.connect(lp); osc2.connect(g2); g2.connect(lp);
  lp.connect(g);
  connectOut(g, midi); // 與取樣路徑共用同一個出口(聲像 + 殘響)
  osc.start(when); osc2.start(when);
  const stopAt = when + sustain + releaseTail + 0.05;
  osc.stop(stopAt); osc2.stop(stopAt);
  osc._g = osc2._g = g; osc._end = osc2._end = stopAt;
  scheduledNodes.push(osc, osc2);
}
/* 停掉一個音:不要直接 stop()——正在響的波形瞬間被切斷會「喀」一聲,連續點和弦時很明顯。
   先用 12ms 的時間常數把音量收掉,再停。t 是音訊時鐘上的時間(練習的換和弦排在下一拍) */
function fadeStop(n, t){
  const g = n._g;
  try {
    if (g) {
      const p = g.gain;
      if (p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t);
      else if (t <= audioCtx.currentTime + 0.005) { p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); }
      else { n.stop(t); return; }        // 舊瀏覽器沒辦法在未來的時間點保住包絡,照舊在那一刻停
      p.setTargetAtTime(0, t, 0.012);
      n.stop(t + 0.1);
    } else n.stop(t);
  } catch (e) {}
}
function stopAllSound(){
  if (audioCtx) { const t = audioCtx.currentTime; for (const n of scheduledNodes) fadeStop(n, t); }
  scheduledNodes = [];
  soundingWindows = [];
}

/* 播放中的視覺高亮:記下每個音的發聲區間,rAF 期間比對現在時間 */
let soundingWindows = [];   // [{midi, from, to}] 以 audioCtx.currentTime 為基準
let animId = 0;
function startHighlightLoop(untilTime){
  cancelAnimationFrame(animId);
  const step = () => {
    drawKeyboardLive();
    if (audioCtx && heardTime() < untilTime) animId = requestAnimationFrame(step);
    else { soundingWindows = []; drawKeyboardLive(); }
  };

}
/* 使用者「聽到」的時刻:currentTime 只是排程時鐘,喇叭/藍牙耳機實際出聲還要再晚 outputLatency。

function heardTime(){
  const lat = (audioCtx.outputLatency || 0) + (audioCtx.baseLatency || 0);
  return audioCtx.currentTime - Math.min(lat, 0.6);

  if (!audioCtx || !soundingWindows.length) return false;

/* at:指定在音訊時鐘的哪一刻開始(練習的節拍器用,跟點擊聲同一個時鐘)。
   有指定時,前一個和弦不是立刻切掉,而是排在新和弦開始的那一刻停 */
/* 吉他刷和弦弦與弦的間隔(秒)。原本 35ms 聽起來像一次壓下去,使用者要求刷慢一點;和弦圖上弦亮起的節奏用同一個值 */
const GTR_STRUM_GAP = 0.06;

    // 吉他音階:每個音只響到下一個音的 1.6 倍間隔(使用者回報:原本每個音 2.6 秒,十幾個音疊在一起糊掉);
    // 最後一個音留長一點收尾。鋼琴音階、和弦琶音照舊
    const short = STATE.inst === "guitar" && STATE.tab === "scale";
    seq = midis.map((m, i) => ({ midi: m, at: t0 + i * gap, dur: short ? (i === midis.length - 1 ? 1.2 : gap * 1.6) : 2.6 - i * gap * 0.2 }));

    const gap = 0.30;
    const up = midis.slice();
    const down = downMidis || midis.slice(0, -1).reverse();
    seq = up.concat(down).map((m, i) => ({ midi: m, at: t0 + i * gap, dur: gap * 1.6 }));
  }
  let end = t0;
  const chordAnchors = {}; // 同一次播放裡,同音名的音共用同一份錄音,八度關係才精確
  for (const n of seq) {
    const k = scheduledNodes.length;
    scheduleNote(n.midi, n.at, n.dur, chordAnchors);
    for (let i = k; i < scheduledNodes.length; i++) scheduledNodes[i]._at = n.at;
    soundingWindows.push({ midi: n.midi, from: n.at, to: n.at + Math.min(n.dur, 0.55) });
    end = Math.max(end, n.at + n.dur);
  }
  startHighlightLoop(end + 0.3);
}
function playSingle(midi){
  ensureAudio();
  const at = audioCtx.currentTime + 0.02;
  // 單音不會清掉之前的紀錄(playNotes 才會),連點辨識、滑過和弦圖時兩個陣列會一直長大:把早就結束的丟掉
  soundingWindows = soundingWindows.filter(w => w.to > at - 1);
  scheduledNodes = scheduledNodes.filter(n => !(n._end < at - 0.5));
  scheduleNote(midi, at, 1.4, null);
  soundingWindows.push({ midi, from: at, to: at + 0.4 });
  startHighlightLoop(at + 0.7);
}

const chordById = id => CHORDS.find(c => c.id === id);

STATE.group.scale = scaleById(STATE.scaleId).g;

function rootPc(){ return ((LETTER_PC[STATE.letter] + STATE.acc) % 12 + 12) % 12; }
/* 理論調:調號超過 7 個升降的調(G♯ 大調、F♭ 大調、D♭ 小調…),照級數拼會冒出重升/重降,實務上改用等音根音。
   拼法照舊(字母照級數推),只在音階頁提示並給一顆換根音的鈕。看的是「同主音大調或小調」的調號
   (音階有 ♭3 就看小調,否則看大調),所以 C♯ 大調(E♯ B♯)、C♭ 大調、A♯ 小調這些真實存在的調不提示,
   G♯ 和聲小調的 F♯♯(導音)也不會被誤判 */
const KEY_REF = { maj: ["1","2","3","4","5","6","7"], min: ["1","2","♭3","4","5","♭6","♭7"] };
function keySignature(letter, acc, def){
  const ref = def.t.some(tok => tokenSemi(tok) === 3 && parseToken(tok).deg === 3) ? KEY_REF.min : KEY_REF.maj;
  return ref.reduce((n, tok) => n + spell(letter, acc, tok).acc, 0);
}
function theoreticalAlt(def, letter, acc){
  if (!acc || !def) return null;
  const sig = Math.abs(keySignature(letter, acc, def));
  if (sig <= 7) return null;
  const L2 = (letter + (acc > 0 ? 1 : 6)) % 7;
  const a2 = ((LETTER_PC[letter] + acc - LETTER_PC[L2]) % 12 + 18) % 12 - 6;
  if (Math.abs(a2) > 1 || Math.abs(keySignature(L2, a2, def)) >= sig) return null;
  return { letter: L2, acc: a2 };
}
// 吉他的根音固定放在第三八度(C3 = MIDI 48),落在指板的中低音域;起始八度只管鋼琴
function rootMidi(){ return 12 * ((STATE.inst === "guitar" ? 3 : STATE.octave) + 1) + LETTER_PC[STATE.letter] + STATE.acc; }

/* 目前選擇 → 音的清單(含正規拼寫與實際 MIDI) */
function currentNotes(){
  const def = STATE.tab === "scale" ? scaleById(STATE.scaleId) : chordById(STATE.chordId);
  if (!def) return [];
  const base = rootMidi();
  return def.t.map(tok => {
    const s = spell(STATE.letter, STATE.acc, tok);
    return Object.assign({}, s, { midi: base + s.semi });
  });
}
/* 音階要多畫一顆高八度的主音,才看得出「一圈」的形狀。
   這一份是「讀出來給人看/拿去播放」的音,音階固定一個八度就好 */
let VOICED = null;   // 練習「就近轉位」時 withStep 放進來的排法(鋼琴);其他時候一律 null
function displayNotes(){
  if (VOICED) return VOICED.map(n => Object.assign({}, n));
  const notes = currentNotes();
  /* 斜線和弦(鋼琴):低音放在和弦下面一個八度內,C/B 就是 B2 + C3 E3 G3。
     吉他的低音由指法決定,不走這裡 */
  const b = STATE.inst === "piano" ? bassInfo() : null;
  /* 低音是和弦內音(C/E、C7/B♭)= 轉位:照名稱彈真正的轉位,低音以下的音往上移一個八度
     (C/E = E G C),不是在原位和弦底下再多加一個 E。沒有斜線就是原位(使用者要求:照輸入的名稱) */
  if (b && b.chordTone && notes.length) {
    const bm = notes.find(n => pcOf(n.midi) === b.pc).midi;
    return notes.map(n => n.midi < bm ? Object.assign({}, n, { midi: n.midi + 12 }) : n)
                .sort((x, y) => x.midi - y.midi)
                .map(n => n.midi === bm ? Object.assign({}, n, { isBass: true }) : n);
  }
  if (b && notes.length) {
    const sp = spell(STATE.letter, STATE.acc, b.tok);
    notes.unshift(Object.assign({}, sp, { midi: rootMidi() + b.iv - 12, isBass: true }));
  }
  if (STATE.tab === "scale" && notes.length) {
    const first = notes[0];
    notes.push(Object.assign({}, first, { midi: first.midi + 12, octaveTop: true }));
  }
  return notes;
}
/* 鋼琴音階只顯示一個八度(使用者要求)。照抄自 ScrollScore 的 rebuildKeyboardRange 規定至少兩個八度,
   那段不能改,所以在它後面再疊一層:把音域收成「主音下方最近的 C 或 F」到「高八度主音」
   (從 C 或 F 開始,黑鍵分組才完整,跟練習的小鍵盤同一條規則);最後一個音是黑鍵就多補到下一個白鍵 */
function scaleOctaveRange(midis){
  if (!midis.length) return;
  let lo = Math.min(...midis), hi = Math.max(...midis);
  while (![0, 5].includes(pcOf(lo))) lo--;
  while (isBlackKey(hi)) hi++;
  KB_LOW = lo; KB_HIGH = hi;
  KB_WHITE_KEYS = [];
  for (let m = KB_LOW; m <= KB_HIGH; m++) if (!isBlackKey(m)) KB_WHITE_KEYS.push(m);
  KB_WHITE_IDX = {};
  KB_WHITE_KEYS.forEach((m, i) => KB_WHITE_IDX[m] = i);
}
/* 這一份是畫在鍵盤上的音。和弦畫的是一個具體的排列;音階只畫**一個八度**(主音到高八度的主音),
   跟課本一樣(使用者要求:原本畫兩個八度,重複一次反而亂、鍵也變小) */
function keyboardNotes(){
  return displayNotes();
}
/* 交給 drawKeyboard 的 activeMap,以及標籤用的 labelMap */
function currentView(){
  const activeMap = new Map(), labelMap = new Map();
  if (STATE.tab === "find") {
    const an = findAnalysis();
    const bass = an.sel[0];
    for (const m of an.sel) {
      const pc = ((m % 12) + 12) % 12;
      activeMap.set(m, { staff: m === bass ? 1 : 2, attack: isSounding(m) });
      labelMap.set(m, { text: keyLabelText(an.nameByPc.get(pc), an.tokByPc.get(pc)), strong: true });
    }
  } else {
    for (const n of keyboardNotes()) {
      const isRoot = n.deg === 1;
      activeMap.set(n.midi, { staff: isRoot ? 1 : 2, attack: isSounding(n.midi) });
      labelMap.set(n.midi, { text: keyLabelText(n.name, n.tok), strong: true });
    }
  }
  // 沒被選到的 C 也淡淡標一下,才知道現在看的是哪個八度。
  // 從音域裡第一個 C 開始:音階分頁的鋼琴從 C 或 F 起(scaleOctaveRange),從 KB_LOW 直接每 12 跳的話
  // 會標在 F 上、八度數變成 4.4166…(使用者回報「奇怪的數字」)
  for (let m = KB_LOW + (12 - pcOf(KB_LOW)) % 12; m <= KB_HIGH; m += 12) {
    if (!labelMap.has(m)) labelMap.set(m, { text: STATE.label === "deg" ? "" : keyLabelText("C", null) + (m / 12 - 1), strong: false });
  }
  return { activeMap, labelMap };
}
function keyLabelText(name, tok){
  if (STATE.label === "do") return toSolfege(name);
  if (STATE.label === "deg") return tok || "";
  return name;
}

const ACC_BTNS = [[-1, "accFlat", "♭"], [1, "accSharp", "♯"]];
/* 根音卡片的「/」:斜線模式只對按下去當時的那個和弦有效,換了和弦或分頁就自動失效 */
function rootSlashState(){
  const sl = STATE.slash;
  return sl && STATE.tab === "chord" && sl.for === STATE.chordId ? sl : null;
}
/* 和弦分頁換根音(C → D、加升降記號)的瞬間就發出新和弦的聲音,跟點和弦名稱一樣 */
// 音階分頁換根音也一樣:馬上播上行音階(跟點鍵盤/指板一樣),不用再點上面的顯示區(使用者要求)
function playAfterRootChange(){ if (STATE.tab === "chord") playCurrent(); else if (STATE.tab === "scale") playScaleUp(); }
function rootLetter(i){
  const sl = rootSlashState();
  // 「/」之後的第一個字母是低音;選好之後再按字母就是換根音(離開斜線模式)
  if (sl && sl.letter < 0) { STATE.slash = Object.assign({}, sl, { letter: i, acc: 0 }); rootSetBass(); }
  // 換根音 = 換一個和弦,低音回到原位。原本低音「跟著根音走」(C/E 按 G 變 G/B),
  // 跟用 / 自己打低音互相矛盾:想從 C/E 換到 G 卻得到 G/B(使用者回報切換變不方便)
  else { STATE.slash = null; STATE.letter = i; STATE.acc = 0; STATE.bassIv = null; render(); playAfterRootChange(); }
}
function rootAcc(v){
  const sl = rootSlashState();
  if (sl) {
    if (sl.letter < 0) return;
    STATE.slash = Object.assign({}, sl, { acc: sl.acc === v ? 0 : v }); rootSetBass();
  } else { STATE.acc = STATE.acc === v ? 0 : v; STATE.bassIv = null; render(); playAfterRootChange(); }
}
function rootSlash(){
  const sl = rootSlashState();
  STATE.slash = sl && sl.letter < 0 ? null : { letter: -1, acc: 0, for: STATE.chordId };
  render();
}
function rootSetBass(){
  const sl = STATE.slash;
  const iv = pcOf(LETTER_PC[sl.letter] + sl.acc - rootPc());
  setBass(iv === 0 ? null : iv);   // 低音 = 根音就是原位
}
function buildRootPicker(){
  const sl = rootSlashState(), bi = bassInfo();
  const bassLetter = bi ? LETTERS.indexOf(bi.name[0]) : -1;
  const lr = $("letterRow");
  lr.innerHTML = "";
  LETTERS.forEach((L, i) => {
    const b = document.createElement("button");
    b.className = "key-btn";
    b.textContent = L;
    // 根音一直是金色;低音(斜線和弦)另外用青色框標出來,不搶根音的位置
    b.setAttribute("aria-pressed", String(i === STATE.letter));
    if (bi && bassLetter === i) b.classList.add("bass");
    b.onclick = () => rootLetter(i);   // 按字母 = 還原成本位音,不用另外按 ♮
    lr.appendChild(b);
  });
  const ar = $("accRow");
  ar.innerHTML = "";
  ar.classList.toggle("two", STATE.tab !== "chord");
  // 跟字母排在同一列,只放記號本身;「降/升」的字放進 aria-label 與 title。
  // 沒有 ♮:按字母就是本位音,♭ ♯ 是開關(再按一次取消),還原記號只是多一顆要按的鈕
  ACC_BTNS.forEach(([v, key, sym]) => {
    const b = document.createElement("button");
    b.className = "key-btn acc";
    b.textContent = sym;
    b.setAttribute("aria-label", t(key));
    b.title = t(key);
    // 剛用 / 選好低音時,♭ ♯ 改的是低音,亮的也是低音的記號(青色)
    const bassMode = sl && sl.letter >= 0;
    const on = v === (bassMode ? sl.acc : STATE.acc);
    b.setAttribute("aria-pressed", String(on));
    if (bassMode && on) b.classList.add("bass");   // 只有真的選中的那顆亮青色,沒選的維持原樣(不然滿版都是綠框)
    b.onclick = () => rootAcc(v);
    ar.appendChild(b);
  });
  // 和弦分頁多一顆「/」:按了之後下一個字母(+ ♭ ♯)是低音,跟練習輸入板同一套
  if (STATE.tab === "chord") {
    const b = document.createElement("button");
    b.className = "key-btn acc slash"; b.id = "rootSlash"; b.textContent = "/";
    b.setAttribute("aria-label", t("rootSlash")); b.title = t("rootSlash");
    b.setAttribute("aria-pressed", String(!!sl));
    b.onclick = rootSlash;
    ar.appendChild(b);
  }
}

/* 常用和弦快速鍵:最常查的 14 種,不用進清單找。完整的 80 種還是在下面的清單裡 */
const QUICK_CHORDS = [["maj","maj"],["min","min"],["7","7"],["maj7","maj7"],["m7","m7"],["m7b5","m7♭5"],["dim","dim"],
                      ["aug","aug"],["sus2","sus2"],["sus4","sus4"],["6","6"],["9","9"],["add9","add9"],["13","13"]];
function buildQuickGrid(){
  const g = $("quickGrid");
  g.hidden = STATE.tab !== "chord";
  if (g.hidden) return;
  g.innerHTML = "";
  for (const [id, label] of QUICK_CHORDS) {
    const c = chordById(id);
