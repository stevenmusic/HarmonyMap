<title id="pageTitle">HarmonyMap — 和弦與音階地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ══ 設計代幣:與 ScrollScore 同一套語意變數,兩個工具放在一起看是同一個產品 ══ */
:root{
  --bg:#0C0A07;
  --panel:#161209;
  --panel-2:#201A0F;
  /* 金色統一(使用者要求):介面的金色(按鈕、選中、光暈)跟和弦的根音(鍵盤、指板、和弦圖)同一個 #F2B94B。
     原本介面是 #C9A24B、光暈與根音是 #F2B94B,並排時看得出兩種金 */
  --gold:#F2B94B;
  --gold-bright:#EFD48A;
  --brand-gold:#C9A24B;   /* 品牌名照 ScrollScore 原本的顏色(品牌名的 CSS 要跟 ScrollScore 逐項相同) */
  /* 和弦音的顏色(根音金、其他組成音青):兩種主題都一樣,鍵盤、指板、和弦圖、小鍵盤全部用這一組 */
  --note-gold:#F2B94B;
  --note-teal:#3FBFAE;
  /* 實心的「選中」底色(分頁、按下的鍵、開始鈕…):兩種主題都用和弦音同一組亮金、亮青,上面的字用深色 */
  --gold-fill:#F2B94B;
  --teal-fill:#3FBFAE;
  --on-fill:#16110A;
  --teal:#3FBFAE;          /* 鍵盤上「和弦內音(非根音)」的顏色,沿用 ScrollScore 左右手的第二色 */
  --teal-bright:#8FFFF0;
  --ivory:#F4ECDA;
  --muted:#8A7D5F;
  --muted-bright:#B6A576;
  --line:#2A2415;
  --shadow-sm:0 4px 14px rgba(0,0,0,.35);
  --shadow-md:0 10px 26px rgba(0,0,0,.5);
  --shadow-lg:0 18px 44px rgba(0,0,0,.6);
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:18px;
  --radius-pill:999px;
  --fs-2xs:11px;
  --fs-xs:12px;
  --fs-sm:13px;
  --fs-md:14px;
  --fs-lg:16px;
  --fs-xl:19px;
  --fs-2xl:26px;
  --surface-glass:rgba(32,26,15,.88);
  --surface-inset:rgba(22,18,9,.55);
  --card-tint:rgba(255,255,255,.035);
  --stage-glow:#171208;
  color-scheme:dark;
}
/* ══ 淺色主題:同一組語意變數換一套值,版面與元件完全不用改寫 ══ */
body.light{
  --bg:#FBF7EE;
  --panel:#F4EEE0;
  --panel-2:#EDE6D4;
  --gold:#856418;          /* 淺色主題的介面金色要深,字在淺底上才讀得到;和弦音照舊用 --note-gold */
  --gold-bright:#6B5115;
  --brand-gold:#856418;
  --teal:#0F5F56;
  --teal-bright:#0B463F;
  --ivory:#241E12;
  --muted:#6F6450;
  --muted-bright:#544B3B;
  --line:#D8CDB2;
  --shadow-sm:0 4px 14px rgba(90,72,30,.10);
  --shadow-md:0 10px 26px rgba(90,72,30,.14);
  --shadow-lg:0 18px 44px rgba(90,72,30,.18);
  --surface-glass:rgba(252,249,241,.92);
  --surface-inset:rgba(255,255,255,.7);
  --card-tint:rgba(133,100,24,.05);
  --stage-glow:#FFFDF6;
  color-scheme:light;
}
/* touch-action:manipulation 只關掉「雙擊放大」這個手勢,雙指縮放完全不受影響——
   跟直接鎖 viewport 的 user-scalable=no 不一樣,那個連縮放需求的使用者也會一起擋掉。
   #keyboardCanvas 自己的 touch-action:manipulation 已經是同一個值,不衝突 */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* 會被按住、連點、滑過的地方不能選取文字:手機上長按琴鍵/和弦圖/按鈕會跳出選取框與放大鏡(iOS 的 callout),
   練習時一直按住輸入板就會一直冒出來。說明文字不在這裡面,照樣可以選取複製 */
button,[role="button"],canvas,.kb-wrap,.kb-summary,.gtr-dgs,.kb-stage,.chip,.tabs,.inst-switch,.pr-steps{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{height:100%}
body{
  min-height:100%;
  background:var(--bg);color:var(--ivory);
  font-family:"Noto Sans TC",sans-serif;
  display:flex;flex-direction:column;
}
/* ── 頂欄 ───────────────────────── */
header{
  display:flex;align-items:center;flex-wrap:wrap;
  gap:8px 14px;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--line);
  background:var(--panel);
  position:sticky;top:0;z-index:20;
}
.header-left,.header-right{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px}
/* Hub 頁(stevenmusic.github.io)是後來才生的,工具頁原本沒有回首頁的路徑——
   跟 ScrollScore/SightScore/LoudMaster 用同一套安靜文字連結 */
.home-link{
  display:inline-flex;align-items:center;gap:4px;flex:none;
  color:var(--muted);font-size:var(--fs-sm);text-decoration:none;
  padding:6px 4px;border-radius:var(--radius-sm);transition:color .15s;
}
.home-link:hover,.home-link:focus-visible{color:var(--gold-bright)}
/* 品牌名用流體字級(clamp)而不是斷點階梯。用斷點的話,430px 的 Pro Max 跟 320px 的 SE
   會拿到同一個字級,大螢幕明明放得下卻被迫用小字,看起來就是「字太小」。
   改成跟著視窗寬度連續縮放:窄機收到剛好放得下,寬機自然長回原本的大小。
   下限 12px 是頂欄單排放得下的極限,上限 var(--fs-lg) 維持桌機原本的大小不變
   ── 這一組數值與 ScrollScore 完全相同,兩個工具的品牌名要長得一模一樣 */
header h1{
  font-family:"Noto Serif TC",serif;
  font-size:clamp(12px, 3.7vw, var(--fs-lg));
  letter-spacing:clamp(.02em, .55vw, .12em);
  font-weight:700;color:var(--brand-gold);white-space:nowrap;
  flex:none;
}
header h1 span{color:var(--ivory);font-weight:600}
/* 副標是 HarmonyMap 自己多出來的東西,獨立成一個元素,不寫進 h1 裡面,
   免得動到照抄過來的品牌名字級 */
.tagline{color:var(--muted);font-size:var(--fs-xs);letter-spacing:.04em;white-space:nowrap;line-height:17px}
@media (max-width:600px){ .tagline{display:none} }
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1;
  border:1px solid var(--gold);background:transparent;color:var(--gold);
  font-family:inherit;font-size:var(--fs-md);font-weight:500;
  padding:8px 16px;height:38px;border-radius:var(--radius-pill);cursor:pointer;
  transition:background .2s,color .2s;white-space:nowrap;
}
.btn svg{flex:none}
.btn:active{background:var(--gold-fill);color:var(--on-fill)}
.btn.primary{background:var(--gold-fill);color:var(--on-fill);font-weight:700}
.btn.ghost{border-color:var(--line);color:var(--muted-bright)}
.btn.small{height:32px;padding:0 12px;font-size:var(--fs-sm)}
#themeToggle[aria-pressed="true"]{background:var(--gold-fill);color:var(--on-fill)}
/* 語言切換鈕:跟主題/設定等圖示鈕一樣統一用正圓形(跟 ScrollScore/SightScore/LoudNorm
   同一套外觀),只顯示「EN」/「中」文字、不搭配圖示——四個專案不要有的用文字有的用圖示。
   aspect-ratio:1 讓寬度自動跟著當下 .btn 的高度走,不用每個斷點各寫一次寬度 */
#langToggle{aspect-ratio:1;padding:0}
#langToggle[aria-pressed="true"]{background:var(--gold-fill);color:var(--on-fill)}
/* 頂欄的內距與間距同樣跟著寬度連續縮放,不用斷點硬切(照 ScrollScore 的值) */
@media (max-width:600px){
  header{padding:8px clamp(6px, 2.2vw, 10px);gap:clamp(4px, 1.4vw, 6px);flex-wrap:nowrap}
  .header-left,.header-right{gap:clamp(4px, 1.4vw, 6px)}
  .btn{padding:0 10px;height:34px;font-size:var(--fs-sm)}
  .btn-label{display:none}
  .header-left .btn svg{margin:0}
}
@media (max-width:380px){ .btn{padding:0 8px;height:32px} }
@media (max-width:340px){ .btn{padding:0 5px} }

/* ── 版面:上半部釘住不動,只有下半部捲動 ──────────────────────
   .topbar(分頁 + 鍵盤 + 根音)整塊 position:sticky,選下面的和弦時鍵盤與 C D E F G
   一直看得到。刻意做成「一個」sticky 區塊而不是三個各自釘住的元素:三個分開釘的話,
   它們中間的間距是透明的,底下的內容會從縫隙穿出來,而且每個元素的 top 偏移量都要
   靠 JS 量前一個的高度。包成一塊就只有一個偏移量、一個不透明底色,不會有縫。
   .lower(和弦清單 + 結果面板)是唯一會捲動的區域。 */
main{
  flex:1;display:flex;flex-direction:column;gap:14px;
  padding:14px;max-width:1400px;width:100%;margin:0 auto;
}
.topbar{
  position:sticky;top:var(--header-h, 56px);z-index:15;
  background:var(--bg); /* 必須不透明:捲上來的內容要被擋在後面 */
  display:flex;flex-direction:column;gap:10px;padding-bottom:8px;
}
.topbar.unstick{position:static}
.lower{display:flex;flex-direction:column;gap:14px;min-width:0}
.info{display:flex;flex-direction:column;gap:14px;min-width:0}
.info[hidden]{display:none}   /* display:flex 會蓋過 hidden 屬性,要明寫 */

/* 手機橫向 / 螢幕高度極矮:頂欄整體收扁,品牌名也降一階 */
@media (max-height:420px){
  header{padding:5px 10px;gap:4px 8px}
  header h1{font-size:var(--fs-sm)}
  .btn{padding:0 10px;height:28px;font-size:var(--fs-xs)}
  /* 螢幕矮到這個程度(手機橫向),再把上半部釘住就沒有空間捲清單了,整頁一起捲 */
  .topbar{position:static}
}

.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-md);padding:14px 16px;
}
.card-title{
  font-size:var(--fs-2xs);letter-spacing:.14em;color:var(--muted);
  text-transform:uppercase;font-weight:700;margin-bottom:10px;
}

/* ── 分頁(和弦 / 音階 / 辨識)── */
.tabs{display:flex;gap:6px;background:var(--surface-inset);border:1px solid var(--line);
      border-radius:var(--radius-pill);padding:4px}
/* 三個分頁等寬(flex-basis 0),樂器切換固定寬度:按鈕的位置與大小不隨文字長短改變,
   換語言(和弦/Chord、辨識/Identify、吉他/Guitar)時整排不會移位(使用者要求) */
.tabs button{
  flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:none;background:transparent;color:var(--muted-bright);
  font-family:inherit;font-size:var(--fs-md);font-weight:500;line-height:18px;   /* 行高寫死:中文字的行框比英文高 2px,換語言整頁會往上跳 */
  padding:9px 8px;border-radius:var(--radius-pill);cursor:pointer;transition:background .2s,color .2s;
}
.tabs button[aria-selected="true"]{background:var(--gold-fill);color:var(--on-fill);font-weight:700}
/* 樂器切換跟分頁同一列、同一種膠囊外框,但字小一階:它是「換顯示方式」,不是主要導覽 */
.tab-row{display:flex;gap:6px;min-width:0}
.tab-row .tabs{flex:1;min-width:0}
.inst-switch{display:flex;gap:2px;flex:none;background:var(--surface-inset);border:1px solid var(--line);
             border-radius:var(--radius-pill);padding:4px}
.inst-switch button{
  flex:0 0 auto;width:56px;white-space:nowrap;overflow:hidden;text-align:center;
  border:none;background:transparent;color:var(--muted-bright);font-family:inherit;
  font-size:var(--fs-sm);padding:0;border-radius:var(--radius-pill);cursor:pointer;
  transition:background .2s,color .2s;
}
.inst-switch button[aria-pressed="true"]{background:var(--teal-fill);color:var(--on-fill);font-weight:700}
@media (max-width:380px){
  .inst-switch button{width:48px} .tabs button{padding:9px 2px}
}
/* 320px 的英文介面:選中的分頁是粗體,「Identify」要 54px、格子只有 52px,會變成「Ident…」。
   分頁寬度固定(換語言不能移位),所以改字級:小一階就放得下 */
@media (max-width:340px){ .tabs button{font-size:var(--fs-sm)} }

/* ── 根音:字母列 + 升降記號 ── */
.root-row{display:flex;gap:6px;flex-wrap:wrap}
.root-row.letters button{flex:1 1 0;min-width:38px}
.key-btn{
  border:1px solid var(--line);background:var(--surface-inset);color:var(--ivory);
  font-family:"Noto Serif TC",serif;font-size:var(--fs-lg);font-weight:600;
  height:44px;border-radius:var(--radius-sm);cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.key-btn[aria-pressed="true"]{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-fill)}
.key-btn.bass{border-color:var(--teal);color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.key-btn.bass[aria-pressed="true"]{background:var(--teal-fill);border-color:var(--teal-fill);color:var(--on-fill)}
.root-line{display:flex;gap:6px}
.root-line .letters{flex:7 1 0;flex-wrap:nowrap;min-width:0}
.root-line .letters .key-btn{min-width:0}
/* 升降記號跟字母同一列,中間多留一點空隔開 */
.acc-row{display:flex;gap:6px;flex:3 1 0;margin-left:6px;min-width:0}
.acc-row .key-btn{flex:1;min-width:0;height:44px;font-size:var(--fs-lg)}
/* 音階分頁只有 ♭ ♯ 兩顆(沒有 ♮),和弦分頁與練習輸入板是 ♭ ♯ / 三顆:每顆一樣寬,字母才不會被擠窄 */
.acc-row.two{flex:2 1 0}
.quick-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;
            padding-top:10px;border-top:1px solid var(--line)}
.quick-grid[hidden]{display:none}
.quick-btn{
  border:1px solid var(--line);background:var(--surface-inset);color:var(--muted-bright);
  font-family:inherit;font-size:var(--fs-sm);font-weight:500;height:36px;min-width:0;padding:0 2px;
  border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background .15s,color .15s,border-color .15s;
}
.quick-btn:hover{border-color:var(--gold);color:var(--gold)}
.quick-btn[aria-pressed="true"]{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-fill);font-weight:700}
/* 手機:根音卡片是釘住的,每省下一點高度就是清單多看到一排。
   「根音」這個標題可以省——底下就是 C D E F G A B 七顆按鈕,不會看不懂 */
@media (max-width:900px){
  #rootCard{padding:8px 10px}
  #rootCard .card-title{display:none}
  /* 按鈕高度隨螢幕高度連續放大(高的手機 44px / 37px,矮的維持 38px / 32px) */
  .root-row.letters .key-btn,.acc-row .key-btn{height:clamp(38px,5.2vh,46px)}
  .quick-grid{margin-top:8px;padding-top:8px;gap:5px}
  .quick-btn{height:clamp(32px,4.4vh,38px)}
  .topbar{gap:8px}
  #typeCard{padding:12px}
}
/* 320~380px 塞不下十顆一列(每顆會窄到 21px),升降記號折到第二列。
   必須放在上面 max-width:900px 那段之後,同權重靠順序決勝負 */
@media (max-width:380px){
  .root-line{flex-wrap:wrap;gap:5px}
  .root-line .letters{flex:1 1 100%}
  .acc-row,.acc-row.two{flex:1 1 100%;margin-left:0}
  .root-row.letters .key-btn{height:clamp(36px,4.8vh,44px)}
  .acc-row .key-btn{height:clamp(30px,4vh,38px);font-size:var(--fs-md)}
  .quick-btn{font-size:11px;letter-spacing:-.02em;padding:0}
}

/* ── 類型清單:搜尋 + 分組晶片 ── */
/* 搜尋 + 篩選同一排,省掉一整行的高度 */
.find-row{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.find-row .search-wrap{flex:1;min-width:0;margin-bottom:0}
.filter-summary{
  cursor:pointer;user-select:none;flex:none;
  display:inline-flex;align-items:center;gap:6px;
  background:transparent;font-family:inherit;
  border:1px solid var(--line);border-radius:var(--radius-pill);
  padding:5px 14px 5px 10px;font-size:var(--fs-xs);color:var(--muted-bright);
  transition:border-color .15s,color .15s;
}
.filter-summary:hover{border-color:var(--gold);color:var(--gold)}
.filter-summary .chev{display:inline-block;transition:transform .2s;font-size:14px;line-height:1}
.filter-summary[aria-expanded="true"] .chev{transform:rotate(90deg)}
.filter-summary[aria-expanded="true"]{border-color:var(--gold);color:var(--gold)}
.filter-summary .badge{
  background:var(--gold-fill);color:var(--on-fill);border-radius:var(--radius-pill);
  padding:1px 7px;font-size:var(--fs-2xs);font-weight:700;
}
.filter-summary .badge:empty{display:none}
.filter-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.filter-rows[hidden]{display:none}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* [hidden] 是 UA 樣式表給的 display:none,會被上面作者自訂的 display:flex 蓋掉,
   一定要自己補這一條,否則 hidden 設了也沒用(和弦的篩選列會跑到音階分頁上) */
.filter-rows[hidden],.filter-row[hidden]{display:none}
.filter-chip{
  border:1px solid var(--line);background:transparent;color:var(--muted-bright);
  border-radius:var(--radius-pill);padding:5px 12px;font-family:inherit;font-size:var(--fs-xs);
  cursor:pointer;transition:border-color .15s,color .15s,background .15s;white-space:nowrap;
}
.filter-chip:hover{border-color:var(--gold);color:var(--gold)}
.filter-chip[aria-pressed="true"]{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-fill);font-weight:700}
.filter-chip .cnt{opacity:.6;font-size:var(--fs-2xs);margin-left:4px}
/* width→min-width:英文標籤(Style/Level/Enh.)比中文兩個字寬,固定寬度會截斷,
   改成最小寬度,超出時整個 label 連同後面的篩選晶片一起換行(.filter-row 本來就 flex-wrap) */
.filter-label{min-width:3em;flex:none;color:var(--muted);font-size:var(--fs-xs)}
/* 記號的圖例。金線與 ≡ 這兩個標記本身看不出是什麼意思,一定要寫出來——
   靠 title 屬性不算數,手機沒有 hover */
.filter-hint{font-size:var(--fs-2xs);color:var(--muted);opacity:.85;line-height:1.6;padding-left:3em}
.filter-hint b{color:var(--gold);font-weight:400}

/* ── 分類按鈕 ── */
/* 這一排是主要的導覽方式,不是篩選:按一下就換一整組項目。
   所以做得比篩選晶片明顯(實心底、字大一級),使用者才知道要先從這裡選 */
/* position:relative 是為了讓按鈕的 offsetLeft 以這一排為基準,
   捲到選中項目的計算才不會算到別的祖先身上 */
.group-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;position:relative}
/* 同樣的老問題:作者自訂的 display:flex 會蓋掉 [hidden] 的 display:none */
.group-tabs[hidden]{display:none}
.group-tab{
  border:1px solid var(--line);background:var(--surface-inset);color:var(--muted-bright);
  border-radius:var(--radius-sm);padding:7px 12px;font-family:inherit;font-size:var(--fs-sm);
  cursor:pointer;transition:border-color .15s,color .15s,background .15s;white-space:nowrap;
}
.group-tab:hover{border-color:var(--gold);color:var(--gold)}
.group-tab[aria-pressed="true"]{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-fill);font-weight:700}
.group-tab .cnt{opacity:.6;font-size:var(--fs-2xs);margin-left:5px}
.group-tab[aria-pressed="true"] .cnt{opacity:.66}
/* 選了哪一組,就把那一組的定義寫在按鈕底下——原本這句話是掛在分組標題上的,
   改成分類按鈕之後標題不見了,這句話不能跟著不見 */
.group-note{font-size:var(--fs-2xs);color:var(--muted);line-height:1.6;margin-bottom:10px}
.group-note:empty{display:none}
/* 目前分類的按鈕:只有窄螢幕會出現(寬螢幕整排分類本來就看得完) */
.group-current{display:none}
/* 窄螢幕:分類有 14 組,排成一排要左右滑才找得到想去的組,滑到一半還會忘記看過哪些。
   改成「一顆按鈕顯示目前分類 + 展開後兩欄格線一次全部看完」,
   收合時只佔一行,展開時不用捲、不用滑,一眼掃完 */
@media (max-width:600px){
  .group-current{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    background:var(--surface-inset);border:1px solid var(--line);color:var(--ivory);
    border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:8px;
    font-family:inherit;font-size:var(--fs-sm);font-weight:700;cursor:pointer;
  }
  .group-current[hidden]{display:none}
  .group-current .cnt{opacity:.55;font-size:var(--fs-2xs);font-weight:400}
  .group-current .chev{margin-left:auto;font-size:16px;line-height:1;transition:transform .2s}
  .group-current[aria-expanded="true"]{border-color:var(--gold);color:var(--gold)}
  .group-current[aria-expanded="true"] .chev{transform:rotate(90deg)}
  /* 三欄:音階有 15 顆(含「全部」),兩欄要排八列、展開後最後一列會掉到摺線以下,
     等於還是要捲才看得完;三欄五列剛好整片在第一屏裡 */
  .group-tabs{display:grid;grid-template-columns:repeat(3,1fr)}
  .group-tab{
    white-space:normal;text-align:center;padding:8px 4px;font-size:var(--fs-2xs);
    line-height:1.35;min-height:44px; /* 觸控目標不小於 44px */
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  }
  .group-tab .cnt{margin-left:0}
}

/* 分組副標:說明是什麼音程定義了這個家族,讓分組本身也在教東西 */
.type-group-sub{
  font-size:var(--fs-2xs);color:var(--muted);opacity:.85;font-weight:400;
  letter-spacing:0;margin-top:2px;
}
/* 必學的和弦在左上角標一顆星。原本用左緣金邊,但一道色塊看不出是什麼意思
   (連做的人都要問),星號本身就帶語意。≡ 在右上角,兩個記號各佔一角不會打架 */
.chip[data-lv="3"]::before{
  content:"★";position:absolute;top:2px;left:5px;
  font-size:10px;line-height:1;color:var(--gold);
}
.chip[data-lv="3"][aria-pressed="true"]::before{color:rgba(0,0,0,.55)}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap input{
  width:100%;height:38px;padding:0 12px 0 34px;
  background:var(--surface-inset);border:1px solid var(--line);border-radius:var(--radius-pill);
  color:var(--ivory);font-family:inherit;font-size:var(--fs-sm);
}
.search-wrap input:focus{outline:none;border-color:var(--gold)}
/* 放大鏡蓋在輸入框上:點到它也要能打字(pointer-events:none 讓點擊穿過去給輸入框) */
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.6;pointer-events:none}
/* 清單本身不再自己捲(上半部已經釘住了,交給頁面捲就好),
   否則會出現「捲軸裡還有捲軸」,手機上很難操作 */
.type-group + .type-group{margin-top:14px}
.type-group-title{
  font-size:var(--fs-2xs);letter-spacing:.12em;color:var(--muted);font-weight:700;
  margin-bottom:8px;padding:4px 0;
}
/* 每一層(必學 / 常用 / 進階)的展開鈕。做得比晶片輕(只有一條文字 + 箭頭),
   讓它讀起來像分隔線而不是又一個可以選的項目 */
.tier-toggle{
  display:flex;align-items:center;gap:6px;width:100%;margin-top:8px;
  background:transparent;border:0;border-top:1px solid var(--line);
  padding:9px 2px 0;font-family:inherit;font-size:var(--fs-2xs);min-height:32px;
  color:var(--muted);cursor:pointer;transition:color .15s;
}
.tier-toggle:hover{color:var(--gold)}
.tier-toggle .chev{display:inline-block;font-size:13px;line-height:1;transition:transform .2s}
.tier-toggle[aria-expanded="true"]{color:var(--gold)}
.tier-toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
.tier-toggle + .chips{margin-top:8px}

/* 等寬格線排列。原本用 flex 讓晶片各自照文字長度決定寬度,每一列的數量與寬度都不一樣,
   整片看起來參差不齊;改成固定欄寬的 grid,行列自然對齊,長短名稱都排得整整齊齊 */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.chips.wide{grid-template-columns:repeat(auto-fill,minmax(152px,1fr))} /* 音階名稱長,欄位加寬 */
.chip{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:1px solid var(--line);background:var(--surface-inset);color:var(--ivory);
  border-radius:var(--radius-sm);padding:8px 8px;cursor:pointer;
  font-family:inherit;text-align:center;transition:border-color .15s,background .15s;
}
.chip{position:relative}
/* 與其他條目同音高的,右上角標一個 ≡,瀏覽時就看得出來,不必點進去才發現 */
.chip[data-dup]::after{
  content:"≡";position:absolute;top:2px;right:5px;
  font-size:10px;line-height:1;color:var(--muted);opacity:.75;
}
.chip[data-dup][aria-pressed="true"]::after{color:rgba(0,0,0,.55)}
.chip b{font-size:var(--fs-sm);font-weight:700;line-height:1.25;white-space:nowrap}
.chip[data-lv="3"],.chip[data-dup]{padding-top:11px}
.chip i{font-size:var(--fs-2xs);font-style:normal;color:var(--muted);line-height:1.25;white-space:nowrap}
/* 英文和弦名稱(例如 "Dominant 7th ♭9♭13")比中文長很多,窄格子裡用 nowrap 會被切斷/溢出——
   只在英文介面放行換行,中文維持原本的單行(中文名稱本來就短,不需要這條規則) */
html[data-lang="en"] .chip i{white-space:normal}
/* 音階的中文名稱長度差很多(「多利安」到「烏克蘭小調(多利安♯4)」),允許換行才不會被截掉 */
.chips.wide .chip b,.chips.wide .chip i{white-space:normal}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-fill)}
.chip[aria-pressed="true"] i{color:rgba(0,0,0,.62)}
.empty-hint{color:var(--muted);font-size:var(--fs-sm);padding:10px 2px}
.go-chip{width:100%;margin-bottom:12px;border-color:var(--gold)}
#practiceOpen{border-color:var(--teal);color:var(--teal)}
#practiceOpen[hidden]{display:none}
#practiceOpen .badge{background:var(--teal-fill)}
/* 使用說明卡片:從頂欄右上角掉下來,點外面或按 Esc 關掉 */
.help-pop{position:fixed;z-index:60;top:calc(var(--header-h, 56px) + 6px);right:12px;width:min(360px, calc(100vw - 24px));
  max-height:calc(100vh - var(--header-h, 56px) - 24px);overflow:auto;
  background:var(--panel);border:1px solid var(--gold);border-radius:var(--radius-md);
  box-shadow:var(--shadow-lg);padding:14px 16px}
.help-pop[hidden]{display:none}
.help-pop h3{margin:0 0 8px;font-size:var(--fs-md);color:var(--gold)}
.help-pop ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:var(--fs-sm);color:var(--ivory);line-height:1.5}
.help-pop b{color:var(--gold)}
.pr-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pr-head .card-title{margin:0;white-space:nowrap}
.pr-head select{flex:1;min-width:0;margin-left:auto;max-width:260px}
.pr-head .kb-gear{margin-left:auto}
.pr-set{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 10px}
.pr-set .pr-bpm{display:inline-flex;align-items:center;gap:2px}
#prBpmOut{cursor:pointer;user-select:none;-webkit-user-select:none}   /* 連點打拍子設定速度 */
.pr-set .pr-bpm .kb-gear{margin:0}
.pr-set output.tr{min-width:0}
.pr-set output{min-width:4.2em;text-align:center;font-variant-numeric:tabular-nums;color:var(--ivory);font-size:var(--fs-sm)}
.pr-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.pr-row .filter-label{min-width:4em}
.pr-now{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 8px}
.pr-now > div{background:var(--surface-inset);border:1px solid var(--line);border-radius:var(--radius-md);padding:10px 12px;min-width:0}
.pr-now small{display:block;font-size:var(--fs-2xs);color:var(--muted);letter-spacing:.12em}
.pr-now b{display:block;font-family:"Noto Serif TC",serif;font-size:clamp(26px,7vw,40px);line-height:1.15;
          color:var(--gold-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 「現在」與「下一個」字級一致(使用者要求);下一個只用顏色區分 */
.pr-now .next b{color:var(--muted-bright)}
/* 「現在」這張圖的外框也有光暈(使用者要求,跟進行列同一套):停止時靜態,進行中跟著拍子呼吸 */
.pr-now .now{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 14px 2px rgba(242,185,75,.35)}
.kb-stage.running .pr-now .now{animation:prGlowCard var(--beat,.86s) ease-out infinite}
@keyframes prGlowCard{
  0%{box-shadow:0 0 0 2px var(--gold),0 0 24px 6px rgba(242,185,75,.6)}
  100%{box-shadow:0 0 0 1px var(--gold),0 0 8px 1px rgba(242,185,75,.2)}
}
@media (prefers-reduced-motion: reduce){ .kb-stage.running .pr-now .now{animation:none} }
.pr-now .dg{display:block;height:auto;margin-top:6px;width:100%;max-width:185px}   /* 185px = 圖裡的字放大 1.4 倍,跟和弦分頁的圖同一個上限 */
.pr-now .dg.kb{max-width:none;aspect-ratio:154 / 56}   /* 框固定是 11 個白鍵的比例:8 / 11 / 15 鍵換來換去時框不變高變矮,底下的輸入板不跳 */
@media (max-height:420px){ .pr-now .dg{max-height:26vh;width:auto;max-width:100%;margin:2px auto 0} .pr-now b{font-size:24px} .pr-now > div{padding:6px 10px} }   /* 手機橫向:圖不要把開始鈕擠出畫面 */   /* 鋼琴小鍵盤撐滿格子,兩張一樣寬 */
.pr-beats{display:flex;gap:8px;justify-content:center;margin:0 0 8px}
.pr-beats i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.pr-beats i.on{background:var(--teal-fill)}
.pr-beats i.on.one{background:var(--gold-fill)}
.pr-steps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pr-steps span{border:1px solid var(--line);border-radius:var(--radius-sm);padding:3px 10px;font-size:var(--fs-sm);font-variant-numeric:tabular-nums;
  min-height:30px;display:inline-flex;align-items:center}   /* 點一下切換半小節:至少 30px 高才點得準 */
.pr-steps span.cur{border-color:var(--gold);color:var(--gold);font-weight:700;
  box-shadow:0 0 0 1px var(--gold),0 0 10px 1px rgba(242,185,75,.45)}
/* 練習進行中:現在這個和弦的邊框跟著拍子呼吸發光(一拍一次,--beat 由 renderPractice 依 BPM 設定),
   一眼就知道進行到哪裡(使用者要求);停下來時維持靜態光暈 */
.pr-steps.running span.cur{animation:prGlow var(--beat,.86s) ease-out infinite}
@keyframes prGlow{
  0%{box-shadow:0 0 0 2px var(--gold),0 0 16px 4px rgba(242,185,75,.75)}
  100%{box-shadow:0 0 0 1px var(--gold),0 0 6px 0 rgba(242,185,75,.25)}
}
@media (prefers-reduced-motion: reduce){ .pr-steps.running span.cur{animation:none} }
/* 練習卡片裡的和弦輸入:跟根音卡片同一套按鈕(根音一下 + 和弦一下 = 把這個和弦加到進行最後面) */
.pr-pad{margin-bottom:10px}
.pr-pad .quick-grid{margin-top:8px;padding-top:8px}
.pr-edit{display:flex;gap:6px;align-items:center;margin-bottom:8px}
/* 進行永遠只有一行(橫向捲動,自動捲到現在/剛加的那個):會換行的話,加和弦、移調時底下的設定列跟著上下跳,
   手指會點錯(320px 上移調 + 一按,整列掉 29px)。上下留 5px 給光暈,不然會被捲動區切掉 */
.pr-edit .pr-steps{flex:1;min-width:0;margin:-4px 0;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:9px 8px;   /* 光暈 10px:內距加大、負邊距抵掉,版面高度不變 */
  scrollbar-width:none;overscroll-behavior-x:contain}
.pr-edit .pr-steps::-webkit-scrollbar{display:none}
.pr-edit .kb-gear{width:32px;height:32px;margin:0}
.kb-gear:disabled{opacity:.4;cursor:default}
.pr-edit .pr-steps span{flex:0 0 auto;white-space:nowrap}
.pr-steps span[role="button"]{cursor:pointer}
.pr-steps span small{margin-left:4px;font-size:var(--fs-2xs);color:var(--teal);font-weight:400}   /* 不是整小節的和弦標拍數 */
.pr-steps span small.auto{color:var(--muted)}   /* 自動填滿小節的拍數 */
/* 小節線:新的一小節從這個和弦開始 */
.pr-steps span.bar{position:relative;margin-left:9px}
.pr-steps span.bar::before{content:"";position:absolute;left:-9px;top:3px;bottom:3px;width:2px;border-radius:1px;background:var(--muted);opacity:.6}
.pr-bars{margin-left:8px;font-size:var(--fs-xs);color:var(--muted-bright);white-space:nowrap;font-variant-numeric:tabular-nums}
/* 高度由 JS 設成跟鋼琴鍵盤一樣(resizeKeyboardCanvas),和弦圖在格子裡等比例縮放塞滿 */
.gtr-dgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr) auto;gap:6px;padding:6px 8px 0;box-sizing:border-box}
/* 指法圖例(圓點裡的 T 1 2 3 4 是哪根手指):手機沒有 hover,要寫出來(使用者要求)。
   放在和弦圖這一格裡面,顯示區總高度不變,鋼琴/吉他照樣同高 */
.gd-legend{grid-column:1 / -1;font-size:var(--fs-2xs);color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.kb-stage .gd-legend{margin:-2px 0 8px}
.gtr-dgs[hidden]{display:none}
.gtr-dgs .gd{border:1px solid var(--line);border-radius:var(--radius-md);padding:4px 3px 2px;cursor:pointer;
             touch-action:none;background:var(--surface-inset);min-width:0}
.gtr-dgs .gd.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
/* 標籤(開放和弦、五弦 · 第 3 格)隨寬度連續放大:320px 12px → 手機 13~15px → 平板桌機 15px(使用者嫌原本 11px 太小) */
.gtr-dgs .gd-lab{font-size:clamp(12px,3.4vw,15px);color:var(--muted-bright);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtr-dgs .gd.on .gd-lab{color:var(--gold)}
/* 和弦圖儘量大、少留白(使用者要求):撐滿格子,只在很寬的桌機擋一個上限,免得釘住區太高 */
/* 和弦圖跟著格子縮放,但最多放大到 1.4 倍(185×160px):圖裡的字(×、○、3fr)是 10~12 個單位,
   1.4 倍約 14~17px,跟旁邊介面的字一樣大。原本兩欄版面撐滿高度時放大到 2 倍以上,圖很大、其他字很小,
   比例不對(使用者回報)。格子照樣撐滿(兩欄對齊),圖在格子裡置中 */
/* 標籤與圖是同一組,一起在格子裡垂直置中。圖的寬高由 fitGallery 用量出來的像素設定:
   原本靠 grid 裡的百分比高度,iPhone Safari 算得跟 Chrome 不一樣,手機橫向時圖被推到格子最底下(使用者回報) */
.gtr-dgs .gd{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;min-height:0;overflow:hidden}
.gtr-dgs .gd-lab{align-self:stretch}
/* 保險:圖只能縮、不能超出格子(字型晚一步載入讓標籤變高時,iPhone 上圖曾經超出格子底部,使用者回報)。
   SVG 維持比例畫在框裡,框被壓矮時圖只是等比例縮小 */
.gtr-dgs svg{display:block;flex:0 1 auto;min-height:0;min-width:0;max-width:100%;overflow:visible}
/* 撥弦時那條弦亮一下(根音金色、其他青色),0.9 秒淡掉;系統減少動態時 animation 會被縮成一瞬間 */
.gtr-dgs line.str.ring{animation:strRing .9s ease-out}
.gtr-dgs line.str.ring.root{animation-name:strRingRoot}
@keyframes strRing{0%{stroke:var(--note-teal);stroke-width:4;filter:drop-shadow(0 0 4px var(--note-teal))}100%{}}
@keyframes strRingRoot{0%{stroke:var(--note-gold);stroke-width:4;filter:drop-shadow(0 0 4px var(--note-gold))}100%{}}
.kb-stage{border:1px solid var(--line);border-radius:var(--radius-md);padding:10px;background:var(--panel);position:relative}
.kb-stage .pr-ghost{opacity:.14;filter:grayscale(1);pointer-events:none}   /* 空的時候淡淡地預覽加進和弦後的樣子(原本整塊看不見,手機橫向一整個畫面都是空的) */
.kb-stage > .pr-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px 24px}
.kb-stage > .pr-empty > span{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);padding:10px 16px;
  box-shadow:var(--shadow-md);color:var(--muted-bright);animation:hmFloat 3.2s ease-in-out infinite}
@keyframes hmFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.kb-stage[hidden],.kb-wrap[hidden]{display:none}
/* 全螢幕鈕:右上角,只有橫式畫面才出現(使用者要求) */
.kb-stage .pr-fs{position:absolute;top:6px;right:6px;z-index:2;margin:0;background:var(--panel)}
@media (orientation: portrait){ .kb-stage .pr-fs{display:none} }
.pr-full{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;
  padding:max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left))}
.pr-full[hidden]{display:none}
body.pr-fs-on{overflow:hidden}
.pf-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pf-card{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  background:var(--surface-inset);border:1px solid var(--line);border-radius:var(--radius-md);padding:10px}
.pf-card.now{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 18px 3px rgba(242,185,75,.35)}
.pf-card b{font-family:"Noto Serif TC",serif;font-size:clamp(26px, 9vh, 72px);line-height:1.1;color:var(--muted-bright);white-space:nowrap}
.pf-card.now b{color:var(--gold-bright)}
.pf-card .dg{display:block;flex:0 1 auto;min-height:0;width:auto;max-width:100%;max-height:calc(100vh - 9vh - 150px)}   /* 下方多了速度/拍子列 */
.pf-card .dg.kb{width:100%;height:auto}
.pf-grid.two{grid-template-rows:repeat(2,minmax(0,1fr));gap:10px}
.pf-grid.two .pf-card{padding:6px 10px;gap:4px}
.pf-grid.two .pf-card b{font-size:clamp(20px, 6vh, 48px)}
.pf-grid.two .pf-card .dg{max-height:calc(50vh - 6vh - 95px)}
.pf-bar{display:flex;justify-content:center;padding-top:8px}
.pf-bar .pr-beats{margin:0}
.pf-tools{position:absolute;top:max(8px, env(safe-area-inset-top));right:max(8px, env(safe-area-inset-right));display:flex;gap:8px}
.pf-tools .kb-gear{margin:0;width:38px;height:38px;background:var(--panel)}
.kb-stage .pr-now > div{cursor:pointer}
.pr-empty{color:var(--muted);font-size:var(--fs-sm);text-align:center;padding:18px 8px}
.pr-steps-empty{color:var(--muted);font-size:var(--fs-xs)}
.pr-steps span.new{animation:prFlash 1s ease-out}
@keyframes prFlash{0%{background:var(--gold-fill);color:var(--on-fill)}100%{background:transparent}}
.pr-custom{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.pr-custom .filter-chip{flex:none}
.pr-custom select{flex:none;max-width:38%}
.pr-custom input{flex:1;min-width:0;background:var(--surface-inset);color:var(--ivory);border:1px solid var(--line);
                 border-radius:var(--radius-pill);padding:0 12px;height:34px;font:inherit;font-size:var(--fs-sm)}
.pr-bad{font-size:var(--fs-xs);color:#E07A5F;margin-bottom:6px}
.pr-go{width:100%;height:44px;font-size:var(--fs-md)}
/* 開始鈕左邊放速度 − BPM +(播放中手不用離開上面這塊就能調;BPM 數字連點 = 打拍子) */
.pr-gorow{display:flex;align-items:center;gap:8px}
.pr-gorow .pr-go{flex:1;min-width:0;width:auto}
.pr-bpm.pt{display:inline-flex;align-items:center;gap:2px;flex:none}
.pr-bpm.pt .kb-gear{margin:0;width:32px;height:32px}
.pt-out{min-width:4.6em;text-align:center;font-variant-numeric:tabular-nums;color:var(--ivory);font-size:var(--fs-sm);cursor:pointer;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
.pt-range{width:clamp(90px, 18vw, 220px);accent-color:var(--gold-fill);height:32px;margin:0 4px}
.pf-bar{align-items:center;gap:14px;flex-wrap:wrap}
.pf-bar .kb-gear{width:38px;height:38px}

.go-chip i{color:var(--gold)}

/* ── 鍵盤 ── */
.kb-wrap{
  position:relative; /* 讓載入提示可以絕對定位貼在上面(窄螢幕改成 sticky 一樣能當定位基準) */
  border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;
  background:
    radial-gradient(ellipse 120% 80% at 50% 0%, var(--stage-glow) 0%, var(--bg) 60%);
}
#keyboardCanvas{display:block;width:100%;height:150px;background:transparent;touch-action:manipulation;cursor:pointer}
/* 釘在鍵盤下方的摘要:和弦名 + 組成音。高度固定(寬版一行、手機兩列,見下面的 max-width:600),
   因為這一塊在手機上是釘住的,高度只要會隨內容變化,底下整排和弦按鈕就會跟著上下跳 */
.kb-summary{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;white-space:nowrap;overflow:hidden;
}
.kb-summary b{
  font-family:"Noto Serif TC",serif;font-size:var(--fs-lg);font-weight:700;
  color:var(--gold-bright);
  /* 名稱排第二個縮(副標 100、名稱與音名 1:兩者照比例一起讓):吉他音階多了把位的 ‹ › 之後,320px 放不下「C 大調(愛奧尼安)」全名,
     不讓名稱縮的話音名會被擠到 0。平常放得下時完全不縮 */
  flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
}
/* 放不下時先縮副標(英文原名/中文名稱),組成音最後才縮:320px 上原本「C 大調(愛奧尼安) Ionian / Major」
   把音名擠到只剩一個「C」。flex-shrink 100 : 1,副標幾乎全部讓完,音名才開始讓 */
.kb-summary b.stk{display:flex;align-items:center;gap:.3em}
.kb-summary b.stk .rt{font-size:1.5em;line-height:1;flex:none}
.kb-summary b.stk .nm{display:flex;flex-direction:column;min-width:0;line-height:1.1;font-size:max(11px,.72em)}
.kb-summary b.stk .nm span{overflow:hidden;text-overflow:ellipsis}
.kb-summary .zh{font-size:var(--fs-xs);color:var(--muted);flex:0 100 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.kb-summary .tn{cursor:pointer;border-radius:4px;padding:2px 1px}
.kb-summary .tn:hover{color:var(--gold-bright)}
.kb-summary .tones{
  font-size:var(--fs-sm);color:var(--ivory);letter-spacing:.06em;
  flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:right;
}
/* 鍵盤設定的浮動面板。蓋在琴鍵上方(.kb-wrap 是 overflow:hidden,所以尺寸要放得進去),
   關掉之後完全不佔版面高度——原本這三個選單常駐一整排,吃掉釘住區約 50px */
/* 右邊讓出齒輪那一欄(44px):原本蓋在齒輪上,想再點齒輪關掉時點到的是面板裡的下拉選單(模擬操作時抓到) */
.kb-popover{
  position:absolute;right:44px;bottom:8px;z-index:5;
  display:flex;flex-direction:column;gap:4px;
  background:var(--surface-glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--gold);border-radius:var(--radius-md);
  padding:6px 10px;box-shadow:var(--shadow-md);
  /* 吉他多了移調夾那一列,320×568 的鍵盤區放不下:面板自己捲動,不要被 .kb-wrap 切掉 */
  max-height:calc(100% - 16px);overflow-y:auto;overscroll-behavior:contain;
}
.kb-popover[hidden]{display:none}
#findDesc{display:grid}
#findDesc > span{grid-area:1 / 1}
#findDesc > span.off{visibility:hidden}
.kb-popover label{display:flex;align-items:center;gap:8px;font-size:var(--fs-2xs);color:var(--muted)}
/* 面板要整個放得進鍵盤區(.kb-wrap 是 overflow:hidden),320×568 的鍵盤區只有 145px:
   三列 × 34px 剛好放得下。選擇器寫兩個 class 才蓋得過觸控裝置的 select.mini{min-height:38px} */
.kb-popover select.mini{flex:1;min-width:96px;min-height:34px}
.kb-popover label > span{flex:none;width:5.2em}   /* 標籤固定寬,每一列的選單對齊 */
.kb-popover{max-width:calc(100% - 52px);
  /* 列數多、要捲動時,上下緣出現陰影提示「還有」(捲到底就消失) */
  background:linear-gradient(var(--surface-glass) 30%, transparent) top / 100% 24px no-repeat local,
             linear-gradient(transparent, var(--surface-glass) 70%) bottom / 100% 24px no-repeat local,
             radial-gradient(farthest-side at 50% 0, rgba(0,0,0,.35), transparent) top / 100% 10px no-repeat scroll,
             radial-gradient(farthest-side at 50% 100%, rgba(0,0,0,.35), transparent) bottom / 100% 10px no-repeat scroll,
             var(--surface-glass)}
/* 手機橫向的鍵盤區只有 130px,放不下三列:改排兩欄 */
@media (max-height:420px){ .kb-popover:not([hidden]){display:grid;grid-template-columns:auto auto;column-gap:12px} }
.kb-gear{
  flex:none;background:transparent;border:1px solid var(--line);color:var(--muted-bright);
  border-radius:var(--radius-pill);width:26px;height:26px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center; /* 線稿圖示要自己置中,不靠字型基線 */
  cursor:pointer;margin-left:8px;transition:border-color .15s,color .15s;
}
.kb-gear svg{display:block}
/* 吉他指法的上一個/下一個。跟齒輪一樣是固定寬度的 flex:none,摘要列仍然只有一行 */
.vc-nav{flex:none;display:inline-flex;align-items:center;gap:2px;font-size:var(--fs-2xs);color:var(--muted-bright)}
.vc-nav button{
  background:transparent;border:1px solid var(--line);color:var(--muted-bright);cursor:pointer;
  width:26px;height:26px;border-radius:var(--radius-pill);display:inline-flex;align-items:center;justify-content:center;
}
.vc-nav button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.vc-nav button:disabled{opacity:.3;cursor:default}
.vc-nav button svg{display:block}
/* 圖示鈕只有 22~26px:看得到的大小不變,用透明的 ::after 把手指點得到的範圍往外擴到 34px 以上 */
.vc-nav button{position:relative}
.vc-nav button::after{content:"";position:absolute;inset:-6px}
table.dia button.link{position:relative}
table.dia button.link::after{content:"";position:absolute;inset:-10px -8px}
.bass-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
.bass-row .filter-label{min-width:0;margin-right:4px}
.bass-row small{opacity:.7;font-size:max(11px,.85em)}   /* 11px 是全站最小字級(原本 .85em = 10.2px) */
.bass-row select{height:30px}
.vc-nav .n{min-width:2.6em;text-align:center;font-variant-numeric:tabular-nums}
.pos-nav{gap:0}
/* 寬度固定、★ 永遠佔位(不是把位 1 時只是看不見):換把位時數字不移位,右邊的 ‹ › 與前面的音名也跟著不動 */
.pos-nav .n{width:3.1em;padding:0;white-space:nowrap;font-size:var(--fs-sm);color:var(--ivory)}
.pos-nav small.off{visibility:hidden}
.pos-nav button{width:22px;height:22px}
/* 有把位箭頭的那一行:名稱(這是哪個音階)比音名重要,放不下時音名先縮 */
.kb-summary.has-pos{gap:5px;padding-left:8px;padding-right:6px}
.kb-summary.has-pos b{font-size:var(--fs-md)}
.kb-summary.has-pos .kb-gear{margin-left:-2px}
.kb-summary.has-pos .tones{flex-shrink:0;letter-spacing:.02em}   /* 七個音要完整顯示:名稱讓,音名不讓 */
.kb-summary .nmrow{display:contents}
.kb-summary .capo-tag{display:inline-block;margin-right:6px;vertical-align:1px;letter-spacing:0;font-size:var(--fs-2xs);color:var(--teal);border:1px solid var(--teal);border-radius:var(--radius-pill);padding:1px 7px;line-height:1.4}
/* 手機直向:一行塞不下「名稱 + 副標 + 七個音名 + ‹ › + 齒輪」,一律變成省略號(使用者要求全部完整顯示)。
   改成固定兩列:上列名稱(+ 副標,放不下就整個不顯示、不寫半截)、下列音名,‹ › 與齒輪在右邊跨兩列。
   列高固定(不隨內容變),所有分頁、兩種樂器都用同一個版型,切換時照樣不移位 */
@media (max-width:600px){
  .kb-summary{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-rows:22px 18px;
    column-gap:6px;row-gap:0;padding:4px 8px 4px 10px}
  .kb-summary.has-pos{row-gap:0;column-gap:6px}   /* .has-pos 的 gap:5px 會把列距撐大,高度就跟其他模式不一樣 */
  /* 吉他音階:‹ 3★ › 放上列,下列整條給音名(八個音、半音階十二個音在 320px 也放得下) */
  .kb-summary.has-pos .vc-nav{grid-area:1 / 2}
  #kbSummary.has-pos .tones{grid-area:2 / 1 / 3 / 3}
  .kb-summary .nmrow{display:flex;align-items:baseline;gap:8px;grid-area:1 / 1;min-width:0;overflow:hidden}
  .kb-summary b,.kb-summary.has-pos b{font-size:var(--fs-lg);line-height:22px;flex:none;overflow:visible}
  .kb-summary .zh{flex:none}
  .kb-summary .zh.off{display:none}
  .kb-summary .tones,.kb-summary.has-pos .tones{grid-area:2 / 1;text-align:left;line-height:18px;overflow:visible}
  .kb-summary .vc-nav{grid-area:1 / 2 / 3 / 3}
  .kb-summary .kb-gear,.kb-summary.has-pos .kb-gear{grid-area:1 / 3 / 3 / 4;margin-left:0}
  /* 兩個名字的音階不必再疊兩行(已經有一整列):排成一行 C Aeolian (Natural Minor) */
  .kb-summary b.stk{display:inline-flex;align-items:baseline;gap:.3em}
  .kb-summary b.stk .rt{font-size:1em;line-height:inherit}
  .kb-summary b.stk .nm{flex-direction:row;gap:.3em;font-size:1em;line-height:inherit}
  .kb-summary b.stk .nm span.off{display:none}
}
.pos-nav small{color:var(--gold);margin-left:1px}
.pos-nav .n i{font-style:normal;color:var(--muted)}
.kb-gear:hover,.kb-gear[aria-expanded="true"]{border-color:var(--gold);color:var(--gold)}
/* 吉他模式左上角是 ○/× 那一欄,載入提示改貼右上角,不要蓋住空弦標記 */
.kb-wrap.gtr .audio-status{left:auto;right:8px}
.kb-wrap.gtr.lefty .audio-status{left:8px;right:auto}
.audio-status{pointer-events:none}   /* 只是提示:手指點下去要穿過它,不能擋住底下的空弦欄或和弦圖 */   /* 左手吉他的 ○/× 欄在右邊 */
.audio-status{
  position:absolute;top:8px;left:8px;z-index:2;
  /* 絕對定位,換行不會推動版面;iPhone 靜音提示比較長,窄螢幕要能折行而不是被切掉 */
  font-size:var(--fs-2xs);color:var(--muted-bright);max-width:calc(100% - 16px);
  background:var(--surface-glass);border:1px solid var(--line);
  border-radius:var(--radius-pill);padding:3px 10px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
select.mini{
  background:var(--surface-inset);color:var(--ivory);border:1px solid var(--line);
  border-radius:var(--radius-pill);padding:0 10px;height:32px;font-family:inherit;font-size:var(--fs-sm);
}
select.mini:focus{outline:none;border-color:var(--gold)}
/* 手機上鍵盤是釘住的,這條工具列也跟著一直佔畫面高度——圖例的資訊
   下方的結果面板已經寫得更清楚了,窄螢幕就先讓位給控制項,確保它們排得下一列 */
@media (max-width:600px){
  select.mini{font-size:var(--fs-xs);padding:0 8px}
}

/* ── 結果面板 ── */
.rt-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.rt-head .rt-add{margin-left:auto;align-self:center;border-color:var(--teal);color:var(--teal)}
.rt-head .rt-add.done{background:var(--teal-fill);color:var(--on-fill)}
.rt-name{font-family:"Noto Serif TC",serif;font-size:var(--fs-2xl);font-weight:700;color:var(--gold-bright);line-height:1.1}
.rt-sub{font-size:var(--fs-sm);color:var(--muted-bright)}
/* align-items:stretch(預設值,寫出來提醒別動它):有的音要標八度、有的不用,
   同一列的格子必須等高,不然高低參差 */
/* 組成音:一列小晶片(級數 + 音名)。原本是一排大方格,內容跟鍵盤下那行摘要重複,
   手機上白白佔掉約 75px(音階兩列約 150px),改小但一樣可以點來聽單音 */
.note-strip{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.note-cell{
  flex:0 0 auto;display:inline-flex;align-items:baseline;gap:5px;
  border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:4px 10px;background:var(--surface-inset);
}
.note-cell .deg{font-size:var(--fs-2xs);color:var(--muted);letter-spacing:.04em}
.note-cell .nm{font-family:"Noto Serif TC",serif;font-size:var(--fs-md);font-weight:700;color:var(--ivory);line-height:1.3}
.note-cell.is-root{border-color:var(--gold);background:rgba(242,185,75,.12)}
.note-cell.is-root .nm{color:var(--gold-bright)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;font-size:var(--fs-sm);color:var(--muted-bright)}
.meta-row b{color:var(--ivory);font-weight:500;font-variant-numeric:tabular-nums}
.desc{margin-top:12px;font-size:var(--fs-sm);line-height:1.75;color:var(--muted-bright)}
.desc strong{color:var(--ivory);font-weight:500}

/* 順階和弦表 */
.table-scroll{overflow-x:auto}
/* 不設最小寬度:手機上四欄本來就放得下(約 280px),設 420px 會讓「組成音」那欄被切掉、要橫滑才看得到;
   真的放不下(三重升降的理論調)才由外層 .table-scroll 橫向捲動 */
table.dia{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
table.dia th,table.dia td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.dia sup.enh{color:var(--gold);font-size:.8em;margin-left:2px}
table.dia th{font-size:var(--fs-2xs);letter-spacing:.08em;color:var(--muted);font-weight:700;text-transform:uppercase}
table.dia td.rn{color:var(--gold);font-family:"Noto Serif TC",serif;font-weight:700}
table.dia td.sym{font-weight:700}
table.dia td.tones{color:var(--muted-bright);font-size:var(--fs-xs)}
table.dia tr:last-child td{border-bottom:none}
table.dia button.link{
  background:none;border:none;color:inherit;font:inherit;cursor:pointer;padding:0;
  border-bottom:1px dashed var(--line);
}
table.dia button.link:hover{color:var(--gold);border-color:var(--gold)}

/* 建議音階 / 相關連結 */
.link-chips{display:flex;flex-wrap:wrap;gap:6px}
.link-chip{
  border:1px dashed var(--line);background:transparent;color:var(--muted-bright);
  border-radius:var(--radius-pill);padding:6px 12px;font-family:inherit;font-size:var(--fs-xs);cursor:pointer;
  transition:border-color .15s,color .15s;
}
.link-chip:hover{border-color:var(--gold);color:var(--gold)}

/* 反查結果 */
.find-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}   /* 寬的時候排多欄(平板、桌機),手機照舊一欄 */
.find-item{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;background:var(--surface-inset);
}
.find-item .fname{font-family:"Noto Serif TC",serif;font-size:var(--fs-lg);font-weight:700;color:var(--gold-bright)}
.find-item .fzh{font-size:var(--fs-xs);color:var(--muted-bright)}
.find-item .ftag{
  margin-left:auto;font-size:var(--fs-2xs);color:var(--muted);
  border:1px solid var(--line);border-radius:var(--radius-pill);padding:2px 8px;
}
.find-item .ftag.exact{color:var(--gold);border-color:var(--gold)}
/* 辨識結果可以點:跳到那個和弦(或音階)的頁面 */
.find-item[role="button"]{cursor:pointer;transition:border-color .15s}
.find-item[role="button"]:hover,.find-item[role="button"]:focus-visible{border-color:var(--gold);outline:none}

footer{
  padding:16px 14px calc(18px + env(safe-area-inset-bottom));
  text-align:center;color:var(--muted);font-size:var(--fs-2xs);line-height:1.8;
}
footer a{color:var(--muted-bright);text-decoration:none;border-bottom:1px solid var(--line)}
footer a:hover,footer a:focus-visible{color:var(--gold-bright)}
/* ── 觸控裝置:點擊目標放大(照抄 ScrollScore 的 pointer:coarse 三條規則)────────── */
@media (pointer:coarse){
  .btn{height:44px;min-width:44px}
  select.mini{min-height:38px}
  /* iOS 點進字級 < 16px 的輸入框/下拉選單會自動放大整頁,而且不會縮回來。
     各欄位的字級有用 id 選擇器寫的,這裡要 !important 才蓋得過 */
  input,select,textarea{font-size:16px !important}
}
/* 手機橫向:螢幕高度本來就很吃緊,44px 的按鈕會再吃掉寶貴的高度。
   這裡取 36px 折衷——比純高度斷點的 28px 好按,又不會把清單壓得更小。
   必須放在 pointer:coarse 之後,否則會被上面的 44px 蓋掉 */
@media (pointer:coarse) and (max-height:420px){
  .btn{height:36px}
}
/* 觸控目標寬度連續縮放:320px 只放得下 38px(仍遠高於 WCAG 2.2 AA 2.5.8 要求的 24px,
   而且高度維持 44px),400px 以上就回到 Apple HIG 建議的 44px。
   必須放在 pointer:coarse 之後才不會被上面的 min-width:44px 蓋掉 */
@media (pointer:coarse) and (max-width:420px){
  .btn{min-width:clamp(38px, 10.5vw, 44px)}
}

/* ── 使用者在系統關掉動態效果時,一律不要有轉場與動畫 ──────────────
   四個專案(ScrollScore / SightScore / LoudNorm / HarmonyMap)共用同一組斷點,
   這條是其中之一 */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important;
  }
}

/* ── 和弦表(列印 / 存成 PDF)── */
/* 和弦表下載:原本是沒有字的印表機圖示,使用者找不到(回報「不直覺」)。改成跟「練習」同款的膠囊鈕,
   下載箭頭 + 「和弦表」,金色外框跟青色的練習區分 */
#printOpen{flex:none;align-self:stretch;margin:0;display:inline-flex;align-items:center;gap:5px;border-color:var(--gold);color:var(--gold)}
#printOpen svg{flex:none}
/* 窄手機(≤380px)只留下載圖示(金框膠囊),不然搜尋框只剩 49px;字留在 title / aria-label */
@media (max-width:380px){ #printOpen span{display:none} #printOpen{padding:5px 10px} }
#printOpen[hidden]{display:none}
.print-pop{width:min(380px, calc(100vw - 24px))}
.print-pop h3{margin:0}
.print-pop .pr-head{margin-bottom:12px}
.pp-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.pp-row .filter-label{min-width:4.2em;font-size:var(--fs-xs);color:var(--muted)}
.pp-hint{font-size:var(--fs-xs);color:var(--muted-bright);line-height:1.6;margin:4px 0 12px}
.pp-go{width:100%;height:42px}
.pp-go:disabled{opacity:.7;cursor:progress}
#printSheet{display:none}
/* 下載 PDF:把和弦表排成真正的 A4(210 × 297mm)放到畫面外,逐頁畫到 canvas 再寫成 PDF */
#printSheet.pdfmode{display:block;position:fixed;left:-10000px;top:0;width:210mm;pointer-events:none}
#printSheet.pdfmode .ps-page{width:210mm;height:297mm}
/* 列印:只印和弦表,其他全部藏起來;白底、深色線條(SVG 用的是 CSS 變數,在這裡換成淺色的一組) */
@media print{
  @page{size:A4 portrait;margin:0}   /* 頁邊 0:瀏覽器就沒有空間印自己的網址、日期、時間(使用者要求不要);留白放在每頁框裡 */
  :root,body.light{color-scheme:light !important}   /* 深色主題的 color-scheme:dark 會讓 Chrome 把頁邊塗成 #121212 */
  html,body.printing{background:#fff !important}
  body.printing{display:block}
  body.printing > *:not(#printSheet){display:none !important}
  body.printing #printSheet{display:block}
  *{animation:none !important;transition:none !important}
}
/* 版面像專業和弦對照表(使用者要求):A4 直式,一列一個根音、最左一欄寫根音,吉他一列 7 張(基本 7 種剛好一列、上下對齊,
   一頁 6 個根音、12 個根音 2 頁),鋼琴一列 4 張。不畫分隔線、每張圖不加框,用留白分組。
   試過「根音當欄、和弦種類當列」:直式高度只放得下每列 35mm,和弦圖反而縮到 21mm,3 頁,不採用。
   字級照印出來的 pt 定(量過實際 PDF):名稱 12pt、指法數字約 8pt、組成音 8.5pt、頁尾 7.5pt */
#printSheet{--surface-inset:#fff;--muted-bright:#2b261c;--muted:#6f6450;--note-gold:#E3A52E;--note-teal:#2FA897;
  color:#16130D;background:#fff;font-family:"Noto Sans TC",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ps-page{width:100%;height:100vh;padding:10mm 10mm 7mm;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;break-after:page;page-break-after:always}
/* 每頁框的高度 = 紙張可列印的高度(列印時 100vh 就是一頁)。原本寫死 277mm,瀏覽器保留自己的頁邊時超出一截,
   頁尾被擠到下一張、每隔一頁就是只有頁尾的白紙(使用者回報)。內容照最保守的 245mm 排(PS.pageH),任何瀏覽器的頁邊都放得下,
   頁尾 margin-top:auto 貼在每頁最下面 */
.ps-page:last-child{break-after:auto;page-break-after:auto}
.ps-head{height:13mm;flex:none;box-sizing:border-box;overflow:hidden}
.ps-top{display:flex;align-items:baseline;justify-content:space-between;gap:6mm;margin-bottom:1.2mm}
.ps-title{font-family:"Noto Serif TC",serif;font-weight:700;font-size:16pt;letter-spacing:.04em;line-height:1.15;white-space:nowrap}
.ps-meta{font-size:8.5pt;color:#3a3428;white-space:nowrap}
.ps-legend{font-size:7.5pt;line-height:1.5;color:#6f6450;white-space:nowrap;overflow:hidden}
.ps-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.ps-body.full{justify-content:space-evenly}   /* 滿頁:多出來的高度平均分到每一列之間,不要全部堆在最下面(使用者要求) */
.ps-row{display:grid;column-gap:3mm;flex:none}   /* 圖與圖之間 3mm:格數標示「4fr」不會貼到隔壁的圖 */
.ps-row.guitar{grid-template-columns:8mm repeat(7,minmax(0,1fr));height:37mm}
.ps-row.piano{grid-template-columns:8mm repeat(4,minmax(0,1fr));height:27mm}
.ps-lab{font-family:"Noto Serif TC",serif;font-weight:700;font-size:15pt;line-height:1;color:#B8861B;padding-top:1.2mm;white-space:nowrap}
.ps-lab.more{visibility:hidden}   /* 同一個根音的第二列以後不重複寫 */
.ps-cell{height:100%;min-width:0;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;padding:.8mm 0 1.6mm;text-align:center}
.ps-cell b{display:block;max-width:100%;font-family:"Noto Serif TC",serif;font-size:12pt;line-height:1.15;white-space:nowrap}
/* 名稱與組成音不截成「…」(使用者要求):照字數縮字級,一定放得下 */
.ps-cell b.l2{font-size:10.5pt} .ps-cell b.l3{font-size:9pt}
.ps-cell svg{display:block;flex:none;height:auto;width:100%;max-width:100%;margin:.6mm auto .4mm}   /* 高度跟著寬度,名稱、圖、組成音靠在一起,空白留在列與列之間 */
.ps-row.piano .ps-cell svg{height:14mm;width:auto;max-width:96%}   /* 小鍵盤固定高度(8 鍵的會比較窄),不然 8 個白鍵的會長得很高、把名稱擠掉 */
.ps-cell small{display:block;max-width:100%;font-size:8.5pt;color:#4a4232;letter-spacing:.02em;white-space:nowrap}
.ps-cell small.l2{font-size:7.5pt;letter-spacing:0} .ps-cell small.l3{font-size:6.6pt;letter-spacing:0}
/* 圖裡的小字照紙本放大(CSS 蓋過 SVG 的 font-size 屬性):指法數字要放得進圓點(直徑 14 單位) */
#printSheet svg text.fn{font-size:13px}
#printSheet svg circle.fd{r:8.3px}   /* 圓點放大(弦距 18,相鄰的點不會碰到),數字才放得大 */
#printSheet svg text.slab{display:none}   /* 粗/細 改在頁首圖例說一次,每張圖左右的空白裁掉給指板 */
#printSheet svg text.frl{font-size:12px}
#printSheet svg text.mx{font-size:14px}
.ps-none{font-size:8pt;color:#6f6450;padding:10mm 0}
.ps-foot{margin-top:auto;height:8mm;flex:none;box-sizing:border-box;padding-top:1.2mm;font-size:7.5pt;line-height:1.5;color:#6f6450;text-align:center;position:relative}
.ps-pno{position:absolute;right:0;top:1.2mm;font-size:8.5pt;color:#3a3428}

/* ── 動態與質感(使用者要求:多一點特效/動畫)──────────────────────
   都只動外觀:transform / opacity / 陰影 / 背景,不改任何元素的尺寸與位置(點下去的東西不能移位)。
   系統開了「減少動態」時,上面那段 prefers-reduced-motion 會把動畫縮成一瞬間 */
/* 背景:左下金、右下青兩團很淡的光,固定在視窗上。放在下緣,釘住的上半部(不透明 --bg)才不會跟背景接出一條縫;
   內容比螢幕短時,下面那塊也不再是一片死黑 */
body{background:
  radial-gradient(ellipse 70% 45% at 0% 100%, rgba(242,185,75,.075), transparent 70%),
  radial-gradient(ellipse 60% 40% at 100% 100%, rgba(63,191,174,.06), transparent 70%),
  var(--bg);background-attachment:fixed}
body.light{background:
  radial-gradient(ellipse 70% 45% at 0% 100%, rgba(242,185,75,.16), transparent 70%),
  radial-gradient(ellipse 60% 40% at 100% 100%, rgba(63,191,174,.12), transparent 70%),
  var(--bg);background-attachment:fixed}
/* 卡片上緣一點點打光,比平塗有層次 */
.card,.kb-stage{background-image:linear-gradient(180deg, var(--card-tint), transparent 90px)}
/* 選中的分頁、樂器、開始鈕:同色系的柔光 */
.tabs button[aria-selected="true"]{box-shadow:0 2px 14px -3px rgba(242,185,75,.7)}
.inst-switch button[aria-pressed="true"]{box-shadow:0 2px 14px -3px rgba(63,191,174,.7)}
.btn.primary{box-shadow:0 6px 22px -8px rgba(242,185,75,.8)}
.key-btn[aria-pressed="true"],.chip[aria-pressed="true"]{box-shadow:0 0 16px -4px rgba(242,185,75,.75)}
.key-btn.bass[aria-pressed="true"]{box-shadow:0 0 16px -4px rgba(63,191,174,.75)}
/* 按下去的回饋:縮一點點(只是 transform,排版位置不變) */
.btn,.key-btn,.quick-btn,.chip,.tabs button,.inst-switch button,.group-tabs button,.find-item,.kb-gear{
  transition-property:background,color,border-color,box-shadow,transform;transition-duration:.15s,.15s,.15s,.2s,.09s}
.btn:active,.key-btn:active,.quick-btn:active,.chip:active,.tabs button:active,.inst-switch button:active,
.group-tabs button:active,.find-item[role="button"]:active,.kb-gear:active{transform:scale(.95)}
.chip:hover,.quick-btn:hover,.key-btn:hover{border-color:var(--gold)}
.chip:hover,.find-item[role="button"]:hover{box-shadow:0 4px 16px -8px rgba(242,185,75,.6)}
/* 換分頁:下半部淡入(enterAnim 重新觸發) */
@keyframes hmEnter{from{opacity:0}to{opacity:1}}   /* 只淡入不位移:位移中的東西點下去會點歪(測試量位置也會差幾 px) */
.hm-enter{animation:hmEnter .32s cubic-bezier(.2,.7,.3,1)}
/* 彈出來的面板(使用說明、鍵盤設定、篩選、分類)淡入放大 */
@keyframes hmPop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.help-pop:not([hidden]),.kb-popover:not([hidden]),.filter-rows:not([hidden]){animation:hmPop .18s ease-out}
/* 練習的拍點:亮起的那一拍放大發光 */
.pr-beats i{transition:background .12s,transform .12s,box-shadow .12s}
.pr-beats i.on{transform:scale(1.3);box-shadow:0 0 10px 1px rgba(63,191,174,.7)}
.pr-beats i.on.one{box-shadow:0 0 12px 2px rgba(242,185,75,.75)}

/* ── 平板/桌機:左右兩欄 ──────────────────────────────────────
   放在整份樣式表的最後(跟 ScrollScore 一樣),寬度剛好等於 900px 時
   才會贏過上面那些 max-width:900px 的規則,不會兩套版面打架 */
@media (min-width:900px){
  /* 釘住的那塊裡面:左邊放分頁與根音、右邊放鍵盤;下半部左邊清單、右邊說明 */
  /* 第一列固定是分頁那排的高度(auto),右邊跨兩列的鍵盤多出來的高度全給第二列(1fr),
     左邊的根音/辨識卡片才不會因為卡片高度不同、或換樂器而上下跳 */
  .topbar{display:grid;grid-template-columns:minmax(280px,340px) 1fr;grid-template-rows:auto 1fr;gap:10px 14px;align-items:start}
  .topbar .tab-row{grid-column:1;grid-row:1}
  /* 顯示區撐滿左欄高度(高度由 resizeKeyboardCanvas 的 twoColumnAvail 算);內容比較矮時(鋼琴維持琴鍵比例)
     在摘要列上方置中,不是全部擠在最上面、下面留一塊空白 */
  .topbar .kb-wrap{align-self:stretch;display:flex;flex-direction:column}
  .topbar .kb-wrap[hidden]{display:none}   /* 上面的 display:flex 會蓋過 hidden:練習時一般鍵盤會露在「現在/下一個」底下 */
  .topbar #rootCard,.topbar #findCard{align-self:stretch}
  .topbar .kb-wrap > #keyboardCanvas{align-self:center}
  .topbar .kb-wrap > #keyboardCanvas{margin-top:auto}
  .topbar .kb-wrap > .kb-summary{margin-top:auto}
  /* 左欄只有 340px,三個分頁各約 65px:英文的粗體「Identify」放不下,跟窄螢幕一樣把左右內距收到 2px */
  .tabs button{padding:9px 2px}
  .topbar #rootCard,.topbar #findCard{grid-column:1;grid-row:2}
  .topbar .kb-wrap,.topbar .kb-stage{grid-column:2;grid-row:1 / span 2}
  /* 左欄只有 280~340px 寬:十顆排一列每顆只剩 23px,升降記號改排第二列;
     快速鍵排五欄三列(跟參考圖同一個排法) */
  #rootCard .root-line{flex-wrap:wrap}
  #rootCard .root-line .letters,#rootCard .acc-row{flex:1 1 100%;margin-left:0}
  #rootCard .acc-row .key-btn{height:36px;font-size:var(--fs-md)}
  #rootCard .quick-grid{grid-template-columns:repeat(5,1fr)}
  /* 欄寬分配:會捲的長清單拿彈性寬度,不會捲的短說明給上限。
     反過來(清單鎖 420px、說明吃 1fr)在平板橫式會很難看——實測 1024×768 時
     清單被擠成 420 寬 × 1292 高的窄長條、右下角一大片空白。
     讓清單隨寬度長大,每列多放幾顆晶片,整體高度就跟著降下來 */
  .lower{display:grid;grid-template-columns:minmax(360px,1fr) minmax(340px,480px);align-items:start}
  /* 右邊的說明欄也跟著釘住。不然左邊清單很長、右邊說明很短,清單一往下捲,
     右半邊就整片空著。--topbar-h 由 JS 量出來(鍵盤高度會隨音域變,寫死會對不齊) */
  .info{position:sticky;top:calc(var(--header-h, 60px) + var(--topbar-h, 250px) + 10px)}
  .lower.practicing{grid-template-columns:minmax(0,760px)}
  /* 辨識:沒有左邊的清單,結果改佔滿兩欄(結果清單自己排多欄)。原本結果擠在左欄、右半邊整片空著 */
  .lower.finding{grid-template-columns:minmax(0,1fr)}
  .lower.finding .info{position:static}
  /* 兩欄時練習:練習卡片(輸入板、進行、設定)搬到左欄分頁下面(原本根音卡片的位置,練習時是空的),
     右邊「現在/下一個」跟著捲動停在畫面上(sticky)。原本左欄整片空、練習卡片被擠到畫面下面(使用者回報橫式平板) */
  .topbar > #practiceCard{grid-column:1;grid-row:2;align-self:stretch;min-width:0}
  .topbar #practiceCard .root-line{flex-wrap:wrap}
  .topbar #practiceCard .root-line .letters,.topbar #practiceCard .acc-row{flex:1 1 100%;margin-left:0}
  .topbar #practiceCard .quick-grid{grid-template-columns:repeat(5,1fr)}
  .topbar .kb-stage{align-self:start;position:sticky;top:calc(var(--header-h, 60px) + 8px)}
  /* 右邊至少跟左邊的練習卡片一樣高(最多一個螢幕高,fitPracticeStage 設 min-height):原本只有兩張小圖的高度,
     左欄很長、右邊底下整片空著。多出來的高度給「現在/下一個」的圖,鋼琴改成上下排、鍵盤佔滿整個寬度 */
  .topbar .kb-stage{display:flex;flex-direction:column}
  .topbar .kb-stage[hidden]{display:none}
  .topbar .kb-stage > .pr-ghost{flex:1;display:flex;flex-direction:column}
  .topbar .kb-stage .pr-now{flex:1 1 auto;min-height:0}
  .topbar .kb-stage .pr-now > div{display:flex;flex-direction:column;min-height:0}
  .topbar .kb-stage:not(.gtr) .pr-now{grid-template-columns:minmax(0,1fr)}
  /* 圖的高度照視窗高度收:矮的橫式平板(460px 高)也要看得到開始/停止鈕 */
  .topbar .kb-stage .pr-now b{font-size:clamp(26px, 6vh, 40px)}
  /* 圖在卡片剩下的空間裡等比例放到最大(SVG 預設 meet,框比圖寬/高時置中) */
  .topbar .kb-stage .pr-now .dg{flex:1 1 0;min-height:90px;height:auto;width:100%;max-width:min(100%, 420px);margin:6px auto 0}   /* 練習時手在琴上、眼睛離螢幕遠,圖可以比和弦分頁大 */
  .topbar .kb-stage .pr-now .dg.kb{max-width:100%;min-height:50px;aspect-ratio:auto}
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Harmony<span>Map</span></h1>

  <div class="header-right">

         這裡原本是反過來的,四個工具並排時只有這一頁的兩顆鈕位置對調 -->
    <!-- 使用說明:很多好用的操作(點音名只播單音、滑過和弦圖撥弦、快捷鍵…)第一次來看不出來,收在這顆 ? 裡。

        <circle cx="12" cy="12" r="9"/>
        <path d="M9.6 9.3a2.5 2.5 0 014.9.7c0 1.7-2.5 2.1-2.5 3.7"/>
        <path d="M12 17h.01"/>
      </svg>
    </button>
    <button class="btn" id="themeToggle" aria-label="淺色模式" aria-pressed="false" data-i18n-attr="aria-label:themeToggleLabel,title:themeToggleTitle" title="切換淺色/深色主題">
      <svg id="themeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 3a9 9 0 000 18z" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button class="btn" id="langToggle" aria-pressed="false" data-i18n-attr="aria-label:langToggleLabel,title:langToggleTitle" data-i18n="langToggleText">EN</button>
  </div>
</header>

<div class="help-pop" id="helpPop" hidden role="dialog" aria-modal="false" aria-labelledby="helpPopTitle"></div>
<div class="help-pop print-pop" id="printPop" hidden role="dialog" aria-modal="false" aria-labelledby="printPopTitle"></div>
<div id="printSheet" aria-hidden="true"></div>

<main>
  <!-- ══ 釘在上方的區塊:分頁 / 鍵盤 / 根音,捲動時不會離開畫面 ══ -->
  <div class="topbar">
    <!-- 分頁 + 樂器切換併成一列。樂器切換不是分頁(三個分頁在鋼琴與吉他底下都一樣),
         所以另外一組、不放進 tablist -->
    <div class="tab-row">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabChord" aria-selected="true" data-i18n="tabChord">和弦</button>
        <button role="tab" id="tabScale" aria-selected="false" data-i18n="tabScale">音階</button>
        <button role="tab" id="tabFind"  aria-selected="false" data-i18n="tabFind">辨識</button>
      </div>
      <div class="inst-switch" role="group" data-i18n-attr="aria-label:instLabel" aria-label="樂器">
        <!-- 吉他在左、鋼琴在右,跟和弦表下載視窗的樂器選項同一個順序(使用者要求) -->
        <button id="instGuitar" aria-pressed="true" data-i18n="instGuitar">吉他</button>
        <button id="instPiano" aria-pressed="false" data-i18n="instPiano">鋼琴</button>
      </div>
    </div>

    <div class="kb-wrap">
      <canvas id="keyboardCanvas" role="img"></canvas>
      <span id="audioStatus" class="audio-status" role="status" aria-live="polite" hidden></span>

      <div class="gtr-dgs" id="gtrDiagrams" hidden></div>
      <div class="kb-summary" id="kbSummary"></div>
      <!-- 起始八度/標示方式/播放方式都是「設一次就不太會再動」的設定,

      <div class="kb-popover" id="kbPopover" hidden>
        <label><span data-i18n="octaveLabel">起始八度</span><select class="mini" id="octaveSel"></select></label>
        <label><span data-i18n="keyLabelLabel">琴鍵標示</span><select class="mini" id="labelSel">
          <option value="en" data-i18n="labelOptEn">音名 C D E</option>
          <option value="do" data-i18n="labelOptDo">唱名 Do Re Mi</option>
          <option value="deg" data-i18n="labelOptDeg">數字 1 ♭3 5</option>
          <option value="off" data-i18n="labelOptOff">不標字</option>
        </select></label>
        <label><span data-i18n="playModeLabel">播放方式</span><select class="mini" id="playModeSel"></select></label>
        <label id="gtrToneRow"><span data-i18n="gtrToneLabel">吉他音色</span><select class="mini" id="gtrToneSel">
          <option value="acoustic" data-i18n="gtrToneAcoustic">民謠吉他(鋼弦)</option>
          <option value="nylon" data-i18n="gtrToneNylon">古典吉他(尼龍弦)</option>

        <label id="capoRow"><span data-i18n="capoLabel">移調夾</span><select class="mini" id="capoSel"></select></label>
        <label id="leftyRow"><span data-i18n="leftyLabel">慣用手</span><select class="mini" id="leftySel">
          <option value="0" data-i18n="leftyRight">右手</option>
          <option value="1" data-i18n="leftyLeft">左手(鏡像)</option>

      </div>
    </div>

    <!-- 練習時取代上方指板/鍵盤:「現在 / 下一個」兩張和弦圖 + 拍點 + 開始鈕,由 renderPractice() 填 -->

    <div class="card" id="rootCard">
      <div class="card-title" data-i18n="rootCardTitle">根音</div>

        <div class="root-row letters" id="letterRow"></div>
        <div class="acc-row" id="accRow"></div>
      </div>
      <div class="quick-grid" id="quickGrid"></div>

      </div>
    </div>

  <!-- ══ 只有這一區會捲動:和弦/音階清單 + 結果說明 ══ -->
  <div class="lower">

    <div class="card" id="practiceCard" hidden></div>

    <div class="card" id="typeCard">
      <!-- 篩選預設收合。它是「偶爾用一次」的功能,常駐展開會把主要內容(和弦清單)
           整個推到第一屏之外——實測手機版第一顆和弦落在 y=803 的 844px 畫面上 -->

      <div class="find-row">
        <div class="search-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

  </div>

/* t(key, vars):讀目前語言的字典,缺字退回中文、再退回 key 本身。
   vars 用來填 "{n}" 這種佔位符——八度數字、還差幾個音,這幾句話都要塞數字進去 */
function t(key, vars){
  let s = (I18N[LANG] && I18N[LANG][key]) || I18N.zh[key] || key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}
/* 和弦/音階字典本身每一條目已經同時有 zh/en 兩個欄位(不是介面文字,是樂理名詞),
   所以不走 I18N,直接依目前語言挑欄位。localName = 目前語言的主要名稱。
   subName = 副標用的對照名稱:中文介面附上英文原名(查資料、看譜都用得到),
   英文介面則**不附中文名**——英文版裡冒出一個中文名稱讀不出任何資訊,只是雜訊。
   所以 subName 在英文介面回傳空字串,呼叫端要連分隔號一起省略,
   不然會留下孤零零的「 · 」(用 nameWithSub() 就不必每個地方各判斷一次) */
function localName(def){ return LANG === "en" ? (def.en || def.zh) : def.zh; }
/* 摘要列(只有一行、空間最緊)用的短名稱:括號裡是別名或補充(大調(愛奧尼安)、變化音階(超級洛克里安))就拿掉;
   括號是用來區分兩個音階的(旋律小調(古典)/(爵士小調)、減音階(全半)/(半全))拿掉後會撞名,就保留。
   清單與結果面板照舊寫全名 */
function shortName(def){
  const full = localName(def), base = full.replace(/\s*[(（][^()（）]*[)）]\s*$/, "");
  if (base === full || !base) return full;
  return SCALES.some(x => x !== def && localName(x).replace(/\s*[(（][^()（）]*[)）]\s*$/, "") === base) ? full : base;
}
/* 摘要列的音階名:大調/小調類保留中文,其他調式(弗里吉安、利底亞…)一律用英文,中文音譯看不懂 */
function summaryScaleName(def){
  return LANG === "zh" && def.en && !/大調|小調/.test(def.zh) ? def.en : shortName(def);
}
function subName(def){ return LANG === "en" ? "" : (def.en || def.zh); }
function nameWithSub(main, def){ const s = subName(def); return s ? main + " · " + s : main; }
/* 每個和弦/音階的長篇說明(def.d)也有對應的英文版 def.d_en,挑法跟 localName 一樣。
   沒有 d_en 就退回中文,不要讓面板開天窗(200 條理論上都已經補好了) */
function localDesc(def){ return LANG === "en" ? (def.d_en || def.d) : def.d; }

/* 走一遍 DOM,把 data-i18n / data-i18n-attr 標記的文字換成目前語言。
   同一份元素、同一份 DOM 結構,只換文字內容——不是中英文各刻一份畫面 */
function applyLanguage(lang){
  LANG = (lang === "en") ? "en" : "zh";
  try { localStorage.setItem(LANG_KEY, LANG); } catch (e) {}
  document.documentElement.lang = LANG === "en" ? "en" : "zh-Hant";
  document.documentElement.setAttribute("data-lang", LANG);
  document.title = t("pageTitle");
  const titleTag = $("pageTitle");
  if (titleTag) titleTag.textContent = t("pageTitle");
  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.setAttribute("content", t("pageTitle"));
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-attr]").forEach(el => {
    el.getAttribute("data-i18n-attr").split(",").forEach(pair => {
      const [attr, key] = pair.split(":");
      if (attr && key) el.setAttribute(attr.trim(), t(key.trim()));
    });
  });
  const lt = $("langToggle");
  if (lt) lt.setAttribute("aria-pressed", String(LANG === "en"));
  // 鋼琴取樣還在載入/失敗時,狀態文字是用 setAudioStatus() 存 key 記住的——
  // 換語言時補一次,免得它停在切換前的語言,一直等到下一次狀態變化才會更新
  if (typeof audioStatusKey !== "undefined" && audioStatusKey && typeof setAudioStatus === "function") {
    setAudioStatus(audioStatusKey);
  }
  // 動態產生的內容(清單、篩選列、鍵盤摘要、結果面板…)不是靠 data-i18n 走的,
  // 換語言之後要整套重新 render 一次,才不會留下舊語言的殘影
  if (typeof render === "function") render();
}

/* ══════════════════════════════════════════════════════════════
   1. 樂理核心:音名拼寫
   ──────────────────────────────────────────────────────────────
   「C 小三度」寫成 E♭ 而不是 D♯,是因為三度就必須落在 C 往上數第三個字母 E 上。
   所以這裡不用「12 個音的查表」,而是照樂理規則推:
     字母 = 根音字母 + (級數 - 1),升降記號 = 目標音高 - 該字母的自然音高。
   這樣 Cdim7 會正確地拼成 C E♭ G♭ B♭♭(而不是 C D♯ F♯ A),
   Locrian 的 ♭5 也不會被寫成 ♯4。
   ══════════════════════════════════════════════════════════════ */
const LETTERS   = ["C","D","E","F","G","A","B"];
const LETTER_PC = [0, 2, 4, 5, 7, 9, 11];        // 各字母的自然音高(半音)
const SOLFEGE   = ["Do","Re","Mi","Fa","Sol","La","Si"]; // 固定唱名,跟字母一一對應
/* 級數 → 相對根音的半音數(自然音程) */
const DEG_SEMI  = {1:0, 2:2, 3:4, 4:5, 5:7, 6:9, 7:11, 9:14, 11:17, 13:21};

function accText(n){
  if (n === 0) return "";
  if (n > 0) return "♯".repeat(n);
  return "♭".repeat(-n);
}
/* 把 "♭13"、"♯11"、"♭♭7"、"5" 這種級數代號拆成 {deg, alt} */
function parseToken(tok){
  let alt = 0, i = 0;
  while (i < tok.length && (tok[i] === "♭" || tok[i] === "♯")) { alt += tok[i] === "♯" ? 1 : -1; i++; }
  return { deg: parseInt(tok.slice(i), 10), alt };
}
function tokenSemi(tok){
  const { deg, alt } = parseToken(tok);
  return DEG_SEMI[deg] + alt;
}
/* 根音(字母序號 + 升降)加上一個級數代號,推出該音的正規拼寫與相對半音 */
function spell(rootLetter, rootAcc, tok){
  const { deg } = parseToken(tok);
  const semi     = tokenSemi(tok);
  const step     = rootLetter + (deg - 1);
  const letter   = step % 7;
  const carry    = Math.floor(step / 7);            // 跨過 B→C 要補一個八度
  const absolute = LETTER_PC[rootLetter] + rootAcc + semi;
  const natural  = LETTER_PC[letter] + 12 * carry;
  let acc = absolute - natural;
  let name;
  if (acc < -2 || acc > 2) {
    // 三重升降(例如 G♯ 的利底安♯2)在實務上不會這樣寫,退回等音的簡易拼寫
    name = simpleName(((absolute % 12) + 12) % 12, acc < 0 ? "flat" : "sharp");
    acc = null;
  } else {
    name = LETTERS[letter] + accText(acc);
  }
  return { tok, deg, semi, name, letter, acc };
}
const SHARP_NAMES = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const FLAT_NAMES  = ["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];
function simpleName(pc, pref){ return (pref === "flat" ? FLAT_NAMES : SHARP_NAMES)[pc]; }
/* 音名 → 唱名(把字母換掉,升降記號原樣保留) */
function toSolfege(name){
  const idx = LETTERS.indexOf(name[0]);
  return idx < 0 ? name : SOLFEGE[idx] + name.slice(1);
}
function midiToFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }
