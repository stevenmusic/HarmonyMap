const SCALES = [
  // ── 大調七聲調式 ──
  {id:"ionian",     zh:"大調(愛奧尼安)", en:"Ionian / Major",       g:"大調七聲調式", t:["1","2","3","4","5","6","7"],        lv:3, d:"最基本的七聲音階,全全半全全全半。第四音是「避開音」,即興時不要在 I 級上久留。", d_en:"The most basic seven-note scale — whole, whole, half, whole, whole, whole, half. The 4th is an \"avoid note\" — don't linger on it over the I chord when improvising."},
  {id:"dorian",     zh:"多利安",          en:"Dorian",               g:"大調七聲調式", t:["1","2","♭3","4","5","6","♭7"],      lv:3, d:"小調系但六音是自然大六度,比自然小調明亮,是所有 m7 和弦的預設選擇。", d_en:"A minor-family scale with a natural major 6th, brighter than natural minor — the default choice over any m7 chord."},
  {id:"phrygian",   zh:"弗里吉安",        en:"Phrygian",             g:"大調七聲調式", t:["1","♭2","♭3","4","5","♭6","♭7"],    lv:3, d:"♭2 是最大特徵,帶有西班牙、佛朗明哥式的暗色與異國感。", d_en:"The ♭2 is its defining feature, giving it a dark, exotic, Spanish/flamenco color."},
  {id:"lydian",     zh:"利底安",          en:"Lydian",               g:"大調七聲調式", t:["1","2","3","♯4","5","6","7"],       lv:3, d:"比大調多一個 ♯4,沒有避開音,明亮到有點夢幻,電影配樂裡的「奇蹟感」。", d_en:"One extra ♯4 compared to the major scale, with no avoid note — bright to the point of dreamy, the \"sense of wonder\" sound in film scoring."},
  {id:"mixolydian", zh:"米索利地安",      en:"Mixolydian",           g:"大調七聲調式", t:["1","2","3","4","5","6","♭7"],       lv:3, d:"大調把七音降半音,是屬七和弦的家鄉,藍調搖滾與放克的骨幹。", d_en:"The major scale with the 7th lowered a half step — the home scale of the dominant 7th chord, the backbone of blues rock and funk."},
  {id:"aeolian",    zh:"自然小調(愛奧利安)", en:"Aeolian / Natural Minor", g:"大調七聲調式", t:["1","2","♭3","4","5","♭6","♭7"], lv:3, d:"最標準的小調音階,♭6 讓它比多利安更沉、更有悲劇感。", d_en:"The most standard minor scale — the ♭6 makes it darker and more tragic-sounding than Dorian."},
  {id:"locrian",    zh:"洛克里安",        en:"Locrian",              g:"大調七聲調式", t:["1","♭2","♭3","4","♭5","♭6","♭7"],   lv:3, d:"唯一五音是減五度的調式,主和弦是 m7♭5,不穩定到幾乎無法當作終止。", d_en:"The only mode with a diminished 5th — its tonic chord is m7♭5, so unstable it can barely function as a point of rest."},

  // ── 和聲小調系統 ──
  {id:"harmMinor",  zh:"和聲小調",        en:"Harmonic Minor",       g:"和聲小調系統", t:["1","2","♭3","4","5","♭6","7"],      lv:3, d:"自然小調把七音升回導音,才能在小調得到真正的屬七和弦。♭6 到 7 的增二度是它的異國味來源。", d_en:"Natural minor with the 7th raised back to a leading tone, so a minor key can get a real dominant 7th chord. The augmented 2nd from ♭6 to 7 is the source of its exotic flavor."},
  {id:"locrian6",   zh:"洛克里安 ♮6",     en:"Locrian ♮6",           g:"和聲小調系統", t:["1","♭2","♭3","4","♭5","6","♭7"],    lv:1, d:"和聲小調的第二級,用在 m7♭5 上時可以帶出自然六度的亮點。", d_en:"The 2nd degree of harmonic minor — used over m7♭5 it brings out the bright spot of a natural 6th."},
  {id:"ionianAug",  zh:"大調 ♯5",         en:"Ionian ♯5",            g:"和聲小調系統", t:["1","2","3","4","♯5","6","7"],       lv:2, d:"和聲小調的第三級,對應 maj7♯5,聽感華麗而略帶不安。", d_en:"The 3rd degree of harmonic minor, matching maj7♯5 — a lavish sound with a hint of unease."},
  {id:"dorian4",    zh:"烏克蘭小調(多利安♯4)", en:"Ukrainian Dorian", g:"和聲小調系統", t:["1","2","♭3","♯4","5","6","♭7"],  lv:2, d:"和聲小調的第四級,♯4 加上自然 6,東歐與克萊茲梅爾音樂的典型色彩。", d_en:"The 4th degree of harmonic minor — ♯4 plus a natural 6th, the classic color of Eastern European and klezmer music."},
  {id:"phrygDom",   zh:"弗里吉安屬音階",  en:"Phrygian Dominant",    g:"和聲小調系統", t:["1","♭2","3","4","5","♭6","♭7"],     lv:2, d:"和聲小調的第五級,大三度配 ♭2 與 ♭6,是中東與佛朗明哥最具代表性的聲音。", d_en:"The 5th degree of harmonic minor — a major 3rd paired with ♭2 and ♭6, the most representative sound of Middle Eastern and flamenco music."},
  {id:"lydian2",    zh:"利底安 ♯2",       en:"Lydian ♯2",            g:"和聲小調系統", t:["1","♯2","3","♯4","5","6","7"],      lv:2, d:"和聲小調的第六級,兩個增音程讓它比利底安更奇幻。", d_en:"The 6th degree of harmonic minor — two augmented intervals make it even more fantastical than Lydian."},
  {id:"superLocBB7",zh:"超級洛克里安 ♭♭7", en:"Altered ♭♭7",          g:"和聲小調系統", t:["1","♭2","♭3","♭4","♭5","♭6","♭♭7"],d:"和聲小調的第七級,主和弦是減七和弦,用在 dim7 上的完整音階。", d_en:"The 7th degree of harmonic minor — its tonic chord is a diminished 7th; the complete scale to use over dim7."},

  // ── 旋律小調系統 ──
  {id:"melMinor",   zh:"旋律小調(爵士小調)", en:"Melodic Minor",     g:"旋律小調系統", t:["1","2","♭3","4","5","6","7"],       lv:3, d:"小三度配自然六、七度。爵士裡上下行都用同一組音,是七個現代調式的母體。", d_en:"A minor 3rd paired with a natural 6th and 7th. In jazz, the same notes are used ascending and descending — the parent scale of the seven modern modes."},
  // 古典旋律小調:上行升高 6、7 級,下行改用自然小調(down)。音高集合跟爵士旋律小調的上行一樣,
  // 但下行不同,所以不算「同音重複」(pitchKey 連下行一起比)
  {id:"melMinorCl", zh:"旋律小調(古典)",   en:"Melodic Minor (Classical)", g:"旋律小調系統", t:["1","2","♭3","4","5","6","7"], down:["1","2","♭3","4","5","♭6","♭7"], lv:2, d:"古典和聲的旋律小調:上行把 6、7 級升高(避開和聲小調 ♭6 到 7 的增二度,並保留導音),下行不需要導音,改回自然小調的 ♭7、♭6。「逐音上下行」播放時下行照這個規則走;鍵盤與公式顯示的是上行。", d_en:"Melodic minor as used in classical harmony: ascending raises the 6th and 7th (avoiding harmonic minor's augmented 2nd from ♭6 to 7 while keeping the leading tone); descending needs no leading tone and returns to natural minor's ♭7 and ♭6. The \"Up & down\" playback follows this rule on the way down; the keyboard and formula show the ascending form."},
  {id:"dorianb2",   zh:"多利安 ♭2",       en:"Dorian ♭2 / Phrygian ♮6", g:"旋律小調系統", t:["1","♭2","♭3","4","5","6","♭7"],  lv:2, d:"旋律小調第二級,用在 sus♭9 這類和弦上,暗色但仍保有六度的亮點。", d_en:"The 2nd degree of melodic minor — used over sus♭9-type chords, dark but still keeping the bright spot of the 6th."},
  {id:"lydianAug",  zh:"利底安 ♯5",       en:"Lydian Augmented",     g:"旋律小調系統", t:["1","2","3","♯4","♯5","6","7"],      lv:2, d:"旋律小調第三級,對應 maj7♯5,完全沒有重力感的漂浮音階。", d_en:"The 3rd degree of melodic minor, matching maj7♯5 — a completely weightless, floating scale."},
  {id:"lydianDom",  zh:"利底安屬音階",    en:"Lydian Dominant",      g:"旋律小調系統", t:["1","2","3","♯4","5","6","♭7"],      lv:2, d:"旋律小調第四級,又稱 Overtone 音階(接近自然泛音列),是 7♯11 與三全音代理的標準選擇。", d_en:"The 4th degree of melodic minor, also called the Overtone scale (close to the natural harmonic series) — the standard choice for 7♯11 and tritone substitution."},
  {id:"mixob6",     zh:"米索利地安 ♭6",   en:"Mixolydian ♭6",        g:"旋律小調系統", t:["1","2","3","4","5","♭6","♭7"],      lv:2, d:"旋律小調第五級,又稱印度音階,屬七和弦帶 ♭13 時用它。", d_en:"The 5th degree of melodic minor, also called the Hindu scale — used over dominant chords carrying a ♭13."},
  {id:"locrian2",   zh:"半減音階(洛克里安♮2)", en:"Locrian ♮2",      g:"旋律小調系統", t:["1","2","♭3","4","♭5","♭6","♭7"],    lv:2, d:"旋律小調第六級,比一般洛克里安多了自然九音,是小調 ii 級 m7♭5 的首選。", d_en:"The 6th degree of melodic minor — has a natural 9th that ordinary Locrian lacks, the first choice for a minor-key ii chord voiced as m7♭5."},
  {id:"altered",    zh:"變化音階(超級洛克里安)", en:"Altered / Super Locrian", g:"旋律小調系統", t:["1","♭2","♭3","♭4","♭5","♭6","♭7"], lv:2, d:"旋律小調第七級,含 ♭9 ♯9 ♭5 ♯5 四個變化音(♭4 其實就是大三度),7alt 的專屬音階。", d_en:"The 7th degree of melodic minor, containing four altered tones — ♭9, ♯9, ♭5, ♯5 (the ♭4 is enharmonically a major 3rd) — the dedicated scale for 7alt."},

  // ── 和聲大調系統 ──
  {id:"harmMajor",  zh:"和聲大調",        en:"Harmonic Major",       g:"和聲大調系統", t:["1","2","3","4","5","♭6","7"],       lv:2, d:"大調把六音降半音,同時擁有大三度與 ♭6,常用在 IV 級轉小調的瞬間。", d_en:"The major scale with the 6th lowered a half step, keeping both the major 3rd and the ♭6 — often used at the moment a IV chord tips into minor."},
  {id:"dorianb5", zh:"多利安 ♭5", en:"Dorian ♭5", g:"和聲大調系統", t:["1","2","♭3","4","♭5","6","♭7"], lv:1, d:"和聲大調第二級。小三度配 ♭5 又保留大六度,是 IIm7♭5 上的另一種選擇;比洛克里安 ♮2 多了自然六度,聽起來亮一點。", d_en:"The 2nd degree of harmonic major. A minor 3rd paired with ♭5 while keeping the major 6th — an alternative for IIm7♭5; with its natural 6th it sounds a little brighter than Locrian ♮2."},
  {id:"phrygianb4", zh:"弗里吉安 ♭4", en:"Phrygian ♭4", g:"和聲大調系統", t:["1","♭2","♭3","♭4","5","♭6","♭7"], lv:1, d:"和聲大調第三級。♭4 讓三音與四音擠在一起,張力極高,少見但適合營造不安。", d_en:"The 3rd degree of harmonic major. The ♭4 squeezes right up against the 3rd for very high tension — rare, but good for building unease."},
  {id:"lydianb3", zh:"利底安 ♭3", en:"Lydian ♭3", g:"和聲大調系統", t:["1","2","♭3","♯4","5","6","7"], lv:2, d:"和聲大調第四級,又稱 Lydian Diminished。小三度配 ♯4 與大七度,可用在 mMaj7♯11。", d_en:"The 4th degree of harmonic major, also called Lydian Diminished. A minor 3rd paired with ♯4 and a major 7th — usable over mMaj7♯11."},
  {id:"mixob2", zh:"米索利地安 ♭2", en:"Mixolydian ♭2", g:"和聲大調系統", t:["1","♭2","3","4","5","6","♭7"], lv:2, d:"和聲大調第五級。屬和弦配 ♭9 但保留大十三度,是 7♭9 上很好用的選擇。", d_en:"The 5th degree of harmonic major. A dominant chord with ♭9 that keeps the major 13th — a great choice over 7♭9."},
  {id:"lydAug2", zh:"增利底安 ♯2", en:"Lydian Augmented ♯2", g:"和聲大調系統", t:["1","♯2","3","♯4","♯5","6","7"], lv:1, d:"和聲大調第六級。三個升高音,漂浮又帶增二度,現代配樂用來寫神祕感。", d_en:"The 6th degree of harmonic major. Three raised tones — floating, with an augmented 2nd — used in modern scoring to write a sense of mystery."},
  {id:"locrianbb7", zh:"洛克里安 ♭♭7", en:"Locrian ♭♭7", g:"和聲大調系統", t:["1","♭2","♭3","4","♭5","♭6","♭♭7"], lv:1, d:"和聲大調第七級。與減七和弦完全相合,是 dim7 上的音階選擇。", d_en:"The 7th degree of harmonic major. A perfect match for a diminished 7th chord — the scale choice over dim7."},

  // ── 雙和聲大調系統 ──
  {id:"dblHarm",    zh:"雙和聲大調(拜占庭)", en:"Double Harmonic",   g:"雙和聲大調系統", t:["1","♭2","3","4","5","♭6","7"],      lv:2, d:"兩個增二度,又稱阿拉伯/吉普賽大調,異國感最強烈的七聲音階。", d_en:"Two augmented 2nds, also called the Arabic/Gypsy major scale — the most strongly exotic-sounding seven-note scale."},
  {id:"lydian26", zh:"利底安 ♯2 ♯6", en:"Lydian ♯2 ♯6", g:"雙和聲大調系統", t:["1","♯2","3","♯4","5","♯6","7"], lv:1, d:"雙和聲大調第二級。♯2 ♯4 ♯6 三個升高音,兩個增二度,最外放的一個調式。", d_en:"The 2nd degree of double harmonic major. Three raised tones — ♯2, ♯4, ♯6 — and two augmented 2nds, the most outward-facing of these modes."},
  {id:"ultraphryg", zh:"超弗里吉安", en:"Ultraphrygian", g:"雙和聲大調系統", t:["1","♭2","♭3","♭4","5","♭6","♭♭7"], lv:1, d:"雙和聲大調第三級,又稱弗里吉安 ♭4 ♭♭7。半音與增二度交錯,幾乎沒有穩定音。", d_en:"The 3rd degree of double harmonic major, also called Phrygian ♭4 ♭♭7. Half steps and augmented 2nds interleave, with almost no stable tone."},
  {id:"hungMinor",  zh:"匈牙利小調",      en:"Hungarian Minor",      g:"雙和聲大調系統", t:["1","2","♭3","♯4","5","♭6","7"],     lv:2, d:"和聲小調再把四音升高,同時有 ♯4 與導音,東歐吉普賽音樂的代表。", d_en:"Harmonic minor with the 4th also raised — has both ♯4 and a leading tone, representative of Eastern European Gypsy music."},
  {id:"oriental", zh:"東方音階", en:"Oriental", g:"雙和聲大調系統", t:["1","♭2","3","4","♭5","6","♭7"], lv:2, d:"雙和聲大調第五級,又稱 Mixolydian ♭5 ♭9。中東與東歐旋律常見的下行色彩。", d_en:"The 5th degree of double harmonic major, also called Mixolydian ♭5 ♭9 — a common descending color in Middle Eastern and Eastern European melodies."},
  {id:"ionianAug2", zh:"增愛奧尼安 ♯2", en:"Ionian Augmented ♯2", g:"雙和聲大調系統", t:["1","♯2","3","4","♯5","6","7"], lv:1, d:"雙和聲大調第六級。大調骨架配 ♯2 與 ♯5,古典晚期與配樂裡的增和弦素材。", d_en:"The 6th degree of double harmonic major. A major-scale skeleton with ♯2 and ♯5 — augmented-chord material from the late-Romantic era and film scoring."},
  {id:"locrianbb3bb7", zh:"洛克里安 ♭♭3 ♭♭7", en:"Locrian ♭♭3 ♭♭7", g:"雙和聲大調系統", t:["1","♭2","♭♭3","4","♭5","♭6","♭♭7"], lv:1, d:"雙和聲大調第七級。拼寫上出現兩個重降音,實際音高與雙和聲大調同一組。", d_en:"The 7th degree of double harmonic major. Spelled with two double-flats, but the same pitches as double harmonic major."},

  // ── 五聲與藍調 ──
  {id:"majPent",    zh:"大調五聲",        en:"Major Pentatonic",     g:"五聲與藍調", t:["1","2","3","5","6"],                lv:3, d:"大調拿掉四音與七音,沒有半音衝突,怎麼彈都不會錯,民謠與鄉村的基礎。", d_en:"The major scale with the 4th and 7th removed — no half-step clashes, so nothing you play sounds wrong. The foundation of folk and country music."},
  {id:"minPent",    zh:"小調五聲",        en:"Minor Pentatonic",     g:"五聲與藍調", t:["1","♭3","4","5","♭7"],              lv:3, d:"搖滾與藍調獨奏的第一課,與大調五聲互為關係音階(相差小三度)。", d_en:"Lesson one for rock and blues soloing, and the relative scale of major pentatonic (a minor 3rd apart)."},
  {id:"bluesMin",   zh:"小調藍調",        en:"Minor Blues",          g:"五聲與藍調", t:["1","♭3","4","♭5","5","♭7"],         lv:3, d:"小調五聲插入 ♭5 這顆藍調音,經過性地滑過去最有味道。", d_en:"Minor pentatonic with the ♭5 blue note dropped in — sounds best slid through as a passing tone."},
  {id:"bluesMaj",   zh:"大調藍調",        en:"Major Blues",          g:"五聲與藍調", t:["1","2","♭3","3","5","6"],           lv:2, d:"大調五聲插入 ♭3,♭3→3 的滑音是鄉村與西岸藍調的招牌。", d_en:"Major pentatonic with a ♭3 dropped in — the ♭3→3 slide is the signature move of country and West Coast blues."},
  {id:"egyptian",   zh:"埃及五聲(sus)",   en:"Egyptian / Sus Pent",  g:"五聲與藍調", t:["1","2","4","5","♭7"],               lv:1, d:"大調五聲的第二轉位,全是二度與四度堆疊,開放且無調性傾向。", d_en:"The second inversion of major pentatonic — entirely stacked 2nds and 4ths, open and with no clear tonal leaning."},

  // ── 日本音階 ──
  {id:"hirajoshi",  zh:"平調子",          en:"Hirajoshi",            g:"日本音階", t:["1","2","♭3","5","♭6"],              lv:2, d:"日本箏最常見的定弦音階,兩個半音落點讓它一聽就有和風。", d_en:"The most common tuning scale for the Japanese koto — its two half-step landings give it an unmistakable Japanese sound."},
  {id:"kumoi",      zh:"雲井調子",        en:"Kumoi",                g:"日本音階", t:["1","2","♭3","5","6"],               lv:2, d:"小調五聲換掉四音與七音、帶自然六度,清澈明亮的和風小調。", d_en:"Minor pentatonic with the 4th and 7th swapped out for a natural 6th — a clear, bright, Japanese-flavored minor scale."},
  {id:"miyakobushi",zh:"都節音階",        en:"Miyako-bushi",         g:"日本音階", t:["1","♭2","4","5","♭6"],              lv:2, d:"江戶時代都市音樂的代表音階,♭2 與 ♭6 兩個半音是它的招牌,聽起來最「日本」。", d_en:"The representative scale of Edo-period urban music — its two half steps, ♭2 and ♭6, are its signature, and it sounds the most \"Japanese\" of all."},
  {id:"insen",      zh:"陰旋音階",        en:"Insen",                g:"日本音階", t:["1","♭2","4","5","♭7"],              lv:1, d:"都節把 ♭6 換成 ♭7,陰暗中多一點流動感,常用於尺八與箏曲。", d_en:"Miyako-bushi with ♭6 swapped for ♭7 — darker but with more flow, common in shakuhachi and koto music."},
  {id:"iwato",      zh:"岩戶音階",        en:"Iwato",                g:"日本音階", t:["1","♭2","4","♭5","♭7"],             lv:1, d:"都節音階的轉位,含減五度,是日本音階裡最緊繃、最神祕的一個。", d_en:"An inversion of Miyako-bushi containing a diminished 5th — the tensest, most mysterious of the Japanese scales."},
  {id:"ryukyu",     zh:"琉球音階",        en:"Ryukyu / Okinawan",    g:"日本音階", t:["1","3","4","5","7"],                lv:2, d:"沖繩民謠的音階,拿掉二音與六音、保留大三與大七,明亮而獨特,與本土的陰暗和風完全相反。", d_en:"The scale of Okinawan folk music — drops the 2nd and 6th, keeps the major 3rd and major 7th, bright and distinct, the opposite of the dark mainland Japanese sound."},
  {id:"ritsu",      zh:"律音階",          en:"Ritsu",                g:"日本音階", t:["1","2","4","5","6"],                lv:1, d:"雅樂使用的音階,沒有半音,聽感平穩莊重。", d_en:"A scale used in gagaku court music, with no half steps — calm and stately."},
  {id:"minyo",      zh:"民謠音階",        en:"Min'yō",               g:"日本音階", t:["1","♭3","4","5","♭7"],              lv:1, d:"日本民謠的骨幹,音程結構與小調五聲相同,差別在旋律的走法與裝飾。", d_en:"The backbone of Japanese folk song — the same interval structure as minor pentatonic, differing in melodic movement and ornamentation."},
  {id:"ryo",        zh:"呂音階",          en:"Ryo",                  g:"日本音階", t:["1","2","3","5","6"],                lv:1, d:"與律音階相對的雅樂音階,結構等同大調五聲,明亮開闊。", d_en:"The gagaku counterpart to Ritsu — structurally identical to major pentatonic, bright and open."},

  // ── 阿拉伯與中東 ──
  {id:"hijaz",      zh:"希賈茲",          en:"Hijaz",                g:"阿拉伯與中東", t:["1","♭2","3","4","5","♭6","♭7"],  lv:2, d:"最廣為人知的馬卡姆,♭2 到 3 的增二度就是「中東感」的來源。音高結構與弗里吉安屬音階相同。", d_en:"The best-known maqam — the augmented 2nd from ♭2 to 3 is the source of that \"Middle Eastern\" feeling. Same pitches as Phrygian Dominant."},
  {id:"hijazkar",   zh:"希賈茲卡爾",      en:"Hijaz Kar",            g:"阿拉伯與中東", t:["1","♭2","3","4","5","♭6","7"],   lv:2, d:"上下半部都是希賈茲四音列,兩個增二度,又稱雙和聲大調、拜占庭音階。", d_en:"Both halves are Hijaz tetrachords, giving two augmented 2nds — also called double harmonic major or the Byzantine scale."},
  {id:"nahawand",   zh:"納哈萬德",        en:"Nahawand",             g:"阿拉伯與中東", t:["1","2","♭3","4","5","♭6","7"],   lv:2, d:"阿拉伯音樂裡的小調,結構等同和聲小調,是最貼近西方耳朵的馬卡姆之一。", d_en:"The minor scale of Arabic music — structurally identical to harmonic minor, one of the maqamat closest to Western ears."},
  {id:"kurd",       zh:"庫爾德",          en:"Kurd",                 g:"阿拉伯與中東", t:["1","♭2","♭3","4","5","♭6","♭7"], lv:2, d:"結構等同弗里吉安,現代阿拉伯流行歌大量使用。", d_en:"Structurally identical to Phrygian — used heavily in modern Arabic pop."},
  {id:"ajam",       zh:"阿賈姆",          en:"Ajam",                 g:"阿拉伯與中東", t:["1","2","3","4","5","6","7"],      lv:2, d:"阿拉伯音樂裡的大調,結構等同 Ionian,明亮、節慶感。", d_en:"The major scale of Arabic music — structurally identical to Ionian, bright and festive."},
  {id:"bayati",     zh:"巴亞提",          en:"Bayati",               g:"阿拉伯與中東", t:["1","2","♭3","4","5","♭6","♭7"],  lv:2, d:"最常用的馬卡姆之一。真正的巴亞提第二音是四分之一音(比 ♮2 略低),鋼琴彈不出來,這裡用最接近的十二平均律近似。", d_en:"One of the most-used maqamat. The true 2nd degree of Bayati is a quarter tone (slightly lower than ♮2), which a piano can't play — this is its closest 12-tone-equal-temperament approximation."},
  {id:"rast",       zh:"拉斯特",          en:"Rast",                 g:"阿拉伯與中東", t:["1","2","3","4","5","6","♭7"],     lv:2, d:"馬卡姆體系的「基準音階」,三音與七音實際是四分之一音,鋼琴上以 Mixolydian 近似。", d_en:"The \"reference scale\" of the maqam system — the 3rd and 7th are actually quarter tones, approximated on piano as Mixolydian."},
  {id:"saba",       zh:"薩巴",            en:"Saba",                 g:"阿拉伯與中東", t:["1","2","♭3","♭4","5","♭6","♭7"], lv:1, d:"四音就降下來(♭4),形成獨特的哀傷色彩,是最容易辨認的馬卡姆之一。", d_en:"The 4th degree drops a half step (♭4), giving it a distinctively mournful color — one of the most recognizable maqamat."},
  {id:"nikriz",     zh:"尼克里茲",        en:"Nikriz",               g:"阿拉伯與中東", t:["1","2","♭3","♯4","5","6","♭7"],  lv:1, d:"♯4 配自然六度,結構等同烏克蘭小調,土耳其與巴爾幹音樂常見。", d_en:"♯4 paired with a natural 6th — structurally identical to Ukrainian Dorian, common in Turkish and Balkan music."},
  {id:"nawaathar",  zh:"納瓦阿薩爾",      en:"Nawa Athar",           g:"阿拉伯與中東", t:["1","2","♭3","♯4","5","♭6","7"],  lv:1, d:"兩個增二度的小調型馬卡姆,結構等同匈牙利小調。", d_en:"A minor-type maqam with two augmented 2nds — structurally identical to Hungarian minor."},
  {id:"suznak",     zh:"蘇茲納克",        en:"Suznak",               g:"阿拉伯與中東", t:["1","2","3","4","5","♭6","7"],     lv:1, d:"下半部是拉斯特、上半部是希賈茲,結構等同和聲大調。", d_en:"The lower half is Rast, the upper half is Hijaz — structurally identical to harmonic major."},
  {id:"zanjaran",   zh:"贊賈蘭",          en:"Zanjaran",             g:"阿拉伯與中東", t:["1","♭2","3","4","5","6","♭7"],    lv:1, d:"希賈茲四音列配上明亮的自然六度,聽感比一般希賈茲開朗。", d_en:"A Hijaz tetrachord paired with a bright natural 6th — sounds more cheerful than typical Hijaz."},
  {id:"atharkurd",  zh:"阿薩爾庫爾德",    en:"Athar Kurd",           g:"阿拉伯與中東", t:["1","♭2","♭3","♯4","5","♭6","7"], lv:1, d:"庫爾德起頭、增四度轉折,是馬卡姆裡結構最曲折的一支。", d_en:"Starts as Kurd, then turns through an augmented 4th — the most winding structure among the maqamat."},
  {id:"persian",    zh:"波斯音階",        en:"Persian",              g:"阿拉伯與中東", t:["1","♭2","3","4","♭5","♭6","7"],  lv:1, d:"兩個增二度加減五度,異國情調濃厚,常見於電影配樂對「東方」的想像。", d_en:"Two augmented 2nds plus a diminished 5th — heavily exotic, often used in film scoring to evoke \"the East\"."},
  {id:"jiharkah", zh:"賈哈爾卡", en:"Jiharkah", g:"阿拉伯與中東", t:["1","2","3","4","5","6","♭7"], lv:1, d:"阿賈姆家族的馬卡姆,以大調四音列起頭、七音降半音,音高與米索利地安相同。", d_en:"A maqam of the Ajam family — starts with a major tetrachord, 7th lowered a half step — the same pitches as Mixolydian."},
  {id:"farahfaza", zh:"法拉赫法扎", en:"Farahfaza", g:"阿拉伯與中東", t:["1","2","♭3","4","5","♭6","♭7"], lv:1, d:"納哈萬德家族的馬卡姆,音高與自然小調相同,差別在旋律的行進與終止習慣。", d_en:"A maqam of the Nahawand family — same pitches as natural minor, differing in melodic movement and cadence habits."},
  {id:"shawqafza", zh:"蕭克阿夫扎", en:"Shawq Afza", g:"阿拉伯與中東", t:["1","2","3","4","5","♭6","7"], lv:1, d:"阿賈姆家族的馬卡姆,上半部改用希賈茲四音列,音高與和聲大調相同。", d_en:"A maqam of the Ajam family — the upper half switches to a Hijaz tetrachord; same pitches as harmonic major."},

  // ── 印度與其他亞洲 ──
  {id:"bilawal",    zh:"比拉瓦爾",        en:"Bilawal Thaat",        g:"印度與其他亞洲", t:["1","2","3","4","5","6","7"],      lv:2, d:"印度十大塔特(音階母體)之一,結構等同大調,是其他塔特的參照點。", d_en:"One of the ten Hindustani thaats (parent scales) — structurally identical to the major scale, the reference point for the other thaats."},
  {id:"khamaj",     zh:"卡瑪吉",          en:"Khamaj Thaat",         g:"印度與其他亞洲", t:["1","2","3","4","5","6","♭7"],     lv:1, d:"結構等同 Mixolydian,輕快的半古典曲目(Thumri)常用。", d_en:"Structurally identical to Mixolydian — common in lighter semi-classical repertoire (thumri)."},
  {id:"kafi",       zh:"卡菲",            en:"Kafi Thaat",           g:"印度與其他亞洲", t:["1","2","♭3","4","5","6","♭7"],    lv:2, d:"結構等同多利安,是北印度音樂裡最常見的小調型塔特。", d_en:"Structurally identical to Dorian — the most common minor-type thaat in North Indian music."},
  {id:"asavari",    zh:"阿薩瓦里",        en:"Asavari Thaat",        g:"印度與其他亞洲", t:["1","2","♭3","4","5","♭6","♭7"],   lv:1, d:"結構等同自然小調,晨間拉格的典型音階。", d_en:"Structurally identical to natural minor — the typical scale of morning ragas."},
  {id:"bhairavi",   zh:"拜拉維",          en:"Bhairavi Thaat",       g:"印度與其他亞洲", t:["1","♭2","♭3","4","5","♭6","♭7"],  lv:2, d:"結構等同弗里吉安,音樂會通常以拜拉維作結。", d_en:"Structurally identical to Phrygian — concerts traditionally close with Bhairavi."},
  {id:"bhairav",    zh:"拜拉夫",          en:"Bhairav Thaat",        g:"印度與其他亞洲", t:["1","♭2","3","4","5","♭6","7"],    lv:2, d:"結構等同雙和聲大調,清晨演奏的莊嚴拉格。", d_en:"Structurally identical to double harmonic major — a solemn raga performed at dawn."},
  {id:"kalyan",     zh:"卡揚",            en:"Kalyan Thaat",         g:"印度與其他亞洲", t:["1","2","3","♯4","5","6","7"],     lv:2, d:"結構等同利底安,黃昏拉格的代表。", d_en:"Structurally identical to Lydian — representative of evening ragas."},
  {id:"marwa",      zh:"馬爾瓦",          en:"Marwa Thaat",          g:"印度與其他亞洲", t:["1","♭2","3","♯4","5","6","7"],    lv:1, d:"♭2 配 ♯4,刻意迴避五音,懸浮而不安定。", d_en:"♭2 paired with ♯4, deliberately avoiding the 5th — suspended and unsettled."},
  {id:"purvi",      zh:"普爾維",          en:"Purvi Thaat",          g:"印度與其他亞洲", t:["1","♭2","3","♯4","5","♭6","7"],   lv:1, d:"馬爾瓦再把六音降下來,日落時分的拉格。", d_en:"Marwa with the 6th also lowered — a raga for sunset."},
  {id:"todi",       zh:"托迪",            en:"Todi Thaat",           g:"印度與其他亞洲", t:["1","♭2","♭3","♯4","5","♭6","7"],  lv:1, d:"三個降音配一個升四,是十大塔特裡張力最強的一個。", d_en:"Three lowered tones paired with a raised 4th — the most tense of the ten thaats."},
  {id:"gong",       zh:"宮調式",          en:"Gong (Chinese)",       g:"印度與其他亞洲", t:["1","2","3","5","6"],              lv:2, d:"中國五聲調式的第一調,以宮為主音,結構等同大調五聲,端正明亮。", d_en:"The first mode of the Chinese pentatonic system, centered on gong — structurally identical to major pentatonic, upright and bright."},
  {id:"shang",      zh:"商調式",          en:"Shang (Chinese)",      g:"印度與其他亞洲", t:["1","2","4","5","♭7"],             lv:1, d:"以商為主音的五聲調式,沒有三音,聽感中性開闊。", d_en:"A pentatonic mode centered on shang — no 3rd, a neutral, open sound."},
  {id:"jue",        zh:"角調式",          en:"Jue (Chinese)",        g:"印度與其他亞洲", t:["1","♭3","4","♭6","♭7"],           lv:1, d:"以角為主音的五聲調式,五個音裡沒有純五度,是五個調式中最不穩定的。", d_en:"A pentatonic mode centered on jue — none of its five notes form a perfect 5th, making it the least stable of the five modes."},
  {id:"zhi",        zh:"徵調式",          en:"Zhi (Chinese)",        g:"印度與其他亞洲", t:["1","2","4","5","6"],              lv:1, d:"以徵為主音的五聲調式,結構等同律音階,平和舒展。", d_en:"A pentatonic mode centered on zhi — structurally identical to Ritsu, calm and expansive."},
  {id:"yu",         zh:"羽調式",          en:"Yu (Chinese)",         g:"印度與其他亞洲", t:["1","♭3","4","5","♭7"],            lv:2, d:"以羽為主音的五聲調式,結構等同小調五聲,是中國音樂裡的「小調」。", d_en:"A pentatonic mode centered on yu — structurally identical to minor pentatonic, the closest thing to a \"minor key\" in Chinese music."},
  {id:"qingyue", zh:"清樂音階", en:"Qingyue (Chinese)", g:"印度與其他亞洲", t:["1","2","3","4","5","6","7"], lv:1, d:"中國七聲之一,五聲加清角(4)與變宮(7),音高與大調相同,魏晉至南北朝的清商樂系統。", d_en:"One of the Chinese heptatonic scales — pentatonic plus qingjiao (4) and biangong (7); same pitches as the major scale — the Qingshang system from the Wei-Jin through Northern-and-Southern-Dynasties era."},
  {id:"yayue", zh:"雅樂音階", en:"Yayue (Chinese)", g:"印度與其他亞洲", t:["1","2","3","♯4","5","6","7"], lv:1, d:"中國七聲之一,五聲加變徵(♯4)與變宮(7),音高與利底安相同,古代宮廷雅樂所用。", d_en:"One of the Chinese heptatonic scales — pentatonic plus bianzhi (♯4) and biangong (7); same pitches as Lydian — used in ancient imperial court music."},
  {id:"yanyue", zh:"燕樂音階", en:"Yanyue (Chinese)", g:"印度與其他亞洲", t:["1","2","3","4","5","6","♭7"], lv:1, d:"中國七聲之一,五聲加清角(4)與閏(♭7),音高與米索利地安相同,隋唐燕樂所用。", d_en:"One of the Chinese heptatonic scales — pentatonic plus qingjiao (4) and run (♭7); same pitches as Mixolydian — used in the banquet music of the Sui and Tang dynasties."},
  {id:"pelog",      zh:"貝洛(印尼)",      en:"Pelog",                g:"印度與其他亞洲", t:["1","♭2","♭3","5","♭6"],           lv:2, d:"甘美朗的七聲音律取五個音的近似。真正的貝洛音程不均等、也不落在十二平均律上。", d_en:"A seven-note approximation reduced to five for gamelan tuning. The true Pelog intervals are uneven and don't fall on 12-tone equal temperament."},
  {id:"slendro",    zh:"斯連德羅(印尼)",  en:"Slendro",              g:"印度與其他亞洲", t:["1","2","♭3","5","6"],             lv:2, d:"甘美朗的另一套音律,五個音接近等分八度,這裡同樣是十二平均律的近似。", d_en:"Another gamelan tuning system — its five notes divide the octave almost equally; again approximated here in 12-tone equal temperament."},

  // ── 非洲音階 ──
  {id:"tizita", zh:"提濟塔", en:"Tizita", g:"非洲音階", t:["1","2","3","5","6"], lv:2, d:"衣索比亞四大 qenet 之一,懷舊與思念的代名詞,音高與大調五聲相同。", d_en:"One of Ethiopia's four great qenet — synonymous with nostalgia and longing, same pitches as major pentatonic."},
  {id:"tizitaMin", zh:"提濟塔(小調)", en:"Tizita Minor", g:"非洲音階", t:["1","2","♭3","5","♭6"], lv:2, d:"提濟塔的小調變體,♭3 與 ♭6 讓同一套旋律轉為哀傷。", d_en:"The minor variant of Tizita — ♭3 and ♭6 turn the same melodic material melancholy."},
  {id:"bati", zh:"巴提", en:"Bati", g:"非洲音階", t:["1","3","4","5","7"], lv:1, d:"衣索比亞四大 qenet 之一,以大三度與導音構成明亮開闊的色彩。", d_en:"One of Ethiopia's four great qenet — built from a major 3rd and a leading tone for a bright, open color."},
  {id:"batiMin", zh:"巴提(小調)", en:"Bati Minor", g:"非洲音階", t:["1","♭3","4","5","♭7"], lv:1, d:"巴提的小調變體,音高與小調五聲相同,是 Ethio-jazz 最常見的底色。", d_en:"The minor variant of Bati — same pitches as minor pentatonic, the most common backdrop in Ethio-jazz."},
  {id:"ambassel", zh:"安巴塞爾", en:"Ambassel", g:"非洲音階", t:["1","♭2","4","5","♭6"], lv:1, d:"衣索比亞四大 qenet 之一,♭2 與 ♭6 讓它聽起來接近中東音階。", d_en:"One of Ethiopia's four great qenet — ♭2 and ♭6 make it sound close to a Middle Eastern scale."},
  {id:"anchihoye", zh:"安奇霍耶", en:"Anchihoye", g:"非洲音階", t:["1","♭2","4","♭5","6"], lv:1, d:"衣索比亞四大 qenet 之一,♭5 讓它在四個 qenet 裡最不穩定、最具異國感。", d_en:"One of Ethiopia's four great qenet — the ♭5 makes it the most unstable and exotic-sounding of the four."},

  // ── 對稱音階 ──
  {id:"wholeTone",  zh:"全音音階",        en:"Whole Tone",           g:"對稱音階", t:["1","2","3","♯4","♯5","♭7"],           lv:2, d:"全部由全音構成,只有兩組不同的全音音階存在。無中心感,對應 7♯5,德布西的印象派語彙。", d_en:"Built entirely from whole steps — only two distinct whole-tone scales exist. No tonal center; matches 7♯5, the vocabulary of Debussy's impressionism."},
  {id:"dimHW",      zh:"減音階(半全)",    en:"Half-Whole Diminished",g:"對稱音階", t:["1","♭2","♯2","3","♯4","5","6","♭7"],  lv:2, d:"半音、全音交替的八聲音階,含 ♭9 ♯9 ♯11 13 又保留完全五度,是 7♭9、13♭9、7♭9♯11 的標準選擇。", d_en:"An eight-note scale alternating half and whole steps, containing ♭9, ♯9, ♯11, and 13 while keeping the perfect 5th — the standard choice for 7♭9, 13♭9, and 7♭9♯11."},
  {id:"dimWH",      zh:"減音階(全半)",    en:"Whole-Half Diminished",g:"對稱音階", t:["1","2","♭3","4","♭5","♭6","6","7"],   lv:2, d:"全音、半音交替,主和弦是 dim7,四個小三度對稱,轉位後仍是同一組音。", d_en:"Alternating whole and half steps; its tonic chord is dim7. Four minor 3rds in symmetry, so the same pitches survive any inversion."},
  {id:"augmented",  zh:"增音階",          en:"Augmented",            g:"對稱音階", t:["1","♯2","3","5","♯5","7"],            lv:1, d:"小三度與半音交替的六聲音階,對應 maj7♯5,現代爵士的對稱素材。", d_en:"A six-note scale alternating minor 3rds and half steps, matching maj7♯5 — symmetric material in modern jazz."},
  {id:"chromatic",  zh:"半音階",          en:"Chromatic",            g:"對稱音階", t:["1","♭2","2","♭3","3","4","♭5","5","♭6","6","♭7","7"], lv:1, d:"十二個半音全用,沒有調性中心,實務上當作經過音的來源而不是即興的骨架。", d_en:"Uses all twelve half steps with no tonal center — in practice a source of passing tones rather than a skeleton for improvising."},

  // ── 其他七聲音階 ──
  {id:"harmMajor2", zh:"匈牙利大調",      en:"Hungarian Major",      g:"其他七聲音階", t:["1","♯2","3","♯4","5","6","♭7"],    lv:2, d:"增二度起頭配 ♯4,李斯特筆下吉普賽風格的大調版本。", d_en:"Opens with an augmented 2nd paired with ♯4 — the major-key version of Liszt's Gypsy style."},
  {id:"neapMinor",  zh:"拿坡里小調",      en:"Neapolitan Minor",     g:"其他七聲音階", t:["1","♭2","♭3","4","5","♭6","7"],     lv:2, d:"和聲小調配 ♭2,古典裡與拿坡里六和弦(♭II)一同出現。", d_en:"Harmonic minor with a ♭2 — appears in classical music alongside the Neapolitan sixth chord (♭II)."},
  {id:"neapMajor",  zh:"拿坡里大調",      en:"Neapolitan Major",     g:"其他七聲音階", t:["1","♭2","♭3","4","5","6","7"],      lv:1, d:"旋律小調配 ♭2,下半部是小調、上半部是大調的混血音階。", d_en:"Melodic minor with a ♭2 — a hybrid scale, minor in the lower half and major in the upper half."},
  {id:"romanianMaj", zh:"羅馬尼亞大調", en:"Romanian Major", g:"其他七聲音階", t:["1","♭2","3","♯4","5","6","♭7"], lv:1, d:"♭2 配 ♯4 的屬和弦色彩,巴爾幹與克萊茲梅爾音樂的常見素材。", d_en:"♭2 paired with ♯4 for a dominant-chord color — common material in Balkan and klezmer music."},
  {id:"locrianMaj", zh:"大洛克里安",      en:"Locrian Major",        g:"其他七聲音階", t:["1","2","3","4","♭5","♭6","♭7"],    lv:1, d:"大三度配減五度,拿坡里大調的第五級(C 大洛克里安 = F 拿坡里大調從 C 開始),又稱阿拉伯音階,用在 7♭5 這類和弦上。", d_en:"A major 3rd paired with a diminished 5th — the 5th mode of Neapolitan major (C Major Locrian = F Neapolitan major starting on C), also called the Arabian scale; used over 7♭5-type chords."},

  // ── Bebop 八聲音階 ──
  {id:"bebopDom",   zh:"屬七 Bebop",      en:"Bebop Dominant",       g:"Bebop 八聲音階", t:["1","2","3","4","5","6","♭7","7"],   lv:2, d:"米索利地安加一顆經過性的大七度,八個音剛好讓和弦內音落在正拍上。", d_en:"Mixolydian plus a passing major 7th — eight notes that land chord tones squarely on the beat."},
  {id:"bebopMaj",   zh:"大調 Bebop",      en:"Bebop Major",          g:"Bebop 八聲音階", t:["1","2","3","4","5","♯5","6","7"],   lv:2, d:"大調在五音與六音之間插入 ♯5,八分音符跑句時和弦音自動對齊拍點。", d_en:"The major scale with a ♯5 inserted between the 5th and 6th — chord tones automatically align to the beat in eighth-note runs."},
  {id:"bebopDor",   zh:"多利安 Bebop",    en:"Bebop Dorian",         g:"Bebop 八聲音階", t:["1","2","♭3","3","4","5","6","♭7"],  lv:2, d:"多利安在 ♭3 與 4 之間插入自然三度,是 ii 級跑句最順手的音階。", d_en:"Dorian with a natural 3rd inserted between ♭3 and 4 — the smoothest-running scale for ii-chord lines."},
  {id:"bebopMel",   zh:"旋律小調 Bebop",  en:"Bebop Melodic Minor",  g:"Bebop 八聲音階", t:["1","2","♭3","4","5","♯5","6","7"],  lv:2, d:"旋律小調插入 ♯5 經過音,小調長樂句的節奏對位工具。", d_en:"Melodic minor with a ♯5 passing tone inserted — a rhythmic-alignment tool for long minor-key phrases."},

   因為那才決定和弦的功能與可以搭配的音階。同一個家族裡的和弦共用同一組音階,

/* 風格標籤:和弦的風格不是它的內在屬性,而是「誰常用它」,所以做成可複選的篩選,
   不做成分組——分組放錯會把和弦藏起來,篩選只是縮小範圍 */
/* 第二個欄位存的是 I18N 的 key,不是直接寫死的文字——顯示時要透過 t() 換成目前語言 */
const STYLES = [["cl","styleCl"],["pop","stylePop"],["jz","styleJz"],["bl","styleBl"],["film","styleFilm"]];
/* 第二條軸:程度。刻意做成「單選一層」而不是「以上」的門檻——
   門檻式(≥2、≥3)永遠取不到「只有進階」那一層,而且「常見以上」會被讀成「全部」,
   實際上它做的是「排除進階」,意思剛好相反 */
const LEVELS = [[3,"levelEssential"],[2,"levelCommon"],[1,"levelAdvanced"]];
/* 第三條軸:編制。家族分組把三和弦與七和弦排在同一組(因為它們本來就是同一個家族,
   三和弦是種子、七和弦與延伸是往上疊的張力音),但「我現在只要三和弦」仍然是很常見的需求。
   同樣用篩選解決,而不是為它另開分組——分組一旦按音數切,家族就又被拆散了 */
const SIZES = [[3,"sizeTriad"],[4,"size7th"],[5,"sizeExt"]];
const DUPOPT = [[1,"dupOptLabel"]];
function sizeBucket(n){ return n <= 3 ? 3 : (n === 4 ? 4 : 5); }

/* 同音異名索引:阿拉伯與印度有大量音階與西方音階是同一組音高
   (庫爾德 = 弗里吉安、卡菲 = 多利安…)。這不是資料錯誤,而是音樂的事實——
   但要注意「同音高」不等於「同一個東西」:
     · 馬卡姆的拉斯特、巴亞提,定義音本來是四分之一音,鋼琴只能近似,
       「等於米索利地安」是近似之後才成立的
     · 印度的塔特(thaat)只是拉格的「母音階」,拉格本身還要看上行/下行、
       vadi(骨幹音)與演奏時辰,同一個塔特可以長出完全不同的拉格
   所以一律保留條目(有人就是要查「拜拉夫」),但要讓使用者一眼看到重複關係,
   而且可以一鍵把重複的收起來 */
/* 音階「同一組音」的比對鍵:有下行(古典旋律小調)的連下行一起比,上行一樣、下行不同的不算同音重複 */
function pitchKey(s){ return setKey(s.t.map(tokenSemi)) + (s.down ? "|" + setKey(s.down.map(tokenSemi)) : ""); }
const SAME_PITCH = (() => {
  const first = new Map(), map = new Map();
  for (const s of SCALES) {
    const k = pitchKey(s);
    if (first.has(k)) map.set(s.id, first.get(k));   // 指向代表條目
    else first.set(k, s);
  }
  return map;
})();

const CHORD_MATCH = CHORDS.map(c => {
  const pcs = [...new Set(c.t.map(t => ((tokenSemi(t) % 12) + 12) % 12))].sort((a, b) => a - b);
  return { ref: c, key: pcs.join(","), size: pcs.length, pcs };
});
function setKey(pcs){ return [...new Set(pcs.map(p => ((p % 12) + 12) % 12))].sort((a, b) => a - b).join(","); }
/* 給定根音音級與一組音級,回傳符合的和弦定義(可能多個,依字典順序 = 由簡到繁) */
function matchChords(rootPc, pcs){
  const rel = pcs.map(p => ((p - rootPc) % 12 + 12) % 12);
  const k = setKey(rel);
  return CHORD_MATCH.filter(m => m.key === k).map(m => m.ref);
}

/* ══════════════════════════════════════════════════════════════
   5. 鍵盤渲染 —— 以下這一段(isBlackKey / KB_* / computeKeyboardHeight /
      rebuildKeyboardRange / drawKeyboard)直接照抄 ScrollScore 的實作,
      連常數與註解都保持原樣,只把「左右手聲部(staff 1/2)」的語意
      改讀成「根音 / 其他組成音」:
        staff 1(金色)= 根音       staff 2(青色)= 和弦或音階內的其他音
        attack       = 該音正在發聲(播放時的觸鍵瞬間高亮)
   ══════════════════════════════════════════════════════════════ */
function isBlackKey(midi){ return [1,3,6,8,10].includes(((midi%12)+12)%12); }
let KB_LOW = 21, KB_HIGH = 108; // 預設A0~C8,選定和弦/音階後會依實際音域重新計算
let KB_WHITE_KEYS = [], KB_WHITE_IDX = {};
/* 真實鋼琴白鍵長寬比大約 6:1,鍵盤畫布固定高度時,可見的白鍵數量一多,
   每個鍵就會被擠得又窄又長、比例完全跑掉。改成依「目前實際畫面寬度 ÷ 可見白鍵數」反推出
   符合真實比例的高度,畫布高度動態跟著調,而不是每個裝置寬度都套同一個寫死的高度 */
const WHITE_KEY_ASPECT = 5.2;
const KB_MIN_H = 54, KB_MAX_H = 170;
function computeKeyboardHeight(containerWidth, minH = KB_MIN_H, maxH = KB_MAX_H){
  const n = Math.max(KB_WHITE_KEYS.length, 1);
  const whiteW = containerWidth / n;
  return Math.min(maxH, Math.max(minH, whiteW * WHITE_KEY_ASPECT));
}
function rebuildKeyboardRange(midiList){
  let lowest = Infinity, highest = -Infinity;
  for (const m of midiList) {
    if (m < lowest) lowest = m;
    if (m > highest) highest = m;
  }
  if (!isFinite(lowest) || !isFinite(highest)) {
    KB_LOW = 48; KB_HIGH = 72; // 沒有選任何音時,退回中央的兩個八度
  } else {
    // 兩端都取範圍外最靠近的C(最低音所在八度的C,最高音上面那個八度的C)
    KB_LOW = Math.floor(lowest / 12) * 12;
    KB_HIGH = Math.ceil(highest / 12) * 12;
    if (KB_HIGH <= KB_LOW) KB_HIGH = KB_LOW + 12; // 保險,至少留一個八度
    if (KB_HIGH - KB_LOW < 24) KB_HIGH = KB_LOW + 24; // 視覺化用途:至少看得到兩個八度才有「地圖」感
  }
  KB_WHITE_KEYS = [];
  for (let m = KB_LOW; m <= KB_HIGH; m++) if (!isBlackKey(m)) KB_WHITE_KEYS.push(m);
  KB_WHITE_IDX = {};
  KB_WHITE_KEYS.forEach((m, i) => KB_WHITE_IDX[m] = i);
}
rebuildKeyboardRange([]);

function drawKeyboard(ctx, x, y, w, h, activeMap){
  const whiteW = w / KB_WHITE_KEYS.length;

  // 底板陰影,讓整個鍵盤看起來有深度
  const baseGrad = ctx.createLinearGradient(0, y, 0, y + h);
  baseGrad.addColorStop(0, "#050403");
  baseGrad.addColorStop(1, "#0C0A07");
  ctx.fillStyle = baseGrad;
  ctx.fillRect(x, y, w, h);

  const rr = (cx, cy, cw, ch, r) => {
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(cx, cy, cw, ch, r); }
    else { ctx.beginPath(); ctx.rect(cx, cy, cw, ch); }
  };

  // 白鍵:漸層 + 立體邊緣 + 按下時的光暈(觸鍵瞬間更亮,之後轉為持續的普通高亮)
  for (let i = 0; i < KB_WHITE_KEYS.length; i++) {
    const m = KB_WHITE_KEYS[i];
    const kx = x + i * whiteW;
    const kw = whiteW - 1;
    const info = activeMap.get(m);
    const staff = info && info.staff;
    const attack = info && info.attack;
    let baseColor = staff === 2 ? ["#3FBFAE", "#3FBFAE"] : staff === 1 ? ["#FFDA7A", "#C4901A"] : ["#FFFDF6", "#DDD6C4"];
    if (attack) baseColor = staff === 2 ? ["#8FFFF0", "#8FFFF0"] : ["#FFF3CC", "#F2B94B"];
    const g = ctx.createLinearGradient(kx, y, kx, y + h);
    g.addColorStop(0, baseColor[0]);
    g.addColorStop(0.85, baseColor[1]);
    g.addColorStop(1, baseColor[1]);
    if (staff) {
      ctx.save();
      ctx.shadowColor = staff === 2 ? "rgba(63,191,174,0.85)" : "rgba(242,185,75,0.85)";
      ctx.shadowBlur = attack ? 24 : 14;
    }
    rr(kx, y, kw, h, [3, 3, 6, 6]);
    ctx.fillStyle = g;
    ctx.fill();
    if (staff) ctx.restore();
    // 鍵縫陰影
    ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 1;
    rr(kx, y, kw, h, [3, 3, 6, 6]); ctx.stroke();
    // 頂端高光細線,增加立體感
    ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(kx + 2, y + 1); ctx.lineTo(kx + kw - 2, y + 1); ctx.stroke();
  }

  // 黑鍵:漸層 + 陰影,疊在白鍵上方
  const blackH = h * 0.6, blackW = whiteW * 0.62;
  for (let m = KB_LOW; m <= KB_HIGH; m++) {
    if (!isBlackKey(m)) continue;
    let leftWhite = m - 1;
    while (isBlackKey(leftWhite)) leftWhite--;
    const li = KB_WHITE_IDX[leftWhite];
    if (li === undefined) continue;
    const kx = x + (li + 1) * whiteW - blackW / 2;
    const info = activeMap.get(m);
    const staff = info && info.staff;
    const attack = info && info.attack;
    let baseColor = staff === 2 ? ["#3FBFAE", "#3FBFAE"] : staff === 1 ? ["#F2B94B", "#8A6410"] : ["#3a3a3a", "#0a0a0a"];
    if (attack) baseColor = staff === 2 ? ["#8FFFF0", "#8FFFF0"] : staff === 1 ? ["#FFE39A", "#C4901A"] : baseColor;
    // 黑鍵投影到白鍵上
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(kx - 1, y + blackH, blackW + 2, 6);

    const g = ctx.createLinearGradient(kx, y, kx, y + blackH);
    g.addColorStop(0, baseColor[0]);
    g.addColorStop(1, baseColor[1]);
    if (staff) {
      ctx.save();
      ctx.shadowColor = staff === 2 ? "rgba(63,191,174,0.9)" : "rgba(242,185,75,0.9)";
      ctx.shadowBlur = 12;
    }
    rr(kx, y, blackW, blackH, [2, 2, 4, 4]);
    ctx.fillStyle = g;
    ctx.fill();
    if (staff) ctx.restore();
    // 黑鍵頂端光澤
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.fillRect(kx + blackW * 0.15, y + 2, blackW * 0.3, blackH * 0.35);
  }
}

/* ── 音名標籤:ScrollScore 的鍵盤不需要標音名(那邊看的是樂譜),
   這裡是「知道這是什麼音」的工具,所以在上面照同一套幾何再疊一層文字,
   不動到照抄過來的 drawKeyboard 本身 ── */
/* 黑鍵描一圈深色邊(使用者要求):亮起來的黑鍵(青/金)旁邊的白鍵也亮成同色時,兩者幾乎分不開。
   照抄的 drawKeyboard 不能改,所以跟 drawKeyLabels 一樣在上面再疊一層,形狀與位置照它的算法
   (寬 = 白鍵 0.62、高 = 0.6、圓角 2/2/4/4) */
function drawBlackKeyEdges(ctx, x, y, w, h){
  const whiteW = w / KB_WHITE_KEYS.length, blackH = h * 0.6, blackW = whiteW * 0.62;
  ctx.save();
  ctx.strokeStyle = "rgba(8,6,4,0.9)";
  ctx.lineWidth = Math.max(1, Math.min(1.6, whiteW * 0.05));
  for (let m = KB_LOW; m <= KB_HIGH; m++) {
    if (!isBlackKey(m)) continue;
    let leftWhite = m - 1;
    while (isBlackKey(leftWhite)) leftWhite--;
    const li = KB_WHITE_IDX[leftWhite];
    if (li === undefined) continue;
    const kx = x + (li + 1) * whiteW - blackW / 2, lw = ctx.lineWidth / 2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(kx + lw, y + lw, blackW - 2 * lw, blackH - 2 * lw, [2, 2, 4, 4]);
    else ctx.rect(kx + lw, y + lw, blackW - 2 * lw, blackH - 2 * lw);
    ctx.stroke();
  }
  ctx.restore();
}
function drawKeyLabels(ctx, x, y, w, h, labelMap){
  if (!labelMap.size) return;
  const whiteW = w / KB_WHITE_KEYS.length;
  const blackH = h * 0.6, blackW = whiteW * 0.62;
  // 字級照白鍵寬度連續放大:手機兩個八度時白鍵只有 21~29px,原本 0.40 倍只剩 8~10px(使用者嫌字太小)
  const fs = Math.max(9, Math.min(15, whiteW * 0.48));
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  // 白鍵標籤:寫在鍵的下緣(黑鍵構不到的地方)
  for (let i = 0; i < KB_WHITE_KEYS.length; i++) {
    const m = KB_WHITE_KEYS[i];
    const lab = labelMap.get(m);
    if (!lab) continue;
    const cx = x + i * whiteW + (whiteW - 1) / 2;
    ctx.font = (lab.strong ? "700 " : "500 ") + fs + "px 'Noto Serif TC', serif";
    ctx.fillStyle = lab.strong ? "rgba(20,14,4,0.92)" : "rgba(60,52,36,0.55)";
    ctx.fillText(lab.text, cx, y + h - fs * 0.95);
  }
  // 黑鍵標籤:寫在黑鍵下緣,字比白鍵小一點才塞得下
  const bfs = Math.max(7.5, Math.min(12, blackW * 0.55));
  for (let m = KB_LOW; m <= KB_HIGH; m++) {
    if (!isBlackKey(m)) continue;
    const lab = labelMap.get(m);
    if (!lab) continue;
    let leftWhite = m - 1;
    while (isBlackKey(leftWhite)) leftWhite--;
    const li = KB_WHITE_IDX[leftWhite];
    if (li === undefined) continue;
    const cx = x + (li + 1) * whiteW;
    ctx.font = "700 " + bfs + "px 'Noto Serif TC', serif";
    ctx.fillStyle = lab.strong ? "rgba(10,8,2,0.92)" : "rgba(255,253,246,0.6)";
    ctx.fillText(lab.text, cx, y + blackH - bfs * 0.9);
  }
}

/* ══════════════════════════════════════════════════════════════
   6. 畫布尺寸與繪製迴圈
   ══════════════════════════════════════════════════════════════ */
/* 兩欄版面時,右邊顯示區可以用的高度 = 左欄高度 − 摘要列 − 外框;不是兩欄(或練習中)就回傳 0 */
const TWO_COL = window.matchMedia("(min-width:900px)");
function twoColumnAvail(){
  if (!TWO_COL.matches) return 0;
  try { if (PRACTICE.open && STATE.tab === "chord") return 0; } catch (e) { return 0; }   // 載入初期 PRACTICE 還沒宣告
  const card = [$("rootCard"), $("findCard")].find(c => c && !c.hidden);
  const tabs = document.querySelector(".topbar .tab-row"), wrap = document.querySelector(".kb-wrap");
  if (!card || !tabs || !wrap) return 0;
  const gap = parseFloat(getComputedStyle(document.querySelector(".topbar")).rowGap) || 0;
  const cs = getComputedStyle(wrap);
  const chrome = (parseFloat(cs.borderTopWidth) || 0) + (parseFloat(cs.borderBottomWidth) || 0) + $("kbSummary").offsetHeight;
  // 卡片會被拉高去對齊右邊(align-self:stretch),所以量「內容」的高度,不量卡片本身——量卡片的話兩邊會互相撐大
  const kids = [...card.children].filter(k => k.offsetParent);
  const cc = getComputedStyle(card), top = card.getBoundingClientRect().top;
  const natural = kids.length ? Math.max(...kids.map(k => k.getBoundingClientRect().bottom)) - top +
    (parseFloat(cc.paddingBottom) || 0) + (parseFloat(cc.borderBottomWidth) || 0) : card.offsetHeight;
  return Math.floor(tabs.offsetHeight + gap + natural - chrome);
}
function resizeKeyboardCanvas(){
  const cv = $("keyboardCanvas");
  if (!cv) return;
  // 吉他和弦分頁的畫布是藏起來的(寬度 0),寬度改量外框,顯示區高度才算得出來
  cv.style.width = "";   // 先還原成滿版再量(鋼琴在寬螢幕會把畫布縮窄,不還原的話下一次量到的是縮過的寬度)
  const w = cv.getBoundingClientRect().width || cv.parentElement.clientWidth;
  /* 鍵盤是釘住的,螢幕越矮它就越該收斂,否則上半部佔滿整個畫面、下面的清單沒空間捲。
     用「視窗高度的 22%」當上限而不是再開一個高度斷點:斷點會在某個高度突然跳一階,
     連續縮放則是一路平滑收斂,而且直向手機與桌機(844/900px 高)算出來仍是原本的 170px 上限,
     外觀完全沒變,只有真的很矮的畫面才會收 */
  const maxH = Math.min(KB_MAX_H, window.innerHeight * 0.22);
  /* 鋼琴與吉他的顯示區一樣高(使用者要求:切換樂器時下面的根音那一排不能移位)。
     基準是「鋼琴在這個寬度、這個分頁會有的高度」;吉他的指板(音階時連同把位那排按鈕)、
     和弦分頁的三張和弦圖都塞進同一個高度 */
  const H0 = computeKeyboardHeight(w, KB_MIN_H, Math.max(KB_MIN_H, maxH));
  /* 儘量滿版(使用者要求:空位還很多,指板與按鈕都可以再大):螢幕越高、顯示區就越高,連續變化不開斷點。
     單欄(手機、平板直向)最多放大到 1.23 倍(鋼琴白鍵長寬比 5.2 → 真實的 6.4),矮螢幕(≤640px 高)維持原本,
     釘住區塊才不會擠掉清單;兩欄(桌機、手機橫向)右邊放大到寬度的 26%、視窗高度的 30%,取比原本大的 */
  const H = TWO_COL.matches ? Math.max(H0, Math.min(w * 0.26, window.innerHeight * 0.30))
                            : Math.round(H0 * Math.max(1, Math.min(1.23, 1 + (window.innerHeight - 640) / 800)));
  /* 兩欄版面(≥900px,含大手機橫向 932×430):右邊的顯示區撐滿左欄(分頁 + 根音卡片)的高度,兩欄底部對齊。
     原本右邊只有 170px(或視窗高度的 22%),左欄的根音卡片比它高很多,右邊空一大段(使用者回報)。
     左欄的高度跟顯示區無關,所以換樂器時照樣不會移位;外框兩種樂器一樣高(CSS 的 align-self:stretch)。
     裡面:吉他和弦圖用滿整個高度;指板最高到寬度的 42%;鋼琴維持真實琴鍵比例、垂直置中(拉長琴鍵會變形) */
  // 右邊至少維持原本的高度 H(音階分頁左欄很矮,照左欄走的話 1920 寬的指板只剩 110px 高);
  // 右邊比較高時左欄卡片拉高對齊(CSS align-self:stretch,twoColumnAvail 量的是卡片內容,不會互相撐大)
  const avail = twoColumnAvail() && Math.max(H, twoColumnAvail());
  if (STATE.inst === "guitar") {
    const disp = avail || H;
    cv.style.height = Math.max(60, avail ? Math.min(disp, w * 0.42) : H) + "px";
    $("gtrDiagrams").style.height = disp + "px";
    fitGallery();
  } else {
    // 鋼琴白鍵實際的長寬比約 6.4(寬 23.5mm、長 150mm);照抄的 WHITE_KEY_ASPECT 是 5.2,兩欄有空間時放寬到真實比例
    /* 白鍵最寬 56px:寬螢幕上一個八度只有 8 個白鍵,撐滿 1000px 會變成一塊塊方磚(1920 寬的音階分頁)。
       畫布本身縮窄、置中;手機與一般桌機本來就不到 56px,不受影響 */
    const nWhite = Math.max(KB_WHITE_KEYS.length, 1), kw = Math.min(w, nWhite * 56);
    cv.style.width = avail && kw < w ? kw + "px" : "";
    const real = computeKeyboardHeight(kw, KB_MIN_H, 10000) * 6.4 / WHITE_KEY_ASPECT;
    cv.style.height = (avail ? Math.min(avail, real) : H) + "px";
  }
  const rect = cv.getBoundingClientRect();
  // ScrollScore 的畫布是要拿去錄影的,所以用 CSS px;這裡是給人盯著看音名的,
  // 乘上 devicePixelRatio 讓文字在高解析螢幕上不糊(繪圖座標仍維持 CSS px)
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width  = Math.round(rect.width * dpr);
  cv.height = Math.round(rect.height * dpr);
  cv._cssW = rect.width;
  cv._cssH = rect.height;
  cv._dpr = dpr;
}
function drawKeyboardLive(){
  const cv = $("keyboardCanvas");
  if (!cv || !cv.width) return;
  const ctx = cv.getContext("2d");
  ctx.setTransform(cv._dpr, 0, 0, cv._dpr, 0, 0);
  ctx.clearRect(0, 0, cv._cssW, cv._cssH);
  if (STATE.inst === "guitar") { cv._fb = drawFretboard(ctx, cv._cssW, cv._cssH, guitarView()); return; }
  const view = currentView();
  drawKeyboard(ctx, 0, 0, cv._cssW, cv._cssH, view.activeMap);
  drawBlackKeyEdges(ctx, 0, 0, cv._cssW, cv._cssH);
  if (STATE.label !== "off") drawKeyLabels(ctx, 0, 0, cv._cssW, cv._cssH, view.labelMap);
}
/* 把頂欄與釘住區塊的實際高度餵給 CSS。兩個高度都是會變的:頂欄隨字級與換行改變,
   釘住區塊的高度隨鍵盤音域(白鍵數)改變,寫死數字遲早會對不齊 */
function syncStickyMetrics(){
  const root = document.documentElement.style;
  const h = document.querySelector("header");
  if (h) root.setProperty("--header-h", h.offsetHeight + "px");
  const t = document.querySelector(".topbar");
  if (t) {
    root.setProperty("--topbar-h", t.offsetHeight + "px");
    /* 釘住區塊(分頁 + 鍵盤 + 根音 + 常用和弦)加上頂欄超過螢幕高度 70% 時就不要釘:
       320×568 的手機釘住的話清單只剩 100px。用比例判斷而不是再開一個高度斷點——
       390×844 以上的直向手機、平板、桌機照樣釘住 */
    const hh = h ? h.offsetHeight : 0;
    t.classList.toggle("unstick", hh + t.offsetHeight > window.innerHeight * 0.7);
  }
}
/* ══════════════════════════════════════════════════════════════
   6b. 吉他指板 —— 跟鋼琴共用同一張畫布,換樂器只換畫法。
       上面照抄 ScrollScore 的鍵盤程式一行都沒動,吉他是另外一組函式
   ══════════════════════════════════════════════════════════════ */
const GTR_OPEN = [40, 45, 50, 55, 59, 64]; // 標準調音,索引 0 = 6 弦(低音 E2)… 5 = 1 弦(高音 E4)
const GTR_FRETS = 15;    // 指法搜尋最高到第幾格
const GTR_MAX_SPAN = 3;  // 按弦的最低格與最高格最多差 3 格(四根手指各管一格)
const pcOf = m => ((m % 12) + 12) % 12;

/* 少了某個組成音的代價。五音最不影響和弦的身分,吉他上最常省略;
   六、七個音的延伸和弦六條弦塞不下(而且手指不夠),十一音與九音依序讓位 */
/* 這個指法有沒有把「定義和弦的音」都彈到。可以省略的只有:完全五度;有 13 的和弦裡的 9 與 11
   (吉他的 C13 標準按法就是 1 ♭7 3 13);7alt 的變化音取其中幾個就好(至少一個)。
   三音、七音、♭5/♯5、♭9/♯9/♯11/♭13 這些決定名稱的音一個都不能少——原本 C13 會列出沒有 ♭7 的按法
   (那是 6/9 和弦)、m11♭5 列出沒有 ♭5 的(全檢時發現)。
   窮舉時不直接淘汰(評分照舊),挑指法時優先挑完整的;整個和弦都沒有完整按法時才退回原本的結果 */
function voicingComplete(def, missing){
  const has13 = def.t.includes("13");
  for (const m of missing) {
    if (m === "5") continue;
    if ((m === "9" || m === "11") && has13) continue;
    if (def.id === "7alt" && /^[♭♯](9|13)$/.test(m)) continue;
    return false;
  }
  return !(def.id === "7alt" && ["♭9", "♯9", "♭13"].every(x => missing.includes(x)));
}
function toneWeight(tok, nTones){
  if (tok === "1") return 100;
  if (tok === "5") return 6;
  if (nTones >= 6 && tok === "11") return 12;
  if (nTones >= 7 && tok === "9") return 25;
  return 60;
}
/* 每條弦的標記:"open" = 空弦(○)、"mute" = 不彈(×)、"fretted" = 按弦。
   指板上畫的 ○/× 與讀出來的指法字串都從這裡來,兩邊不會各算各的 */
function gtrMarkers(frets){
  return frets.map(f => f === 0 ? "open" : (f == null || f < 0) ? "mute" : "fretted");
}
function gtrTabText(frets){ return frets.map(f => f < 0 ? "×" : String(f)).join(" "); }

/* 評估一組指法(frets[s]:-1 = 不彈、0 = 空弦、n = 第 n 格),不能彈就回傳 null */
/* 實際最少要幾根手指:食指可以橫按最低那格(中間不能有空弦或不彈的弦),其他手指可以一指壓相鄰、同一格的弦 */
function gtrFingersNeeded(fr){
  const fretted = [];
  fr.forEach((f, s) => { if (f > 0) fretted.push([s, f]); });
  if (!fretted.length) return 0;
  const minF = Math.min(...fretted.map(x => x[1]));
  const atMin = fretted.filter(x => x[1] === minF).map(x => x[0]);
  let barre = atMin.length >= 2;
  for (let s = atMin[0]; barre && s <= atMin[atMin.length - 1]; s++) if (fr[s] < minF) barre = false;
  const rest = fretted.filter(([, f]) => !(barre && f === minF));
  let runs = 0;
  rest.forEach(([s, f], i) => { if (!(i && rest[i - 1][0] === s - 1 && rest[i - 1][1] === f)) runs++; });
  return runs + (barre ? 1 : 0);
}
function evalVoicing(frets, tones, rPc, bassPc, extraPc, trusted){
  // 窮舉時一個和弦要評估上萬次(C13 約 2 萬),這裡刻意不配置陣列與 Set,用迴圈與位元遮罩
  let nPlayed = 0, lowS = -1, highS = -1, have = 0;
  for (let s = 0; s < 6; s++) if (frets[s] >= 0) { nPlayed++; if (lowS < 0) lowS = s; highS = s; have |= 1 << pcOf(GTR_OPEN[s] + frets[s]); }
  if (nPlayed < Math.min(3, tones.length)) return null;
  const lowPc = pcOf(GTR_OPEN[lowS] + frets[lowS]);
  // 指定了低音(斜線和弦)就一定要是它。低音在上面的弦重複是可以的(使用者確認過):
  // 斜線只規定「最低的是誰」,C/G 的 3 3 2 0 1 0、D/F♯ 的 2 0 0 2 3 2 本來就重複了低音,
  // 和弦外的低音(D/C♯ 的 C♯)一樣可以在上面再出現
  if (bassPc != null && lowPc !== bassPc) return null;
  const bassIsRoot = lowPc === rPc;
  let cost = bassIsRoot || bassPc != null ? 0 : 40; // 最低音不是根音的話,聽起來就是轉位,不是使用者選的那個和弦
  const missing = [];
  for (const tn of tones) if (!(have >> tn.pc & 1)) { cost += tn.w; missing.push(tn.tok); }

  let nFretted = 0, minF = Infinity, maxF = -Infinity;
  for (let s = 0; s < 6; s++) if (frets[s] > 0) { nFretted++; if (frets[s] < minF) minF = frets[s]; if (frets[s] > maxF) maxF = frets[s]; }
  if (!nFretted) minF = 0;
  let fingers = 0, barre = false, barreLo = -1, barreHi = -1;
  if (nFretted) {
    fingers = nFretted;
    let aLo = -1, aHi = -1, aN = 0;
    for (let s = 0; s < 6; s++) if (frets[s] === minF) { if (aLo < 0) aLo = s; aHi = s; aN++; }
    if (aN >= 2) {
      // 橫按:食指壓住最低格上最外側兩條弦之間的每一條弦,這段範圍裡不能有空弦或不彈的弦
      let ok = true;
      for (let s = aLo; s <= aHi; s++) if (frets[s] < minF) ok = false;
      if (ok) { fingers = nFretted - aN + 1; barre = true; barreLo = aLo; barreHi = aHi; }
    }
    /* 食指只橫按中間幾條弦、其他手指卻同時落在橫按的兩側(低音那側和高音那側都有比橫按高的格):
       7 7 5 5 5 7(Cmaj7/B)要無名指壓 5 弦、小指跨過整個橫按去壓 1 弦,手指會交叉,沒有人按得到(使用者回報)。
       兩側都有手指時:低音側兩根以上,或兩側各有一根落在同一格、比橫按高兩格以上、中間隔四條弦以上
       (× 8 5 5 5 8:無名指 5 弦、小指 1 弦,撐三格又橫跨整個橫按),手都張不開。

  const rootPos = fr => {
    const sel = fr.map((f, s) => f >= 0 ? GTR_OPEN[s] + f : null).filter(m => m != null).sort((x, y) => x - y);
    const pcs = [...new Set(sel.map(pcOf))];
    return pcs.length >= 3 && matchChords(pcOf(sel[0]), pcs).length > 0;
  };
  if (low > 0 && !rootPos(base))
    for (let k = 1; k <= 2 && low - k >= 0; k++) { const c = build(low - k); if (rootPos(c)) return c; }

}

/* 吉他音階的把位。規則對每一種音階都一樣(不另外存每個音階的指型表):
   從 6 弦上某一個音階音開始,沿著音階往上,每條弦放固定幾個音再換下一條弦——
   七聲音階每弦 3 音(3NPS,7 個把位)、五聲/六聲每弦 2 音(五聲就是標準的 5 個 box)、
   八聲以上每弦 3~4 音。六聲以下再把「把位範圍內的其他音階音」補進來(藍調音階的 ♭5)。
   從 6 弦的哪個音開始 = 哪個把位;把位照在指板上的高低排序,編號 1、2、3… */
function scalePositions(){
  const notes = currentNotes();
  const pcs = [...new Set(notes.map(n => pcOf(n.midi)))];
  const n = pcs.length, set = new Set(pcs);
  if (n < 2) return [];

     直接用 6 個音每弦 2 音排,會多走半個八度,跨度拉到 8 格,不是大家學的那個 box */
  let base = pcs;
  if (n === 6) {
    const r0 = pcs[0];
    const five = pcs.filter(pc => pc !== r0).map(drop => pcs.filter(pc => pc !== drop))
      .find(sub => SCALES.some(sc => sc.t.length === 5 && sc.t.every(tk => sub.includes(pcOf(r0 + tokenSemi(tk))))));
    if (five) base = five;
  }
  const bset = new Set(base);
  const nextUp = m => { do m++; while (!bset.has(pcOf(m))); return m; };
  const out = [];
  pcs.forEach((pc, k) => {
    if (!bset.has(pc)) return;   // 經過音本身不當把位的起點(藍調還是 5 個 box)
    let f0 = pcOf(pc - GTR_OPEN[0]);          // 6 弦上 0~11 格
    let m = GTR_OPEN[0] + f0, pat = [];
    for (let s = 0; s < 6; s++) for (let i = 0; i < per; i++) {
      if (s || i) m = nextUp(m);

    if (pat.some(x => x.f < 0)) pat = pat.map(x => ({ s: x.s, f: x.f + 12, midi: x.midi + 12 }));
    let lo = Math.min(...pat.map(x => x.f)), hi = Math.max(...pat.map(x => x.f));

      for (let s = 0; s < 6; s++) for (let f = lo; f <= hi; f++)
        if (set.has(pcOf(GTR_OPEN[s] + f)) && !pat.some(x => x.s === s && x.f === f)) pat.push({ s, f, midi: GTR_OPEN[s] + f });
    }
    out.push({ k, start: f0, notes: pat, lo, hi });

}

    for (const p of an.pcs) info.set(p, { name: an.nameByPc.get(p), tok: an.tokByPc.get(p), root: p === an.bassPc });

      // 音階沒有「不彈」這回事:空弦不在音階裡就什麼都不標,在的話畫成 ○

  for (let s = 0; s < 6; s++) for (let f = 1; f <= frets; f++) {

function fretboardLayout(w, h, nFrets, first = 0){
  const numH = Math.max(12, Math.min(16, h * 0.11));   // 最下面一條寫格數
  const colW = Math.max(20, Math.min(30, h * 0.2));    // 琴頸左邊的 ○/× 欄
  const nutX = colW + 5, right = w - 6;
  const top = Math.round(h * 0.05) + 2, bottom = h - numH - 2;
  const sp = (bottom - top) / 6;
  return {
    numH, colW, nutX, right, top, bottom, sp, frets: nFrets, first,
    fretW: (right - nutX) / nFrets,
    // 橫著看的指板:1 弦(高音 E)在最上面、6 弦(低音 E)在最下面,跟六線譜同一個方向
    yOf: s => top + sp * (5 - s + 0.5),

    xOf(f){ return f === 0 && !first ? colW / 2 + 2 : nutX + (f - first - 0.5) * this.fretW; }

  // 按弦的音
  for (const d of gv.dots) {
    const x = L.xOf(d.f), y = L.yOf(d.s), attack = isSounding(d.midi);
    ctx.save();
    ctx.shadowColor = d.root ? "rgba(242,185,75,0.85)" : "rgba(63,191,174,0.85)";
    ctx.shadowBlur = attack ? 18 : 6;
    ctx.fillStyle = d.root ? (attack ? "#FFE39A" : "#F2B94B") : (attack ? "#8FFFF0" : "#3FBFAE");
    dot(x, y, r); ctx.fill();
    ctx.restore();
    if (d.text) {
      fitText(d.text, r * 1.8, Math.max(8, r * 1.15));
      ctx.fillStyle = "rgba(20,14,4,0.92)";
      ctx.fillText(d.text, x, y + 0.5);
    }
  }
  // 琴頸左邊那一欄:空弦畫空心圈(○)、不彈畫叉(×)
  for (let s = 0; s < 6; s++) {
    const mk = gv.markers[s];
    if (!mk) continue;
    const x = L.xOf(0), y = L.yOf(s), rr = Math.min(r, L.colW * 0.42);
    if (mk.type === "mute") {

      ctx.lineWidth = 2; ctx.lineCap = "round";

      const attack = isSounding(mk.midi);
      const col = mk.root ? TH.gold : TH.teal;
      ctx.strokeStyle = col; ctx.lineWidth = attack ? 3.5 : 2;
      dot(x, y, rr - 1); ctx.stroke();
      if (mk.text) {
        fitText(mk.text, rr * 1.8, Math.max(8, rr * 1.1));   // 空弦圈裡的音名跟按弦的音點同一套比例(原本只有 7px)
        ctx.fillStyle = col;
        ctx.fillText(mk.text, x, y + 0.5);
      }
    }
  }
  return L;
}
/* 弦的振動動畫:記下每條弦最後一次被撥的時間與按住的格數,畫的時候依經過時間算振幅 */
const VIB_MS = 900;
const STRING_VIB = [null, null, null, null, null, null];
const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)");
let vibAnim = 0;
function vibrateString(s, f){
  STRING_VIB[s] = { t0: performance.now(), f };
  if (vibAnim) return;
  const step = () => {
    drawKeyboardLive();
    const alive = STRING_VIB.some(v => v && performance.now() - v.t0 < VIB_MS);
    vibAnim = alive && STATE.inst === "guitar" ? requestAnimationFrame(step) : 0;
    if (!vibAnim) drawKeyboardLive(); // 最後一格畫回靜止的直線

/* 點指板:反推是哪一條弦、第幾格(0 = 點在琴頸左邊那一欄,代表空弦) */
function fretAt(px, py){
  const L = $("keyboardCanvas")._fb;
  if (!L) return null;
  const s = Math.max(0, Math.min(5, 5 - Math.floor((py - L.top) / L.sp)));
  if (px < L.nutX - 2 && L.first) return null;   // 平移時左邊那一欄不是空弦
  const f = px < L.nutX - 2 ? 0 : L.first + Math.max(1, Math.min(L.frets, Math.floor((px - L.nutX) / L.fretW) + 1));
  return { s, f };

function refreshDisplaySize(){ syncStickyMetrics(); resizeKeyboardCanvas(); drawKeyboardLive(); syncStickyMetrics(); if (PRACTICE.open) fitStageNames(); }
window.addEventListener("resize", refreshDisplaySize);
/* iPhone 轉橫向時 resize 事件比版面還早到:當下量到的還是直向的版面(不是兩欄、高度上限是螢幕的 22%),

   所以不只靠 resize:用 ResizeObserver 盯著「決定顯示區大小的東西」(顯示區寬度、左欄的分頁與卡片),
   它是在版面真的變完之後才通知。只在寬度/左欄高度/視窗真的變了才重算(顯示區自己的高度變化不算,不會循環) */
let displaySizeKey = "";
function refreshIfSizeChanged(){
  const wrap = document.querySelector(".kb-wrap");
  if (!wrap) return;
  const key = [innerWidth, innerHeight, wrap.clientWidth, TWO_COL.matches, twoColumnAvail()].join("|");
  if (key === displaySizeKey) return;
  displaySizeKey = key;

}
window.addEventListener("orientationchange", () => { requestAnimationFrame(refreshIfSizeChanged); setTimeout(refreshIfSizeChanged, 350); });
TWO_COL.addEventListener ? TWO_COL.addEventListener("change", refreshDisplaySize) : TWO_COL.addListener(refreshDisplaySize);

/* ══════════════════════════════════════════════════════════════
   7. 音訊:與 ScrollScore 同一套音源
   ──────────────────────────────────────────────────────────────
   主音源是 Salamander 鋼琴真實取樣(Tone.js 官方託管的完整版),
   取樣還沒載好或抓不到時,退回同一套合成音色備援 —— 訊號鏈(限幅器、
   殘響、依音高擺左右的聲像)與包絡參數都照 ScrollScore 的設定。
   ══════════════════════════════════════════════════════════════ */
let audioCtx = null, masterGain = null, masterLimiter = null;

let scheduledNodes = [];
function buildImpulseResponse(seconds, decayPow){
  const rate = audioCtx.sampleRate;
  const len = Math.max(1, Math.floor(rate * seconds));
  const ir = audioCtx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    let lp = 0;
    for (let i = 0; i < len; i++) {
      const t = i / len;
      const env = Math.pow(1 - t, decayPow);
      const noise = (Math.random() * 2 - 1) * env;
      // 一極低通,係數隨時間變小 = 尾巴越後面越暗,模擬空間對高頻的吸收
      const a = 0.42 * (1 - t * 0.8) + 0.02;
      lp += a * (noise - lp);

}

  // 等載入提示(載入鋼琴/吉他音色中…)消失後再顯示,兩句不要搶同一個位置
  const show = () => {
    if (audioStatusKey) { setTimeout(show, 1000); return; }

    masterLimiter = audioCtx.createDynamicsCompressor();
    masterLimiter.threshold.value = -3;

    masterLimiter.ratio.value = 12;
    masterLimiter.attack.value = 0.001;
    masterLimiter.release.value = 0.25;
    /* 響度壓縮(loudnessComp):完全保留鋼琴原始力度動態的話,只有在真正逼近削波的瞬間才被
       限幅器煞車,平均音量自然遠低於一般影片(影片後製都會做母帶壓縮,把安靜段落墊高、
       整體塞到接近上限),使用者要開到 80~90% 音量才聽得清楚。
       這裡加一段真正的響度壓縮,門檻降到 -18dB、壓縮比 3:1,把較大聲的部分先壓掉一截,
       空出來的餘裕再用 makeupGain 補回音量,把平均音量墊高。參數與 ScrollScore 相同。 */
    const loudnessComp = audioCtx.createDynamicsCompressor();
    loudnessComp.threshold.value = -18;
    loudnessComp.knee.value = 8;
    loudnessComp.ratio.value = 3;
    loudnessComp.attack.value = 0.008;
    loudnessComp.release.value = 0.18;
    const makeupGain = audioCtx.createGain();
    makeupGain.gain.value = 1.6; // 補回響度壓縮讓出來的餘裕,數值來自實測而非估算
    masterGain.connect(loudnessComp);
    loudnessComp.connect(makeupGain);
    makeupGain.connect(masterLimiter);
    masterLimiter.connect(audioCtx.destination);

    reverbBus = audioCtx.createGain();
    reverbPreDelay = audioCtx.createDelay(0.2);
    reverbPreDelay.delayTime.value = 0.018;
    reverbConvolver = audioCtx.createConvolver();
    // 殘響的脈衝響應要逐一算 20 萬個取樣,手機上超過 100ms,而且剛好卡在使用者第一次碰畫面的那一下。
    // 閒下來再算:殘響晚零點幾秒接上,第一下點擊不會頓
    (window.requestIdleCallback ? cb => requestIdleCallback(cb, { timeout: 300 }) : cb => setTimeout(cb, 50))(
      () => { reverbConvolver.buffer = buildImpulseResponse(2.1, 2.4); });
    reverbWet = audioCtx.createGain();
    reverbWet.gain.value = 0.18;
    reverbBus.connect(reverbPreDelay);
    reverbPreDelay.connect(reverbConvolver);
    reverbConvolver.connect(reverbWet);
    reverbWet.connect(masterGain);
  }
  // iOS 被電話、Siri、鬧鐘打斷後狀態是非標準的 "interrupted",不只 "suspended":不是 running 就叫醒
  if (audioCtx.state !== "running") { const r = audioCtx.resume(); if (r && r.catch) r.catch(() => {}); }
  loadPianoSamples();
  if (STATE.inst === "guitar") loadGuitarSamples(STATE.gtrTone);
}

/* ── 真實樂器取樣 ─────────────────────────────

const PIANO_BASE = "https://tonejs.github.io/audio/salamander/";

const PIANO_SAMPLES = [
  ["A",0],
  ["C",1],["Ds",1],["Fs",1],["A",1],
  ["C",2],["Ds",2],["Fs",2],["A",2],
  ["C",3],["Ds",3],["Fs",3],["A",3],
  ["C",4],["Ds",4],["Fs",4],["A",4],
  ["C",5],["Ds",5],["Fs",5],["A",5],
  ["C",6],["Ds",6],["Fs",6],["A",6],
  ["C",7],["Ds",7],["Fs",7],["A",7],
  ["C",8]
];
let pianoBuffers = null, pianoLoading = null;
let audioStatusKey = ""; // 記住目前顯示的是哪一句(用 key,不是譯好的字串),換語言時才補得回來
function setAudioStatus(key){
  audioStatusKey = key || "";

  const txt = key ? t(key) : "";
  if (el) { el.textContent = txt; el.hidden = !txt; }
}
/* 取樣的抓取:有 Cache API 就把抓到的 mp3 存起來,下次(包括沒網路時)直接從快取拿,不用每次重抓 70 個檔案。
   快取名稱帶版本號,改了 PIANO_SAMPLES / GUITAR_SETS 的網址要把 v1 往上加。沒有 Cache API(file://、部分 WebView)就照舊直接抓 */
const SAMPLE_CACHE = "hm-samples-v1";
function sampleFetch(url){
  const net = () => fetch(url).then(r => { if (!r.ok) throw new Error("404"); return r; });
  if (!window.caches || !caches.open) return net().then(r => r.arrayBuffer());
  return caches.open(SAMPLE_CACHE).then(c => c.match(url).then(hit => hit ||
    net().then(r => { c.put(url, r.clone()).catch(() => {}); return r; })))
    .catch(() => net())
    .then(r => r.arrayBuffer());
}
/* 一個都沒抓到(第一次開就沒網路)時不要永遠卡在合成音色:記下失敗時間,15 秒後再碰畫面、或網路恢復時重抓。
   「載入中…」只在第一次顯示,離線時每點一下就閃一次提示很煩 */
const sampleFail = { piano: 0 };
let sampleTried = { piano: false };
window.addEventListener("online", () => {
  for (const k in sampleFail) sampleFail[k] = 0;
  if (audioCtx) { loadPianoSamples(); if (STATE.inst === "guitar") loadGuitarSamples(STATE.gtrTone); }
});
function loadPianoSamples(){
  if (pianoBuffers || pianoLoading) return pianoLoading || Promise.resolve();
  if (sampleFail.piano && Date.now() - sampleFail.piano < 15000) return Promise.resolve();
  const list = [], jobs = [];
  for (const [letter, oct] of PIANO_SAMPLES) {
    const midi = (oct + 1) * 12 + NOTE_SEMITONE[letter];
    const url = PIANO_BASE + letter + oct + ".mp3";
    jobs.push(
      sampleFetch(url)
        .then(arr => audioCtx.decodeAudioData(arr))
        .then(buf => {
          // mp3 解碼後開頭常留一小段空白(編碼器延遲),和弦每個音都晚這麼多才出聲。跟吉他一樣裁到起音前 5ms
          const x = buf.getChannelData(0);
          let peak = 0; for (let i = 0; i < x.length; i++) peak = Math.max(peak, Math.abs(x[i]));
          let on = 0; while (on < x.length && Math.abs(x[on]) < peak * 0.1) on++;

    if (list.length) { pianoBuffers = list; sampleFail.piano = 0; if (audioStatusKey === "loadingPiano") setAudioStatus(""); return; }
    pianoLoading = null; sampleFail.piano = Date.now();   // 留給下一次重抓
    if (first) { setAudioStatus("pianoLoadFailed"); setTimeout(() => { if (audioStatusKey === "pianoLoadFailed") setAudioStatus(""); }, 4000); }
  });

/* ── 吉他取樣 ─────────────────────────────

     民謠吉他  37 檔、每個半音都有錄音(不必變速),尾端雜訊 -105 dBFS,音準全部在 ±15 cents 內 ← 預設

  nylon:    { base: "https://cdn.jsdelivr.net/npm/tonejs-instrument-guitar-nylon-mp3@1.1.1/",    files: "A2 A3 A4 A5 As5 B1 B2 B3 B4 Cs3 Cs4 Cs5 D2 D3 Ds4 E2 E3 E4 E5 Fs2 Fs3 Fs4 Fs5 G3 G5 Gs2 Gs4 Gs5" },
  electric: { base: "https://cdn.jsdelivr.net/npm/tonejs-instrument-guitar-electric-mp3@1.1.1/", files: "A2 A3 A4 A5 C3 C4 C5 C6 Cs2 Ds3 Ds4 Ds5 E2 Fs2 Fs3 Fs4 Fs5" }

const guitarBuffers = {}, guitarLoading = {};
function loadGuitarSamples(kind){

  if (sampleFail[kind] && Date.now() - sampleFail[kind] < 15000) return;
  const list = [];
  const jobs = set.files.split(" ").map(name => {
    const m = name.match(/^([A-G]s?)(\d)$/);

      .then(arr => audioCtx.decodeAudioData(arr))
      .then(buf => {

/* 吉他的弦撥下去之後就自己衰減,不像鋼琴需要人為的衰減曲線;只在音符結束時收尾 */
function playSampledGuitar(midi, when, dur){
  const list = guitarBuffers[STATE.gtrTone];
  if (!list || !list.length) return false;
  const best = nearestSample(list, midi);
  const rate = Math.pow(2, (midi - best.midi) / 12);
  const src = audioCtx.createBufferSource();
  src.buffer = best.buffer;
  src.playbackRate.setValueAtTime(rate, when);
  const g = audioCtx.createGain();
  const peakGain = 0.6, tail = 0.3;
  const sustain = Math.max(dur, 0.1);
  g.gain.setValueAtTime(peakGain, when);
  g.gain.setValueAtTime(peakGain, when + sustain);
  g.gain.exponentialRampToValueAtTime(0.0001, when + sustain + tail);
  src.connect(g);
  connectOut(g, midi);
  src.start(when, best.offset);
  src.stop(when + sustain + tail + 0.1);
  src._g = g; src._end = when + sustain + tail + 0.1;
  scheduledNodes.push(src);
  return true;
}
/* 找最接近的取樣,用 playbackRate 補足音高差(標準取樣器做法) */
function nearestSample(list, targetMidi){
  let best = list[0], bestDist = Infinity;
  for (const s of list) {
    const dist = Math.abs(s.midi - targetMidi);
    if (dist < bestDist) { bestDist = dist; best = s; }
  }
  return best;
}
/* 取樣播放。chordAnchors:同一個和弦裡,同音名(差整數個八度)的音優先共用同一份錄音,

function playSampledPiano(midi, when, dur, chordAnchors){

  const SHARE_SHIFT_LIMIT = 4; // 半音,超過這個幅度共用弊大於利
  let best;
  if (chordAnchors && chordAnchors[pitchClass] && Math.abs(midi - chordAnchors[pitchClass].midi) <= SHARE_SHIFT_LIMIT) {
    best = chordAnchors[pitchClass];
  } else {
    best = nearestSample(list, midi);
    if (chordAnchors && !chordAnchors[pitchClass]) chordAnchors[pitchClass] = best;
  }
  const rate = Math.pow(2, (midi - best.midi) / 12);
  const src = audioCtx.createBufferSource();
  src.buffer = best.buffer;
  src.playbackRate.setValueAtTime(rate, when);
  const g = audioCtx.createGain();
  const peakGain = 0.6, tail = 0.4;
  const sustain = Math.max(dur, 0.1);
  // 取樣本身錄音長度可能比需要的延音短,加上尾段循環撐住聲音
  const neededSec = (sustain + tail) * rate;
  const bufDur = best.buffer.duration;
  if (bufDur < neededSec && bufDur > 0.3) {
    src.loop = true;
    const loopLen = Math.min(0.6, bufDur * 0.3);
    src.loopStart = Math.max(0, bufDur - loopLen);
    src.loopEnd = bufDur;
  }
  g.gain.setValueAtTime(peakGain, when);
  /* 鋼琴弦被敲下去之後就一路自然衰減,而且衰減速度必須是「每秒固定比例」,
     不是「不管多長都在音符結束時剛好衰減到某個比例」——後者短音掉得快、長音掉得慢,
     同一台鋼琴上不該有這種差異。這裡用固定時間常數 DECAY_TAU */
  const DECAY_TAU = 2.2; // 秒:約每 2.2 秒衰減到 37%,接近真實鋼琴中音域的衰減速度
  const decayEnd = Math.max(when + Math.max(sustain, 0.02), when + 0.005);
  const endLevel = Math.max(0.06, Math.exp(-(decayEnd - when) / DECAY_TAU));
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peakGain * endLevel), decayEnd);
  g.gain.exponentialRampToValueAtTime(0.0001, decayEnd + tail);
  src.connect(g);
  connectOut(g, midi);
  src.start(when, best.offset || 0);
  src.stop(when + sustain + tail + 0.1);
  src._g = g; src._end = when + sustain + tail + 0.1;
  scheduledNodes.push(src);
  return true;
}
/* 聲像 + 殘響送出:鋼琴依音高擺左右(低音左、高音右),取樣與合成兩條路徑共用同一個出口,
   否則取樣載入前後的空間感會突然改變 */
function connectOut(node, midi){
  const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
  const out = panner || node;
  if (panner) { panner.pan.value = pianoPanFor(midi); node.connect(panner); }
  out.connect(masterGain);
  if (reverbBus) {
    const send = audioCtx.createGain();
    send.gain.value = 0.5;
    out.connect(send); send.connect(reverbBus);

}
/* 對外的統一入口:有取樣就用取樣,沒有就用合成音色備援 */
function scheduleNote(midi, when, dur, chordAnchors){
  // 吉他模式:吉他取樣優先;還沒載好或抓不到時退回鋼琴取樣,再退回合成音色
  if (STATE.inst === "guitar" && playSampledGuitar(midi, when, dur)) return;
  if (playSampledPiano(midi, when, dur, chordAnchors)) return;
  schedulePiano(midi, when, dur);
}
/* 真實鋼琴的低音弦在左、高音弦在右(以演奏者的視角) */
function pianoPanFor(midi){
  const t = Math.max(0, Math.min(1, (midi - 21) / 87));
  return (t - 0.5) * 0.64;
}
function schedulePiano(midi, when, dur){
  const freq = midiToFreq(midi);
  const osc = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const lp = audioCtx.createBiquadFilter();
  osc.type = "triangle"; osc.frequency.value = freq;
  osc2.type = "sine";    osc2.frequency.value = freq * 2; // 一點泛音
  lp.type = "lowpass";   lp.frequency.value = Math.min(freq * 6, 8000);
  const g2 = audioCtx.createGain(); g2.gain.value = 0.18;
  const peak = 0.32;
  const sustain = Math.max(dur * 0.9, 0.08), releaseTail = 0.35;
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(peak, when + 0.012);
  // 鋼琴弦是持續自然衰減,而且衰減速度是每秒固定比例(短音長音都一樣)
  const decayEnd = when + Math.max(sustain, 0.02);
  const endLevel = Math.max(0.06, Math.exp(-(decayEnd - when) / 2.2));
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak * endLevel), decayEnd);
  g.gain.exponentialRampToValueAtTime(0.0001, decayEnd + releaseTail);
  osc.connect(lp); osc2.connect(g2); g2.connect(lp);
  lp.connect(g);
  connectOut(g, midi); // 與取樣路徑共用同一個出口(聲像 + 殘響)
  osc.start(when); osc2.start(when);
  const stopAt = when + sustain + releaseTail + 0.05;
  osc.stop(stopAt); osc2.stop(stopAt);
  osc._g = osc2._g = g; osc._end = osc2._end = stopAt;

/* 停掉一個音:不要直接 stop()——正在響的波形瞬間被切斷會「喀」一聲,連續點和弦時很明顯。
   先用 12ms 的時間常數把音量收掉,再停。t 是音訊時鐘上的時間(練習的換和弦排在下一拍) */
function fadeStop(n, t){
  const g = n._g;
  try {
    if (g) {
      const p = g.gain;
      if (p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t);
      else if (t <= audioCtx.currentTime + 0.005) { p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); }
      else { n.stop(t); return; }        // 舊瀏覽器沒辦法在未來的時間點保住包絡,照舊在那一刻停
      p.setTargetAtTime(0, t, 0.012);
      n.stop(t + 0.1);
    } else n.stop(t);

function stopAllSound(){
  if (audioCtx) { const t = audioCtx.currentTime; for (const n of scheduledNodes) fadeStop(n, t); }
  scheduledNodes = [];

/* 播放中的視覺高亮:記下每個音的發聲區間,rAF 期間比對現在時間 */
let soundingWindows = [];   // [{midi, from, to}] 以 audioCtx.currentTime 為基準
let animId = 0;
function startHighlightLoop(untilTime){
  cancelAnimationFrame(animId);
  const step = () => {
    drawKeyboardLive();
    if (audioCtx && heardTime() < untilTime) animId = requestAnimationFrame(step);
    else { soundingWindows = []; drawKeyboardLive(); }
  };
  animId = requestAnimationFrame(step);
}
/* 使用者「聽到」的時刻:currentTime 只是排程時鐘,喇叭/藍牙耳機實際出聲還要再晚 outputLatency。
   高亮跟著聽到的時刻走,畫面才不會比聲音早亮 */
function heardTime(){
  const lat = (audioCtx.outputLatency || 0) + (audioCtx.baseLatency || 0);
  return audioCtx.currentTime - Math.min(lat, 0.6);
}
function isSounding(midi){
  if (!audioCtx || !soundingWindows.length) return false;
  const t = heardTime();
  return soundingWindows.some(s => s.midi === midi && t >= s.from && t <= s.to);

/* at:指定在音訊時鐘的哪一刻開始(練習的節拍器用,跟點擊聲同一個時鐘)。
   有指定時,前一個和弦不是立刻切掉,而是排在新和弦開始的那一刻停 */
/* 吉他刷和弦弦與弦的間隔(秒)。原本 35ms 聽起來像一次壓下去,使用者要求刷慢一點;和弦圖上弦亮起的節奏用同一個值 */
const GTR_STRUM_GAP = 0.06;
function playNotes(midis, mode, at, downMidis){
  ensureAudio();
  if (at == null) stopAllSound();
  else { for (const n of scheduledNodes) fadeStop(n, at); scheduledNodes = []; }
  const t0 = at != null ? at : audioCtx.currentTime + 0.02; // 提前量越小,按下到出聲越快(跟 playSingle 一致)
  let seq;
  if (mode === "block") {
    seq = midis.map(m => ({ midi: m, at: t0, dur: 2.6 }));
  } else if (mode === "strum") { // 吉他的齊奏:由低音弦往高音弦刷下去,弦與弦之間差幾十毫秒
    seq = midis.map((m, i) => ({ midi: m, at: t0 + i * GTR_STRUM_GAP, dur: 2.6 }));
  } else if (mode === "arp") {
    const gap = midis.length > 14 ? Math.max(0.11, 3.6 / midis.length) : 0.24;   // 吉他把位裡最多十幾到二十個音,照 0.24 秒會太久,加快到約 3.6 秒
    seq = midis.map((m, i) => ({ midi: m, at: t0 + i * gap, dur: 2.6 - i * gap * 0.2 }));
  } else { // 逐音上下行:上去再下來,最後一顆是最高音的下行起點,不重複敲
    const gap = 0.30;
    const up = midis.slice();
    const down = downMidis || midis.slice(0, -1).reverse();
    seq = up.concat(down).map((m, i) => ({ midi: m, at: t0 + i * gap, dur: gap * 1.6 }));
  }
  let end = t0;
  const chordAnchors = {}; // 同一次播放裡,同音名的音共用同一份錄音,八度關係才精確
  for (const n of seq) {
    const k = scheduledNodes.length;
    scheduleNote(n.midi, n.at, n.dur, chordAnchors);
    for (let i = k; i < scheduledNodes.length; i++) scheduledNodes[i]._at = n.at;
    soundingWindows.push({ midi: n.midi, from: n.at, to: n.at + Math.min(n.dur, 0.55) });
    end = Math.max(end, n.at + n.dur);
  }

}
function playSingle(midi){
  ensureAudio();
  const at = audioCtx.currentTime + 0.02;
  // 單音不會清掉之前的紀錄(playNotes 才會),連點辨識、滑過和弦圖時兩個陣列會一直長大:把早就結束的丟掉
  soundingWindows = soundingWindows.filter(w => w.to > at - 1);
  scheduledNodes = scheduledNodes.filter(n => !(n._end < at - 0.5));
  scheduleNote(midi, at, 1.4, null);
  soundingWindows.push({ midi, from: at, to: at + 0.4 });
  startHighlightLoop(at + 0.7);
}

  bassIv: null, bassFor: "", // 吉他斜線和弦:低音離根音幾個半音(null = 根音),只對 bassFor 這個和弦有效
  findFrets: [null, null, null, null, null, null] // 吉他反查:每條弦按第幾格(null = 不彈)

const INST_KEY = "harmonymap.inst";
const GTR_TONE_KEY = "harmonymap.gtrTone";
try {

} catch (e) {}
const chordById = id => CHORDS.find(c => c.id === id);
const scaleById = id => SCALES.find(s => s.id === id);

STATE.group.scale = scaleById(STATE.scaleId).g;

  const def = STATE.tab === "scale" ? scaleById(STATE.scaleId) : chordById(STATE.chordId);
  if (!def) return [];

/* 音階要多畫一顆高八度的主音,才看得出「一圈」的形狀。

function displayNotes(){
  const notes = currentNotes();

  const b = STATE.inst === "piano" ? bassInfo() : null;

  if (b && b.chordTone && notes.length) {
    const bm = notes.find(n => pcOf(n.midi) === b.pc).midi;
    return notes.map(n => n.midi < bm ? Object.assign({}, n, { midi: n.midi + 12 }) : n)

                .map(n => n.midi === bm ? Object.assign({}, n, { isBass: true }) : n);

  for (let m = KB_LOW + (12 - pcOf(KB_LOW)) % 12; m <= KB_HIGH; m += 12) {

  }

  if (sl && sl.letter < 0) { STATE.slash = Object.assign({}, sl, { letter: i, acc: 0 }); rootSetBass(); }

    b.setAttribute("aria-label", t(key));
    b.title = t(key);
    // 剛用 / 選好低音時,♭ ♯ 改的是低音,亮的也是低音的記號(青色)
    const bassMode = sl && sl.letter >= 0;
    const on = v === (bassMode ? sl.acc : STATE.acc);
    b.setAttribute("aria-pressed", String(on));
    if (bassMode && on) b.classList.add("bass");   // 只有真的選中的那顆亮青色,沒選的維持原樣(不然滿版都是綠框)
    b.onclick = () => rootAcc(v);
    ar.appendChild(b);
  });
  // 和弦分頁多一顆「/」:按了之後下一個字母(+ ♭ ♯)是低音,跟練習輸入板同一套
  if (STATE.tab === "chord") {
    const b = document.createElement("button");
    b.className = "key-btn acc slash"; b.id = "rootSlash"; b.textContent = "/";
    b.setAttribute("aria-label", t("rootSlash")); b.title = t("rootSlash");
    b.setAttribute("aria-pressed", String(!!sl));
    b.onclick = rootSlash;
    ar.appendChild(b);
  }
}

/* 常用和弦快速鍵:最常查的 14 種,不用進清單找。完整的 80 種還是在下面的清單裡 */
const QUICK_CHORDS = [["maj","maj"],["min","min"],["7","7"],["maj7","maj7"],["m7","m7"],["m7b5","m7♭5"],["dim","dim"],
                      ["aug","aug"],["sus2","sus2"],["sus4","sus4"],["6","6"],["9","9"],["add9","add9"],["13","13"]];
function buildQuickGrid(){
  const g = $("quickGrid");
  g.hidden = STATE.tab !== "chord";
  if (g.hidden) return;
  g.innerHTML = "";
  for (const [id, label] of QUICK_CHORDS) {
    const c = chordById(id);
    if (!c) continue;
    const b = document.createElement("button");
    b.className = "quick-btn";
    b.textContent = label;
    b.title = rootName() + c.sym + " · " + localName(c);
    b.setAttribute("aria-pressed", String(STATE.chordId === id));

    g.appendChild(b);

}
function matchesSearch(item, q){
  if (!q) return true;
  const hay = [item.zh, item.en, item.sym || "", item.id, (item.alias || []).join(" "), item.t.join(" ")]
    .join(" ").toLowerCase();
  return hay.includes(q.toLowerCase());
}
/* 風格與常用度的篩選只套用在和弦(音階是按母音階系統與文化來源分組,本來就沒有這兩個欄位) */
function chordPasses(c, style, level, size){
  if (style && !(c.st || "").split(" ").includes(style)) return false;
  if (level && (c.lv || 2) !== level) return false;
  if (size && sizeBucket(c.t.length) !== size) return false;
  return true;
}
function passesFilter(it){ return chordPasses(it, STATE.style, STATE.level, STATE.size); }

function buildFilterRows(){
  const isChord = STATE.tab === "chord";
  const wrap = $("filterRows");
  $("filterToggle").hidden = STATE.tab === "find";
  wrap.hidden = STATE.tab === "find" || !STATE.filtersOpen;
  $("styleRow").hidden = $("levelRow").hidden = $("sizeRow").hidden = !isChord;
  $("dupRow").hidden = isChord;
  $("filterToggle").setAttribute("aria-expanded", String(STATE.filtersOpen));
  if (STATE.tab === "find") return;
  if (!isChord) {
    const row = $("dupRow");
    row.innerHTML = "";
    const tag = document.createElement("span");
    tag.className = "filter-label";
    tag.textContent = t("filterEnharmonic");
    row.appendChild(tag);
    for (const [val, key] of DUPOPT) {
      const on = STATE.hideDup === val;
