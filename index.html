<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 手機瀏覽器的網址列/狀態列會吃這個顏色。切換淺色主題時 applyTheme() 會一起改,
     不然頁面變白了、上面那條還是黑的,看起來像沒對齊 -->
<meta name="theme-color" content="#0C0A07">
<title>HarmonyMap — 和弦與音階地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ══ 設計代幣:與 ScrollScore 同一套語意變數,兩個工具放在一起看是同一個產品 ══ */
:root{
  --bg:#0C0A07;
  --panel:#161209;
  --panel-2:#201A0F;
  --gold:#C9A24B;
  --gold-bright:#EFD48A;
  --teal:#3FBFAE;          /* 鍵盤上「和弦內音(非根音)」的顏色,沿用 ScrollScore 左右手的第二色 */
  --teal-bright:#8FFFF0;
  --ivory:#F4ECDA;
  --muted:#8A7D5F;
  --muted-bright:#B6A576;
  --line:#2A2415;
  --shadow-sm:0 4px 14px rgba(0,0,0,.35);
  --shadow-md:0 10px 26px rgba(0,0,0,.5);
  --shadow-lg:0 18px 44px rgba(0,0,0,.6);
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:18px;
  --radius-pill:999px;
  --fs-2xs:11px;
  --fs-xs:12px;
  --fs-sm:13px;
  --fs-md:14px;
  --fs-lg:16px;
  --fs-xl:19px;
  --fs-2xl:26px;
  --surface-glass:rgba(32,26,15,.88);
  --surface-inset:rgba(22,18,9,.55);
  --card-tint:rgba(255,255,255,.035);
  --stage-glow:#171208;
  color-scheme:dark;
}
/* ══ 淺色主題:同一組語意變數換一套值,版面與元件完全不用改寫 ══ */
body.light{
  --bg:#FBF7EE;
  --panel:#F4EEE0;
  --panel-2:#EDE6D4;
  --gold:#856418;
  --gold-bright:#6B5115;
  --teal:#0F5F56;
  --teal-bright:#0B463F;
  --ivory:#241E12;
  --muted:#6F6450;
  --muted-bright:#544B3B;
  --line:#D8CDB2;
  --shadow-sm:0 4px 14px rgba(90,72,30,.10);
  --shadow-md:0 10px 26px rgba(90,72,30,.14);
  --shadow-lg:0 18px 44px rgba(90,72,30,.18);
  --surface-glass:rgba(252,249,241,.92);
  --surface-inset:rgba(255,255,255,.7);
  --card-tint:rgba(133,100,24,.05);
  --stage-glow:#FFFDF6;
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  min-height:100%;
  background:var(--bg);color:var(--ivory);
  font-family:"Noto Sans TC",sans-serif;
  display:flex;flex-direction:column;
}
/* ── 頂欄 ───────────────────────── */
header{
  display:flex;align-items:center;flex-wrap:wrap;
  gap:8px 14px;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--line);
  background:var(--panel);
  position:sticky;top:0;z-index:20;
}
.header-left,.header-right{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px}
/* 品牌名用流體字級(clamp)而不是斷點階梯。用斷點的話,430px 的 Pro Max 跟 320px 的 SE
   會拿到同一個字級,大螢幕明明放得下卻被迫用小字,看起來就是「字太小」。
   改成跟著視窗寬度連續縮放:窄機收到剛好放得下,寬機自然長回原本的大小。
   下限 12px 是頂欄單排放得下的極限,上限 var(--fs-lg) 維持桌機原本的大小不變
   ── 這一組數值與 ScrollScore 完全相同,兩個工具的品牌名要長得一模一樣 */
header h1{
  font-family:"Noto Serif TC",serif;
  font-size:clamp(12px, 3.7vw, var(--fs-lg));
  letter-spacing:clamp(.02em, .55vw, .12em);
  font-weight:700;color:var(--gold);white-space:nowrap;
  flex:none;
}
header h1 span{color:var(--ivory);font-weight:600}
/* 副標是 HarmonyMap 自己多出來的東西,獨立成一個元素,不寫進 h1 裡面,
   免得動到照抄過來的品牌名字級 */
.tagline{color:var(--muted);font-size:var(--fs-xs);letter-spacing:.04em;white-space:nowrap}
@media (max-width:600px){ .tagline{display:none} }
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1;
  border:1px solid var(--gold);background:transparent;color:var(--gold);
  font-family:inherit;font-size:var(--fs-md);font-weight:500;
  padding:8px 16px;height:38px;border-radius:var(--radius-pill);cursor:pointer;
  transition:background .2s,color .2s;white-space:nowrap;
}
.btn svg{flex:none}
.btn:active{background:var(--gold);color:var(--bg)}
.btn.primary{background:var(--gold);color:var(--bg);font-weight:700}
.btn.ghost{border-color:var(--line);color:var(--muted-bright)}
.btn.small{height:32px;padding:0 12px;font-size:var(--fs-sm)}
#themeToggle[aria-pressed="true"]{background:var(--gold);color:var(--bg)}
/* 頂欄的內距與間距同樣跟著寬度連續縮放,不用斷點硬切(照 ScrollScore 的值) */
@media (max-width:600px){
  header{padding:8px clamp(6px, 2.2vw, 10px);gap:clamp(4px, 1.4vw, 6px);flex-wrap:nowrap}
  .header-left,.header-right{gap:clamp(4px, 1.4vw, 6px)}
  .btn{padding:0 10px;height:34px;font-size:var(--fs-sm)}
  .btn-label{display:none}
  .header-left .btn svg{margin:0}
}
@media (max-width:380px){ .btn{padding:0 8px;height:32px} }
@media (max-width:340px){ .btn{padding:0 5px} }

/* ── 版面:上半部釘住不動,只有下半部捲動 ──────────────────────
   .topbar(分頁 + 鍵盤 + 根音)整塊 position:sticky,選下面的和弦時鍵盤與 C D E F G
   一直看得到。刻意做成「一個」sticky 區塊而不是三個各自釘住的元素:三個分開釘的話,
   它們中間的間距是透明的,底下的內容會從縫隙穿出來,而且每個元素的 top 偏移量都要
   靠 JS 量前一個的高度。包成一塊就只有一個偏移量、一個不透明底色,不會有縫。
   .lower(和弦清單 + 結果面板)是唯一會捲動的區域。 */
main{
  flex:1;display:flex;flex-direction:column;gap:14px;
  padding:14px;max-width:1400px;width:100%;margin:0 auto;
}
.topbar{
  position:sticky;top:var(--header-h, 56px);z-index:15;
  background:var(--bg); /* 必須不透明:捲上來的內容要被擋在後面 */
  display:flex;flex-direction:column;gap:10px;padding-bottom:8px;
}
.lower{display:flex;flex-direction:column;gap:14px;min-width:0}
.info{display:flex;flex-direction:column;gap:14px;min-width:0}

/* 手機橫向 / 螢幕高度極矮:頂欄整體收扁,品牌名也降一階 */
@media (max-height:420px){
  header{padding:5px 10px;gap:4px 8px}
  header h1{font-size:var(--fs-sm)}
  .btn{padding:0 10px;height:28px;font-size:var(--fs-xs)}
  /* 螢幕矮到這個程度(手機橫向),再把上半部釘住就沒有空間捲清單了,整頁一起捲 */
  .topbar{position:static}
}

.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-md);padding:14px 16px;
}
.card-title{
  font-size:var(--fs-2xs);letter-spacing:.14em;color:var(--muted);
  text-transform:uppercase;font-weight:700;margin-bottom:10px;
}

/* ── 分頁(和弦 / 音階 / 反查)── */
.tabs{display:flex;gap:6px;background:var(--surface-inset);border:1px solid var(--line);
      border-radius:var(--radius-pill);padding:4px}
.tabs button{
  flex:1;border:none;background:transparent;color:var(--muted-bright);
  font-family:inherit;font-size:var(--fs-md);font-weight:500;
  padding:9px 8px;border-radius:var(--radius-pill);cursor:pointer;transition:background .2s,color .2s;
}
.tabs button[aria-selected="true"]{background:var(--gold);color:var(--bg);font-weight:700}

/* ── 根音:字母列 + 升降記號 ── */
.root-row{display:flex;gap:6px;flex-wrap:wrap}
.root-row.letters button{flex:1 1 0;min-width:38px}
.key-btn{
  border:1px solid var(--line);background:var(--surface-inset);color:var(--ivory);
  font-family:"Noto Serif TC",serif;font-size:var(--fs-lg);font-weight:600;
  height:44px;border-radius:var(--radius-sm);cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.key-btn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.acc-row{display:flex;gap:6px;margin-top:6px}
.acc-row .key-btn{flex:1;height:36px;font-size:var(--fs-md)}
/* 手機:根音卡片是釘住的,每省下一點高度就是清單多看到一排。
   「根音」這個標題可以省——底下就是 C D E F G A B 七顆按鈕,不會看不懂 */
@media (max-width:900px){
  #rootCard{padding:10px 12px}
  #rootCard .card-title{display:none}
  .root-row.letters .key-btn{height:40px}
  .acc-row .key-btn{height:32px}
  .topbar{gap:8px}
}

/* ── 類型清單:搜尋 + 分組晶片 ── */
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap input{
  width:100%;height:38px;padding:0 12px 0 34px;
  background:var(--surface-inset);border:1px solid var(--line);border-radius:var(--radius-pill);
  color:var(--ivory);font-family:inherit;font-size:var(--fs-sm);
}
.search-wrap input:focus{outline:none;border-color:var(--gold)}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.6}
/* 清單本身不再自己捲(上半部已經釘住了,交給頁面捲就好),
   否則會出現「捲軸裡還有捲軸」,手機上很難操作 */
.type-group + .type-group{margin-top:14px}
.type-group-title{
  font-size:var(--fs-2xs);letter-spacing:.12em;color:var(--muted);font-weight:700;
  margin-bottom:8px;padding:4px 0;
}
/* 等寬格線排列。原本用 flex 讓晶片各自照文字長度決定寬度,每一列的數量與寬度都不一樣,
   整片看起來參差不齊;改成固定欄寬的 grid,行列自然對齊,長短名稱都排得整整齊齊 */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.chips.wide{grid-template-columns:repeat(auto-fill,minmax(152px,1fr))} /* 音階名稱長,欄位加寬 */
.chip{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:1px solid var(--line);background:var(--surface-inset);color:var(--ivory);
  border-radius:var(--radius-sm);padding:8px 8px;cursor:pointer;
  font-family:inherit;text-align:center;transition:border-color .15s,background .15s;
}
.chip b{font-size:var(--fs-sm);font-weight:700;line-height:1.25;white-space:nowrap}
.chip i{font-size:var(--fs-2xs);font-style:normal;color:var(--muted);line-height:1.25;white-space:nowrap}
/* 音階的中文名稱長度差很多(「多利安」到「烏克蘭小調(多利安♯4)」),允許換行才不會被截掉 */
.chips.wide .chip b,.chips.wide .chip i{white-space:normal}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.chip[aria-pressed="true"] i{color:rgba(0,0,0,.62)}
.empty-hint{color:var(--muted);font-size:var(--fs-sm);padding:10px 2px}

/* ── 鍵盤 ── */
.kb-wrap{
  position:relative; /* 讓載入提示可以絕對定位貼在上面(窄螢幕改成 sticky 一樣能當定位基準) */
  border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;
  background:
    radial-gradient(ellipse 120% 80% at 50% 0%, var(--stage-glow) 0%, var(--bg) 60%);
}
#keyboardCanvas{display:block;width:100%;height:150px;background:transparent;touch-action:manipulation;cursor:pointer}
/* 釘在鍵盤下方的一行摘要:和弦名 + 組成音。
   刻意限制成「絕對只有一行」(nowrap + 超出用省略號),因為這一塊在手機上是釘住的,
   高度只要會隨內容變化,底下整排和弦按鈕就會跟著上下跳 */
.kb-summary{
  display:flex;align-items:baseline;gap:10px;
  padding:9px 12px 0;white-space:nowrap;overflow:hidden;
}
.kb-summary b{
  font-family:"Noto Serif TC",serif;font-size:var(--fs-lg);font-weight:700;
  color:var(--gold-bright);flex:none;
}
.kb-summary .zh{font-size:var(--fs-xs);color:var(--muted);flex:none}
.kb-summary .tones{
  font-size:var(--fs-sm);color:var(--ivory);letter-spacing:.06em;
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:right;
}
.kb-bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 12px;border-top:1px solid var(--line);background:var(--panel);
}
.kb-bar .spacer{flex:1}
.kb-legend{display:flex;gap:12px;font-size:var(--fs-2xs);color:var(--muted)}
.kb-legend span{display:inline-flex;align-items:center;gap:5px}
.kb-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* 載入提示是暫時的,絕對定位浮在鍵盤左上角。
   放進工具列的話,它出現與消失會把那排選單擠成兩行再收回去,整個版面跳一下 */
.audio-status{
  position:absolute;top:8px;left:8px;z-index:2;
  font-size:var(--fs-2xs);color:var(--muted-bright);white-space:nowrap;
  background:var(--surface-glass);border:1px solid var(--line);
  border-radius:var(--radius-pill);padding:3px 10px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
select.mini{
  background:var(--surface-inset);color:var(--ivory);border:1px solid var(--line);
  border-radius:var(--radius-pill);padding:0 10px;height:32px;font-family:inherit;font-size:var(--fs-sm);
}
select.mini:focus{outline:none;border-color:var(--gold)}
/* 手機上鍵盤是釘住的,這條工具列也跟著一直佔畫面高度——圖例的資訊
   下方的結果面板已經寫得更清楚了,窄螢幕就先讓位給控制項,確保它們排得下一列 */
@media (max-width:600px){
  .kb-legend{display:none}
  .kb-bar{padding:6px 8px;gap:6px}
  select.mini{font-size:var(--fs-xs);padding:0 8px}
}

/* ── 結果面板 ── */
.rt-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.rt-name{font-family:"Noto Serif TC",serif;font-size:var(--fs-2xl);font-weight:700;color:var(--gold-bright);line-height:1.1}
.rt-sub{font-size:var(--fs-sm);color:var(--muted-bright)}
/* align-items:stretch(預設值,寫出來提醒別動它):有的音要標八度、有的不用,
   同一列的格子必須等高,不然高低參差 */
.note-strip{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.note-cell{
  min-width:64px;flex:0 0 auto;text-align:center;
  border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:8px 10px;background:var(--surface-inset);
}
.note-cell .deg{font-size:var(--fs-2xs);color:var(--muted);letter-spacing:.06em}
.note-cell .nm{font-family:"Noto Serif TC",serif;font-size:var(--fs-xl);font-weight:700;color:var(--ivory);line-height:1.25}
.note-cell .oct{font-size:var(--fs-2xs);color:var(--muted);opacity:.75}
.note-cell.is-root{border-color:var(--gold);background:rgba(201,162,75,.12)}
.note-cell.is-root .nm{color:var(--gold-bright)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;font-size:var(--fs-sm);color:var(--muted-bright)}
.meta-row b{color:var(--ivory);font-weight:500;font-variant-numeric:tabular-nums}
.desc{margin-top:12px;font-size:var(--fs-sm);line-height:1.75;color:var(--muted-bright)}
.desc strong{color:var(--ivory);font-weight:500}

/* 順階和弦表 */
.table-scroll{overflow-x:auto}
table.dia{width:100%;border-collapse:collapse;font-size:var(--fs-sm);min-width:420px}
table.dia th,table.dia td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.dia th{font-size:var(--fs-2xs);letter-spacing:.08em;color:var(--muted);font-weight:700;text-transform:uppercase}
table.dia td.rn{color:var(--gold);font-family:"Noto Serif TC",serif;font-weight:700}
table.dia td.sym{font-weight:700}
table.dia td.tones{color:var(--muted-bright);font-size:var(--fs-xs)}
table.dia tr:last-child td{border-bottom:none}
table.dia button.link{
  background:none;border:none;color:inherit;font:inherit;cursor:pointer;padding:0;
  border-bottom:1px dashed var(--line);
}
table.dia button.link:hover{color:var(--gold);border-color:var(--gold)}

/* 建議音階 / 相關連結 */
.link-chips{display:flex;flex-wrap:wrap;gap:6px}
.link-chip{
  border:1px dashed var(--line);background:transparent;color:var(--muted-bright);
  border-radius:var(--radius-pill);padding:6px 12px;font-family:inherit;font-size:var(--fs-xs);cursor:pointer;
  transition:border-color .15s,color .15s;
}
.link-chip:hover{border-color:var(--gold);color:var(--gold)}

/* 反查結果 */
.find-list{display:flex;flex-direction:column;gap:8px}
.find-item{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;background:var(--surface-inset);
}
.find-item .fname{font-family:"Noto Serif TC",serif;font-size:var(--fs-lg);font-weight:700;color:var(--gold-bright)}
.find-item .fzh{font-size:var(--fs-xs);color:var(--muted-bright)}
.find-item .ftag{
  margin-left:auto;font-size:var(--fs-2xs);color:var(--muted);
  border:1px solid var(--line);border-radius:var(--radius-pill);padding:2px 8px;
}
.find-item .ftag.exact{color:var(--gold);border-color:var(--gold)}

footer{
  padding:16px 14px calc(18px + env(safe-area-inset-bottom));
  text-align:center;color:var(--muted);font-size:var(--fs-2xs);line-height:1.8;
}
/* ── 觸控裝置:點擊目標放大(照抄 ScrollScore 的 pointer:coarse 三條規則)────────── */
@media (pointer:coarse){
  .btn{height:44px;min-width:44px}
  select.mini{min-height:38px}
}
/* 手機橫向:螢幕高度本來就很吃緊,44px 的按鈕會再吃掉寶貴的高度。
   這裡取 36px 折衷——比純高度斷點的 28px 好按,又不會把清單壓得更小。
   必須放在 pointer:coarse 之後,否則會被上面的 44px 蓋掉 */
@media (pointer:coarse) and (max-height:420px){
  .btn{height:36px}
}
/* 觸控目標寬度連續縮放:320px 只放得下 38px(仍遠高於 WCAG 2.2 AA 2.5.8 要求的 24px,
   而且高度維持 44px),400px 以上就回到 Apple HIG 建議的 44px。
   必須放在 pointer:coarse 之後才不會被上面的 min-width:44px 蓋掉 */
@media (pointer:coarse) and (max-width:420px){
  .btn{min-width:clamp(38px, 10.5vw, 44px)}
}

/* ── 使用者在系統關掉動態效果時,一律不要有轉場與動畫 ──────────────
   四個專案(ScrollScore / SightScore / LoudNorm / HarmonyMap)共用同一組斷點,
   這條是其中之一 */
@media (prefers-reduced-motion: reduce){

<script>
"use strict";
const $ = id => document.getElementById(id);

/* ══════════════════════════════════════════════════════════════
   1. 樂理核心:音名拼寫
   ──────────────────────────────────────────────────────────────
   「C 小三度」寫成 E♭ 而不是 D♯,是因為三度就必須落在 C 往上數第三個字母 E 上。
   所以這裡不用「12 個音的查表」,而是照樂理規則推:
     字母 = 根音字母 + (級數 - 1),升降記號 = 目標音高 - 該字母的自然音高。
   這樣 Cdim7 會正確地拼成 C E♭ G♭ B♭♭(而不是 C D♯ F♯ A),
   Locrian 的 ♭5 也不會被寫成 ♯4。
   ══════════════════════════════════════════════════════════════ */
const LETTERS   = ["C","D","E","F","G","A","B"];
const LETTER_PC = [0, 2, 4, 5, 7, 9, 11];        // 各字母的自然音高(半音)
const SOLFEGE   = ["Do","Re","Mi","Fa","Sol","La","Si"]; // 固定唱名,跟字母一一對應
/* 級數 → 相對根音的半音數(自然音程) */
const DEG_SEMI  = {1:0, 2:2, 3:4, 4:5, 5:7, 6:9, 7:11, 9:14, 11:17, 13:21};

function accText(n){
  if (n === 0) return "";
  if (n > 0) return "♯".repeat(n);
  return "♭".repeat(-n);
}
/* 把 "♭13"、"♯11"、"♭♭7"、"5" 這種級數代號拆成 {deg, alt} */
function parseToken(tok){
  let alt = 0, i = 0;
  while (i < tok.length && (tok[i] === "♭" || tok[i] === "♯")) { alt += tok[i] === "♯" ? 1 : -1; i++; }
  return { deg: parseInt(tok.slice(i), 10), alt };
}
function tokenSemi(tok){
  const { deg, alt } = parseToken(tok);
  return DEG_SEMI[deg] + alt;
}
/* 根音(字母序號 + 升降)加上一個級數代號,推出該音的正規拼寫與相對半音 */
function spell(rootLetter, rootAcc, tok){
  const { deg } = parseToken(tok);
  const semi     = tokenSemi(tok);
  const step     = rootLetter + (deg - 1);
  const letter   = step % 7;
  const carry    = Math.floor(step / 7);            // 跨過 B→C 要補一個八度
  const absolute = LETTER_PC[rootLetter] + rootAcc + semi;
  const natural  = LETTER_PC[letter] + 12 * carry;
  let acc = absolute - natural;
  let name;
  if (acc < -2 || acc > 2) {
    // 三重升降(例如 G♯ 的利底安♯2)在實務上不會這樣寫,退回等音的簡易拼寫
    name = simpleName(((absolute % 12) + 12) % 12, acc < 0 ? "flat" : "sharp");
    acc = null;
  } else {
    name = LETTERS[letter] + accText(acc);
  }
  return { tok, deg, semi, name, letter, acc };
}
const SHARP_NAMES = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const FLAT_NAMES  = ["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];
function simpleName(pc, pref){ return (pref === "flat" ? FLAT_NAMES : SHARP_NAMES)[pc]; }
/* 音名 → 唱名(把字母換掉,升降記號原樣保留) */
function toSolfege(name){
  const idx = LETTERS.indexOf(name[0]);
  return idx < 0 ? name : SOLFEGE[idx] + name.slice(1);
}
function midiToFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }

/* ══════════════════════════════════════════════════════════════
   4. 和弦辨識表:用「相對根音的音級集合」比對,反查與順階和弦共用
   ══════════════════════════════════════════════════════════════ */
const CHORD_MATCH = CHORDS.map(c => {
  const pcs = [...new Set(c.t.map(t => ((tokenSemi(t) % 12) + 12) % 12))].sort((a, b) => a - b);
  return { ref: c, key: pcs.join(","), size: pcs.length, pcs };
});
function setKey(pcs){ return [...new Set(pcs.map(p => ((p % 12) + 12) % 12))].sort((a, b) => a - b).join(","); }
/* 給定根音音級與一組音級,回傳符合的和弦定義(可能多個,依字典順序 = 由簡到繁) */
function matchChords(rootPc, pcs){
  const rel = pcs.map(p => ((p - rootPc) % 12 + 12) % 12);
  const k = setKey(rel);
  return CHORD_MATCH.filter(m => m.key === k).map(m => m.ref);
}

      連常數與註解都保持原樣,只把「左右手聲部(staff 1/2)」的語意
      改讀成「根音 / 其他組成音」:
        staff 1(金色)= 根音       staff 2(青色)= 和弦或音階內的其他音

   ══════════════════════════════════════════════════════════════ */
function isBlackKey(midi){ return [1,3,6,8,10].includes(((midi%12)+12)%12); }
let KB_LOW = 21, KB_HIGH = 108; // 預設A0~C8,選定和弦/音階後會依實際音域重新計算

   符合真實比例的高度,畫布高度動態跟著調,而不是每個裝置寬度都套同一個寫死的高度 */
const WHITE_KEY_ASPECT = 5.2;
const KB_MIN_H = 54, KB_MAX_H = 170;
function computeKeyboardHeight(containerWidth, minH = KB_MIN_H, maxH = KB_MAX_H){
  const n = Math.max(KB_WHITE_KEYS.length, 1);
  const whiteW = containerWidth / n;
  return Math.min(maxH, Math.max(minH, whiteW * WHITE_KEY_ASPECT));
}
function rebuildKeyboardRange(midiList){
  let lowest = Infinity, highest = -Infinity;
  for (const m of midiList) {
    if (m < lowest) lowest = m;
    if (m > highest) highest = m;
  }
  if (!isFinite(lowest) || !isFinite(highest)) {
    KB_LOW = 48; KB_HIGH = 72; // 沒有選任何音時,退回中央的兩個八度
  } else {
    // 兩端都取範圍外最靠近的C(最低音所在八度的C,最高音上面那個八度的C)
    KB_LOW = Math.floor(lowest / 12) * 12;
    KB_HIGH = Math.ceil(highest / 12) * 12;
    if (KB_HIGH <= KB_LOW) KB_HIGH = KB_LOW + 12; // 保險,至少留一個八度
    if (KB_HIGH - KB_LOW < 24) KB_HIGH = KB_LOW + 24; // 視覺化用途:至少看得到兩個八度才有「地圖」感
  }
  KB_WHITE_KEYS = [];
  for (let m = KB_LOW; m <= KB_HIGH; m++) if (!isBlackKey(m)) KB_WHITE_KEYS.push(m);
  KB_WHITE_IDX = {};
  KB_WHITE_KEYS.forEach((m, i) => KB_WHITE_IDX[m] = i);
}
rebuildKeyboardRange([]);

function drawKeyboard(ctx, x, y, w, h, activeMap){
  const whiteW = w / KB_WHITE_KEYS.length;

  // 底板陰影,讓整個鍵盤看起來有深度
  const baseGrad = ctx.createLinearGradient(0, y, 0, y + h);
  baseGrad.addColorStop(0, "#050403");
  baseGrad.addColorStop(1, "#0C0A07");
  ctx.fillStyle = baseGrad;
  ctx.fillRect(x, y, w, h);

  const rr = (cx, cy, cw, ch, r) => {
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(cx, cy, cw, ch, r); }
    else { ctx.beginPath(); ctx.rect(cx, cy, cw, ch); }
  };

  // 白鍵:漸層 + 立體邊緣 + 按下時的光暈(觸鍵瞬間更亮,之後轉為持續的普通高亮)
  for (let i = 0; i < KB_WHITE_KEYS.length; i++) {
    const m = KB_WHITE_KEYS[i];
    const kx = x + i * whiteW;
    const kw = whiteW - 1;
    const info = activeMap.get(m);
    const staff = info && info.staff;
    const attack = info && info.attack;
    let baseColor = staff === 2 ? ["#5FE0CE", "#22887A"] : staff === 1 ? ["#FFDA7A", "#C4901A"] : ["#FFFDF6", "#DDD6C4"];
    if (attack) baseColor = staff === 2 ? ["#B6FFF4", "#3FBFAE"] : ["#FFF3CC", "#F2B94B"];
    const g = ctx.createLinearGradient(kx, y, kx, y + h);
    g.addColorStop(0, baseColor[0]);
    g.addColorStop(0.85, baseColor[1]);
    g.addColorStop(1, baseColor[1]);
    if (staff) {
      ctx.save();
      ctx.shadowColor = staff === 2 ? "rgba(63,191,174,0.85)" : "rgba(242,185,75,0.85)";
      ctx.shadowBlur = attack ? 24 : 14;
    }
    rr(kx, y, kw, h, [3, 3, 6, 6]);
    ctx.fillStyle = g;
    ctx.fill();
    if (staff) ctx.restore();
    // 鍵縫陰影
    ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 1;
    rr(kx, y, kw, h, [3, 3, 6, 6]); ctx.stroke();
    // 頂端高光細線,增加立體感
    ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(kx + 2, y + 1); ctx.lineTo(kx + kw - 2, y + 1); ctx.stroke();
  }

  // 黑鍵:漸層 + 陰影,疊在白鍵上方
  const blackH = h * 0.6, blackW = whiteW * 0.62;
  for (let m = KB_LOW; m <= KB_HIGH; m++) {
    if (!isBlackKey(m)) continue;
    let leftWhite = m - 1;
    while (isBlackKey(leftWhite)) leftWhite--;
    const li = KB_WHITE_IDX[leftWhite];
    if (li === undefined) continue;
    const kx = x + (li + 1) * whiteW - blackW / 2;
    const info = activeMap.get(m);
    const staff = info && info.staff;
    const attack = info && info.attack;
    let baseColor = staff === 2 ? ["#3FBFAE", "#0F5F56"] : staff === 1 ? ["#F2B94B", "#8A6410"] : ["#3a3a3a", "#0a0a0a"];
    if (attack) baseColor = staff === 2 ? ["#8FFFF0", "#22887A"] : staff === 1 ? ["#FFE39A", "#C4901A"] : baseColor;
    // 黑鍵投影到白鍵上
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(kx - 1, y + blackH, blackW + 2, 6);

    const g = ctx.createLinearGradient(kx, y, kx, y + blackH);
    g.addColorStop(0, baseColor[0]);
    g.addColorStop(1, baseColor[1]);
    if (staff) {
      ctx.save();
      ctx.shadowColor = staff === 2 ? "rgba(63,191,174,0.9)" : "rgba(242,185,75,0.9)";
      ctx.shadowBlur = 12;
    }
    rr(kx, y, blackW, blackH, [2, 2, 4, 4]);
    ctx.fillStyle = g;
    ctx.fill();
    if (staff) ctx.restore();
    // 黑鍵頂端光澤
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.fillRect(kx + blackW * 0.15, y + 2, blackW * 0.3, blackH * 0.35);
  }
}

/* ── 音名標籤:ScrollScore 的鍵盤不需要標音名(那邊看的是樂譜),
   這裡是「知道這是什麼音」的工具,所以在上面照同一套幾何再疊一層文字,
   不動到照抄過來的 drawKeyboard 本身 ── */
function drawKeyLabels(ctx, x, y, w, h, labelMap){
  if (!labelMap.size) return;
  const whiteW = w / KB_WHITE_KEYS.length;
  const blackH = h * 0.6, blackW = whiteW * 0.62;
  const fs = Math.max(8, Math.min(15, whiteW * 0.40));
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  // 白鍵標籤:寫在鍵的下緣(黑鍵構不到的地方)
  for (let i = 0; i < KB_WHITE_KEYS.length; i++) {
    const m = KB_WHITE_KEYS[i];
    const lab = labelMap.get(m);
    if (!lab) continue;
    const cx = x + i * whiteW + (whiteW - 1) / 2;
    ctx.font = (lab.strong ? "700 " : "500 ") + fs + "px 'Noto Serif TC', serif";
    ctx.fillStyle = lab.strong ? "rgba(20,14,4,0.92)" : "rgba(60,52,36,0.55)";
    ctx.fillText(lab.text, cx, y + h - fs * 0.95);
  }
  // 黑鍵標籤:寫在黑鍵下緣,字比白鍵小一點才塞得下
  const bfs = Math.max(7, Math.min(12, blackW * 0.46));
  for (let m = KB_LOW; m <= KB_HIGH; m++) {
    if (!isBlackKey(m)) continue;
    const lab = labelMap.get(m);
    if (!lab) continue;
    let leftWhite = m - 1;
    while (isBlackKey(leftWhite)) leftWhite--;
    const li = KB_WHITE_IDX[leftWhite];
    if (li === undefined) continue;
    const cx = x + (li + 1) * whiteW;
    ctx.font = "700 " + bfs + "px 'Noto Serif TC', serif";
    ctx.fillStyle = lab.strong ? "rgba(10,8,2,0.92)" : "rgba(255,253,246,0.6)";
    ctx.fillText(lab.text, cx, y + blackH - bfs * 0.9);
  }
}

/* ══════════════════════════════════════════════════════════════
   6. 畫布尺寸與繪製迴圈
   ══════════════════════════════════════════════════════════════ */
function resizeKeyboardCanvas(){
  const cv = $("keyboardCanvas");
  if (!cv) return;
  const w = cv.getBoundingClientRect().width;
  /* 鍵盤是釘住的,螢幕越矮它就越該收斂,否則上半部佔滿整個畫面、下面的清單沒空間捲。
     用「視窗高度的 22%」當上限而不是再開一個高度斷點:斷點會在某個高度突然跳一階,
     連續縮放則是一路平滑收斂,而且直向手機與桌機(844/900px 高)算出來仍是原本的 170px 上限,
     外觀完全沒變,只有真的很矮的畫面才會收 */
  const maxH = Math.min(KB_MAX_H, window.innerHeight * 0.22);
  cv.style.height = computeKeyboardHeight(w, KB_MIN_H, Math.max(KB_MIN_H, maxH)) + "px";
  const rect = cv.getBoundingClientRect();
  // ScrollScore 的畫布是要拿去錄影的,所以用 CSS px;這裡是給人盯著看音名的,
  // 乘上 devicePixelRatio 讓文字在高解析螢幕上不糊(繪圖座標仍維持 CSS px)
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width  = Math.round(rect.width * dpr);
  cv.height = Math.round(rect.height * dpr);
  cv._cssW = rect.width;
  cv._cssH = rect.height;
  cv._dpr = dpr;
}
function drawKeyboardLive(){
  const cv = $("keyboardCanvas");
  if (!cv || !cv.width) return;
  const ctx = cv.getContext("2d");
  ctx.setTransform(cv._dpr, 0, 0, cv._dpr, 0, 0);
  ctx.clearRect(0, 0, cv._cssW, cv._cssH);
  const view = currentView();
  drawKeyboard(ctx, 0, 0, cv._cssW, cv._cssH, view.activeMap);
  if (STATE.label !== "off") drawKeyLabels(ctx, 0, 0, cv._cssW, cv._cssH, view.labelMap);
}
/* 把頂欄與釘住區塊的實際高度餵給 CSS。兩個高度都是會變的:頂欄隨字級與換行改變,
   釘住區塊的高度隨鍵盤音域(白鍵數)改變,寫死數字遲早會對不齊 */
function syncStickyMetrics(){
  const root = document.documentElement.style;
  const h = document.querySelector("header");
  if (h) root.setProperty("--header-h", h.offsetHeight + "px");
  const t = document.querySelector(".topbar");
  if (t) root.setProperty("--topbar-h", t.offsetHeight + "px");
}
window.addEventListener("resize", () => { syncStickyMetrics(); resizeKeyboardCanvas(); drawKeyboardLive(); syncStickyMetrics(); });

/* ══════════════════════════════════════════════════════════════
   7. 音訊:與 ScrollScore 同一套音源
   ──────────────────────────────────────────────────────────────
   主音源是 Salamander 鋼琴真實取樣(Tone.js 官方託管的完整版),
   取樣還沒載好或抓不到時,退回同一套合成音色備援 —— 訊號鏈(限幅器、
   殘響、依音高擺左右的聲像)與包絡參數都照 ScrollScore 的設定。
   ══════════════════════════════════════════════════════════════ */
let audioCtx = null, masterGain = null, masterLimiter = null;
let reverbBus = null, reverbConvolver = null, reverbPreDelay = null, reverbWet = null;
let scheduledNodes = [];
function buildImpulseResponse(seconds, decayPow){
  const rate = audioCtx.sampleRate;
  const len = Math.max(1, Math.floor(rate * seconds));
  const ir = audioCtx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    let lp = 0;
    for (let i = 0; i < len; i++) {
      const t = i / len;
      const env = Math.pow(1 - t, decayPow);
      const noise = (Math.random() * 2 - 1) * env;
      // 一極低通,係數隨時間變小 = 尾巴越後面越暗,模擬空間對高頻的吸收
      const a = 0.42 * (1 - t * 0.8) + 0.02;
      lp += a * (noise - lp);
      d[i] = lp;
    }
  }
  return ir;
}
function ensureAudio(){
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.48;   // 留足夠的動態餘裕,和弦同時發聲才不會相加後破音
    masterLimiter = audioCtx.createDynamicsCompressor();
    masterLimiter.threshold.value = -3;
    masterLimiter.knee.value = 3;
    masterLimiter.ratio.value = 12;
    masterLimiter.attack.value = 0.001;
    masterLimiter.release.value = 0.25;
    /* 響度壓縮(loudnessComp):完全保留鋼琴原始力度動態的話,只有在真正逼近削波的瞬間才被
       限幅器煞車,平均音量自然遠低於一般影片(影片後製都會做母帶壓縮,把安靜段落墊高、
       整體塞到接近上限),使用者要開到 80~90% 音量才聽得清楚。
       這裡加一段真正的響度壓縮,門檻降到 -18dB、壓縮比 3:1,把較大聲的部分先壓掉一截,
       空出來的餘裕再用 makeupGain 補回音量,把平均音量墊高。參數與 ScrollScore 相同。 */
    const loudnessComp = audioCtx.createDynamicsCompressor();
    loudnessComp.threshold.value = -18;
    loudnessComp.knee.value = 8;
    loudnessComp.ratio.value = 3;
    loudnessComp.attack.value = 0.008;
    loudnessComp.release.value = 0.18;
    const makeupGain = audioCtx.createGain();
    makeupGain.gain.value = 1.6; // 補回響度壓縮讓出來的餘裕,數值來自實測而非估算
    masterGain.connect(loudnessComp);
    loudnessComp.connect(makeupGain);
    makeupGain.connect(masterLimiter);
    masterLimiter.connect(audioCtx.destination);

    reverbBus = audioCtx.createGain();
    reverbPreDelay = audioCtx.createDelay(0.2);
    reverbPreDelay.delayTime.value = 0.018;
    reverbConvolver = audioCtx.createConvolver();
    reverbConvolver.buffer = buildImpulseResponse(2.1, 2.4);
    reverbWet = audioCtx.createGain();
    reverbWet.gain.value = 0.18;
    reverbBus.connect(reverbPreDelay);
    reverbPreDelay.connect(reverbConvolver);
    reverbConvolver.connect(reverbWet);
    reverbWet.connect(masterGain);
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  loadPianoSamples();
}

/* ── 真實樂器取樣 ─────────────────────────────
   PIANO_BASE 是 Tone.js 官方託管的完整版 Salamander 鋼琴取樣,音質/延音都比一般鏡像版本好。
   exactList 是這個取樣庫實際收錄的每一個(音名,八度),逐一驗證過才收錄,
   不是套公式帶入每個八度固定幾個音——套用不存在的組合只會讓抓取落空 */
const PIANO_BASE = "https://tonejs.github.io/audio/salamander/";
const NOTE_SEMITONE = { C:0, Cs:1, D:2, Ds:3, E:4, F:5, Fs:6, G:7, Gs:8, A:9, As:10, B:11 };
const PIANO_SAMPLES = [
  ["A",0],
  ["C",1],["Ds",1],["Fs",1],["A",1],
  ["C",2],["Ds",2],["Fs",2],["A",2],
  ["C",3],["Ds",3],["Fs",3],["A",3],
  ["C",4],["Ds",4],["Fs",4],["A",4],
  ["C",5],["Ds",5],["Fs",5],["A",5],
  ["C",6],["Ds",6],["Fs",6],["A",6],
  ["C",7],["Ds",7],["Fs",7],["A",7],
  ["C",8]
];
let pianoBuffers = null, pianoLoading = null;
function setAudioStatus(txt){
  const el = $("audioStatus");
  if (el) { el.textContent = txt || ""; el.hidden = !txt; }
}
function loadPianoSamples(){
  if (pianoBuffers || pianoLoading) return pianoLoading || Promise.resolve();
  const list = [], jobs = [];
  for (const [letter, oct] of PIANO_SAMPLES) {
    const midi = (oct + 1) * 12 + NOTE_SEMITONE[letter];
    const url = PIANO_BASE + letter + oct + ".mp3";
    jobs.push(
      fetch(url).then(r => { if (!r.ok) throw new Error("404"); return r.arrayBuffer(); })
        .then(arr => audioCtx.decodeAudioData(arr))
        .then(buf => { list.push({ midi, buffer: buf }); })
        .catch(() => {}) // 該取樣缺失就跳過,不影響其他音符
    );
  }
  setAudioStatus("載入鋼琴音色中…");
  pianoLoading = Promise.all(jobs).then(() => {
    pianoBuffers = list;
    setAudioStatus(list.length ? "" : "音色載入失敗,使用合成音色");
    if (!list.length) setTimeout(() => setAudioStatus(""), 4000);
  });
  return pianoLoading;
}
/* 找最接近的取樣,用 playbackRate 補足音高差(標準取樣器做法) */
function nearestSample(list, targetMidi){
  let best = list[0], bestDist = Infinity;
  for (const s of list) {
    const dist = Math.abs(s.midi - targetMidi);
    if (dist < bestDist) { bestDist = dist; best = s; }
  }
  return best;
}
/* 取樣播放。chordAnchors:同一個和弦裡,同音名(差整數個八度)的音優先共用同一份錄音,
   讓八度關係更精確;但如果共用會讓變速幅度過大(音色明顯失真),就改用各自最近的錄音 */
function playSampledPiano(midi, when, dur, chordAnchors){
  const list = pianoBuffers;
  if (!list || !list.length) return false;
  const pitchClass = ((midi % 12) + 12) % 12;
  const SHARE_SHIFT_LIMIT = 4; // 半音,超過這個幅度共用弊大於利
  let best;
  if (chordAnchors && chordAnchors[pitchClass] && Math.abs(midi - chordAnchors[pitchClass].midi) <= SHARE_SHIFT_LIMIT) {
    best = chordAnchors[pitchClass];
  } else {
    best = nearestSample(list, midi);
    if (chordAnchors && !chordAnchors[pitchClass]) chordAnchors[pitchClass] = best;
  }
  const rate = Math.pow(2, (midi - best.midi) / 12);
  const src = audioCtx.createBufferSource();
  src.buffer = best.buffer;
  src.playbackRate.setValueAtTime(rate, when);
  const g = audioCtx.createGain();
  const peakGain = 0.6, tail = 0.4;
  const sustain = Math.max(dur, 0.1);
  // 取樣本身錄音長度可能比需要的延音短,加上尾段循環撐住聲音
  const neededSec = (sustain + tail) * rate;
  const bufDur = best.buffer.duration;
  if (bufDur < neededSec && bufDur > 0.3) {
    src.loop = true;
    const loopLen = Math.min(0.6, bufDur * 0.3);
    src.loopStart = Math.max(0, bufDur - loopLen);
    src.loopEnd = bufDur;
  }
  g.gain.setValueAtTime(peakGain, when);
  /* 鋼琴弦被敲下去之後就一路自然衰減,而且衰減速度必須是「每秒固定比例」,
     不是「不管多長都在音符結束時剛好衰減到某個比例」——後者短音掉得快、長音掉得慢,
     同一台鋼琴上不該有這種差異。這裡用固定時間常數 DECAY_TAU */
  const DECAY_TAU = 2.2; // 秒:約每 2.2 秒衰減到 37%,接近真實鋼琴中音域的衰減速度
  const decayEnd = Math.max(when + Math.max(sustain, 0.02), when + 0.005);
  const endLevel = Math.max(0.06, Math.exp(-(decayEnd - when) / DECAY_TAU));
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peakGain * endLevel), decayEnd);
  g.gain.exponentialRampToValueAtTime(0.0001, decayEnd + tail);
  src.connect(g);
  connectOut(g, midi);
  src.start(when);
  src.stop(when + sustain + tail + 0.1);
  scheduledNodes.push(src);
  return true;
}
/* 聲像 + 殘響送出:鋼琴依音高擺左右(低音左、高音右),取樣與合成兩條路徑共用同一個出口,
   否則取樣載入前後的空間感會突然改變 */
function connectOut(node, midi){
  const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
  const out = panner || node;
  if (panner) { panner.pan.value = pianoPanFor(midi); node.connect(panner); }
  out.connect(masterGain);
  if (reverbBus) {
    const send = audioCtx.createGain();
    send.gain.value = 0.5;
    out.connect(send); send.connect(reverbBus);
  }
}
/* 對外的統一入口:有取樣就用取樣,沒有就用合成音色備援 */
function scheduleNote(midi, when, dur, chordAnchors){
  if (playSampledPiano(midi, when, dur, chordAnchors)) return;
  schedulePiano(midi, when, dur);
}
/* 真實鋼琴的低音弦在左、高音弦在右(以演奏者的視角) */
function pianoPanFor(midi){
  const t = Math.max(0, Math.min(1, (midi - 21) / 87));
  return (t - 0.5) * 0.64;
}
function schedulePiano(midi, when, dur){
  const freq = midiToFreq(midi);
  const osc = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const lp = audioCtx.createBiquadFilter();
  osc.type = "triangle"; osc.frequency.value = freq;
  osc2.type = "sine";    osc2.frequency.value = freq * 2; // 一點泛音
  lp.type = "lowpass";   lp.frequency.value = Math.min(freq * 6, 8000);
  const g2 = audioCtx.createGain(); g2.gain.value = 0.18;
  const peak = 0.32;
  const sustain = Math.max(dur * 0.9, 0.08), releaseTail = 0.35;
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(peak, when + 0.012);
  // 鋼琴弦是持續自然衰減,而且衰減速度是每秒固定比例(短音長音都一樣)
  const decayEnd = when + Math.max(sustain, 0.02);
  const endLevel = Math.max(0.06, Math.exp(-(decayEnd - when) / 2.2));
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak * endLevel), decayEnd);
  g.gain.exponentialRampToValueAtTime(0.0001, decayEnd + releaseTail);
  osc.connect(lp); osc2.connect(g2); g2.connect(lp);
  lp.connect(g);
  connectOut(g, midi); // 與取樣路徑共用同一個出口(聲像 + 殘響)
  osc.start(when); osc2.start(when);
  const stopAt = when + sustain + releaseTail + 0.05;
  osc.stop(stopAt); osc2.stop(stopAt);
  scheduledNodes.push(osc, osc2);
}
function stopAllSound(){
  for (const n of scheduledNodes) { try { n.stop(); } catch (e) {} }
  scheduledNodes = [];
  soundingWindows = [];
}

/* 播放中的視覺高亮:記下每個音的發聲區間,rAF 期間比對現在時間 */
let soundingWindows = [];   // [{midi, from, to}] 以 audioCtx.currentTime 為基準
let animId = 0;
function startHighlightLoop(untilTime){
  cancelAnimationFrame(animId);
  const step = () => {
    drawKeyboardLive();
    if (audioCtx && audioCtx.currentTime < untilTime) animId = requestAnimationFrame(step);
    else { soundingWindows = []; drawKeyboardLive(); }
  };
  animId = requestAnimationFrame(step);
}
function isSounding(midi){
  if (!audioCtx || !soundingWindows.length) return false;
  const t = audioCtx.currentTime;
  return soundingWindows.some(s => s.midi === midi && t >= s.from && t <= s.to);
}
function playNotes(midis, mode){
  ensureAudio();
  stopAllSound();
  const t0 = audioCtx.currentTime + 0.06;
  let seq;
  if (mode === "block") {
    seq = midis.map(m => ({ midi: m, at: t0, dur: 2.6 }));
  } else if (mode === "arp") {
    const gap = 0.16;
    seq = midis.map((m, i) => ({ midi: m, at: t0 + i * gap, dur: 2.6 - i * gap * 0.2 }));
  } else { // 逐音上下行:上去再下來,最後一顆是最高音的下行起點,不重複敲
    const gap = 0.30;
    const up = midis.slice();
    const down = midis.slice(0, -1).reverse();
    seq = up.concat(down).map((m, i) => ({ midi: m, at: t0 + i * gap, dur: gap * 1.6 }));
  }
  let end = t0;
  const chordAnchors = {}; // 同一次播放裡,同音名的音共用同一份錄音,八度關係才精確
  for (const n of seq) {
    scheduleNote(n.midi, n.at, n.dur, chordAnchors);
    soundingWindows.push({ midi: n.midi, from: n.at, to: n.at + Math.min(n.dur, 0.55) });
    end = Math.max(end, n.at + n.dur);
  }
  startHighlightLoop(end + 0.3);
}
function playSingle(midi){
  ensureAudio();
  const at = audioCtx.currentTime + 0.02;
  scheduleNote(midi, at, 1.4, null);
  soundingWindows.push({ midi, from: at, to: at + 0.4 });
  startHighlightLoop(at + 0.7);
}

/* ══════════════════════════════════════════════════════════════
   8. 應用狀態
   ══════════════════════════════════════════════════════════════ */
const STATE = {
  tab: "chord",
  letter: 0,      // LETTERS 的索引
  acc: 0,         // -1 / 0 / 1
  chordId: "maj7",
  scaleId: "ionian",
  octave: 4,      // 根音所在八度(C4 = MIDI 60)
  label: "en",
  playMode: "block",
  search: "",
  findSel: new Set(),
  findSpell: "sharp"
};
const chordById = id => CHORDS.find(c => c.id === id);
const scaleById = id => SCALES.find(s => s.id === id);
function rootName(){ return LETTERS[STATE.letter] + accText(STATE.acc); }
function rootPc(){ return ((LETTER_PC[STATE.letter] + STATE.acc) % 12 + 12) % 12; }
function rootMidi(){ return 12 * (STATE.octave + 1) + LETTER_PC[STATE.letter] + STATE.acc; }

/* 目前選擇 → 音的清單(含正規拼寫與實際 MIDI) */
function currentNotes(){
  const def = STATE.tab === "scale" ? scaleById(STATE.scaleId) : chordById(STATE.chordId);
  if (!def) return [];
  const base = rootMidi();
  return def.t.map(tok => {
    const s = spell(STATE.letter, STATE.acc, tok);
    return Object.assign({}, s, { midi: base + s.semi });
  });
}
/* 音階要多畫一顆高八度的主音,才看得出「一圈」的形狀。
   這一份是「讀出來給人看/拿去播放」的音,音階固定一個八度就好 */
function displayNotes(){
  const notes = currentNotes();
  if (STATE.tab === "scale" && notes.length) {
    const first = notes[0];
    notes.push(Object.assign({}, first, { midi: first.midi + 12, octaveTop: true }));
  }
  return notes;
}
/* 這一份是畫在鍵盤上的音。和弦畫的是一個具體的排列(延伸音本來就該疊在上面),
   音階則是一組「音級」,本來每個八度都會重複出現,所以整片鍵盤都畫出來,
   一眼就看得到這個音階在鋼琴上的形狀 */
function keyboardNotes(){
  const notes = displayNotes();
  if (STATE.tab !== "scale" || !notes.length) return notes;
  const out = [];
  const base = currentNotes();
  for (let oct = 0; oct <= 1; oct++) {
    for (const n of base) out.push(Object.assign({}, n, { midi: n.midi + 12 * oct }));
  }
  out.push(Object.assign({}, base[0], { midi: base[0].midi + 24, octaveTop: true }));
  return out;
}
/* 交給 drawKeyboard 的 activeMap,以及標籤用的 labelMap */
function currentView(){
  const activeMap = new Map(), labelMap = new Map();
  if (STATE.tab === "find") {
    const an = findAnalysis();
    const bass = an.sel[0];
    for (const m of an.sel) {
      const pc = ((m % 12) + 12) % 12;
      activeMap.set(m, { staff: m === bass ? 1 : 2, attack: isSounding(m) });
      labelMap.set(m, { text: keyLabelText(an.nameByPc.get(pc), an.tokByPc.get(pc)), strong: true });
    }
  } else {
    for (const n of keyboardNotes()) {
      const isRoot = n.deg === 1;
      activeMap.set(n.midi, { staff: isRoot ? 1 : 2, attack: isSounding(n.midi) });
      labelMap.set(n.midi, { text: keyLabelText(n.name, n.tok), strong: true });
    }
  }
  // 沒被選到的 C 也淡淡標一下,才知道現在看的是哪個八度
  for (let m = KB_LOW; m <= KB_HIGH; m += 12) {
    if (!labelMap.has(m)) labelMap.set(m, { text: STATE.label === "deg" ? "" : keyLabelText("C", null) + (m / 12 - 1), strong: false });
  }
  return { activeMap, labelMap };
}
function keyLabelText(name, tok){
  if (STATE.label === "do") return toSolfege(name);
  if (STATE.label === "deg") return tok || "";
  return name;
}

function buildRootPicker(){
  const lr = $("letterRow");
  lr.innerHTML = "";
  LETTERS.forEach((L, i) => {

    b.className = "key-btn";
    b.textContent = L;

    lr.appendChild(b);
  });

  ar.innerHTML = "";
  [[-1, "♭ 降"], [0, "♮ 原"], [1, "♯ 升"]].forEach(([v, t]) => {
    const b = document.createElement("button");
    b.className = "key-btn";
    b.textContent = t;
    b.setAttribute("aria-pressed", String(v === STATE.acc));

function matchesSearch(item, q){
  if (!q) return true;
  const hay = [item.zh, item.en, item.sym || "", item.id, (item.alias || []).join(" "), item.t.join(" ")]
    .join(" ").toLowerCase();
  return hay.includes(q.toLowerCase());
}
function buildTypeList(){
  const list = $("typeList");
  list.innerHTML = "";
  const isChord = STATE.tab === "chord";
  const items = (isChord ? CHORDS : SCALES).filter(it => matchesSearch(it, STATE.search));
  if (!items.length) {
    list.innerHTML = '<div class="empty-hint">沒有符合的項目,換個關鍵字試試(可以搜尋 m7、Lydian、♭9、五聲…)</div>';
    return;
  }
  const groups = [];
  for (const it of items) {
    let grp = groups.find(g => g.name === it.g);
    if (!grp) groups.push(grp = { name: it.g, items: [] });
    grp.items.push(it);
  }
  const selId = isChord ? STATE.chordId : STATE.scaleId;
  for (const g of groups) {
    const wrap = document.createElement("div");
    wrap.className = "type-group";
    const title = document.createElement("div");
    title.className = "type-group-title";
    title.textContent = g.name;
    wrap.appendChild(title);
    const chips = document.createElement("div");
    chips.className = isChord ? "chips" : "chips wide";
    for (const it of g.items) {
      const b = document.createElement("button");
      b.className = "chip";
      b.setAttribute("aria-pressed", String(it.id === selId));
      b.innerHTML = "<b></b><i></i>";
      b.querySelector("b").textContent = isChord ? rootName() + it.sym : it.zh;
      b.querySelector("i").textContent = isChord ? it.zh : it.en;
      // 點名稱就直接發聲。已經選中的再點一次就是重播,不需要另外一顆播放鈕
      b.onclick = () => {
        if (isChord) STATE.chordId = it.id; else STATE.scaleId = it.id;
        render();
        playCurrent();
      };
      chips.appendChild(b);
    }
    wrap.appendChild(chips);
    list.appendChild(wrap);
  }
}

const ROMAN = ["I","II","III","IV","V","VI","VII"];
/* 七聲音階的順階和弦:每隔一個音疊上去,再用和弦辨識表反查名稱 */
function diatonicChords(scale){
  if (scale.t.length !== 7) return null;
  const notes = scale.t.map(tok => spell(STATE.letter, STATE.acc, tok));
  const out = [];
  for (let i = 0; i < 7; i++) {
    const pick = k => {
      const idx = (i + k) % 7;
      const wraps = Math.floor((i + k) / 7);
      return { note: notes[idx], semi: notes[idx].semi + 12 * wraps };
    };
    const stack = [pick(0), pick(2), pick(4), pick(6)];
    const rel = stack.map(s => s.semi - stack[0].semi);
    const triad = matchChords(0, rel.slice(0, 3))[0];
    const seventh = matchChords(0, rel)[0];
    const rn = ROMAN[i];
    let roman = rn;
    if (triad) {
      if (triad.id === "min" || triad.id === "dim") roman = rn.toLowerCase();
      if (triad.id === "dim") roman += "°";
      if (triad.id === "aug") roman += "+";
    }
    out.push({
      roman,
      root: stack[0].note.name,
      triad: triad ? stack[0].note.name + triad.sym : "—",
      triadZh: triad ? triad.zh : "",
      seventh: seventh ? stack[0].note.name + seventh.sym : "—",
      seventhId: seventh ? seventh.id : null,
      seventhLetter: stack[0].note.letter,
      seventhAcc: stack[0].note.acc,
      tones: stack.map(s => s.note.name).join(" ")
    });
  }
  return out;
}

function intervalSteps(notes){
  const steps = [];
  for (let i = 1; i < notes.length; i++) steps.push(notes[i].semi - notes[i - 1].semi);
  return steps;
}

function renderReadout(){
  const ro = $("readout"), ex = $("extraCard");
  if (STATE.tab === "find") { renderFindReadout(ro, ex); return; }

  const isChord = STATE.tab === "chord";
  const def = isChord ? chordById(STATE.chordId) : scaleById(STATE.scaleId);
  const notes = currentNotes();
  const title = isChord ? (rootName() + def.sym) : (rootName() + " " + def.zh);
  const sub = isChord
    ? def.zh + " · " + def.en + (def.alias.length ? " · 別名 " + def.alias.map(a => rootName() + a).join("、") : "")
    : def.en;

  let html = '<div class="rt-head"><div class="rt-name"></div><div class="rt-sub"></div></div>';
  html += '<div class="note-strip">';
  const shown = displayNotes();
  let prevOct = null;
  for (const n of shown) {
    const oct = Math.floor(n.midi / 12) - 1;
    // 八度數字只在「換八度」的那顆音標出來,不然每一格都寫一次很吵
    const octLabel = oct === prevOct ? "" : "第 " + oct + " 八度";
    prevOct = oct;
    html += '<div class="note-cell' + (n.deg === 1 && !n.octaveTop ? " is-root" : "") + '" data-midi="' + n.midi + '">' +
              '<div class="deg">' + (n.deg === 1 && !n.octaveTop ? "根音 1" : n.tok) + '</div>' +
              '<div class="nm">' + (STATE.label === "do" ? toSolfege(n.name) : n.name) + '</div>' +
              (octLabel ? '<div class="oct">' + octLabel + '</div>' : "") +
            '</div>';
  }
  html += '</div>';

  // 只留「公式」與「半音間隔」:音數看得出來、音級集合上面那排音名已經寫過了,
  // 重複的資訊只是把面板撐長、讓版面變亂
  const steps = intervalSteps(notes);
  html += '<div class="meta-row">' +
            '<span>公式 <b>' + def.t.join("  ") + '</b></span>' +
            '<span>半音間隔 <b>' + steps.join("–") + '</b></span>' +
          '</div>';
  html += '<div class="desc">' + def.d + '</div>';
  ro.innerHTML = html;
  ro.querySelector(".rt-name").textContent = title;
  ro.querySelector(".rt-sub").textContent = sub;
  ro.querySelectorAll(".note-cell").forEach(el => {
    el.style.cursor = "pointer";
    el.onclick = () => playSingle(+el.dataset.midi);
  });

  // ── 延伸資訊 ──
  if (isChord) {
    const ids = CHORD_SCALES[def.id] || [];
    let e = '<div class="card-title">可以搭配的音階</div><div class="link-chips">';
    for (const sid of ids) {
      const s = scaleById(sid);
      if (s) e += '<button class="link-chip" data-scale="' + sid + '">' + rootName() + " " + s.zh + " · " + s.en + '</button>';
    }
    e += '</div>';
    // 同一組音的其他寫法(等和弦)
    const others = matchChords(rootPc(), notes.map(n => (rootPc() + n.semi) % 12)).filter(c => c.id !== def.id);
    if (others.length) {
      e += '<div class="card-title" style="margin-top:16px">同樣這幾個音的其他和弦名稱</div><div class="link-chips">';
      for (const o of others) e += '<button class="link-chip" data-chord="' + o.id + '">' + rootName() + o.sym + " · " + o.zh + '</button>';
      e += '</div>';
    }
    ex.innerHTML = e;
    ex.hidden = false;
    ex.querySelectorAll("[data-scale]").forEach(b => b.onclick = () => { STATE.tab = "scale"; STATE.scaleId = b.dataset.scale; render(); });
    ex.querySelectorAll("[data-chord]").forEach(b => b.onclick = () => { STATE.chordId = b.dataset.chord; render(); });
  } else {
    const dia = diatonicChords(def);
    if (!dia) {
      ex.innerHTML = '<div class="card-title">順階和弦</div><div class="desc" style="margin-top:0">' +
        def.t.length + ' 個音的音階不是照三度堆疊建構的,沒有標準的順階和弦表。直接看上面的組成音來配和弦即可。</div>';
      ex.hidden = false;
    } else {
      let e = '<div class="card-title">順階和弦(三度堆疊)</div><div class="table-scroll"><table class="dia">' +
              '<tr><th>級數</th><th>三和弦</th><th>七和弦</th><th>組成音</th></tr>';
      for (const d of dia) {
        e += '<tr><td class="rn">' + d.roman + '</td><td class="sym">' + d.triad + '</td>' +
             '<td class="sym"><button class="link" data-id="' + (d.seventhId || "") + '" data-letter="' + d.seventhLetter + '" data-acc="' + (d.seventhAcc === null ? "" : d.seventhAcc) + '">' + d.seventh + '</button></td>' +
             '<td class="tones">' + d.tones + '</td></tr>';
      }
      e += '</table></div><div class="desc">點七和弦可以直接跳去看它的組成音。</div>';
      ex.innerHTML = e;
      ex.hidden = false;
      ex.querySelectorAll("button.link").forEach(b => {
        b.onclick = () => {
          if (!b.dataset.id || b.dataset.acc === "") return;
          STATE.tab = "chord";
          STATE.chordId = b.dataset.id;
          STATE.letter = +b.dataset.letter;
          STATE.acc = +b.dataset.acc;
          render();
        };
      });
    }
  }
}
/* 反查的分析結果:選了哪些音、符合哪些和弦、每個音級該怎麼拼寫。
   鍵盤標籤與下方面板共用同一份結果,兩邊的音名才不會不一致 */
function findAnalysis(){
  const sel = [...STATE.findSel].sort((a, b) => a - b);
  const pcs = [...new Set(sel.map(m => ((m % 12) + 12) % 12))];
  const bassPc = sel.length ? ((sel[0] % 12) + 12) % 12 : null;
  const results = [];
  for (const rp of pcs) {
    for (const c of matchChords(rp, pcs)) results.push({ rootPc: rp, chord: c, isBass: rp === bassPc });
  }
  // 低音當根音的排前面,再來是組成音少(比較單純)的寫法
  results.sort((a, b) => (b.isBass - a.isBass) || (a.chord.t.length - b.chord.t.length));

  /* 音名拼寫:一旦找到完全符合的和弦,就照那個和弦的級數推算正規拼寫
     (所以 C-E-G-B♭ 會寫成 B♭ 而不是 A♯);沒有符合的和弦時才退回升/降偏好 */
  const nameByPc = new Map(), tokByPc = new Map();
  if (results.length) {
    const best = results[0];
    const rn = simpleName(best.rootPc, STATE.findSpell);
    const li = LETTERS.indexOf(rn[0]);
    const ac = (rn.match(/♯/g) || []).length - (rn.match(/♭/g) || []).length;
    for (const tok of best.chord.t) {
      const s = spell(li, ac, tok);
      const pc = ((LETTER_PC[li] + ac + s.semi) % 12 + 12) % 12;
      if (!nameByPc.has(pc)) { nameByPc.set(pc, s.name); tokByPc.set(pc, tok); }
    }
  }
  for (const p of pcs) if (!nameByPc.has(p)) nameByPc.set(p, simpleName(p, STATE.findSpell));
  return { sel, pcs, bassPc, results, nameByPc, tokByPc };
}

function renderFindReadout(ro, ex){
  const an = findAnalysis();
  const sel = an.sel;
  if (!sel.length) {
    ro.innerHTML = '<div class="rt-head"><div class="rt-name">反查和弦</div></div>' +
      '<div class="desc" style="margin-top:0">在上面的鍵盤點幾個音,這裡就會列出所有名字符合的和弦。' +
      '例如點 C E G B♭ 會得到 <strong>C7</strong>,再加一個 D 就變成 <strong>C9</strong>。</div>';
    ex.hidden = true;
    return;
  }
  const pcs = an.pcs, results = an.results, spellPref = STATE.findSpell;
  // 依實際彈奏的高低順序把音名列出來(同一個音級只列一次)
  const seen = new Set();
  const ordered = sel.map(m => ((m % 12) + 12) % 12).filter(p => !seen.has(p) && seen.add(p));

  let html = '<div class="rt-head"><div class="rt-name">' +
             ordered.map(p => an.nameByPc.get(p)).join(" ") + '</div>' +
             '<div class="rt-sub">已選 ' + sel.length + ' 個音 · ' + pcs.length + ' 個不同音級</div></div>';
  if (results.length) {
    html += '<div class="find-list">';
    for (const r of results.slice(0, 12)) {
      const nm = simpleName(r.rootPc, spellPref) + r.chord.sym;
      html += '<div class="find-item"><span class="fname">' + nm + '</span>' +
              '<span class="fzh">' + r.chord.zh + '</span>' +
              '<span class="ftag exact">' + (r.isBass ? "根音在低音" : "轉位") + '</span></div>';
    }
    html += '</div>';
  } else {
    html += '<div class="desc" style="margin-top:0">這組音沒有完全對應的標準和弦名稱。下面列出「包含這幾個音」的和弦,可以當作候選。</div>';
  }
  ro.innerHTML = html;

  // 超集合:哪些和弦「包含」目前選的音
  const supers = [];
  for (let rp = 0; rp < 12; rp++) {
    for (const m of CHORD_MATCH) {
      if (m.size <= pcs.length) continue;
      const abs = new Set(m.pcs.map(p => (p + rp) % 12));
      if (pcs.every(p => abs.has(p))) supers.push({ rootPc: rp, chord: m.ref, missing: m.size - pcs.length });
    }
  }
  supers.sort((a, b) => a.missing - b.missing || a.chord.t.length - b.chord.t.length);
  if (supers.length) {
    let e = '<div class="card-title">這些音可以屬於(還差幾個音)</div><div class="find-list">';
    for (const s of supers.slice(0, 10)) {
      e += '<div class="find-item"><span class="fname">' + simpleName(s.rootPc, spellPref) + s.chord.sym + '</span>' +
           '<span class="fzh">' + s.chord.zh + '</span>' +
           '<span class="ftag">還差 ' + s.missing + ' 音</span></div>';
    }
    e += '</div>';
    ex.innerHTML = e;
    ex.hidden = false;
  } else {
    ex.hidden = true;
  }
}

function renderOctaveSel(){
  const sel = $("octaveSel");
  if (sel.options.length) { sel.value = String(STATE.octave); return; }
  for (let o = 2; o <= 5; o++) {
    const op = document.createElement("option");
    op.value = String(o);
    op.textContent = "起始 " + LETTERS[STATE.letter] + o;
    sel.appendChild(op);
  }
  sel.value = String(STATE.octave);
}
function refreshOctaveLabels(){
  const sel = $("octaveSel");
  [...sel.options].forEach(op => { op.textContent = "起始 " + rootName() + op.value; });
}

function render(){
  // 分頁狀態
  $("tabChord").setAttribute("aria-selected", String(STATE.tab === "chord"));
  $("tabScale").setAttribute("aria-selected", String(STATE.tab === "scale"));
  $("tabFind").setAttribute("aria-selected", String(STATE.tab === "find"));
  const findMode = STATE.tab === "find";
  $("rootCard").hidden = findMode;
  $("typeCard").hidden = findMode;
  $("findCard").hidden = !findMode;
  $("typeCardTitle").textContent = STATE.tab === "chord" ? "和弦類型" : "音階類型";

  if (!findMode) {
    buildRootPicker();
    buildTypeList();
    renderOctaveSel();
    refreshOctaveLabels();
  }

  // 鍵盤音域:照選到的音重算(反查模式固定顯示兩個八度的工作區)
  if (findMode) {
    const base = 12 * (STATE.octave + 1);
    rebuildKeyboardRange([base, base + 24]);
  } else {
    rebuildKeyboardRange(keyboardNotes().map(n => n.midi));
  }
  resizeKeyboardCanvas();
  drawKeyboardLive();
  renderSummary();
  renderReadout();
  syncStickyMetrics(); // 鍵盤音域一變,釘住區塊的高度就變,右欄的 sticky 偏移量要跟著更新
}

/* 釘在鍵盤下的那一行:名稱 + 組成音,固定一行高度 */
function renderSummary(){
  const el = $("kbSummary");
  let name = "", zh = "", tones = "";
  if (STATE.tab === "find") {
    const an = findAnalysis();
    const seen = new Set();
    tones = an.sel.map(m => ((m % 12) + 12) % 12).filter(p => !seen.has(p) && seen.add(p))
              .map(p => an.nameByPc.get(p)).join(" ");
    if (an.results.length) { name = simpleName(an.results[0].rootPc, STATE.findSpell) + an.results[0].chord.sym; zh = an.results[0].chord.zh; }
    else { name = an.sel.length ? "?" : "選音"; zh = an.sel.length ? "沒有完全符合的和弦" : "點琴鍵開始"; }
  } else {
    const isChord = STATE.tab === "chord";
    const def = isChord ? chordById(STATE.chordId) : scaleById(STATE.scaleId);
    name = isChord ? rootName() + def.sym : rootName() + " " + def.zh;
    zh = isChord ? def.zh : def.en;
    tones = currentNotes().map(n => STATE.label === "do" ? toSolfege(n.name) : n.name).join(" ");
  }
  el.innerHTML = '<b></b><span class="zh"></span><span class="tones"></span>';
  el.querySelector("b").textContent = name;
  el.querySelector(".zh").textContent = zh;
  el.querySelector(".tones").textContent = tones;
}

/* ══════════════════════════════════════════════════════════════
   10. 互動
   ══════════════════════════════════════════════════════════════ */
/* 鍵盤點擊:用跟 drawKeyboard 一樣的幾何反推點到哪個鍵(黑鍵疊在上面所以先判斷) */
function keyAt(px, py){
  const cv = $("keyboardCanvas");
  const w = cv._cssW, h = cv._cssH;
  const whiteW = w / KB_WHITE_KEYS.length;
  const blackH = h * 0.6, blackW = whiteW * 0.62;
  for (let m = KB_LOW; m <= KB_HIGH; m++) {
    if (!isBlackKey(m)) continue;
    let leftWhite = m - 1;
    while (isBlackKey(leftWhite)) leftWhite--;
    const li = KB_WHITE_IDX[leftWhite];
    if (li === undefined) continue;
    const kx = (li + 1) * whiteW - blackW / 2;
    if (py <= blackH && px >= kx && px <= kx + blackW) return m;
  }
  const i = Math.floor(px / whiteW);
  return KB_WHITE_KEYS[Math.max(0, Math.min(KB_WHITE_KEYS.length - 1, i))];
}
$("keyboardCanvas").addEventListener("pointerdown", ev => {
  const cv = $("keyboardCanvas");
  const rect = cv.getBoundingClientRect();
  const m = keyAt(ev.clientX - rect.left, ev.clientY - rect.top);
  if (m === undefined) return;
  if (STATE.tab === "find") {
    if (STATE.findSel.has(m)) STATE.findSel.delete(m); else STATE.findSel.add(m);
    playSingle(m);
    render();
  } else {
    playSingle(m);
  }
});

$("tabChord").onclick = () => { STATE.tab = "chord"; STATE.search = ""; $("typeSearch").value = ""; render(); };
$("tabScale").onclick = () => { STATE.tab = "scale"; STATE.search = ""; $("typeSearch").value = ""; render(); };
$("tabFind").onclick  = () => { STATE.tab = "find"; render(); };
$("typeSearch").addEventListener("input", e => { STATE.search = e.target.value.trim(); buildTypeList(); });
$("octaveSel").addEventListener("change", e => { STATE.octave = +e.target.value; render(); });
$("labelSel").addEventListener("change", e => { STATE.label = e.target.value; render(); });
$("playModeSel").addEventListener("change", e => { STATE.playMode = e.target.value; });
$("findClear").onclick = () => { STATE.findSel.clear(); render(); };
$("findSpell").addEventListener("change", e => { STATE.findSpell = e.target.value; render(); });
/* 播放目前選的和弦/音階。由「點和弦名稱」與空白鍵觸發,沒有獨立的播放按鈕 */
function playCurrent(){
  const midis = STATE.tab === "find"
    ? [...STATE.findSel].sort((a, b) => a - b)
    : displayNotes().map(n => n.midi);
  if (!midis.length) return;
  playNotes(midis, STATE.playMode);
}
$("kbSummary").onclick = () => playCurrent(); // 釘在上面的摘要點一下就重播

/* 鍵盤快捷鍵:上下切換類型、左右移動根音,方便一路瀏覽完整個字典 */
document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "SELECT") return;
  if (ev.key === " ") { ev.preventDefault(); playCurrent(); return; }
  if (STATE.tab === "find") return;
  const isChord = STATE.tab === "chord";
  const list = isChord ? CHORDS : SCALES;
  const cur = list.findIndex(x => x.id === (isChord ? STATE.chordId : STATE.scaleId));
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    ev.preventDefault();
    const next = (cur + (ev.key === "ArrowDown" ? 1 : list.length - 1)) % list.length;
    if (isChord) STATE.chordId = list[next].id; else STATE.scaleId = list[next].id;
    render();
  } else if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") {
    ev.preventDefault();
    STATE.letter = (STATE.letter + (ev.key === "ArrowRight" ? 1 : 6)) % 7;
    render();
  }
});

/* 取樣有 30 個檔案,等按下播放才開始抓的話,第一次播放一定只聽得到合成音色備援。
   改成使用者第一次碰到頁面(點任何地方、按任何鍵)就先暖機——這時通常還在挑和弦,
   等真的按下播放,真實鋼琴取樣多半已經就緒。沒有互動就不下載,不會白白吃流量 */
["pointerdown", "keydown"].forEach(ev =>
  window.addEventListener(ev, () => ensureAudio(), { once: true, capture: true }));

/* ── 主題 ── */
const THEME_KEY = "harmonymap.light";
function applyTheme(){
  const on = localStorage.getItem(THEME_KEY) === "1";
  document.body.classList.toggle("light", on);
  $("themeToggle").setAttribute("aria-pressed", String(on));
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", on ? "#FBF7EE" : "#0C0A07");
  resizeKeyboardCanvas();   // 畫布底色吃 --bg,換主題要重畫
  drawKeyboardLive();
}
$("themeToggle").onclick = () => {
  localStorage.setItem(THEME_KEY, localStorage.getItem(THEME_KEY) === "1" ? "0" : "1");
  applyTheme();
};

syncStickyMetrics();
applyTheme();
render();
</script>
