<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
<defs><clipPath id="nk"><rect x="104" y="36" width="60" height="110" rx="8"/></clipPath>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFDA7A"/><stop offset=".85" stop-color="#E8A93A"/><stop offset="1" stop-color="#C4901A"/></linearGradient>
<linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF6"/><stop offset=".85" stop-color="#E6DFCC"/><stop offset="1" stop-color="#D2CAB4"/></linearGradient>
<linearGradient id="blk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient>
<linearGradient id="neck" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a3624"/><stop offset=".5" stop-color="#5a4330"/><stop offset="1" stop-color="#3e2c1c"/></linearGradient>
